<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cyber Pong - Gaming Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #070a13; font-family: 'Inter', sans-serif; user-select: none; }
    canvas { display: block; background-color: #070a13; box-shadow: 0 0 25px rgba(56, 189, 248, 0.2); }
  </style>
</head>
<body class="flex flex-col items-center justify-center h-screen text-white p-3 relative">

  <a href="../index.html" class="fixed top-3 left-3 z-50 bg-[#002b5b]/90 hover:bg-[#002b5b] text-white border border-cyan-400/40 px-3.5 py-2 rounded-xl text-xs font-extrabold flex items-center gap-2 shadow-lg backdrop-blur-md active:scale-95 transition">
    <i class="fa-solid fa-arrow-left text-cyan-300"></i><span>Hub</span>
  </a>

  <div class="flex justify-between w-full max-w-[320px] mb-2 px-2 text-sm font-extrabold tracking-wider">
    <span id="playerScore" class="text-cyan-400">PLAYER: 0</span>
    <span id="aiScore" class="text-pink-400">AI: 0</span>
  </div>

  <canvas id="pongCanvas" width="320" height="400" class="rounded-2xl border border-cyan-500/30"></canvas>
  <p class="text-[11px] text-slate-400 mt-3 font-semibold">Drag finger or use Up/Down keys to move paddle</p>

  <script>
    const canvas = document.getElementById('pongCanvas');
    const ctx = canvas.getContext('2d');
    const playerScoreEl = document.getElementById('playerScore');
    const aiScoreEl = document.getElementById('aiScore');

    let pScore = 0, aScore = 0;
    let ball = { x: 160, y: 200, radius: 8, speed: 4, dx: 3, dy: 3 };
    let player = { x: 120, y: 380, width: 80, height: 12 };
    let ai = { x: 120, y: 10, width: 80, height: 12 };

    function resetBall() {
      ball.x = 160; ball.y = 200;
      ball.dx = -ball.dx;
      ball.speed = 4;
    }

    function update() {
      ball.x += ball.dx * (ball.speed / 3);
      ball.y += ball.dy * (ball.speed / 3);

      // Wall collisions
      if (ball.x - ball.radius < 0 || ball.x + ball.radius > canvas.width) {
        ball.dx = -ball.dx;
      }

      // AI movement
      let aiCenter = ai.x + ai.width / 2;
      if (aiCenter < ball.x - 10) ai.x += 3.5;
      else if (aiCenter > ball.x + 10) ai.x -= 3.5;
      ai.x = Math.max(0, Math.min(canvas.width - ai.width, ai.x));

      // Paddle collisions
      // Player
      if (ball.y + ball.radius >= player.y && ball.x >= player.x && ball.x <= player.x + player.width) {
        ball.dy = -ball.dy;
        ball.speed += 0.2;
      }
      // AI
      if (ball.y - ball.radius <= ai.y + ai.height && ball.x >= ai.x && ball.x <= ai.x + ai.width) {
        ball.dy = -ball.dy;
        ball.speed += 0.2;
      }

      // Scoring
      if (ball.y > canvas.height) {
        aScore++;
        aiScoreEl.textContent = `AI: ${aScore}`;
        resetBall();
      } else if (ball.y < 0) {
        pScore++;
        playerScoreEl.textContent = `PLAYER: ${pScore}`;
        resetBall();
      }
    }

    function render() {
      ctx.fillStyle = '#070a13';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Net
      ctx.strokeStyle = '#1e293b'; ctx.setLineDash([5, 5]);
      ctx.beginPath(); ctx.moveTo(0, 200); ctx.lineTo(canvas.width, 200); ctx.stroke();
      ctx.setLineDash([]);

      // Paddles
      ctx.fillStyle = '#38bdf8'; ctx.fillRect(player.x, player.y, player.width, player.height);
      ctx.fillStyle = '#ff007b'; ctx.fillRect(ai.x, ai.y, ai.width, ai.height);

      // Ball
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2); ctx.fill();
    }

    function loop() { update(); render(); requestAnimationFrame(loop); }
    requestAnimationFrame(loop);

    // Controls
    window.addEventListener('mousemove', (e) => {
      let rect = canvas.getBoundingClientRect();
      player.x = e.clientX - rect.left - player.width / 2;
      player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
    });
    canvas.addEventListener('touchmove', (e) => {
      let rect = canvas.getBoundingClientRect();
      player.x = e.touches[0].clientX - rect.left - player.width / 2;
      player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
    }, { passive: true });
  </script>
</body>
</html>
