<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ఫ్రీ ఫైర్ - 3D 360° డెమో గేమ్</title>
    <style>
        body {
            margin: 0;
            background-color: #0b0b0b;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
            border: 2px solid #00ffcc;
        }
        canvas {
            background: linear-gradient(to bottom, #111, #222);
            display: block;
        }
        .ui-panel {
            margin-top: 10px;
            display: flex;
            gap: 25px;
            background: #1f1f1f;
            padding: 10px 25px;
            border-radius: 8px;
            border: 1px solid #444;
        }
        .ui-panel div {
            font-size: 15px;
        }
    </style>
</head>
<body>

    <h2 style="margin: 5px; color: #00ffcc;">ఫ్రీ ఫైర్ - 360° 3D డెమో (స్టెప్ 2)</h2>
    <div id="game-container">
        <canvas id="gameCanvas" width="850" height="480"></canvas>
    </div>

    <div class="ui-panel">
        <div>కదలికలు: <b>W, A, S, D</b></div>
        <div>360° ఎయిమ్: <b>మౌస్ మూవ్‌మెంట్</b></div>
        <div>షూట్: <b>లెఫ్ట్ క్లిక్</b></div>
        <div>గన్: <span id="gunName" style="color: #ffcc00;">AWM స్నిపర్</span></div>
    </div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const gunNameDisplay = document.getElementById("gunName");

    // ప్లేయర్ పొజిషన్ మరియు యాంగిల్ (360 డిగ్రీల రొటేషన్ కోసం)
    let player = {
        x: 425,
        y: 240,
        speed: 3.5,
        angle: 0
    };

    let guns = ["AWM స్నిపర్", "AK47", "SCAR", "AUG", "M4A1"];
    let currentGun = 0;

    let bullets = [];
    let enemies = [
        { x: 200, y: 100, radius: 18, color: "#ff3333", alive: true },
        { x: 700, y: 120, radius: 18, color: "#ff3333", alive: true },
        { x: 600, y: 380, radius: 18, color: "#ff3333", alive: true },
        { x: 150, y: 400, radius: 18, color: "#ff3333", alive: true }
    ];

    let keys = {};

    window.addEventListener("keydown", (e) => {
        keys[e.key.toLowerCase()] = true;
        if(e.key.toLowerCase() === 'q') {
            currentGun = (currentGun + 1) % guns.length;
            gunNameDisplay.innerText = guns[currentGun];
        }
    });

    window.addEventListener("keyup", (e) => {
        keys[e.key.toLowerCase()] = false;
    });

    // మౌస్ ద్వారా 360 డిగ్రీల రొటేషన్ ఎయిమింగ్
    canvas.addEventListener("mousemove", (e) => {
        let rect = canvas.getBoundingClientRect();
        let mouseX = e.clientX - rect.left;
        let mouseY = e.clientY - rect.top;
        player.angle = Math.atan2(mouseY - player.y, mouseX - player.x);
    });

    // షూటింగ్
    canvas.addEventListener("mousedown", () => {
        bullets.push({
            x: player.x,
            y: player.y,
            dx: Math.cos(player.angle) * 10,
            dy: Math.sin(player.angle) * 10,
            radius: 5
        });
    });

    function update() {
        // W, A, S, D కదలికలు
        if (keys['w'] && player.y > 20) player.y -= player.speed;
        if (keys['s'] && player.y < canvas.height - 20) player.y += player.speed;
        if (keys['a'] && player.x > 20) player.x -= player.speed;
        if (keys['d'] && player.x < canvas.width - 20) player.x += player.speed;

        // బుల్లెట్ల అప్‌డేట్
        for (let i = bullets.length - 1; i >= 0; i--) {
            bullets[i].x += bullets[i].dx;
            bullets[i].y += bullets[i].dy;

            if (bullets[i].x < 0 || bullets[i].x > canvas.width || bullets[i].y < 0 || bullets[i].y > canvas.height) {
                bullets.splice(i, 1);
                continue;
            }

            // శత్రువులకు తగిలితే చెక్ చేయి
            for (let j = 0; j < enemies.length; j++) {
                let en = enemies[j];
                if (en.alive) {
                    let dist = Math.hypot(bullets[i].x - en.x, bullets[i].y - en.y);
                    if (dist < en.radius + bullets[i].radius) {
                        en.alive = false;
                        bullets.splice(i, 1);
                        setTimeout(() => { en.alive = true; }, 3000); // 3 సెకన్ల తర్వాత రిసెంట్
                        break;
                    }
                }
            }
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 3D ఎఫెక్ట్ కోసం బ్యాక్‌గ్రౌండ్ గ్రిడ్ లైన్స్
        ctx.strokeStyle = "rgba(0, 255, 204, 0.07)";
        ctx.lineWidth = 1;
        for (let i = 0; i < canvas.width; i += 50) {
            ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
        }

        // శత్రువులు (Enemies) - 3D షాడో ఎఫెక్ట్‌తో
        enemies.forEach(en => {
            if (en.alive) {
                // షాడో
                ctx.fillStyle = "rgba(0,0,0,0.5)";
                ctx.beginPath();
                ctx.arc(en.x + 3, en.y + 5, en.radius, 0, Math.PI * 2);
                ctx.fill();

                // శత్రువు బాడీ
                ctx.fillStyle = en.color;
                ctx.beginPath();
                ctx.arc(en.x, en.y, en.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = "#fff";
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        });

        // బుల్లెట్లు
        ctx.fillStyle = "#ffcc00";
        bullets.forEach(b => {
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
            ctx.fill();
        });

        // ప్లేయర్ (360 డిగ్రీల రొటేషన్ గన్ క్యారెక్టర్)
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.rotate(player.angle);

        // ప్లేయర్ షాడో
        ctx.fillStyle = "rgba(0,0,0,0.4)";
        ctx.beginPath();
        ctx.arc(3, 5, 14, 0, Math.PI * 2);
        ctx.fill();

        // ప్లేయర్ హెల్మెట్/బాడీ (3D లుక్)
        ctx.fillStyle = "#00aaff";
        ctx.beginPath();
        ctx.arc(0, 0, 14, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2;
        ctx.stroke();

        // గన్ బ్యారెల్ (మౌస్ ఎటు ఉంటే అటు 360 తిరుగుతుంది)
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, -4, 22, 8);

        ctx.restore();
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    loop();
</script>

</body>
</html>
