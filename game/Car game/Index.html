
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ultimate City Car Driving 3D</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loading">LOADING CITY...</div>

<div id="garage" class="screen">
  <h1>ULTIMATE DRIVE</h1>
  <p>3D CITY CAR SIMULATOR</p>

  <div class="car-name" id="carName">SPORTS GT</div>
  <div class="car-price" id="carPrice">FREE CAR</div>

  <div class="garage-controls">
    <button id="prevCar">❮</button>
    <button id="nextCar">❯</button>
  </div>

  <div class="color-picker" id="colors">
    <button data-color="#ffcc00" style="background:#ffcc00"></button>
    <button data-color="#ff3030" style="background:#ff3030"></button>
    <button data-color="#1688ff" style="background:#1688ff"></button>
    <button data-color="#ffffff" style="background:#ffffff"></button>
    <button data-color="#20d46b" style="background:#20d46b"></button>
    <button data-color="#111111" style="background:#111111"></button>
  </div>

  <div class="garage-actions">
    <button id="driveBtn" class="main-btn">START DRIVING ▶</button>
    <button id="rewardBtn">🎁 DAILY REWARDS</button>
  </div>
  <div id="rewardMessage"></div>
</div>

<div id="hud">
  <div class="hud-top">
    <div class="hud-box">SPEED <strong><span id="speed">0</span> KM/H</strong></div>
    <div class="hud-box">DISTANCE <strong><span id="distance">0</span> M</strong></div>
    <button id="garageBtn">GARAGE</button>
  </div>
  <div id="modeText">CITY DRIVE</div>
</div>

<div id="controls">
  <div class="steering">
    <button id="left">◀</button>
    <button id="right">▶</button>
  </div>
  <div class="pedals">
    <button id="brake">BRAKE</button>
    <button id="nitro">NITRO ⚡</button>
    <button id="accelerator">GAS ▲</button>
  </div>
</div>

<div id="gameOver" class="screen hidden">
  <h1>CRASHED!</h1>
  <p>YOUR DISTANCE: <span id="finalDistance">0</span> M</p>
  <button id="retryBtn" class="main-btn">TRY AGAIN</button>
  <button id="homeBtn">GARAGE</button>
</div>

<div id="rewardScreen" class="screen hidden">
  <h1>🎁 DAILY REWARD</h1>
  <p>WELCOME DRIVER!</p>
  <h2>+500 COINS</h2>
  <button id="closeReward" class="main-btn">COLLECT</button>
</div>

<div id="scene"></div>

<script type="module" src="script.js"></script>
</body>
</html>
