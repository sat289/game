<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Crowd Runner 3D - Attractive Edition</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <main id="game-viewport">
    <!-- Top HUD Overlay -->
    <header id="hud-top">
      <div id="top-left-controls">
        <button id="exit-btn" class="hud-btn" title="Exit">🚪</button>
        <button id="pause-btn" class="hud-btn" title="Pause">⏸️</button>
        <button id="sound-btn" class="hud-btn" title="Sound On/Off">🔊</button>
        <button id="fullscreen-btn" class="hud-btn" title="Full Screen">⛶</button>
      </div>

      <!-- Level Progress Bar -->
      <div id="progress-container">
        <div id="current-level-badge" class="level-badge">1</div>
        <div class="progress-track">
          <div id="progress-fill"></div>
        </div>
        <div id="finish-icon" class="finish-badge">🏰</div>
      </div>

      <!-- Coin Counter -->
      <div id="coin-counter">
        <span id="coin-amount">300</span>
        <span class="coin-icon">$</span>
      </div>
    </header>

    <!-- Boss Level HUD -->
    <div id="boss-hud" class="hidden">
      <div class="boss-title">👹 GIANT BOSS (<span id="boss-hp-text">120</span> HP)</div>
      <div class="boss-bar-bg">
        <div id="boss-bar-fill"></div>
      </div>
    </div>

    <!-- Upgrade Crowd Button -->
    <div id="upgrade-bar">
      <button id="upgrade-crowd-btn" class="upgrade-btn">
        ✨ +5 Start Avatars (<span id="upgrade-cost">40</span> $)
      </button>
    </div>

    <!-- Clash Battle Banner -->
    <div id="battle-banner" class="hidden">⚔️ CLASH BATTLE! ⚔️</div>

    <!-- Floating Gain Popup -->
    <div id="gain-popup" class="hidden">+15</div>

    <!-- Player Crowd Counter -->
    <div id="player-badge" class="crowd-badge blue-badge">20</div>

    <!-- Enemy Badges -->
    <div id="enemy-badges-container"></div>

    <!-- Modal Overlay -->
    <div id="modal-overlay" class="hidden">
      <div class="modal-card">
        <h2 id="modal-title">Game Paused</h2>
        <p id="modal-subtitle">Level 1 / 50</p>
        <div class="modal-actions">
          <button id="resume-btn" class="action-btn primary-btn">Resume</button>
          <button id="restart-btn" class="action-btn secondary-btn">Restart Level</button>
        </div>
      </div>
    </div>

    <!-- Status Hint -->
    <div id="status-overlay">Touch & Drag to Run (Level 1 of 50)</div>

    <!-- 3D Canvas -->
    <div id="canvas-container"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
