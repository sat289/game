<!DOCTYPE html>
<html lang="en"> 
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Crowd Runner 3D - 50 Levels</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <main id="game-viewport">
    <!-- Top HUD Overlay -->
    <header id="hud-top">
      <!-- Top Left Controls: Exit, Pause, Fullscreen -->
      <div id="top-left-controls">
        <button id="exit-btn" class="hud-btn" title="Exit to Menu">🚪</button>
        <button id="pause-btn" class="hud-btn" title="Pause Game">⏸️</button>
        <button id="fullscreen-btn" class="hud-btn" title="Full Screen">⛶</button>
      </div>

      <!-- Center Level Progress Bar -->
      <div id="progress-container">
        <div id="current-level-badge" class="level-badge">1</div>
        <div class="progress-track">
          <div id="progress-fill"></div>
        </div>
        <div class="finish-badge">🏁</div>
      </div>

      <!-- Top Right Coin Counter -->
      <div id="coin-counter">
        <span id="coin-amount">144</span>
        <span class="coin-icon">$</span>
      </div>
    </header>

    <!-- Floating Crowd Counter Badge -->
    <div id="player-badge" class="crowd-badge blue-badge">20</div>

    <!-- Pause / Level / Exit Modal Overlay -->
    <div id="modal-overlay" class="hidden">
      <div class="modal-card">
        <h2 id="modal-title">Game Paused</h2>
        <p id="modal-subtitle">Level 1 / 50</p>
        <div class="modal-actions">
          <button id="resume-btn" class="action-btn primary-btn">Resume / Start</button>
          <button id="restart-btn" class="action-btn secondary-btn">Restart Level</button>
        </div>
      </div>
    </div>

    <!-- Bottom Touch / Steer Hint -->
    <div id="status-overlay">Touch & Drag to Run (Level 1 of 50)</div>

    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
