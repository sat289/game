<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Crowd Runner 3D - Realistic Forest & Balloon Finale</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <main id="game-viewport">
    <!-- Top HUD Overlay -->
    <header id="hud-top">
      <div id="top-left-controls">
        <button id="exit-btn" class="hud-btn" title="Exit">🚪</button>
        <button id="pause-btn" class="hud-btn" title="Pause">⏸️</button>
        <button id="sound-btn" class="hud-btn" title="Sound On/Off">🔊</button>
        <button id="fullscreen-btn" class="hud-btn" title="Full Screen">⛶</button>
      </div>

      <!-- Level Progress Bar -->
      <div id="progress-container">
        <div id="current-level-badge" class="level-badge">1</div>
        <div class="progress-track">
          <div id="progress-fill"></div>
        </div>
        <div id="finish-icon" class="finish-badge">🎈</div>
      </div>

      <!-- Coin Counter -->
      <div id="coin-counter">
        <span id="coin-amount">300</span>
        <span class="coin-icon">$</span>
      </div>
    </header>

    <!-- Boss Level HUD -->
    <div id="boss-hud" class="hidden">
      <div id="boss-title-text" class="boss-title">👹 BOSS TASK (<span id="boss-hp-text">120</span> HP)</div>
      <div class="boss-bar-bg">
        <div id="boss-bar-fill"></div>
      </div>
    </div>

    <!-- Upgrade Crowd Button -->
    <div id="upgrade-bar">
      <button id="upgrade-crowd-btn" class="upgrade-btn">
        ✨ +5 Start Avatars (<span id="upgrade-cost">40</span> $)
      </button>
    </div>

    <!-- Clash Battle / Finale Banner -->
    <div id="battle-banner" class="hidden">⚔️ CLASH BATTLE! ⚔️</div>

    <!-- Floating Gain / Balloon Pop Popup -->
    <div id="gain-popup" class="hidden">+15</div>

    <!-- Player Crowd Counter -->
    <div id="player-badge" class="crowd-badge blue-badge">20</div>

    <!-- Enemy Crowd Counters -->
    <div id="enemy-badges-container"></div>

    <!-- Pause / Score Summary Modal Overlay -->
    <div id="modal-overlay" class="hidden">
      <div class="modal-card">
        <h2 id="modal-title">Level Complete! 🎉</h2>
        <p id="modal-subtitle">Level 1 / 50</p>

        <!-- Detailed End-of-Level Score Check Box -->
        <div id="score-breakdown" class="score-box hidden">
          <div class="score-row"><span>👥 మిగిలిన అవతార్స్:</span> <strong id="sc-survivors">0</strong></div>
          <div class="score-row"><span>🎈 పగిలిన బెలూన్స్:</span> <strong id="sc-balloons">0</strong></div>
          <div class="score-row"><span>🏆 చేరుకున్న మల్టిప్లయర్:</span> <strong id="sc-mult">x1</strong></div>
          <div class="score-row total-row"><span>💰 మొత్తం బోనస్ కాయిన్స్:</span> <strong id="sc-coins">+0 $</strong></div>
        </div>

        <div class="modal-actions">
          <button id="resume-btn" class="action-btn primary-btn">Next Level ➔</button>
          <button id="restart-btn" class="action-btn secondary-btn">Replay Level</button>
        </div>
      </div>
    </div>

    <!-- Status Hint -->
    <div id="status-overlay">Touch & Drag to Run (Level 1 of 50)</div>

    <!-- 3D Canvas -->
    <div id="canvas-container"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
