<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Crowd Runner - Count Masters Clone</title>
  <link rel="stylesheet" href="style.css">
  <!-- Load Three.js from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="app-wrapper">
    <!-- Left Mobile Control Bar -->
    <aside id="left-sidebar">
      <div class="sidebar-pill">
        <button class="icon-btn" title="Back">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="#d0d6dc">
            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
          </svg>
        </button>
        <button class="icon-btn" title="Favorite">
          <svg viewBox="0 0 24 24" width="24" height="24" stroke="#8c969e" stroke-width="2" fill="none">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
        </button>
        <button class="icon-btn" title="Mute/Unmute">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="#d0d6dc">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
        </button>
      </div>
    </aside>

    <!-- Main 3D Game Viewport -->
    <main id="game-viewport">
      <!-- Top HUD Overlay -->
      <header id="hud-top">
        <!-- Level Progress Bar -->
        <div id="progress-container">
          <div class="level-badge">2</div>
          <div class="progress-track">
            <div id="progress-fill"></div>
          </div>
          <div class="finish-badge">🏁</div>
        </div>

        <!-- Coin Counter -->
        <div id="coin-counter">
          <span id="coin-amount">144</span>
          <span class="coin-icon">$</span>
        </div>
      </header>

      <!-- Floating Dynamic Crowd Counter Badges -->
      <div id="player-badge" class="crowd-badge blue-badge">67</div>
      <div id="enemy-badge" class="crowd-badge red-badge">24</div>

      <!-- Center Instruction / Status Message -->
      <div id="status-overlay">Move Mouse or Drag to Steer Crowd</div>

      <!-- 3D Canvas Container -->
      <div id="canvas-container"></div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
