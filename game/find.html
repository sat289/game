
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07172d">
<title>ST GAMES - Hidden Wonders</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;
 font-family:Arial,sans-serif;background:#b9edff;touch-action:none
}
#app{height:100dvh;display:flex;flex-direction:column}

header{
 height:62px;flex:none;background:linear-gradient(#37c9ef,#087fb9);
 display:flex;align-items:center;justify-content:space-between;
 padding:5px 10px;color:white;gap:6px
}
#back{
 background:transparent;border:0;color:white;font-size:30px
}
.brand{display:flex;align-items:center;gap:8px}
.brand img{
 width:40px;height:40px;object-fit:contain;
 background:white;border-radius:9px
}
.brand span{display:flex;flex-direction:column;gap:3px}
.brand small{font-size:10px;letter-spacing:2px;font-weight:bold}
.brand b{font-size:17px}
.heart{background:#e84361;border-radius:25px;padding:9px 11px;font-weight:bold}

#historyBtn{
 border:1px solid #ffffff99;background:#075d91;color:white;
 border-radius:18px;padding:8px;font-size:11px;font-weight:bold
}

#stage{
 position:relative;flex:1;min-height:0;margin:8px;
 border:3px solid #8bd8e9;border-radius:12px;
 overflow:hidden;background:#263044;box-shadow:0 3px 9px #5594a7
}
#viewport{position:absolute;inset:0;overflow:hidden;touch-action:none}
#scene{
 position:absolute;width:1000px;height:667px;
 left:50%;top:50%;
 transform:translate(-50%,-50%) scale(.8);
 transform-origin:center center
}
#background{
 position:absolute;inset:0;width:100%;height:100%;
 object-fit:fill;pointer-events:none;user-select:none
}
.hotspot{
 position:absolute;z-index:2;border:0;background:transparent;
 padding:0;cursor:pointer;touch-action:manipulation
}
.hotspot:focus-visible{outline:3px solid yellow}

#zoom{
 position:absolute;right:9px;top:9px;z-index:5;
 display:flex;flex-direction:column;gap:8px
}
#zoom button{
 width:43px;height:43px;border:2px solid white;
 border-radius:50%;background:#078fc1;color:white;
 font-size:24px;font-weight:bold
}
#coins,#worldname{
 position:absolute;left:9px;z-index:5;background:#12243ddd;
 color:white;padding:7px 11px;border-radius:20px;
 font-size:12px;font-weight:bold
}
#coins{top:9px}
#worldname{bottom:9px;letter-spacing:1px}

#targets{
 height:82px;flex:none;display:flex;align-items:center;
 gap:7px;padding:7px 9px;background:#d8faff;
 overflow-x:auto;border-top:3px solid #8ed9e9;scrollbar-width:none
}
.target{
 flex:0 0 58px;height:62px;border:2px solid #8acddd;
 border-radius:11px;background:linear-gradient(white,#e5faff);
 display:flex;align-items:center;justify-content:center;font-size:29px;
 transition:.3s
}
.target.done{opacity:.22;filter:grayscale(1);transform:scale(.85)}

#bottom{
 height:88px;flex:none;background:linear-gradient(120deg,#34c9e9,#1199c9);
 display:grid;grid-template-columns:1fr 75px 1fr;
 align-items:center;padding:6px 12px;color:white;font-weight:bold
}
#count{font-size:20px}
#hint{
 justify-self:center;width:68px;height:68px;
 border:4px solid #ffe98b;border-radius:50%;
 background:radial-gradient(#fff27c,#ff9900);
 font-size:32px;position:relative
}
#hint small{
 position:absolute;right:-6px;top:-5px;background:#ed4554;
 color:white;border-radius:50%;padding:5px;font-size:13px
}
#skip{
 justify-self:end;border:0;border-radius:25px;
 background:linear-gradient(#70f45d,#12b52c);
 color:white;padding:13px 14px;font-size:15px;font-weight:bold
}
footer{
 height:25px;flex:none;background:#101d37;color:white;
 text-align:center;padding:6px;font-size:10px;letter-spacing:2px
}

#modal{
 display:none;position:fixed;inset:0;background:#000b;
 z-index:110;align-items:center;justify-content:center;padding:18px
}
#panel{
 position:relative;width:min(360px,100%);max-height:85vh;
 overflow:auto;padding:23px 17px;background:linear-gradient(#fff2c9,#ffb75a);
 border:5px solid #ff8b2e;border-radius:24px;text-align:center;color:#944313
}
#panel h2{margin:0 0 10px;color:white;text-shadow:0 2px 3px #bd6a24}
#panel button{
 border:0;border-radius:25px;padding:12px 18px;margin:5px;
 font-weight:bold;font-size:15px;background:linear-gradient(#42caff,#087dc6);
 color:white
}
#close{
 display:none;position:absolute;right:5px;top:5px;
 background:#e74c55!important;padding:7px 11px!important
}
#historyList{
 max-height:42vh;overflow:auto;text-align:left;padding:0 8px
}
.historyRow{
 display:flex;justify-content:space-between;align-items:center;
 gap:8px;padding:11px 3px;border-bottom:1px solid #a96b3455;
 font-size:12px;flex-wrap:wrap
}
.historyRow b{font-size:14px}
.historyDate{width:100%;color:#925b2b;font-size:11px}

#win{
 display:none;position:absolute;inset:0;background:#07172dcc;
 z-index:10;align-items:center;justify-content:center;text-align:center
}
.card{
 background:#fff0c5;color:#81420d;padding:24px;
 border-radius:25px;border:5px solid #ffb52e;max-width:290px
}
.card button{
 border:0;border-radius:25px;padding:13px 25px;
 background:#27c84b;color:white;font-weight:bold;font-size:18px
}
#toast{
 display:none;position:fixed;bottom:125px;left:50%;
 transform:translateX(-50%);background:#10233e;color:white;
 padding:10px 18px;border-radius:20px;z-index:120;
 font-weight:bold;white-space:nowrap
}
#flyLayer{position:fixed;inset:0;pointer-events:none;z-index:90}
.flying{
 position:fixed;z-index:91;border:3px solid #ffe46b;
 border-radius:13px;box-shadow:0 0 25px #ffcf36;
 background-repeat:no-repeat;transition:transform .8s cubic-bezier(.2,.8,.25,1),opacity .8s;
 pointer-events:none
}

/* ST GAMES LOADING PAGE */
#loadingScreen{
 position:fixed;inset:0;z-index:200;
 background:radial-gradient(circle at 50% 38%,#164f79 0,#07172d 68%);
 display:flex;align-items:center;justify-content:center;
 color:white;text-align:center;
 transition:opacity .55s ease,visibility .55s ease
}
#loadingScreen.hide{
 opacity:0;visibility:hidden;pointer-events:none
}
.loaderBox{width:min(330px,86vw);padding:28px 20px}
.loaderLogo{
 width:104px;height:104px;object-fit:contain;background:white;
 border:3px solid #7be7ff;border-radius:25px;padding:5px;
 box-shadow:0 0 18px #29cfff,0 0 42px #168dff;
 animation:logoPulse 1.5s ease-in-out infinite
}
.loaderBrand{
 font-size:30px;font-weight:900;letter-spacing:4px;margin:18px 0 5px
}
.loaderSub{font-size:12px;letter-spacing:3px;color:#8eeaff}
.loaderTrack{
 height:8px;background:#ffffff25;border-radius:20px;
 margin:27px 0 12px;overflow:hidden
}
.loaderBar{
 height:100%;width:0;
 background:linear-gradient(90deg,#35dfff,#fff,#35aaff);
 border-radius:20px;animation:loadProgress 1.8s ease forwards
}
.loaderText{font-size:12px;color:#c4eaff;letter-spacing:1px}
@keyframes logoPulse{
 50%{transform:scale(1.06);box-shadow:0 0 28px #29cfff,0 0 58px #168dff}
}
@keyframes loadProgress{to{width:100%}}

@media(max-width:480px){
 header{height:56px}
 .brand img{width:34px;height:34px}
 .brand b{font-size:15px}
 .target{flex-basis:53px;height:57px}
 #bottom{height:82px}
}
</style>
</head>

<body>
<div id="app">

<header>
 <button id="back">‹</button>

 <div class="brand">
  <img src="../logo/logo.jpg" alt="ST Games">
  <span><small>ST GAMES</small><b id="level">Level 1</b></span>
 </div>

 <button id="historyBtn">📜 History</button>
 <div class="heart">❤️ <b id="lives">6</b></div>
</header>

<main id="stage">
 <div id="viewport">
  <div id="scene">
   <img id="background"
    src="https://aipict.com/wp-content/uploads/2023/05/messy_room01.png"
    crossorigin="anonymous" alt="Hidden object room">
  </div>
 </div>

 <div id="coins">🪙 <b id="coinCount">0</b></div>
 <div id="worldname">HIDDEN ROOM</div>

 <div id="zoom">
  <button id="plus">+</button>
  <button id="minus">−</button>
  <button id="home">⌂</button>
 </div>

 <div id="win">
  <div class="card">
   <h1>🎉 Level Complete!</h1>
   <p>You found all hidden objects!</p>
   <p>⭐ +50 Coins</p>
   <button id="next">Next Level</button>
  </div>
 </div>
</main>

<div id="targets"></div>

<section id="bottom">
 <div id="count">0/12</div>
 <button id="hint">💡<small id="hintnum">2</small></button>
 <button id="skip">Skip Level</button>
</section>

<footer>ST GAMES • HIDDEN WONDERS</footer>
</div>

<!-- LOADING SCREEN -->
<div id="loadingScreen">
 <div class="loaderBox">
  <img class="loaderLogo" src="../logo/logo.jpg" alt="ST GAMES Logo">
  <div class="loaderBrand">ST GAMES</div>
  <div class="loaderSub">HIDDEN WONDERS</div>
  <div class="loaderTrack"><div class="loaderBar"></div></div>
  <div class="loaderText">LOADING YOUR ADVENTURE...</div>
 </div>
</div>

<div id="modal">
 <div id="panel">
  <button id="close">✕</button>
  <h2 id="modalTitle">HINT</h2>
  <div id="modalIcon" style="font-size:48px">💡</div>
  <p id="modalText"></p>
  <div id="historyList" style="display:none"></div>
  <button id="watch">Continue</button>
  <button id="cancel">Cancel</button>
 </div>
</div>

<div id="toast"></div>
<div id="flyLayer"></div>

<script>
const $=id=>document.getElementById(id);
const scene=$('scene'),viewport=$('viewport'),image=$('background');

const items=[
 {icon:'🕰️',name:'Clock',x:535,y:235,w:65,h:65},
 {icon:'🌿',name:'Plant',x:835,y:105,w:115,h:155},
 {icon:'🎒',name:'Backpack',x:300,y:445,w:85,h:115},
 {icon:'🛹',name:'Skateboard',x:400,y:555,w:100,h:55},
 {icon:'👟',name:'Shoes',x:630,y:525,w:85,h:45},
 {icon:'🧢',name:'Cap',x:160,y:95,w:60,h:55},
 {icon:'🧥',name:'Jacket',x:460,y:325,w:75,h:150},
 {icon:'🧸',name:'Toy',x:720,y:180,w:65,h:55},
 {icon:'💻',name:'Laptop',x:690,y:410,w:100,h:90},
 {icon:'🪴',name:'Small Plant',x:70,y:180,w:70,h:120},
 {icon:'🧳',name:'Bag',x:160,y:420,w:100,h:130},
 {icon:'👕',name:'Shirt',x:560,y:330,w:65,h:150}
];

let level=1,coins=0,hints=2,lives=6;
let found=new Set();
let zoom=1,tx=0,ty=0;
let pointers=new Map(),gesture=null;
let completed=false,audio=null;
let modalAction=()=>hideModal();
let lastWrong=0;
let gameStarted=false;

/* LOAD SAVED PLAYER DATA */
function readNumber(key,defaultValue){
 const value=Number(localStorage.getItem(key));
 return Number.isFinite(value)&&value>=0?value:defaultValue;
}

level=Math.max(1,readNumber('sthw_online_level',1));
coins=readNumber('sthw_online_coins',0);
hints=readNumber('sthw_online_hints',2);

let levelHistory={};
try{
 levelHistory=JSON.parse(localStorage.getItem('sthw_level_history')||'{}')||{};
}catch(e){
 levelHistory={};
}

/* SAVE PLAYER DATA */
function save(){
 localStorage.setItem('sthw_online_level',level);
 localStorage.setItem('sthw_online_coins',coins);
 localStorage.setItem('sthw_online_hints',hints);
 localStorage.setItem('sthw_last_played',new Date().toISOString());
 localStorage.setItem('sthw_level_history',JSON.stringify(levelHistory));
}

/* SAVE COMPLETED LEVEL HISTORY */
function recordLevelComplete(){
 const key=String(level);
 const previous=levelHistory[key]||{};

 levelHistory[key]={
  level:level,
  completed:true,
  completions:(previous.completions||0)+1,
  firstCompleted:previous.firstCompleted||new Date().toISOString(),
  lastCompleted:new Date().toISOString(),
  bestCoins:Math.max(previous.bestCoins||0,50),
  objectsFound:items.length
 };

 save();
}

/* HISTORY SCREEN */
function showHistory(){
 const list=$('historyList');
 const keys=Object.keys(levelHistory).sort((a,b)=>Number(a)-Number(b));

 $('modalTitle').textContent='LEVEL HISTORY';
 $('modalIcon').textContent='🏆';
 $('modalText').textContent=keys.length
  ?'Your completed levels are saved on this device.'
  :'No completed levels yet. Finish a level to see it here.';

 list.innerHTML='';
 list.style.display='block';

 keys.forEach(key=>{
  const entry=levelHistory[key];
  const row=document.createElement('div');
  row.className='historyRow';

  const title=document.createElement('b');
  title.textContent='Level '+Number(key);

  const status=document.createElement('span');
  status.textContent='⭐ Completed · '+(entry.completions||1)+' time(s)';

  const date=document.createElement('small');
  date.className='historyDate';
  date.textContent='Last completed: '+(
   entry.lastCompleted
    ?new Date(entry.lastCompleted).toLocaleString()
    :'Date unavailable'
  );

  row.append(title,status,date);
  list.appendChild(row);
 });

 $('watch').textContent='Close';
 $('cancel').style.display='none';
 $('close').style.display='none';
 $('modal').style.display='flex';
 modalAction=hideModal;
}

/* CREATE OBJECT HOTSPOTS */
function makeHotspots(){
 items.forEach((item,i)=>{
  const b=document.createElement('button');
  b.className='hotspot';
  b.style.left=item.x+'px';
  b.style.top=item.y+'px';
  b.style.width=item.w+'px';
  b.style.height=item.h+'px';
  b.setAttribute('aria-label','Find '+item.name);
  b.onclick=()=>collect(i,b);
  scene.appendChild(b);
 });
}

/* GAME UI */
function update(){
 $('level').textContent='Level '+level;
 $('lives').textContent=lives;
 $('coinCount').textContent=coins;
 $('hintnum').textContent=hints;
 $('count').textContent=found.size+'/'+items.length;

 $('targets').innerHTML='';

 items.forEach((item,i)=>{
  const b=document.createElement('div');
  b.className='target'+(found.has(i)?' done':'');
  b.textContent=item.icon;
  b.title=item.name;
  $('targets').appendChild(b);
 });

 save();

 if(found.size===items.length&&!completed){
  completed=true;
  recordLevelComplete();
  coins+=50;
  save();
  $('coinCount').textContent=coins;
  $('win').style.display='flex';
  sound(850,.25);
 }
}

/* ZOOM AND PAN */
function applyTransform(){
 scene.style.transform=
 `translate(calc(-50% + ${tx}px),calc(-50% + ${ty}px)) scale(${zoom})`;
}
function setZoom(v){
 zoom=Math.max(.65,Math.min(3,v));
 applyTransform();
}
function resetView(){
 zoom=.8;tx=0;ty=0;
 applyTransform();
}

/* SOUND */
function sound(freq=600,duration=.12,type='sine'){
 try{
  const C=window.AudioContext||window.webkitAudioContext;
  if(!audio)audio=new C();
  const o=audio.createOscillator();
  const g=audio.createGain();
  o.type=type;
  o.frequency.value=freq;
  g.gain.setValueAtTime(.06,audio.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);
  o.connect(g);
  g.connect(audio.destination);
  o.start();
  o.stop(audio.currentTime+duration);
 }catch(e){}
}

/* TOAST MESSAGE */
function toast(msg){
 $('toast').textContent=msg;
 $('toast').style.display='block';
 clearTimeout(toast.timer);
 toast.timer=setTimeout(()=>$('toast').style.display='none',1500);
}

/* FLYING OBJECT ANIMATION */
function collect(i,button){
 if(found.has(i)||completed)return;

 found.add(i);
 coins+=5;
 sound(780,.15);

 const item=items[i];
 const sceneRect=scene.getBoundingClientRect();
 const target=$('targets').children[i].getBoundingClientRect();

 const scaleX=sceneRect.width/1000;
 const scaleY=sceneRect.height/667;

 const fly=document.createElement('div');
 fly.className='flying';

 const left=sceneRect.left+item.x*scaleX;
 const top=sceneRect.top+item.y*scaleY;
 const width=item.w*scaleX;
 const height=item.h*scaleY;

 fly.style.left=left+'px';
 fly.style.top=top+'px';
 fly.style.width=width+'px';
 fly.style.height=height+'px';

 fly.style.backgroundImage=`url("${image.src}")`;
 fly.style.backgroundSize=sceneRect.width+'px '+sceneRect.height+'px';
 fly.style.backgroundPosition=
 `-${item.x*scaleX}px -${item.y*scaleY}px`;

 $('flyLayer').appendChild(fly);

 button.style.opacity='.12';
 button.style.pointerEvents='none';

 requestAnimationFrame(()=>{
  const dx=target.left+target.width/2-(left+width/2);
  const dy=target.top+target.height/2-(top+height/2);
  fly.style.transform=
   `translate(${dx}px,${dy}px) scale(.25) rotate(360deg)`;
  fly.style.opacity='.15';
 });

 setTimeout(()=>fly.remove(),850);
 update();
 toast('✨ Found '+item.name+'!');
}

/* WRONG TAP */
function wrongTap(){
 if(Date.now()-lastWrong<600||completed)return;
 lastWrong=Date.now();

 lives=Math.max(0,lives-1);
 $('lives').textContent=lives;
 sound(160,.15,'sawtooth');
 toast('Wrong spot! -1 heart');

 if(lives===0)gameOver();
}

/* MODALS */
function showModal(title,icon,msg,button,cancel=true){
 $('historyList').style.display='none';
 $('historyList').innerHTML='';
 $('modalTitle').textContent=title;
 $('modalIcon').textContent=icon;
 $('modalText').textContent=msg;
 $('watch').textContent=button;
 $('cancel').style.display=cancel?'inline-block':'none';
 $('close').style.display='none';
 $('modal').style.display='flex';
}
function hideModal(){
 $('modal').style.display='none';
 $('historyList').style.display='none';
}

/* RESTART */
function gameOver(){
 showModal('GAME OVER','💔',
 'You used all 6 hearts. Restart this level?',
 'Restart',false);

 modalAction=()=>{
  hideModal();
  found.clear();
  lives=6;
  completed=false;

  document.querySelectorAll('.hotspot').forEach(b=>{
   b.style.opacity='1';
   b.style.pointerEvents='auto';
  });

  $('win').style.display='none';
  resetView();
  update();
 };
}

/* NEXT LEVEL */
function nextLevel(){
 level++;
 localStorage.setItem('sthw_online_level',level);

 found.clear();
 lives=6;
 completed=false;
 $('win').style.display='none';

 document.querySelectorAll('.hotspot').forEach(b=>{
  b.style.opacity='1';
  b.style.pointerEvents='auto';
 });

 resetView();
 update();

 showModal('LEVEL '+level,'🌟',
 'Welcome to your next hidden-object challenge!',
 'Start',false);

 modalAction=hideModal;
}

/* HINT */
function openHint(){
 if(hints>0){
  hints--;
  const i=items.findIndex((_,i)=>!found.has(i));
  if(i>=0)collect(i,document.querySelectorAll('.hotspot')[i]);
  update();
  return;
 }

 showModal('GET A HINT','💡',
 'Watch an advertisement to receive one hint.',
 'Watch Ad',false);

 modalAction=()=>goAd('hintReward');
}

/* AD PAGE RETURN */
function goAd(reward){
 const returnTo=location.origin+location.pathname+'?'+reward+'=1';
 location.href='../ad.html?returnTo='+encodeURIComponent(returnTo);
}

/* BUTTONS */
$('hint').onclick=openHint;
$('historyBtn').onclick=showHistory;

$('close').onclick=()=>{
 hideModal();
 hints++;
 update();
 toast('Hint added!');
};

$('watch').onclick=()=>modalAction();
$('cancel').onclick=hideModal;
$('next').onclick=nextLevel;

$('skip').onclick=()=>{
 showModal('SKIP LEVEL','⏭️',
 'Watch an advertisement to unlock the next level.',
 'Watch Ad',true);
 modalAction=()=>goAd('skipReward');
};

$('back').onclick=()=>history.back();

$('plus').onclick=()=>setZoom(zoom*1.2);
$('minus').onclick=()=>setZoom(zoom/1.2);
$('home').onclick=resetView;

/* DRAG AND PINCH ZOOM */
let startDistance=0,startZoom=1;

viewport.addEventListener('pointerdown',e=>{
 viewport.setPointerCapture(e.pointerId);
 pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});

 if(pointers.size===1){
  gesture={
   x:e.clientX,y:e.clientY,tx,ty,moved:false,
   onHotspot:!!e.target.closest('.hotspot')
  };
 }

 if(pointers.size===2){
  const a=[...pointers.values()];
  startDistance=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
  startZoom=zoom;
  gesture=null;
 }
});

viewport.addEventListener('pointermove',e=>{
 if(!pointers.has(e.pointerId))return;

 pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});

 if(pointers.size===2){
  const a=[...pointers.values()];
  const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
  if(startDistance)setZoom(startZoom*d/startDistance);
 }
 else if(pointers.size===1&&gesture){
  const dx=e.clientX-gesture.x;
  const dy=e.clientY-gesture.y;

  if(Math.hypot(dx,dy)>5)gesture.moved=true;

  tx=gesture.tx+dx;
  ty=gesture.ty+dy;
  applyTransform();
 }
});

viewport.addEventListener('pointerup',e=>{
 pointers.delete(e.pointerId);

 if(pointers.size===0){
  if(gesture&&!gesture.moved&&!gesture.onHotspot)wrongTap();
  gesture=null;
 }

 if(pointers.size===1){
  const p=[...pointers.values()][0];
  gesture={x:p.x,y:p.y,tx,ty,moved:true,onHotspot:false};
 }
});

viewport.addEventListener('pointercancel',e=>{
 pointers.delete(e.pointerId);
 gesture=null;
});

viewport.addEventListener('wheel',e=>{
 e.preventDefault();
 setZoom(zoom*(e.deltaY<0?1.12:.9));
},{passive:false});

/* LOADING SCREEN AND IMAGE */
function startGame(){
 if(gameStarted)return;
 gameStarted=true;

 makeHotspots();
 resetView();
 update();

 setTimeout(()=>{
  $('loadingScreen').classList.add('hide');
 },450);
}

image.onload=startGame;

image.onerror=()=>{
 $('loadingScreen').classList.add('hide');
 toast('Room image failed to load. Check internet connection.');
};

if(image.complete&&image.naturalWidth>0){
 startGame();
}

/* HANDLE AD REWARDS */
const params=new URLSearchParams(location.search);

if(params.get('hintReward')==='1'){
 hints++;
 save();
 history.replaceState({},'',location.pathname);
}

if(params.get('skipReward')==='1'){
 history.replaceState({},'',location.pathname);
 nextLevel();
}

save();
</script>
</body>
</html>
