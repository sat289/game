canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1)startPan={x:e.clientX,y:e.clientY,cx:camera.position.x,cz:camera.position.z};if(pointers.size===2){let a=[...pointers.values()];startDist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);startZoom=zoom}down={x:e.clientX,y:e.clientY,t:Date.now()}});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){let a=[...pointers.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(startDist)setZoom(startZoom*d/startDist)}else if(pointers.size===1&&startPan){let dx=e.clientX-startPan.x,dy=e.clientY-startPan.y;camera.position.x=startPan.cx-dx*.025/zoom;camera.position.z=startPan.cz+dy*.025/zoom;camera.lookAt(0,1.5,0)}});
canvas.addEventListener('pointerup',e=>{let p=pointers.get(e.pointerId);pointers.delete(e.pointerId);if(pointers.size===0){if(down&&Math.hypot(e.clientX-down.x,e.clientY-down.y)<9&&Date.now()-down.t<500)pick(e);startPan=null;down=null}if(pointers.size===1){let a=[...pointers.values()][0];startPan={x:a.x,y:a.y,cx:camera.position.x,cz:camera.position.z}}});canvas.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);startPan=null});canvas.addEventListener('wheel',e=>{e.preventDefault();setZoom(zoom*(e.deltaY<0?1.12:.89))},{passive:false});
document.querySelector('#plus').onclick=()=>setZoom(zoom*1.2);document.querySelector('#minus').onclick=()=>setZoom(zoom/1.2);document.querySelector('#home').onclick=()=>{setZoom(1);camera.position.set(15,18,20);camera.lookAt(0,1.5,0)};
function resize(){let w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);let aspect=w/h;camera.left=-9*aspect/0.72;camera.right=9*aspect/0.72;camera.top=12;camera.bottom=-12;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(stage);resize();
function animate(){requestAnimationFrame(animate);renderer.render(scene,camera)}animate();
function showModal(title,icon,message,primary,showCancel=true){document.querySelector('#modalTitle').textContent=title;document.querySelector('#modalIcon').textContent=icon;document.querySelector('#modalText').textContent=message;document.querySelector('#watch').textContent=primary;document.querySelector('#cancelModal').style.display=showCancel?'inline-block':'none';document.querySelector('#close').style.display='none';document.querySelector('#modal').style.display='flex'}
function hideModal(){document.querySelector('#modal').style.display='none'}
let modalAction=()=>hideModal();
function openHint(){if(hints>0){hints--;document.querySelector('#hintnum').textContent=hints;let idx=items.findIndex((_,i)=>!found.has(i));if(idx>=0){found.add(idx);update();toast('Hint found: '+items[idx][1])}return}showModal('HINT','💡','Watch the short ad to claim one hint.','Get Hint • Watch Ad',false);modalAction=()=>goAd('hintReward');let c=document.querySelector('#close');setTimeout(()=>{if(document.querySelector('#modal').style.display==='flex')c.style.display='block'},5000)}
function nextLevel(showPopup=true){found.clear();targetMeshes.forEach(g=>g.scale.setScalar(g.userData.baseScale));level++;lives=6;document.querySelector('#level').textContent='Level '+level;document.querySelector('#win').style.display='none';applyLevelTheme();update();if(showPopup){showModal('LEVEL '+level,'🌟','A new room is ready! Find all 30 hidden objects.','Start Level',false);modalAction=hideModal}}
function showGameOver(){showModal('MATCH OVER','💔','You used all 6 hearts. Restart this match and try again.','Restart Match',false);modalAction=()=>{hideModal();found.clear();targetMeshes.forEach(g=>g.scale.setScalar(g.userData.baseScale));lives=6;hints=2;document.querySelector('#hintnum').textContent=hints;applyLevelTheme();update();toast('Match restarted!')};document.querySelector('#close').style.display='none'}
function goAd(reward){const back=location.href.split('?')[0]+'?'+reward+'=1';location.href='../ad.html?returnTo='+encodeURIComponent(back)+'&reward='+reward}
document.querySelector('#hint').onclick=openHint;
document.querySelector('#close').onclick=()=>{hideModal();hints++;document.querySelector('#hintnum').textContent=hints;toast('Free hint added')};
document.querySelector('#watch').onclick=()=>modalAction();
document.querySelector('#cancelModal').onclick=hideModal;
const params=new URLSearchParams(location.search);
if(params.get('hintReward')==='1'){hints++;document.querySelector('#hintnum').textContent=hints;history.replaceState({},'',location.pathname);toast('Ad completed — hint claimed!')}
if(params.get('skipReward')==='1'){history.replaceState({},'',location.pathname);nextLevel(true)}
document.querySelector('#skip').onclick=()=>{showModal('SKIP LEVEL','⏭️','Watch a short ad to unlock the next level.','Watch Ad • Skip Level',true);modalAction=()=>goAd('skipReward')};
document.querySelector('#next').onclick=()=>nextLevel(true);
document.querySelector('#back').onclick=()=>history.back();
</script></body></html>
