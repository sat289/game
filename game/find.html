
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#087fb9">
<title>ST GAMES - Hidden Wonders</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;
 font-family:Arial,sans-serif;background:#b9edff;
 touch-action:none
}
#app{height:100dvh;display:flex;flex-direction:column}
header{
 height:62px;flex:none;
 background:linear-gradient(#37c9ef,#087fb9);
 display:flex;align-items:center;justify-content:space-between;
 padding:5px 10px;color:white
}
.brand{display:flex;align-items:center;gap:8px}
.brand img{width:40px;height:40px;object-fit:contain;background:white;border-radius:9px}
.brand span{display:flex;flex-direction:column;gap:3px}
.brand small{font-size:10px;letter-spacing:2px;font-weight:bold}
.brand b{font-size:17px}
.heart{background:#e84361;border-radius:25px;padding:9px 11px;font-weight:bold}
#stage{
 position:relative;flex:1;min-height:0;margin:8px;
 border:3px solid #8bd8e9;border-radius:12px;
 overflow:hidden;background:#263044;
 box-shadow:0 3px 9px #5594a7
}
#viewport{position:absolute;inset:0;overflow:hidden;touch-action:none}
#scene{
 position:absolute;width:1000px;height:667px;
 left:50%;top:50%;
 transform:translate(-50%,-50%) scale(.8);
 transform-origin:center center;
}
#background{
 position:absolute;inset:0;width:100%;height:100%;
 object-fit:fill;pointer-events:none;user-select:none
}
.hotspot{
 position:absolute;z-index:2;
 border:0;background:transparent;padding:0;
 cursor:pointer;touch-action:manipulation
}
.hotspot:focus-visible{outline:3px solid yellow}
#zoom{
 position:absolute;right:9px;top:9px;z-index:5;
 display:flex;flex-direction:column;gap:8px
}
#zoom button{
 width:43px;height:43px;border:2px solid white;
 border-radius:50%;background:#078fc1;color:white;
 font-size:24px;font-weight:bold
}
#coins,#worldname{
 position:absolute;left:9px;z-index:5;
 background:#12243ddd;color:white;
 padding:7px 11px;border-radius:20px;
 font-size:12px;font-weight:bold
}
#coins{top:9px}
#worldname{bottom:9px;letter-spacing:1px}
#targets{
 height:82px;flex:none;display:flex;align-items:center;
 gap:7px;padding:7px 9px;background:#d8faff;
 overflow-x:auto;border-top:3px solid #8ed9e9;
 scrollbar-width:none
}
.target{
 flex:0 0 58px;height:62px;border:2px solid #8acddd;
 border-radius:11px;background:linear-gradient(white,#e5faff);
 display:flex;align-items:center;justify-content:center;
 font-size:29px;transition:.3s
}
.target.done{opacity:.22;filter:grayscale(1);transform:scale(.85)}
#bottom{
 height:88px;flex:none;
 background:linear-gradient(120deg,#34c9e9,#1199c9);
 display:grid;grid-template-columns:1fr 75px 1fr;
 align-items:center;padding:6px 12px;color:white;font-weight:bold
}
#count{font-size:20px}
#hint{
 justify-self:center;width:68px;height:68px;
 border:4px solid #ffe98b;border-radius:50%;
 background:radial-gradient(#fff27c,#ff9900);
 font-size:32px;position:relative
}
#hint small{
 position:absolute;right:-6px;top:-5px;
 background:#ed4554;color:white;border-radius:50%;
 padding:5px;font-size:13px
}
#skip{
 justify-self:end;border:0;border-radius:25px;
 background:linear-gradient(#70f45d,#12b52c);
 color:white;padding:13px 14px;font-size:15px;font-weight:bold
}
footer{
 height:25px;flex:none;background:#101d37;color:white;
 text-align:center;padding:6px;font-size:10px;letter-spacing:2px
}
#modal{
 display:none;position:fixed;inset:0;background:#0009;
 z-index:20;align-items:center;justify-content:center;padding:18px
}
#panel{
 position:relative;width:min(340px,100%);padding:23px 17px;
 background:linear-gradient(#fff2c9,#ffb75a);
 border:5px solid #ff8b2e;border-radius:24px;
 text-align:center;color:#944313
}
#panel h2{margin:0 0 10px;color:white;text-shadow:0 2px 3px #bd6a24}
#panel button{
 border:0;border-radius:25px;padding:12px 18px;margin:5px;
 font-weight:bold;font-size:15px;
 background:linear-gradient(#42caff,#087dc6);color:white
}
#close{
 display:none;position:absolute;right:-12px;top:-14px;
 background:#e74c55!important;padding:7px 11px!important
}
#win{
 display:none;position:absolute;inset:0;background:#07172dcc;
 z-index:10;align-items:center;justify-content:center;text-align:center
}
.card{
 background:#fff0c5;color:#81420d;padding:24px;
 border-radius:25px;border:5px solid #ffb52e;max-width:290px
}
.card button{
 border:0;border-radius:25px;padding:13px 25px;
 background:#27c84b;color:white;font-weight:bold;font-size:18px
}
#toast{
 display:none;position:fixed;bottom:125px;left:50%;
 transform:translateX(-50%);background:#10233e;color:white;
 padding:10px 18px;border-radius:20px;z-index:30;
 font-weight:bold;white-space:nowrap
}
#flyLayer{position:fixed;inset:0;pointer-events:none;z-index:40}
.flying{
 position:fixed;z-index:41;
 border:3px solid #ffe46b;border-radius:13px;
 box-shadow:0 0 25px #ffcf36;
 background-repeat:no-repeat;
 transition:transform .8s cubic-bezier(.2,.8,.25,1),opacity .8s;
 pointer-events:none
}
@media(max-width:480px){
 header{height:56px}
 .brand img{width:34px;height:34px}
 .brand b{font-size:15px}
 .target{flex-basis:53px;height:57px}
 #bottom{height:82px}
}
</style>
</head>

<body>
<div id="app">

<header>
 <button id="back">‹</button>
 <div class="brand">
  <img src="../logo/logo.jpg" alt="ST Games">
  <span><small>ST GAMES</small><b id="level">Level 1</b></span>
 </div>
 <div class="heart">❤️ <b id="lives">6</b></div>
</header>

<main id="stage">
 <div id="viewport">
  <div id="scene">
   <img id="background"
    src="https://aipict.com/wp-content/uploads/2023/05/messy_room01.png"
    crossorigin="anonymous" alt="Messy illustrated room">
  </div>
 </div>

 <div id="coins">🪙 <b id="coinCount">0</b></div>
 <div id="worldname">HIDDEN ROOM</div>

 <div id="zoom">
  <button id="plus">+</button>
  <button id="minus">−</button>
  <button id="home">⌂</button>
 </div>

 <div id="win">
  <div class="card">
   <h1>🎉 Level Complete!</h1>
   <p>You found all hidden objects!</p>
   <p>⭐ +50 Coins</p>
   <button id="next">Next Level</button>
  </div>
 </div>
</main>

<div id="targets"></div>

<section id="bottom">
 <div id="count">0/12</div>
 <button id="hint">💡<small id="hintnum">2</small></button>
 <button id="skip">Skip Level</button>
</section>

<footer>ST GAMES • HIDDEN WONDERS</footer>
</div>

<div id="modal">
 <div id="panel">
  <button id="close">✕</button>
  <h2 id="modalTitle">HINT</h2>
  <div id="modalIcon" style="font-size:48px">💡</div>
  <p id="modalText"></p>
  <button id="watch">Continue</button>
  <button id="cancel">Cancel</button>
 </div>
</div>

<div id="toast"></div>
<div id="flyLayer"></div>

<script>
const $=id=>document.getElementById(id);
const scene=$('scene'),viewport=$('viewport');
const image=$('background');

/*
 Coordinates are based on the 1000 x 667 online room image.
 Each object has a rectangular crop region and a tap area.
*/

const items=[
 {icon:'🕰️',name:'Clock',x:535,y:235,w:65,h:65},
 {icon:'🌿',name:'Plant',x:835,y:105,w:115,h:155},
 {icon:'🎒',name:'Backpack',x:300,y:445,w:85,h:115},
 {icon:'🛹',name:'Skateboard',x:400,y:555,w:100,h:55},
 {icon:'👟',name:'Shoes',x:630,y:525,w:85,h:45},
 {icon:'🧢',name:'Cap',x:160,y:95,w:60,h:55},
 {icon:'🧥',name:'Jacket',x:460,y:325,w:75,h:150},
 {icon:'🧸',name:'Toy',x:720,y:180,w:65,h:55},
 {icon:'💻',name:'Laptop',x:690,y:410,w:100,h:90},
 {icon:'🪴',name:'Small Plant',x:70,y:180,w:70,h:120},
 {icon:'🧳',name:'Bag',x:160,y:420,w:100,h:130},
 {icon:'👕',name:'Shirt',x:560,y:330,w:65,h:150}
];

let level=1;
let coins=0;
let hints=2;
let lives=6;
let found=new Set();
let zoom=1,tx=0,ty=0;
let pointers=new Map(),gesture=null;
let completed=false;
let audio;

function makeHotspots(){
 items.forEach((item,i)=>{
  const b=document.createElement('button');
  b.className='hotspot';
  b.style.left=item.x+'px';
  b.style.top=item.y+'px';
  b.style.width=item.w+'px';
  b.style.height=item.h+'px';
  b.setAttribute('aria-label','Find '+item.name);
  b.onclick=()=>collect(i,b);
  scene.appendChild(b);
 });
}

function save(){
 localStorage.setItem('sthw_online_level',level);
 localStorage.setItem('sthw_online_coins',coins);
 localStorage.setItem('sthw_online_hints',hints);
}

function update(){
 $('level').textContent='Level '+level;
 $('lives').textContent=lives;
 $('coinCount').textContent=coins;
 $('hintnum').textContent=hints;
 $('count').textContent=found.size+'/'+items.length;

 $('targets').innerHTML='';
 items.forEach((item,i)=>{
  const b=document.createElement('div');
  b.className='target'+(found.has(i)?' done':'');
  b.textContent=item.icon;
  b.title=item.name;
  $('targets').appendChild(b);
 });

 save();

 if(found.size===items.length&&!completed){
  completed=true;
  coins+=50;
  save();
  $('coinCount').textContent=coins;
  $('win').style.display='flex';
  sound(850,.25);
 }
}

function applyTransform(){
 scene.style.transform=
 `translate(calc(-50% + ${tx}px),calc(-50% + ${ty}px)) scale(${zoom})`;
}

function setZoom(v){
 zoom=Math.max(.65,Math.min(3,v));
 applyTransform();
}

function resetView(){
 zoom=.8;tx=0;ty=0;
 applyTransform();
}

function sound(freq=600,duration=.12,type='sine'){
 try{
  const C=window.AudioContext||window.webkitAudioContext;
  if(!audio)audio=new C();
  const o=audio.createOscillator();
  const g=audio.createGain();
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(.06,audio.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);
  o.connect(g);g.connect(audio.destination);
  o.start();o.stop(audio.currentTime+duration);
 }catch(e){}
}

function toast(msg){
 $('toast').textContent=msg;
 $('toast').style.display='block';
 clearTimeout(toast.timer);
 toast.timer=setTimeout(()=>$('toast').style.display='none',1500);
}

/* Create a flying crop from the actual room image */
function collect(i,button){
 if(found.has(i)||completed)return;

 found.add(i);
 coins+=5;
 sound(780,.15);

 const item=items[i];
 const sceneRect=scene.getBoundingClientRect();
 const target=$('targets').children[i].getBoundingClientRect();

 const scaleX=sceneRect.width/1000;
 const scaleY=sceneRect.height/667;

 const fly=document.createElement('div');
 fly.className='flying';

 const left=sceneRect.left+item.x*scaleX;
 const top=sceneRect.top+item.y*scaleY;
 const width=item.w*scaleX;
 const height=item.h*scaleY;

 fly.style.left=left+'px';
 fly.style.top=top+'px';
 fly.style.width=width+'px';
 fly.style.height=height+'px';

 fly.style.backgroundImage=`url("${image.src}")`;
 fly.style.backgroundSize=sceneRect.width+'px '+sceneRect.height+'px';
 fly.style.backgroundPosition=
 `-${item.x*scaleX}px -${item.y*scaleY}px`;

 $('flyLayer').appendChild(fly);

 button.style.opacity='.12';
 button.style.pointerEvents='none';

 requestAnimationFrame(()=>{
  const dx=target.left+target.width/2-(left+width/2);
  const dy=target.top+target.height/2-(top+height/2);
  fly.style.transform=`translate(${dx}px,${dy}px) scale(.25) rotate(360deg)`;
  fly.style.opacity='.15';
 });

 setTimeout(()=>fly.remove(),850);

 update();
 toast('✨ Found '+item.name+'!');
}

let lastWrong=0;
function wrongTap(){
 if(Date.now()-lastWrong<600)return;
 lastWrong=Date.now();
 lives=Math.max(0,lives-1);
 $('lives').textContent=lives;
 sound(160,.15,'sawtooth');
 toast('Wrong spot! -1 heart');
 if(lives===0)gameOver();
}

function showModal(title,icon,msg,button,cancel=true){
 $('modalTitle').textContent=title;
 $('modalIcon').textContent=icon;
 $('modalText').textContent=msg;
 $('watch').textContent=button;
 $('cancel').style.display=cancel?'inline-block':'none';
 $('close').style.display='none';
 $('modal').style.display='flex';
}
function hideModal(){$('modal').style.display='none'}

let modalAction=hideModal;

function gameOver(){
 showModal('GAME OVER','💔',
 'You used all 6 hearts. Restart this level?',
 'Restart',false);

 modalAction=()=>{
  hideModal();
  found.clear();lives=6;completed=false;
  document.querySelectorAll('.hotspot').forEach(b=>{
   b.style.opacity='1';b.style.pointerEvents='auto';
  });
  resetView();update();
 };
}

function nextLevel(){
 level++;
 found.clear();
 lives=6;
 completed=false;
 $('win').style.display='none';

 document.querySelectorAll('.hotspot').forEach(b=>{
  b.style.opacity='1';b.style.pointerEvents='auto';
 });

 resetView();
 update();

 showModal('LEVEL '+level,'🌟',
 'Welcome to your next hidden-object challenge!',
 'Start',false);
 modalAction=hideModal;
}

function openHint(){
 if(hints>0){
  hints--;
  const i=items.findIndex((_,i)=>!found.has(i));
  if(i>=0)collect(i,document.querySelectorAll('.hotspot')[i]);
  update();
  return;
 }

 showModal('GET A HINT','💡',
 'Watch an advertisement to receive one hint.',
 'Watch Ad',false);

 modalAction=()=>goAd('hintReward');

 setTimeout(()=>{
  if($('modal').style.display==='flex')
   $('close').style.display='block';
 },5000);
}

function goAd(reward){
 const returnTo=location.origin+location.pathname+'?'+reward+'=1';
 location.href='../ad.html?returnTo='+encodeURIComponent(returnTo);
}

$('hint').onclick=openHint;
$('close').onclick=()=>{
 hideModal();hints++;update();toast('Hint added!');
};
$('watch').onclick=()=>modalAction();
$('cancel').onclick=hideModal;
$('next').onclick=nextLevel;

$('skip').onclick=()=>{
 showModal('SKIP LEVEL','⏭️',
 'Watch an advertisement to unlock the next level.',
 'Watch Ad',true);
 modalAction=()=>goAd('skipReward');
};

$('back').onclick=()=>history.back();

$('plus').onclick=()=>setZoom(zoom*1.2);
$('minus').onclick=()=>setZoom(zoom/1.2);
$('home').onclick=resetView;

/* Drag and pinch zoom */
let startDistance=0,startZoom=1;

viewport.addEventListener('pointerdown',e=>{
 viewport.setPointerCapture(e.pointerId);
 pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});

 if(pointers.size===1){
  gesture={x:e.clientX,y:e.clientY,tx,ty,moved:false};
 }

 if(pointers.size===2){
  const a=[...pointers.values()];
  startDistance=Math.hypot(
   a[0].x-a[1].x,a[0].y-a[1].y
  );
  startZoom=zoom;
  gesture=null;
 }
});

viewport.addEventListener('pointermove',e=>{
 if(!pointers.has(e.pointerId))return;
 pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});

 if(pointers.size===2){
  const a=[...pointers.values()];
  const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
  if(startDistance)setZoom(startZoom*d/startDistance);
 }
 else if(pointers.size===1&&gesture){
  const dx=e.clientX-gesture.x;
  const dy=e.clientY-gesture.y;
  if(Math.hypot(dx,dy)>5)gesture.moved=true;
  tx=gesture.tx+dx;
  ty=gesture.ty+dy;
  applyTransform();
 }
});

viewport.addEventListener('pointerup',e=>{
 pointers.delete(e.pointerId);

 if(pointers.size===0){
  if(gesture&&!gesture.moved)wrongTap();
  gesture=null;
 }

 if(pointers.size===1){
  const p=[...pointers.values()][0];
  gesture={x:p.x,y:p.y,tx,ty,moved:true};
 }
});

viewport.addEventListener('pointercancel',e=>{
 pointers.delete(e.pointerId);
 gesture=null;
});

viewport.addEventListener('wheel',e=>{
 e.preventDefault();
 setZoom(zoom*(e.deltaY<0?1.12:.9));
},{passive:false});

/* Image loading and initial setup */
image.onload=()=>{
 makeHotspots();
 resetView();
 update();
};
image.onerror=()=>{
 toast('Room image failed to load. Check internet connection.');
};

level=Math.max(1,Number(localStorage.getItem('sthw_online_level')||1));
coins=Number(localStorage.getItem('sthw_online_coins')||0);
hints=Math.max(0,Number(localStorage.getItem('sthw_online_hints')??2));

const params=new URLSearchParams(location.search);

if(params.get('hintReward')==='1'){
 hints++;
 history.replaceState({},'',location.pathname);
}
if(params.get('skipReward')==='1'){
 history.replaceState({},'',location.pathname);
 nextLevel();
}
</script>
</body>
</html>
