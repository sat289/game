<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Bird Strike — Full Screen Airplane Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #57a0c4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
      touch-action: none;
    }

    /* True Edge-to-Edge Full-Screen Game Stage */
    .game-stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: linear-gradient(180deg, #57a0c4 0%, #8ac0d8 55%, #cbe4ec 82%, #7f947c 100%);
      cursor: pointer;
    }

    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Top HUD Score Cards (SECONDS & BEST) */
    .hud-layer {
      position: absolute;
      top: max(12px, env(safe-area-inset-top, 12px));
      left: max(14px, env(safe-area-inset-left, 14px));
      right: max(14px, env(safe-area-inset-right, 14px));
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 10;
    }

    .score-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #0f172a;
      border-radius: 14px;
      padding: 6px 14px;
      min-width: 78px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.16);
      display: flex;
      flex-direction: column;
    }

    .score-card.left {
      align-items: flex-start;
    }

    .score-card.right {
      align-items: flex-end;
    }

    .score-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #64748b;
      text-transform: uppercase;
      margin-bottom: 1px;
    }

    .score-value {
      font-size: 24px;
      font-weight: 800;
      line-height: 1.05;
      color: #0f172a;
      font-variant-numeric: tabular-nums;
    }

    /* Subtle Center Status Pill (PAUSED) */
    .status-pill {
      position: absolute;
      top: max(18px, env(safe-area-inset-top, 18px));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(18, 19, 18, 0.75);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #f8fafc;
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      pointer-events: none;
      z-index: 12;
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: opacity 0.2s ease;
    }

    .status-pill.hidden {
      opacity: 0;
    }

    /* Compact Floating On-Screen Action Buttons */
    .onscreen-controls {
      position: absolute;
      left: max(14px, env(safe-area-inset-left, 14px));
      bottom: max(14px, env(safe-area-inset-bottom, 14px));
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      z-index: 15;
    }

    .ctrl-btn {
      background: rgba(18, 20, 18, 0.62);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #f1f5f9;
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.01em;
      cursor: pointer;
      text-align: center;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.22);
      transition: background 0.15s ease, transform 0.08s ease, border-color 0.15s ease;
      white-space: nowrap;
    }

    .ctrl-btn:hover {
      background: rgba(28, 32, 28, 0.82);
      border-color: rgba(255, 255, 255, 0.42);
    }

    .ctrl-btn:active {
      transform: scale(0.94);
    }

    .ctrl-btn.active-toggle {
      border-color: #a5c3a7;
      color: #a5c3a7;
      background: rgba(18, 20, 18, 0.82);
    }

    /* Compact On-Screen Thumb Fly Button */
    .fly-fab {
      position: absolute;
      right: max(16px, env(safe-area-inset-right, 16px));
      bottom: max(14px, env(safe-area-inset-bottom, 14px));
      z-index: 15;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.6);
      background: rgba(18, 20, 18, 0.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.28);
      transition: transform 0.08s ease, background 0.15s ease;
    }

    .fly-fab:active {
      transform: scale(0.9);
      background: rgba(18, 20, 18, 0.82);
    }

    /* Bird Strike! Game Over Modal */
    .modal-backdrop {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(0, 0, 0, 0.38);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      z-index: 30;
      transition: opacity 0.2s ease;
    }

    .modal-backdrop.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .gameover-card {
      width: 100%;
      max-width: 360px;
      background: #1e211e;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 24px;
      padding: 22px 20px 20px 20px;
      text-align: center;
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.65);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .gameover-title {
      font-size: 25px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 12px;
      letter-spacing: -0.01em;
    }

    .gameover-portrait-wrap {
      width: 155px;
      height: 142px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      overflow: hidden;
      border-radius: 12px;
    }

    .gameover-portrait-wrap img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
    }

    .gameover-stats {
      display: flex;
      justify-content: center;
      gap: 48px;
      width: 100%;
      margin-bottom: 18px;
    }

    .stat-col {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-col-label {
      font-size: 14px;
      font-weight: 500;
      color: #9ca89e;
      margin-bottom: 2px;
    }

    .stat-col-val {
      font-size: 34px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.05;
      font-variant-numeric: tabular-nums;
    }

    .play-again-btn {
      width: 100%;
      padding: 13px 18px;
      border-radius: 14px;
      border: none;
      background: #a5c3a7;
      color: #111812;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: filter 0.15s ease, transform 0.08s ease;
    }

    .play-again-btn:hover {
      filter: brightness(1.06);
    }

    .play-again-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <!-- Full-Screen Game Viewport -->
  <div class="game-stage" id="game-stage">
    <canvas id="game-canvas"></canvas>

    <!-- Top HUD Cards -->
    <div class="hud-layer">
      <div class="score-card left">
        <span class="score-label">SECONDS</span>
        <span class="score-value" id="seconds-val">0</span>
      </div>
      <div class="score-card right">
        <span class="score-label">BEST</span>
        <span class="score-value" id="best-val">37</span>
      </div>
    </div>

    <!-- Center Status Pill (Paused) -->
    <div class="status-pill hidden" id="status-pill">PAUSED</div>

    <!-- Small On-Screen Control Buttons Overlaid on Game Screen -->
    <div class="onscreen-controls">
      <button type="button" class="ctrl-btn" id="pause-btn">Pause</button>
      <button type="button" class="ctrl-btn" id="restart-btn">Restart</button>
      <button type="button" class="ctrl-btn" id="sound-btn">Sound on</button>
      <button type="button" class="ctrl-btn" id="fullscreen-btn">⛶ Fullscreen</button>
    </div>

    <!-- Compact On-Screen Thumb Fly Button -->
    <button type="button" class="fly-fab" id="fly-btn" aria-label="Fly upward">
      <span>▲</span>
      <span>FLY</span>
    </button>

            sprites[key] = defaultImg;
            spriteLoaded[key] = true;
            if (key === "gameover") {
              const gEl = document.getElementById("gameover-img");
              if (gEl) gEl.src = defaultImg.src;
            }
          }
        };
        defaultImg.src = BUILTIN_DEFAULTS[key];

        // Automatically override with external file from folder/GitHub if present
        const localImg = new Image();
        localImg.onload = function () {
          sprites[key] = localImg;
          spriteLoaded[key] = true;
          if (key === "gameover") {
            const gEl = document.getElementById("gameover-img");
            if (gEl) gEl.src = localImg.src;
          }
        };
        localImg.onerror = function () {};
        localImg.src = IMAGE_FILES[key];
      });
    }

    loadSprites();

    // ============================================================================
    // 2. AUDIO ENGINE: "naa.mp3" (BG SONG) & "naaover.mp3" (GAMEOVER SONG)
    // ============================================================================
    const bgmAudio = new Audio();
    bgmAudio.src = AUDIO_FILES.bgm;
    bgmAudio.loop = true;
    bgmAudio.preload = "auto";
    let bgmAvailable = false;
    bgmAudio.addEventListener("canplaythrough", function () {
      bgmAvailable = true;
    });

    const gameoverAudio = new Audio();
    gameoverAudio.src = AUDIO_FILES.gameover;
    gameoverAudio.loop = false;
    gameoverAudio.preload = "auto";
    let gameoverAudioAvailable = false;
    gameoverAudio.addEventListener("canplaythrough", function () {
      gameoverAudioAvailable = true;
    });

    let audioCtx = null;
    let soundEnabled = true;

    function startBgm() {
      if (!soundEnabled) return;
      try {
        gameoverAudio.pause();
        gameoverAudio.currentTime = 0;
      } catch (e) {}
      try {
        const playPromise = bgmAudio.play();
        if (playPromise && typeof playPromise.catch === "function") {
          playPromise.catch(function () {});
        }
      } catch (e) {}
    }

    function pauseBgm() {
      try {
        bgmAudio.pause();
      } catch (e) {}
    }

    function stopAllAudioFiles() {
      try {
        bgmAudio.pause();
        bgmAudio.currentTime = 0;
      } catch (e) {}
      try {
        gameoverAudio.pause();
        gameoverAudio.currentTime = 0;
      } catch (e) {}
    }

    function playGameoverSong() {
      pauseBgm();
      if (!soundEnabled) return false;
      try {
        gameoverAudio.currentTime = 0;
        const p = gameoverAudio.play();
        if (p && typeof p.catch === "function") {
          p.catch(function () {
            playCrashSoundFallback();
          });
          return true;
        }
      } catch (e) {}
      return false;
    }

    function ensureAudio() {
      if (!soundEnabled) return null;
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return null;
        if (!audioCtx) {
          audioCtx = new AudioContextClass();
        }
        if (audioCtx.state === "suspended") {
          audioCtx.resume();
        }
        return audioCtx;
      } catch (e) {
        return null;
      }
    }

    function playFlapSound() {
      const ctx = ensureAudio();
      if (!ctx) return;
      try {
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(240, now);
        osc.frequency.exponentialRampToValueAtTime(420, now + 0.09);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.1);
      } catch (e) {}
    }

    function playCrashSound() {
      playGameoverSong();
      if (gameoverAudioAvailable) return;
      playCrashSoundFallback();
    }

    function playCrashSoundFallback() {
      const ctx = ensureAudio();
      if (!ctx) return;
      try {
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(190, now);
        osc.frequency.exponentialRampToValueAtTime(52, now + 0.35);
        gain.gain.setValueAtTime(0.24, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.36);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.36);
      } catch (e) {}
    }

    function playTickSound() {
      const ctx = ensureAudio();
      if (!ctx) return;
      try {
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(660, now);
        gain.gain.setValueAtTime(0.03, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.04);
      } catch (e) {}
    }

    // ============================================================================
    // 3. GAME STATE & STORAGE
    // ============================================================================
    const canvas = document.getElementById("game-canvas");
    const ctx = canvas.getContext("2d");
    const stageEl = document.getElementById("game-stage");
    const secondsEl = document.getElementById("seconds-val");
    const bestEl = document.getElementById("best-val");
    const modalSecondsEl = document.getElementById("modal-seconds-val");
    const modalBestEl = document.getElementById("modal-best-val");
    const gameoverModal = document.getElementById("gameover-modal");
    const gameoverHeading = document.getElementById("gameover-heading");
    const statusPill = document.getElementById("status-pill");
    const pauseBtn = document.getElementById("pause-btn");
    const restartBtn = document.getElementById("restart-btn");
    const soundBtn = document.getElementById("sound-btn");
    const playAgainBtn = document.getElementById("play-again-btn");
    const flyBtn = document.getElementById("fly-btn");
    const fullscreenBtn = document.getElementById("fullscreen-btn");

    let bestSeconds = 37;
    try {
      const saved = localStorage.getItem("bird_strike_best_seconds");
      if (saved !== null && !isNaN(parseInt(saved, 10))) {
        bestSeconds = Math.max(37, parseInt(saved, 10));
      }
    } catch (e) {}
    bestEl.textContent = String(bestSeconds);

    let cw = window.innerWidth || 400;
    let ch = window.innerHeight || 600;
    let dpr = 1;

    const state = {
      running: true,
      paused: false,
      gameOver: false,
      elapsedMs: 0,
      seconds: 0,
      spawnTimerMs: 0,
      nextSpawnMs: 2400,
      plane: {
        x: 60,
        y: 220,
        w: 118,
        h: 76,
        vy: 0,
        gravity: 680,
        jumpVelocity: -295
      },
      birds: [],
      feathers: []
    };

    function resizeCanvas() {
      const rect = stageEl.getBoundingClientRect();
      cw = Math.max(280, rect.width || window.innerWidth);
      ch = Math.max(300, rect.height || window.innerHeight);
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(cw * dpr);
      canvas.height = Math.round(ch * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const scale = Math.max(0.75, Math.min(1.3, Math.min(cw, ch) / 420));
      state.plane.w = Math.round(118 * scale);
      state.plane.h = Math.round(77 * scale);
      state.plane.x = Math.round(cw * 0.12);
      state.plane.gravity = 690 * scale;
      state.plane.jumpVelocity = -300 * scale;

      if (state.plane.y > ch - state.plane.h - 20) {
        state.plane.y = Math.max(40, ch * 0.36);
      }
      renderFrame();
    }

    function resetGame() {
      state.running = true;
      state.paused = false;
      state.gameOver = false;
      state.elapsedMs = 0;
      state.seconds = 0;
      state.spawnTimerMs = 800;
      state.nextSpawnMs = 2300;
      state.birds = [];
      state.feathers = [];

      const scale = Math.max(0.75, Math.min(1.3, Math.min(cw, ch) / 420));
      state.plane.w = Math.round(118 * scale);
      state.plane.h = Math.round(77 * scale);
      state.plane.x = Math.round(cw * 0.12);
      state.plane.y = Math.round(ch * 0.34);
      state.plane.vy = 0;

      secondsEl.textContent = "0";
      pauseBtn.textContent = "Pause";
      pauseBtn.classList.remove("active-toggle");
      statusPill.classList.add("hidden");
      gameoverModal.classList.add("hidden");
      startBgm();
    }

    function flapPlane() {
      if (state.gameOver || state.paused) return;
      state.plane.vy = state.plane.jumpVelocity;
      if (soundEnabled && bgmAudio.paused) {
        startBgm();
      }
      if (!bgmAvailable) {
        playFlapSound();
      }
    }

    function spawnHitEffect(x, y) {
      for (let i = 0; i < 14; i++) {
        const angle = (Math.PI * 2 * i) / 14 + (Math.random() - 0.5) * 0.4;
        const speed = 70 + Math.random() * 140;
        state.feathers.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 40,
          r: 3 + Math.random() * 4,
          alpha: 1
        });
      }
    }

    function triggerGameOver(reasonText) {
      state.gameOver = true;
      state.running = false;
      playCrashSound();

      if (state.seconds > bestSeconds) {
        bestSeconds = state.seconds;
        try {
          localStorage.setItem("bird_strike_best_seconds", String(bestSeconds));
        } catch (e) {}
      }

      bestEl.textContent = String(bestSeconds);
      modalSecondsEl.textContent = String(state.seconds);
      modalBestEl.textContent = String(bestSeconds);
      gameoverHeading.textContent = reasonText || "Bird strike!";
      gameoverModal.classList.remove("hidden");
    }

    function spawnBird() {
      const scale = Math.max(0.75, Math.min(1.3, Math.min(cw, ch) / 420));
      const bw = Math.round(54 * scale);
      const bh = Math.round(47 * scale);
      const minY = 16;
      const maxY = Math.max(minY + 60, ch - bh - Math.max(18, ch * 0.04));

      let startY = minY + Math.random() * (maxY - minY);
      if (Math.random() < 0.45) {
        const jitter = (Math.random() - 0.5) * 130;
        startY = Math.max(minY, Math.min(maxY, state.plane.y + jitter));
      }

      const speedBoost = Math.min(150, state.seconds * 3.5);
      const speed = (180 + Math.random() * 55 + speedBoost) * scale;

      state.birds.push({
        x: cw + 20,
        y: startY,
        baseY: startY,
        w: bw,
        h: bh,
        speed: speed,
        phase: Math.random() * Math.PI * 2,
        bobAmp: 6 + Math.random() * 10,
        bobFreq: 2.5 + Math.random() * 1.8
      });
    }

    // ============================================================================
    // 4. UPDATE & RENDER LOOP
    // ============================================================================
    function updateGame(dtMs) {
      const dt = Math.min(dtMs / 1000, 0.05);

      // Update feather particles even after collision
      for (let i = state.feathers.length - 1; i >= 0; i--) {
        const p = state.feathers[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 260 * dt;
        p.alpha -= 1.4 * dt;
        if (p.alpha <= 0) {
          state.feathers.splice(i, 1);
        }
      }

      if (!state.running || state.paused || state.gameOver) return;

      state.elapsedMs += dtMs;

      const newSec = Math.floor(state.elapsedMs / 1000);
      if (newSec !== state.seconds) {
        state.seconds = newSec;
        secondsEl.textContent = String(state.seconds);
        if (state.seconds > bestSeconds) {
          bestSeconds = state.seconds;
          bestEl.textContent = String(bestSeconds);
          try {
            localStorage.setItem("bird_strike_best_seconds", String(bestSeconds));
          } catch (e) {}
        }
        if (!bgmAvailable) {
          playTickSound();
        }
      }

      // Plane physics
      state.plane.vy += state.plane.gravity * dt;
      state.plane.y += state.plane.vy * dt;

      // Top & bottom edge clamp (game over only on bird collision)
      if (state.plane.y < 8) {
        state.plane.y = 8;
        if (state.plane.vy < 0) state.plane.vy = 0;
      }

      const groundLimit = ch - state.plane.h - Math.max(14, ch * 0.03);
      if (state.plane.y >= groundLimit) {
        state.plane.y = groundLimit;
        if (state.plane.vy > 0) state.plane.vy = 0;
      }

      // Bird spawning
      state.spawnTimerMs += dtMs;
      if (state.spawnTimerMs >= state.nextSpawnMs) {
        state.spawnTimerMs = 0;
        spawnBird();
        const difficultyReduction = Math.min(980, state.seconds * 22);
        state.nextSpawnMs = Math.max(1000, 2400 - difficultyReduction + (Math.random() * 500 - 250));
      }

      // Update birds & check collisions
      const px1 = state.plane.x + state.plane.w * 0.16;
      const py1 = state.plane.y + state.plane.h * 0.18;
      const px2 = state.plane.x + state.plane.w * 0.86;
      const py2 = state.plane.y + state.plane.h * 0.84;

      for (let i = state.birds.length - 1; i >= 0; i--) {
        const b = state.birds[i];
        b.x -= b.speed * dt;
        b.phase += b.bobFreq * dt;
        b.y = b.baseY + Math.sin(b.phase) * b.bobAmp;

        const bx1 = b.x + b.w * 0.18;
        const by1 = b.y + b.h * 0.2;
        const bx2 = b.x + b.w * 0.84;
        const by2 = b.y + b.h * 0.82;

        if (px1 < bx2 && px2 > bx1 && py1 < by2 && py2 > by1) {
          spawnHitEffect(b.x + b.w / 2, b.y + b.h / 2);
          triggerGameOver("Bird strike!");
          return;
        }

        if (b.x + b.w < -40) {
          state.birds.splice(i, 1);
        }
      }
    }

    function drawFallbackBackground() {
      const grad = ctx.createLinearGradient(0, 0, 0, ch);
      grad.addColorStop(0, "#59a1c5");
      grad.addColorStop(0.65, "#a7d2e3");
      grad.addColorStop(0.88, "#d4eae8");
      grad.addColorStop(1, "#7f947c");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, cw, ch);

      ctx.fillStyle = "#fdf4b8";
      ctx.beginPath();
      ctx.arc(cw * 0.79, ch * 0.15, Math.min(cw, ch) * 0.085, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#9ebb9f";
      ctx.beginPath();
      ctx.moveTo(0, ch * 0.9);
      ctx.lineTo(cw * 0.18, ch * 0.82);
      ctx.lineTo(cw * 0.31, ch * 0.88);
      ctx.lineTo(cw * 0.48, ch * 0.8);
      ctx.lineTo(cw * 0.69, ch * 0.88);
      ctx.lineTo(cw * 0.84, ch * 0.81);
      ctx.lineTo(cw, ch * 0.9);
      ctx.lineTo(cw, ch);
      ctx.lineTo(0, ch);
      ctx.closePath();
      ctx.fill();
    }

    function renderFrame() {
      ctx.clearRect(0, 0, cw, ch);

      // 1. Draw Background Image (background.png)
      if (spriteLoaded.background && sprites.background.complete && sprites.background.naturalWidth > 0) {
        ctx.drawImage(sprites.background, 0, 0, cw, ch);
      } else {
        drawFallbackBackground();
      }

      // 2. Draw Incoming Birds (bird.png)
      for (let i = 0; i < state.birds.length; i++) {
        const b = state.birds[i];
        if (spriteLoaded.bird && sprites.bird.complete && sprites.bird.naturalWidth > 0) {
          ctx.drawImage(sprites.bird, b.x, b.y, b.w, b.h);
        }
      }

      // 3. Draw Player Plane (plane.png) with pitch tilt
      ctx.save();
      const cx = state.plane.x + state.plane.w / 2;
      const cy = state.plane.y + state.plane.h / 2;
      ctx.translate(cx, cy);
      const tilt = Math.max(-0.18, Math.min(0.22, state.plane.vy / 900));
      ctx.rotate(tilt);

      if (spriteLoaded.plane && sprites.plane.complete && sprites.plane.naturalWidth > 0) {
        ctx.drawImage(sprites.plane, -state.plane.w / 2, -state.plane.h / 2, state.plane.w, state.plane.h);
      } else {
        ctx.fillStyle = "#facc15";
        ctx.fillRect(-state.plane.w / 2, -state.plane.h / 2, state.plane.w, state.plane.h);
      }
      ctx.restore();

      // 4. Draw Hit Feather Burst
      for (let i = 0; i < state.feathers.length; i++) {
        const p = state.feathers[i];
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    let lastTime = performance.now();
    let animId = null;

    function gameLoop(now) {
      const dtMs = now - lastTime;
      lastTime = now;
      updateGame(dtMs);
      renderFrame();
      animId = requestAnimationFrame(gameLoop);
    }

    // ============================================================================
    // 5. EVENT LISTENERS & ON-SCREEN CONTROLS
    // ============================================================================
    stageEl.addEventListener("pointerdown", function (e) {
      if (
        e.target.closest("#gameover-modal") ||
        e.target.closest(".onscreen-controls") ||
        e.target.closest("#fly-btn")
      ) {
        return;
      }
      flapPlane();
    });

    flyBtn.addEventListener("pointerdown", function (e) {
      e.stopPropagation();
      flapPlane();
    });

    window.addEventListener("keydown", function (e) {
      if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") {
        e.preventDefault();
        if (state.gameOver) {
          resetGame();
        } else {
          flapPlane();
        }
      } else if (e.code === "KeyP") {
        togglePause();
      } else if (e.code === "KeyR") {
        resetGame();
      } else if (e.code === "KeyM") {
        toggleSound();
      } else if (e.code === "KeyF") {
        toggleFullscreen();
      }
    });

    function togglePause() {
      if (state.gameOver) return;
      state.paused = !state.paused;
      if (state.paused) {
        pauseBtn.textContent = "Resume";
        pauseBtn.classList.add("active-toggle");
        statusPill.textContent = "PAUSED";
        statusPill.classList.remove("hidden");
        pauseBgm();
      } else {
        pauseBtn.textContent = "Pause";
        pauseBtn.classList.remove("active-toggle");
        statusPill.classList.add("hidden");
        lastTime = performance.now();
        startBgm();
      }
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      if (soundEnabled) {
        soundBtn.textContent = "Sound on";
        soundBtn.classList.remove("active-toggle");
        ensureAudio();
        if (!state.paused && !state.gameOver) {
          startBgm();
        }
        if (!bgmAvailable) {
          playFlapSound();
        }
      } else {
        soundBtn.textContent = "Sound off";
        soundBtn.classList.add("active-toggle");
        stopAllAudioFiles();
      }
    }

    function toggleFullscreen() {
      const docEl = document.documentElement;
      if (!document.fullscreenElement) {
        if (docEl.requestFullscreen) {
          docEl.requestFullscreen().catch(function () {});
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(function () {});
        }
      }
    }

    pauseBtn.addEventListener("click", togglePause);
    restartBtn.addEventListener("click", resetGame);
    playAgainBtn.addEventListener("click", resetGame);
    soundBtn.addEventListener("click", toggleSound);
    fullscreenBtn.addEventListener("click", toggleFullscreen);

    document.addEventListener("fullscreenchange", function () {
      if (document.fullscreenElement) {
        fullscreenBtn.textContent = "⛶ Exit";
      } else {
        fullscreenBtn.textContent = "⛶ Fullscreen";
      }
      setTimeout(resizeCanvas, 60);
    });

    window.addEventListener("resize", resizeCanvas);

    window.onload = function () {
      resizeCanvas();
      resetGame();
      lastTime = performance.now();
      if (animId) cancelAnimationFrame(animId);
      animId = requestAnimationFrame(gameLoop);
    };
  </script>
</body>
</html>
