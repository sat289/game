
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Samose! - TFI Games</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #0f172a;
  font-family: Arial, sans-serif;
  touch-action: none;
}

#game {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

canvas {
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}

#hud {
  position: absolute;
  top: max(14px, env(safe-area-inset-top));
  left: 12px;
  z-index: 5;
  color: white;
  font-size: 17px;
  font-weight: bold;
  text-shadow: 0 2px 5px black;
  pointer-events: none;
}

#controls {
  position: absolute;
  top: max(10px, env(safe-area-inset-top));
  right: 10px;
  display: flex;
  gap: 6px;
  z-index: 10;
}

.icon-btn {
  width: 40px;
  height: 40px;
  border: 1px solid rgba(255,255,255,.4);
  border-radius: 12px;
  background: rgba(15,23,42,.82);
  color: white;
  font-size: 21px;
  display: grid;
  place-items: center;
}

#warning {
  position: absolute;
  top: 23%;
  left: 50%;
  transform: translateX(-50%);
  display: none;
  z-index: 7;
  color: #ff2424;
  font-size: clamp(23px, 6vw, 32px);
  font-weight: 900;
  text-shadow: 0 3px 6px black;
  white-space: nowrap;
  pointer-events: none;
}

#warning.show {
  display: block;
  animation: pulse .35s infinite alternate;
}

@keyframes pulse {
  from {
    opacity: .65;
    transform: translateX(-50%) scale(.96);
  }
  to {
    opacity: 1;
    transform: translateX(-50%) scale(1.04);
  }
}

#hint {
  position: absolute;
  bottom: max(18px, env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  color: white;
  font-size: 13px;
  white-space: nowrap;
  text-shadow: 0 2px 5px black;
  pointer-events: none;
}

#message {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  text-align: center;
  color: white;
  background: rgba(0,0,0,.7);
}

#message.hidden {
  display: none;
}

#message h1 {
  font-size: clamp(36px, 10vw, 58px);
  color: #ffd34d;
  margin-bottom: 14px;
  text-shadow: 0 4px 0 #8b4513;
}

#message p {
  font-size: 17px;
  line-height: 1.5;
  margin-bottom: 22px;
  max-width: 340px;
}

.main-btn {
  padding: 14px 35px;
  border: 0;
  border-radius: 14px;
  background: #ff9f1c;
  color: #241300;
  font-size: 20px;
  font-weight: 900;
  box-shadow: 0 5px 0 #b85c00;
}
</style>
</head>

<body>

<div id="game">

  <canvas id="canvas"></canvas>

  <div id="hud">
    Score: <span id="score">0</span>
    &nbsp; 🥟 <span id="collected">0</span>
  </div>

  <div id="controls">
    <button class="icon-btn" id="pauseBtn">Ⅱ</button>
    <button class="icon-btn" id="restartBtn">↻</button>
    <button class="icon-btn" id="soundBtn">🔊</button>
    <button class="icon-btn" id="fullBtn">⛶</button>
  </div>

  <div id="warning">⚠ FLASHMAN COMING!</div>

  <div id="hint">
    HOLD SCREEN TO FLY UP • RELEASE TO FALL
  </div>

  <div id="message">
    <h1 id="messageTitle">🥟 SAMOSE!</h1>
    <p id="messageText">
      Help Bunny collect samosas and escape Flashman!<br>
      Hold your finger to fly up. Release to fall.
    </p>
    <button class="main-btn" id="startBtn">PLAY GAME</button>
  </div>

</div>

<script>
(() => {
"use strict";

/* =====================================
   EXISTING IMAGE FILES
===================================== */

const ASSETS = {
  bunny: "assets/bunny.png",
  background: "assets/samosa.png",
  samosa: "assets/samo.png",
  gameover: "assets/gameover.jpg"
};

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const scoreEl = document.getElementById("score");
const collectedEl = document.getElementById("collected");

const message = document.getElementById("message");
const messageTitle = document.getElementById("messageTitle");
const messageText = document.getElementById("messageText");

const warning = document.getElementById("warning");

const startBtn = document.getElementById("startBtn");
const pauseBtn = document.getElementById("pauseBtn");
const restartBtn = document.getElementById("restartBtn");
const soundBtn = document.getElementById("soundBtn");
const fullBtn = document.getElementById("fullBtn");

/* =====================================
   LOAD IMAGES
===================================== */

const images = {};

function loadImage(name, path) {
  const img = new Image();
  img.onload = () => console.log(name + " loaded");
  img.onerror = () => console.error("Cannot load " + path);
  img.src = path;
  images[name] = img;
}

Object.entries(ASSETS).forEach(([name, path]) => {
  loadImage(name, path);
});

/* =====================================
   AUDIO
===================================== */

const collectAudio = new Audio("assets/samose_sfx.mp3");
const musicAudio = new Audio("assets/bgm_samosa.mp3");
const flashmanAudio = new Audio("assets/samo.mp3");

collectAudio.preload = "auto";
musicAudio.preload = "auto";
flashmanAudio.preload = "auto";

collectAudio.volume = 0.8;
musicAudio.volume = 0.35;
musicAudio.loop = true;
flashmanAudio.volume = 1;

let soundEnabled = true;

function playSound(audio) {
  if (!soundEnabled) return;

  try {
    audio.currentTime = 0;
    const promise = audio.play();
    if (promise) promise.catch(() => {});
  } catch (error) {}
}

function stopSound(audio) {
  try {
    audio.pause();
    audio.currentTime = 0;
  } catch (error) {}
}

/* =====================================
   SCREEN
===================================== */

let W = 0;
let H = 0;
let DPR = 1;

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;

  DPR = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  if (bunny) {
    bunny.x = W * 0.2;
    bunny.y = Math.max(
      bunny.height / 2,
      Math.min(H - bunny.height / 2, bunny.y)
    );
  }
}

window.addEventListener("resize", resize);

/* =====================================
   SETTINGS
===================================== */

const SETTINGS = {
  gravity: 0.38,

  // Bunny speed increased
  flyAcceleration: 1.05,
  maxFlySpeed: 8.5,
  maxFallSpeed: 7,

  // First Flashman after 12 seconds
  firstWaveDelay: 12,

  // Later waves every 18 seconds
  nextWaveDelay: 18,

  // Maximum wave size
  maximumFlashmen: 6,

  flashmanSpeed: 3.3,

  samosaSpeed: 3.2,
  samosaInterval: 1.6
};

/* =====================================
   GAME VARIABLES
===================================== */

let running = false;
let paused = false;
let gameOver = false;
let holding = false;

let score = 0;
let collected = 0;

let elapsed = 0;
let nextWaveAt = SETTINGS.firstWaveDelay;
let waveNumber = 0;

let warningTimer = 0;
let samosaTimer = 0;
let backgroundOffset = 0;

let bunny = {
  x: 0,
  y: 0,
  width: 58,
  height: 58,
  velocityY: 0
};

let samosas = [];
let flashmans = [];

/* =====================================
   RESET GAME
===================================== */

function resetGame() {
  score = 0;
  collected = 0;

  elapsed = 0;
  nextWaveAt = SETTINGS.firstWaveDelay;
  waveNumber = 0;

  warningTimer = 0;
  samosaTimer = 0;
  backgroundOffset = 0;

  bunny.x = W * 0.2;
  bunny.y = H * 0.5;
  bunny.velocityY = 0;

  samosas = [];
  flashmans = [];

  holding = false;
  paused = false;
  gameOver = false;

  warning.classList.remove("show");

  updateHUD();
  spawnSamosa();
}

/* =====================================
   START GAME
===================================== */

function startGame() {
  stopSound(musicAudio);
  stopSound(collectAudio);
  stopSound(flashmanAudio);

  resetGame();

  running = true;

  message.classList.add("hidden");
  pauseBtn.textContent = "Ⅱ";

  playSound(musicAudio);

  lastTime = performance.now();
  requestAnimationFrame(loop);
}

/* =====================================
   SCORE
===================================== */

function updateHUD() {
  scoreEl.textContent = score;
  collectedEl.textContent = collected;
}

/* =====================================
   BACKGROUND
===================================== */

function drawBackground() {
  const img = images.background;

  if (img && img.complete && img.naturalWidth > 0) {
    const scale = Math.max(W / img.width, H / img.height);

    const bw = img.width * scale;
    const bh = img.height * scale;

    ctx.drawImage(
      img,
      (W - bw) / 2,
      (H - bh) / 2,
      bw,
      bh
    );
  } else {
    const gradient = ctx.createLinearGradient(0, 0, 0, H);
    gradient.addColorStop(0, "#f9b34b");
    gradient.addColorStop(1, "#b65b20");

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, W, H);
  }
}

/* =====================================
   BUNNY
===================================== */

function drawBunny() {
  const img = images.bunny;

  if (img && img.complete && img.naturalWidth > 0) {
    ctx.drawImage(
      img,
      bunny.x - bunny.width / 2,
      bunny.y - bunny.height / 2,
      bunny.width,
      bunny.height
    );
  } else {
    ctx.font = "48px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("🐰", bunny.x, bunny.y);
  }
}

function updateBunny(dt) {
  if (holding) {
    bunny.velocityY -= SETTINGS.flyAcceleration * dt;

    bunny.velocityY = Math.max(
      bunny.velocityY,
      -SETTINGS.maxFlySpeed
    );
  } else {
    bunny.velocityY += SETTINGS.gravity * dt;

    bunny.velocityY = Math.min(
      bunny.velocityY,
      SETTINGS.maxFallSpeed
    );
  }

  bunny.y += bunny.velocityY * dt;

  // Bunny never dies at top or bottom.

  const half = bunny.height / 2;

  if (bunny.y < half) {
    bunny.y = half;
    bunny.velocityY = 0;
  }

  if (bunny.y > H - half) {
    bunny.y = H - half;
    bunny.velocityY = 0;
  }
}

/* =====================================
   SAMOSAS
===================================== */

function spawnSamosa() {
  const margin = 75;

  samosas.push({
    x: W + 45,
    y: margin + Math.random() * Math.max(20, H - margin * 2),
    size: 40
  });
}

function drawSamosas() {
  const img = images.samosa;

  samosas.forEach(s => {
    if (img && img.complete && img.naturalWidth > 0) {
      ctx.drawImage(
        img,
        s.x - s.size / 2,
        s.y - s.size / 2,
        s.size,
        s.size
      );
    } else {
      ctx.font = "34px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("🥟", s.x, s.y);
    }
  });
}

function updateSamosas(dt) {
  samosaTimer += dt / 60;

  if (samosaTimer >= SETTINGS.samosaInterval) {
    samosaTimer = 0;
    spawnSamosa();
  }

  for (let i = samosas.length - 1; i >= 0; i--) {
    const s = samosas[i];

    s.x -= SETTINGS.samosaSpeed * dt;

    const dx = bunny.x - s.x;
    const dy = bunny.y - s.y;

    if (Math.hypot(dx, dy) < 38) {
      samosas.splice(i, 1);

      collected++;
      score += 10;

      updateHUD();

      // This is the samosa collection sound only.
      playSound(collectAudio);
      continue;
    }

    if (s.x < -60) {
      samosas.splice(i, 1);
    }
  }
}

/* =====================================
   FLASHMAN EMOJI
===================================== */

// No image file required.
// The running-person emoji is Flashman.

function drawFlashman(f) {
  ctx.save();

  // Red warning circle behind Flashman
  ctx.beginPath();
  ctx.arc(f.x, f.y, 34, 0, Math.PI * 2);
  ctx.fillStyle = "#e52b2b";
  ctx.fill();

  ctx.lineWidth = 3;
  ctx.strokeStyle = "#700000";
  ctx.stroke();

  // Draw Flashman emoji
  ctx.font = '58px "Noto Color Emoji", "Apple Color Emoji", sans-serif';
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = "white";
  ctx.fillText("🏃", f.x, f.y + 1);

  ctx.restore();
}

/* =====================================
   FLASHMAN WAVES
===================================== */

function spawnFlashmanWave() {
  waveNumber++;

  const count = Math.min(
    waveNumber,
    SETTINGS.maximumFlashmen
  );

  const margin = 75;
  const availableHeight = Math.max(60, H - margin * 2);

  const newWave = [];

  for (let i = 0; i < count; i++) {
    let y;

    if (count === 1) {
      y = H * 0.5;
    } else {
      y = margin + (availableHeight * i / (count - 1));
    }

    newWave.push({
      // Start at the right edge, already visible
      x: W - 28,
      y: y,
      radius: 34,
      speed: SETTINGS.flashmanSpeed + Math.min(waveNumber * 0.12, 1.5)
    });
  }

  // Add the complete wave before playing the sound.
  flashmans.push(...newWave);

  // Alert appears at the same time as Flashman.
  warningTimer = 2.5;
  warning.classList.add("show");

  // Flashman dialogue only.
  playSound(flashmanAudio);

  console.log(
    "Flashman wave " + waveNumber +
    " appeared with " + count + " enemies"
  );
}

function updateFlashmans(dt) {
  elapsed += dt / 60;

  if (elapsed >= nextWaveAt) {
    spawnFlashmanWave();

    nextWaveAt = elapsed + SETTINGS.nextWaveDelay;
  }

  if (warningTimer > 0) {
    warningTimer -= dt / 60;

    if (warningTimer <= 0) {
      warningTimer = 0;
      warning.classList.remove("show");
    }
  }

  for (let i = flashmans.length - 1; i >= 0; i--) {
    const f = flashmans[i];

    // Flashman always moves from right to left.
    f.x -= f.speed * dt;

    if (f.x < -80) {
      flashmans.splice(i, 1);
    }
  }
}

/* =====================================
   DRAW FLASHMEN
===================================== */

function drawFlashmans() {
  flashmans.forEach(f => {
    drawFlashman(f);
  });
}

/* =====================================
   COLLISION
===================================== */

function checkCollision() {
  for (const f of flashmans) {
    const dx = bunny.x - f.x;
    const dy = bunny.y - f.y;

    if (Math.hypot(dx, dy) < 48) {
      endGame();
      return;
    }
  }
}

/* =====================================
   GAME OVER
===================================== */

function endGame() {
  if (gameOver) return;

  gameOver = true;
  running = false;
  holding = false;

  stopSound(musicAudio);
  stopSound(flashmanAudio);
  stopSound(collectAudio);

  warning.classList.remove("show");

  messageTitle.textContent = "GAME OVER!";

  messageText.textContent =
    "Flashman caught Bunny! Your score: " + score;

  startBtn.textContent = "PLAY AGAIN";

  message.classList.remove("hidden");
}

/* =====================================
   DRAW
===================================== */

function draw() {
  drawBackground();
  drawSamosas();
  drawFlashmans();
  drawBunny();
}

/* =====================================
   UPDATE
===================================== */

function update(dt) {
  if (!running || paused || gameOver) return;

  backgroundOffset += 2 * dt;

  updateBunny(dt);
  updateSamosas(dt);
  updateFlashmans(dt);

  checkCollision();

  updateHUD();
}

/* =====================================
   MAIN LOOP
===================================== */

let lastTime = 0;

function loop(timestamp) {
  if (!running || paused) return;

  let dt = (timestamp - lastTime) / 16.67;

  lastTime = timestamp;

  dt = Math.min(dt, 2.5);

  update(dt);
  draw();

  if (running && !paused) {
    requestAnimationFrame(loop);
  }
}

/* =====================================
   TOUCH CONTROLS
===================================== */

function startHolding(e) {
  if (!running || paused || gameOver) return;

  holding = true;

  if (e && e.pointerId !== undefined) {
    try {
      canvas.setPointerCapture(e.pointerId);
    } catch (error) {}
  }
}

function stopHolding() {
  holding = false;
}

canvas.addEventListener("pointerdown", startHolding);
window.addEventListener("pointerup", stopHolding);
window.addEventListener("pointercancel", stopHolding);
window.addEventListener("blur", stopHolding);

/* =====================================
   BUTTONS
===================================== */

startBtn.addEventListener("click", startGame);
restartBtn.addEventListener("click", startGame);

pauseBtn.addEventListener("click", () => {
  if (!running || gameOver) return;

  paused = !paused;
  holding = false;

  pauseBtn.textContent = paused ? "▶" : "Ⅱ";

  if (paused) {
    musicAudio.pause();
  } else {
    playSound(musicAudio);
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }
});

soundBtn.addEventListener("click", () => {
  soundEnabled = !soundEnabled;

  soundBtn.textContent = soundEnabled ? "🔊" : "🔇";

  if (!soundEnabled) {
    stopSound(musicAudio);
    stopSound(collectAudio);
    stopSound(flashmanAudio);
  } else if (running && !paused) {
    playSound(musicAudio);
  }
});

fullBtn.addEventListener("click", async () => {
  try {
    if (!document.fullscreenElement) {
      await document.documentElement.requestFullscreen();
    } else {
      await document.exitFullscreen();
    }
  } catch (error) {
    console.log("Fullscreen is unavailable in this environment.");
  }
});

/* =====================================
   INITIALIZE
===================================== */

resize();

bunny.x = W * 0.2;
bunny.y = H * 0.5;

draw();

})();
</script>

</body>
</html>
