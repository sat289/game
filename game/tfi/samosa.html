
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Samose! - TFI Games</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #0f172a;
  font-family: Arial, sans-serif;
  touch-action: none;
}

#game {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #0f172a;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}

#controls {
  position: absolute;
  top: max(12px, env(safe-area-inset-top));
  right: 12px;
  display: flex;
  gap: 8px;
  z-index: 10;
}

.icon-btn {
  width: 42px;
  height: 42px;
  border: 1px solid rgba(255,255,255,.35);
  border-radius: 13px;
  background: rgba(15,23,42,.72);
  color: white;
  font-size: 21px;
  display: grid;
  place-items: center;
  cursor: pointer;
  backdrop-filter: blur(8px);
}

#hud {
  position: absolute;
  top: max(14px, env(safe-area-inset-top));
  left: 12px;
  z-index: 5;
  color: white;
  font-size: 17px;
  font-weight: bold;
  text-shadow: 0 2px 4px #000;
  pointer-events: none;
}

#message {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 25px;
  text-align: center;
  color: white;
  background: rgba(0,0,0,.62);
}

#message.hidden {
  display: none;
}

#message h1 {
  font-size: clamp(35px, 9vw, 58px);
  color: #ffd54a;
  margin-bottom: 12px;
  text-shadow: 0 4px 0 #8b4513;
}

#message p {
  font-size: 17px;
  line-height: 1.5;
  margin-bottom: 22px;
  max-width: 340px;
}

.main-btn {
  border: 0;
  border-radius: 15px;
  background: #ff9f1c;
  color: #241300;
  font-size: 20px;
  font-weight: 900;
  padding: 14px 35px;
  box-shadow: 0 5px 0 #b85c00;
}

#hint {
  position: absolute;
  bottom: max(20px, env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  color: white;
  font-size: 13px;
  text-shadow: 0 2px 4px black;
  white-space: nowrap;
  pointer-events: none;
}
</style>
</head>

<body>
<div id="game">
  <canvas id="canvas"></canvas>

  <div id="hud">
    Score: <span id="score">0</span>
    &nbsp; 🥟 <span id="collected">0</span>
  </div>

  <div id="controls">
    <button class="icon-btn" id="pauseBtn" aria-label="Pause">Ⅱ</button>
    <button class="icon-btn" id="restartBtn" aria-label="Restart">↻</button>
    <button class="icon-btn" id="soundBtn" aria-label="Sound">🔊</button>
    <button class="icon-btn" id="fullBtn" aria-label="Fullscreen">⛶</button>
  </div>

  <div id="hint">HOLD SCREEN TO FLY UP • RELEASE TO FALL</div>

  <div id="message">
    <h1 id="messageTitle">🥟 SAMOSE!</h1>
    <p id="messageText">
      Help Bunny collect samosas and escape Flashman!<br>
      Hold your finger to fly up. Release to fall.
    </p>
    <button class="main-btn" id="startBtn">PLAY GAME</button>
  </div>
</div>

<script>
(() => {
"use strict";

/* ===================================
   EXISTING ASSET FILENAMES
=================================== */

const ASSETS = {
  bunny: "assets/bunny.png",
  background: "assets/samosa.png",
  samosa: "assets/samo.png",
  flashman: "assets/flashman.png",
  gameover: "assets/gameover.jpg",
  collectSound: "assets/samose_sfx.mp3",
  music: "assets/bgm_samosa.mp3",
  flashmanVoice: "assets/samo.mp3"
};

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const scoreEl = document.getElementById("score");
const collectedEl = document.getElementById("collected");
const message = document.getElementById("message");
const messageTitle = document.getElementById("messageTitle");
const messageText = document.getElementById("messageText");
const startBtn = document.getElementById("startBtn");
const pauseBtn = document.getElementById("pauseBtn");
const restartBtn = document.getElementById("restartBtn");
const soundBtn = document.getElementById("soundBtn");
const fullBtn = document.getElementById("fullBtn");

const images = {};

function loadImage(name, src) {
  const img = new Image();
  img.src = src;
  images[name] = img;
}

Object.entries(ASSETS).forEach(([name, src]) => {
  if (name === "collectSound" || name === "music" ||
      name === "flashmanVoice") return;
  loadImage(name, src);
});

/* ===================================
   AUDIO
=================================== */

const collectAudio = new Audio(ASSETS.collectSound);
const musicAudio = new Audio(ASSETS.music);
const flashmanAudio = new Audio(ASSETS.flashmanVoice);

musicAudio.loop = true;
musicAudio.volume = 0.35;
collectAudio.volume = 0.8;
flashmanAudio.volume = 1;

let soundEnabled = true;

function playAudio(audio, restart = true) {
  if (!soundEnabled) return;
  try {
    if (restart) audio.currentTime = 0;
    const result = audio.play();
    if (result && result.catch) result.catch(() => {});
  } catch (e) {}
}

function stopAudio(audio) {
  try {
    audio.pause();
    audio.currentTime = 0;
  } catch (e) {}
}

/* ===================================
   SCREEN SIZE
=================================== */

let W = 0;
let H = 0;
let dpr = 1;

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener("resize", resize);
resize();

/* ===================================
   GAME VARIABLES
=================================== */

let running = false;
let paused = false;
let gameOver = false;
let holding = false;

let score = 0;
let collected = 0;
let elapsed = 0;
let lastTime = 0;

let bunny = {
  x: 0,
  y: 0,
  width: 58,
  height: 58,
  velocityY: 0
};

let samosas = [];
let flashmans = [];

let samosaTimer = 0;
let flashmanTimer = 0;
let nextFlashmanWave = 1;

let backgroundOffset = 0;
let warningTextTimer = 0;

/* ===================================
   GAME SETTINGS
=================================== */

const SETTINGS = {
  gravity: 0.34,

  // Increased bunny flying speed
  flyAcceleration: 0.82,
  maxFlySpeed: 7.2,

  // Falling speed
  maxFallSpeed: 6.5,

  // First Flashman appears after this time
  firstFlashmanTime: 12,

  // Time between later waves
  waveInterval: 17,

  // Samosa generation
  samosaInterval: 1.5,

  // Flashman movement speed
  flashmanSpeed: 3.2
};

/* ===================================
   RESET GAME
=================================== */

function resetGame() {
  score = 0;
  collected = 0;
  elapsed = 0;

  bunny.x = W * 0.20;
  bunny.y = H * 0.48;
  bunny.velocityY = 0;

  samosas = [];
  flashmans = [];

  samosaTimer = 0;
  flashmanTimer = 0;
  nextFlashmanWave = 1;

  backgroundOffset = 0;
  warningTextTimer = 0;

  holding = false;
  gameOver = false;
  paused = false;

  updateHUD();
  spawnSamosa();
}

/* ===================================
   START GAME
=================================== */

function startGame() {
  resetGame();

  running = true;
  lastTime = performance.now();

  message.classList.add("hidden");
  pauseBtn.textContent = "Ⅱ";

  playAudio(musicAudio, false);

  requestAnimationFrame(loop);
}

/* ===================================
   HUD
=================================== */

function updateHUD() {
  scoreEl.textContent = score;
  collectedEl.textContent = collected;
}

/* ===================================
   BACKGROUND
=================================== */

function drawBackground() {
  const bg = images.background;

  if (bg && bg.complete && bg.naturalWidth > 0) {
    const scale = Math.max(W / bg.width, H / bg.height);
    const bw = bg.width * scale;
    const bh = bg.height * scale;

    ctx.drawImage(bg, (W - bw) / 2, (H - bh) / 2, bw, bh);
  } else {
    const gradient = ctx.createLinearGradient(0, 0, 0, H);
    gradient.addColorStop(0, "#f9b34b");
    gradient.addColorStop(1, "#b65b20");
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, W, H);
  }

  ctx.fillStyle = "rgba(255,255,255,0.12)";
  for (let i = 0; i < 5; i++) {
    const x = ((i * 180 - backgroundOffset * 0.25) % (W + 180) + W + 180) % (W + 180);
    ctx.beginPath();
    ctx.arc(x, H * 0.2 + (i % 3) * 90, 18 + i * 4, 0, Math.PI * 2);
    ctx.fill();
  }
}

/* ===================================
   BUNNY
=================================== */

function drawBunny() {
  const img = images.bunny;

  if (img && img.complete && img.naturalWidth > 0) {
    ctx.drawImage(
      img,
      bunny.x - bunny.width / 2,
      bunny.y - bunny.height / 2,
      bunny.width,
      bunny.height
    );
  } else {
    ctx.font = "48px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("🐰", bunny.x, bunny.y);
  }
}

function updateBunny(dt) {
  if (holding) {
    bunny.velocityY -= SETTINGS.flyAcceleration * dt;

    if (bunny.velocityY < -SETTINGS.maxFlySpeed) {
      bunny.velocityY = -SETTINGS.maxFlySpeed;
    }
  } else {
    bunny.velocityY += SETTINGS.gravity * dt;

    if (bunny.velocityY > SETTINGS.maxFallSpeed) {
      bunny.velocityY = SETTINGS.maxFallSpeed;
    }
  }

  bunny.y += bunny.velocityY * dt;

  // Bunny cannot die at top or bottom.
  // It stays inside the playable screen.
  const half = bunny.height / 2;

  if (bunny.y < half) {
    bunny.y = half;
    if (bunny.velocityY < 0) bunny.velocityY = 0;
  }

  if (bunny.y > H - half) {
    bunny.y = H - half;
    if (bunny.velocityY > 0) bunny.velocityY = 0;
  }
}

/* ===================================
   SAMOSA COLLECTIBLES
=================================== */

function spawnSamosa() {
  const margin = 75;

  samosas.push({
    x: W + 40,
    y: margin + Math.random() * Math.max(20, H - margin * 2),
    size: 38,
    collected: false
  });
}

function drawSamosas() {
  const img = images.samosa;

  samosas.forEach(s => {
    if (img && img.complete && img.naturalWidth > 0) {
      ctx.drawImage(
        img,
        s.x - s.size / 2,
        s.y - s.size / 2,
        s.size,
        s.size
      );
    } else {
      ctx.font = "34px Arial";
      ctx.textAlign = "center";
      ctx.fillText("🥟", s.x, s.y);
    }
  });
}

function updateSamosas(dt) {
  samosaTimer += dt / 60;

  if (samosaTimer >= SETTINGS.samosaInterval) {
    samosaTimer = 0;
    spawnSamosa();
  }

  samosas.forEach(s => {
    s.x -= 3.2 * dt;

    const dx = bunny.x - s.x;
    const dy = bunny.y - s.y;
    const distance = Math.sqrt(dx * dx + dy * dy);

    if (!s.collected && distance < 38) {
      s.collected = true;
      collected++;
      score += 10;
      updateHUD();
      playAudio(collectAudio);
    }
  });

  samosas = samosas.filter(s => !s.collected && s.x > -60);
}

/* ===================================
   FLASHMAN WAVES
=================================== */

/*
  Wave 1 = one Flashman
  Wave 2 = two Flashmans together
  Wave 3 = three Flashmans together
  Wave 4 = four Flashmans together
  And so on.

  All Flashmans in a wave appear at the
  same time, with different vertical positions.
*/

function spawnFlashmanWave() {
  const count = nextFlashmanWave;

  flashmans = [];

  for (let i = 0; i < count; i++) {
    const margin = 75;
    const availableHeight = Math.max(50, H - margin * 2);

    let y;

    if (count === 1) {
      y = margin + Math.random() * availableHeight;
    } else {
      y = margin + (availableHeight / (count - 1)) * i;
      y += (Math.random() - 0.5) * 35;
    }

    flashmans.push({
      x: W + 80 + i * 48,
      y: Math.max(margin, Math.min(H - margin, y)),
      width: 66,
      height: 66,
      speed: SETTINGS.flashmanSpeed + Math.min(nextFlashmanWave * 0.15, 2)
    });
  }

  // Play Flashman dialogue immediately when the wave appears.
  playAudio(flashmanAudio);

  warningTextTimer = 2.3;

  nextFlashmanWave++;
}

function updateFlashmans(dt) {
  elapsed += dt / 60;

  if (elapsed >= SETTINGS.firstFlashmanTime &&
      flashmans.length === 0 &&
      nextFlashmanWave === 1) {
    spawnFlashmanWave();
  }

  flashmanTimer += dt / 60;

  if (nextFlashmanWave > 1 &&
      flashmanTimer >= SETTINGS.waveInterval) {
    flashmanTimer = 0;
    spawnFlashmanWave();
  }

  flashmans.forEach(f => {
    f.x -= f.speed * dt;
  });

  flashmans = flashmans.filter(f => f.x > -100);

  if (warningTextTimer > 0) {
    warningTextTimer -= dt / 60;
  }
}

/* ===================================
   DRAW FLASHMAN AVATAR
=================================== */

function drawFlashmans() {
  const img = images.flashman;

  flashmans.forEach(f => {
    if (img && img.complete && img.naturalWidth > 0) {
      ctx.drawImage(
        img,
        f.x - f.width / 2,
        f.y - f.height / 2,
        f.width,
        f.height
      );
    } else {
      // Fallback until flashman.png is uploaded
      ctx.font = "53px Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("👹", f.x, f.y);
    }
  });
}

/* ===================================
   COLLISION
=================================== */

function checkFlashmanCollision() {
  for (const f of flashmans) {
    const dx = bunny.x - f.x;
    const dy = bunny.y - f.y;

    const distance = Math.sqrt(dx * dx + dy * dy);

    if (distance < 48) {
      endGame();
      return;
    }
  }
}

/* ===================================
   GAME OVER
=================================== */

function endGame() {
  if (gameOver) return;

  gameOver = true;
  running = false;
  holding = false;

  stopAudio(musicAudio);
  stopAudio(flashmanAudio);

  messageTitle.textContent = "GAME OVER!";
  messageText.textContent =
    "Flashman caught Bunny! Your score: " + score;

  startBtn.textContent = "PLAY AGAIN";
  message.classList.remove("hidden");
}

/* ===================================
   WARNING TEXT
=================================== */

function drawWarning() {
  if (warningTextTimer > 0) {
    ctx.save();

    ctx.textAlign = "center";
    ctx.font = "bold 27px Arial";
    ctx.fillStyle = "#ff2222";
    ctx.shadowColor = "black";
    ctx.shadowBlur = 8;

    ctx.fillText("⚠ FLASHMAN!", W / 2, H * 0.22);

    ctx.restore();
  }
}

/* ===================================
   UPDATE AND DRAW
=================================== */

function update(dt) {
  if (!running || paused || gameOver) return;

  backgroundOffset += 2.2 * dt;
  score += Math.floor(dt * 0.08);

  updateBunny(dt);
  updateSamosas(dt);
  updateFlashmans(dt);
  checkFlashmanCollision();

  updateHUD();
}

function draw() {
  drawBackground();
  drawSamosas();
  drawFlashmans();
  drawBunny();
  drawWarning();
}

/* ===================================
   MAIN GAME LOOP
=================================== */

function loop(timestamp) {
  if (!running) return;

  if (paused) {
    draw();
    return;
  }

  let dt = (timestamp - lastTime) / 16.67;
  lastTime = timestamp;

  dt = Math.min(dt, 2.5);

  update(dt);
  draw();

  if (running && !paused) {
    requestAnimationFrame(loop);
  }
}

/* ===================================
   HOLD TO FLY
=================================== */

function beginHolding(e) {
  if (!running || paused || gameOver) return;

  holding = true;

  if (e && e.pointerId !== undefined) {
    try {
      canvas.setPointerCapture(e.pointerId);
    } catch (err) {}
  }
}

function stopHolding() {
  holding = false;
}

canvas.addEventListener("pointerdown", beginHolding);
window.addEventListener("pointerup", stopHolding);
window.addEventListener("pointercancel", stopHolding);
window.addEventListener("blur", stopHolding);

/* ===================================
   BUTTONS
=================================== */

startBtn.addEventListener("click", startGame);

pauseBtn.addEventListener("click", () => {
  if (!running || gameOver) return;

  paused = !paused;
  holding = false;

  pauseBtn.textContent = paused ? "▶" : "Ⅱ";

  if (paused) {
    musicAudio.pause();
  } else {
    playAudio(musicAudio, false);
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }
});

restartBtn.addEventListener("click", startGame);

soundBtn.addEventListener("click", () => {
  soundEnabled = !soundEnabled;
  soundBtn.textContent = soundEnabled ? "🔊" : "🔇";

  if (!soundEnabled) {
    musicAudio.pause();
    collectAudio.pause();
    flashmanAudio.pause();
  } else if (running && !paused) {
    playAudio(musicAudio, false);
  }
});

fullBtn.addEventListener("click", async () => {
  try {
    if (!document.fullscreenElement) {
      await document.documentElement.requestFullscreen();
    } else {
      await document.exitFullscreen();
    }
  } catch (e) {
    console.log("Fullscreen is not available in this browser.");
  }
});

/* ===================================
   INITIAL SCREEN
=================================== */

function initialDraw() {
  resetGame();
  draw();
}

initialDraw();

})();
</script>
</body>
</html>
