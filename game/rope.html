
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f6a2ce">
<title>ST GAMES - Rope Pals</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;
 background:#f6b3d4;
 font-family:Arial,sans-serif;
 touch-action:none;user-select:none;
}
#game{
 position:relative;width:100%;height:100%;overflow:hidden;
 background:linear-gradient(#f7b1d2,#ffcfce,#ffdfbd);
}
canvas{width:100%;height:100%;display:block;touch-action:none}

#top{
 position:absolute;top:env(safe-area-inset-top,8px);
 left:0;right:0;padding:12px;
 display:flex;align-items:center;justify-content:space-between;
 pointer-events:none;
}
#brand{
 color:white;font-size:14px;font-weight:1000;
 text-shadow:0 2px 5px #a83c79;letter-spacing:1px;
}
.pill{
 pointer-events:auto;border:2px solid white;
 background:#ffffffdf;color:#85365e;
 border-radius:20px;padding:8px 13px;
 font-weight:900;font-size:12px;
 box-shadow:0 3px 0 #d76b9e;
}
#hint{
 position:absolute;bottom:88px;left:50%;
 transform:translateX(-50%);
 background:#ffffffdf;color:#873b63;
 border-radius:22px;padding:9px 13px;
 font-size:10px;font-weight:900;
 white-space:nowrap;pointer-events:none;
 max-width:95%;overflow:hidden;text-overflow:ellipsis;
}
#toast{
 position:absolute;top:72px;left:50%;
 transform:translateX(-50%);
 background:white;color:#a13f70;
 padding:9px 15px;border-radius:20px;
 font-size:12px;font-weight:900;
 display:none;z-index:8;
 text-align:center;max-width:90%;
}

#bottomControls{
 position:absolute;
 bottom:calc(10px + env(safe-area-inset-bottom,0px));
 left:0;right:0;
 display:none;
 grid-template-columns:1fr 1.35fr 1.15fr;
 align-items:center;gap:8px;padding:0 10px;
 z-index:3;pointer-events:auto;
}
.controlBtn{
 min-width:0;height:65px;
 border:3px solid white;border-radius:25px;
 outline:2px solid #693044;outline-offset:-5px;
 font-weight:1000;
 box-shadow:0 5px 0 #873c60,0 7px 12px #71314b44;
 display:flex;flex-direction:column;
 justify-content:center;align-items:center;
 gap:2px;position:relative;overflow:hidden;
}
.controlBtn:active{
 transform:translateY(3px);
 box-shadow:0 2px 0 #873c60;
}
.controlBtn .mainText{
 font-size:clamp(15px,4vw,23px);line-height:1;
}
.controlBtn .smallText{
 font-size:clamp(9px,2.5vw,13px);font-weight:900;
}
#playerBtn,#ropeAdBtn{
 color:#87400b;background:linear-gradient(#ffe849,#ffad08);
}
#directionBtn{
 color:#286d17;background:linear-gradient(#70ff15,#31d900);
}
.adBadge{
 position:absolute;top:2px;right:3px;
 background:#22e33d;color:#126c18;
 border:2px solid white;border-radius:9px;
 font-size:9px;padding:2px 5px;
}
#ropeAdBtn.removed{
 background:linear-gradient(#b9ffd0,#58df91);
 color:#17643a;
}

#overlay,#pause{
 position:absolute;inset:0;display:flex;
 align-items:center;justify-content:center;
 background:#79335466;backdrop-filter:blur(5px);
 z-index:5;
}
#pause{display:none;z-index:6}
.panel{
 width:min(88%,370px);max-height:85%;overflow:auto;
 text-align:center;background:linear-gradient(160deg,#fff,#ffeaf4);
 border:4px solid white;border-radius:27px;
 padding:22px;color:#773052;
 box-shadow:0 12px 0 #d76b9e,0 20px 45px #8a315b55;
}
h1{margin:0 0 7px;color:#f04e9a;font-size:28px}
.sub{font-size:13px;line-height:1.5;color:#9a5276;margin:8px 0 17px}
.action{
 width:100%;border:0;border-radius:15px;padding:14px;
 margin:6px 0;background:linear-gradient(90deg,#ff5ca8,#ff8cc4);
 color:white;font-size:15px;font-weight:1000;
 box-shadow:0 4px 0 #c84885;
}
.secondary{
 background:white;color:#a13f70;
 border:2px solid #ffc0dc;box-shadow:0 3px 0 #e89abd;
}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:12px 0}
.level{
 border:2px solid #ffc1dc;background:white;
 border-radius:12px;padding:11px 0;color:#9b4772;font-weight:900;
}
.level.done{background:#ffe0ef;border-color:#ff72b2}
.level:disabled{opacity:.35}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}

.skinGrid{
 display:grid;grid-template-columns:repeat(4,1fr);
 gap:8px;margin:12px 0;
}
.skinItem{
 background:white;border:2px solid #ffc1dc;
 border-radius:13px;padding:10px 3px;
 color:#873b63;font-weight:900;font-size:25px;
}
.skinItem.selected{border-color:#ff4f9d;background:#ffe0ef}
.skinItem small{display:block;font-size:9px;margin-top:5px}

@media(max-width:380px){
 #bottomControls{gap:5px;padding:0 6px}
 .controlBtn{height:59px;border-radius:19px}
 #hint{bottom:79px;font-size:9px}
}
</style>
</head>

<body>
<div id="game">
<canvas id="c"></canvas>

<div id="top">
 <div id="brand">✦ ST GAMES</div>
 <div style="display:flex;gap:8px">
  <button class="pill" id="levelLabel">LEVEL 1</button>
  <button class="pill" id="pauseBtn">Ⅱ</button>
 </div>
</div>

<div id="hint">HOLD ANYWHERE TO MOVE · SWITCH PAL AFTER LANDING</div>
<div id="toast"></div>

<div id="bottomControls">
 <button class="controlBtn" id="playerBtn">
  <span class="mainText" id="playerText">1P ⟳</span>
  <span class="smallText">SWITCH PET</span>
 </button>

 <button class="controlBtn" id="directionBtn">
  <span class="mainText" id="directionText">Forward ⇄</span>
  <span class="smallText">CHANGE DIRECTION</span>
 </button>

 <button class="controlBtn" id="ropeAdBtn">
  <span class="adBadge" id="adBadge">AD</span>
  <span class="mainText" id="ropeText">🔗</span>
  <span class="smallText" id="ropeSmallText">Remove Rope</span>
 </button>
</div>

<div id="overlay">
 <div class="panel" id="panel">
  <h1>ROPE PALS</h1>
  <div class="sub">
   TWO PETS · ONE ROPE · ONE ADVENTURE<br>
   Jump forward and help both pals reach the finish!
  </div>
  <button class="action" id="play">PLAY</button>
  <button class="action secondary" id="levelsBtn">SELECT LEVEL</button>
  <button class="action secondary" id="more">MORE GAMES · ST GAMES</button>
  <div class="sub">Your progress saves automatically.</div>
 </div>
</div>

<div id="pause">
 <div class="panel">
  <h1>PAUSED</h1>
  <button class="action" id="resume">RESUME</button>
  <button class="action secondary" id="restart">RESTART LEVEL</button>
  <button class="action secondary" id="home">LEVEL MENU</button>
 </div>
</div>
</div>

<script>
(()=>{
'use strict';

const $=id=>document.getElementById(id);
const canvas=$('c');
const ctx=canvas.getContext('2d');
const gameScreen=$('game');

let W=0,H=0,dpr=1;
let cam=0,level=1,active=0;
let running=false,paused=false,won=false;
let ropeOn=true,skin=0;
let holding=false;
let pointerId=null;
let world=[],pets=[],particles=[];
let goal=0;
let checkpoint=null;
let direction=1;
let adBusy=false;
let last=0;
let rescueToast=false;

const gravity=1450;
const ropeLen=185;
const moveSpeed=190;
const rescueSpeed=115;

const skins=[
 {emoji:'🐥',name:'Chick',color:'#ffe45c'},
 {emoji:'🐱',name:'Cat',color:'#ffb65e'},
 {emoji:'🐸',name:'Frog',color:'#75e88b'},
 {emoji:'🐼',name:'Panda',color:'#ffffff'},
 {emoji:'🐰',name:'Bunny',color:'#ffd4e8'},
 {emoji:'🦊',name:'Fox',color:'#ff995e'},
 {emoji:'🐵',name:'Monkey',color:'#bb855f'},
 {emoji:'🐧',name:'Penguin',color:'#b8e7ff'}
];

let saved;
try{
 saved=JSON.parse(localStorage.getItem('st_ropepals_progress'))||
 {unlocked:1,done:[],skin:0};
}catch(e){
 saved={unlocked:1,done:[],skin:0};
}
skin=saved.skin||0;

function save(){
 try{
  localStorage.setItem('st_ropepals_progress',JSON.stringify(saved));
 }catch(e){}
}

function resize(){
 dpr=Math.min(devicePixelRatio||1,2);
 W=innerWidth;H=innerHeight;
 canvas.width=W*dpr;
 canvas.height=H*dpr;
 ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize',resize);
resize();

function sound(freq=440,duration=.1,type='sine'){
 try{
  let ac=sound.ac||(sound.ac=new(window.AudioContext||window.webkitAudioContext)());
  let o=ac.createOscillator();
  let g=ac.createGain();
  o.type=type;
  o.frequency.value=freq;
  g.gain.setValueAtTime(.05,ac.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+duration);
  o.connect(g);g.connect(ac.destination);
  o.start();o.stop(ac.currentTime+duration);
 }catch(e){}
}

function toast(message){
 $('toast').textContent=message;
 $('toast').style.display='block';
 clearTimeout(toast.timer);
 toast.timer=setTimeout(()=>$('toast').style.display='none',1500);
}

function burst(x,y,color,count=10){
 for(let i=0;i<count;i++){
  particles.push({
   x,y,vx:(Math.random()-.5)*180,
   vy:-Math.random()*160-20,
   life:.4+Math.random()*.4,
   size:2+Math.random()*4,color
  });
 }
}

function updateButtons(){
 $('playerText').textContent=(active===0?'1P':'2P')+' ⟳';
 $('directionText').textContent=direction===1?'Forward →':'Reverse ←';
 $('ropeText').textContent=ropeOn?'🔗':'✓';
 $('ropeSmallText').textContent=ropeOn?'Remove Rope':'Rope Removed';
 $('ropeAdBtn').classList.toggle('removed',!ropeOn);
 $('adBadge').style.display=ropeOn?'block':'none';
}

function makeLevel(n){
 level=n;
 world=[];
 particles=[];
 cam=0;
 active=0;
 direction=1;
 won=false;
 holding=false;
 pointerId=null;
 checkpoint=null;
 ropeOn=true;
 rescueToast=false;

 const base=H*.68;
 let x=0;

 world.push({x:0,y:base+40,w:340,h:130});

 for(let i=0;i<10+(n%5);i++){
  x+=175+(i%3)*35;
  let y=base+Math.sin((i+n)*1.1)*45;
  world.push({x,y:y+35,w:125+(i%2)*25,h:100});
 }

 goal=x+190;
 world.push({x:goal,y:base+40,w:240,h:130});

 pets=[
  createPet(105,base+23,0),
  createPet(150,base+23,1)
 ];

 saveCheckpoint();
 updateButtons();
 $('levelLabel').textContent='LEVEL '+n;
 $('hint').textContent='HOLD ANYWHERE TO MOVE · SWITCH PAL AFTER LANDING';
}

function createPet(x,y,i){
 return {
  x,y,vx:0,vy:0,
  ground:true,
  face:1,
  anim:0,
  hopping:false,
  fallen:false,
  rescuing:false,
  id:i,
  emoji:skins[skin].emoji
 };
}

function saveCheckpoint(){
 if(pets.every(p=>p.ground&&!p.fallen&&!p.rescuing)){
  checkpoint=pets.map(p=>({x:p.x,y:p.y}));
 }
}

function start(n){
 makeLevel(n);
 $('overlay').style.display='none';
 $('pause').style.display='none';
 $('bottomControls').style.display='grid';
 paused=false;
 running=true;
 last=performance.now();
 requestAnimationFrame(loop);
}

function setActive(i){
 if(pets[i].fallen||pets[i].rescuing)return;
 active=i;
 updateButtons();
}

function switchPlayer(){
 if(!running||paused||won)return;
 const other=1-active;
 if(pets[other].fallen||pets[other].rescuing){
  toast('YOUR PAL IS BEING RESCUED!');
  return;
 }
 setActive(other);
 sound(620,.07,'triangle');
}

function switchDirection(){
 if(!running||paused||won)return;
 direction*=-1;
 updateButtons();
 toast(direction===1?'FORWARD MODE':'REVERSE MODE');
 sound(430,.07,'triangle');
}

/* Jump only the active pet. */
function jump(){
 if(!running||paused||won)return;
 const p=pets[active];
 if(p.fallen||p.rescuing||!p.ground)return;

 p.ground=false;
 p.hopping=true;
 p.face=direction;
 p.vy=-560;
 p.vx=0;
 burst(p.x,p.y+12,'#ffffff',6);
 sound(520,.08,'triangle');
 $('hint').textContent='HOLD TO MOVE '+(direction===1?'FORWARD':'BACKWARD');
}

/* Find a platform directly underneath a pet. */
function groundAt(p,oldY){
 let best=null;
 for(const a of world){
  if(p.x+13>a.x&&p.x-13<a.x+a.w&&
     oldY+17<=a.y+8&&p.y+17>=a.y-2){
   if(!best||a.y<best.y)best=a;
  }
 }
 return best;
}

/* Straight rope distance constraint.
   Both pets move gently instead of the rope stretching. */
function constrainRope(dt){
 if(!ropeOn)return;
 const a=pets[0],b=pets[1];
 if(a.fallen||b.fallen||a.rescuing||b.rescuing)return;

 let dx=b.x-a.x,dy=b.y-a.y;
 let dist=Math.hypot(dx,dy);
 if(dist<=ropeLen)return;

 let excess=dist-ropeLen;
 let nx=dx/dist,ny=dy/dist;

 const aFree=!a.ground;
 const bFree=!b.ground;

 if(aFree&&bFree){
  a.x+=nx*excess*.5;
  a.y+=ny*excess*.5;
  b.x-=nx*excess*.5;
  b.y-=ny*excess*.5;
 }else if(aFree){
  a.x+=nx*excess;
  a.y+=ny*excess;
 }else if(bFree){
  b.x-=nx*excess;
  b.y-=ny*excess;
 }else{
  if(active===0)b.x-=nx*excess;
  else a.x+=nx*excess;
 }
}

/* Rescue a fallen pet by smoothly pulling it towards its partner. */
function beginRescue(i){
 const p=pets[i];
 if(p.fallen||p.rescuing)return;

 p.fallen=true;
 p.rescuing=true;
 p.ground=false;
 p.hopping=false;
 p.vx=0;
 p.vy=0;

 const other=1-i;

 if(!pets[other].fallen&&!pets[other].rescuing){
  active=other;
  updateButtons();
  toast('PULLING YOUR PAL BACK!');
  $('hint').textContent='HOLD TO MOVE · RESCUING YOUR PAL';
  sound(330,.15,'triangle');
 }else{
  failLevel();
 }
}

/* Place rescued pet gently beside the active pet. */
function updateRescue(p,other,dt){
 if(!p.rescuing)return;

 const targetX=other.x-direction*45;
 const targetY=other.y;

 const dx=targetX-p.x;
 const dy=targetY-p.y;
 const dist=Math.hypot(dx,dy);

 if(dist>5){
  const speed=Math.min(rescueSpeed*dt,dist);
  p.x+=dx/dist*speed;
  p.y+=dy/dist*speed;
 }

 p.vx=0;p.vy=0;

 if(dist<13&&other.ground){
  p.x=other.x-direction*43;
  p.y=other.y;
  p.rescuing=false;
  p.fallen=false;
  p.ground=true;
  p.hopping=false;

  active=p.id;
  updateButtons();

  burst(p.x,p.y,'#fff',16);
  sound(780,.13,'triangle');
  toast('PAL RESCUED! PLAYER '+(active+1)+' ACTIVE');
  $('hint').textContent='BOTH PETS READY · HOLD TO MOVE';

  saveCheckpoint();
 }
}

function failLevel(){
 running=false;
 holding=false;
 showPanel(
  'BOTH PETS FELL!',
  'Your pals need another try.',
  'REPLAY LEVEL','LEVEL MENU',
  ()=>start(level),showLevels
 );
}

/* Main physics */
function update(dt){
 if(paused||won)return;

 for(let i=0;i<2;i++){
  const p=pets[i];
  if(p.rescuing)continue;

  if(p.fallen)continue;

  const oldY=p.y;

  // Active pet moves horizontally only while held.
  if(i===active&&holding&&p.hopping){
   p.x+=moveSpeed*direction*dt;
   p.face=direction;
  }

  p.vy+=gravity*dt;
  p.y+=p.vy*dt;

  p.ground=false;
  const platform=groundAt(p,oldY);

  if(platform){
   p.y=platform.y-17;
   p.vy=0;
   p.ground=true;

   if(p.hopping){
    p.hopping=false;
    p.vx=0;
    holding=false;
    const other=1-i;

    // Switch only if the other pet is safe.
    if(!pets[other].fallen&&!pets[other].rescuing){
     active=other;
    }
    updateButtons();

    burst(p.x,p.y+12,'#ffffff',8);
    sound(700,.08,'triangle');
    $('hint').textContent='PLAYER '+(active+1)+' READY · HOLD TO MOVE';
   }
  }

  p.anim+=dt*5;

  // Falling pet becomes a rescue target, not a dead pet.
  if(p.y>H+20){
   beginRescue(i);
  }
 }

 // Apply rope constraint after normal movement.
 constrainRope(dt);

 // Rescue movement is separate from normal physics.
 for(let i=0;i<2;i++){
  if(pets[i].rescuing){
   updateRescue(pets[i],pets[1-i],dt);
  }
 }

 const living=pets.filter(p=>!p.fallen);
 if(living.length){
  const furthest=Math.max(...living.map(p=>p.x));
  const target=furthest-W*.35;
  cam+=(Math.max(0,Math.min(goal-W*.55,target))-cam)*Math.min(1,dt*3);
 }

 particles=particles.filter(p=>p.life>0);
 for(const p of particles){
  p.life-=dt;
  p.x+=p.vx*dt;
  p.y+=p.vy*dt;
  p.vy+=350*dt;
 }

 if(pets.every(p=>!p.fallen&&!p.rescuing&&p.x>goal-55)){
  win();
 }

 if(pets.every(p=>p.ground&&!p.fallen&&!p.rescuing)){
  saveCheckpoint();
 }
}

function rounded(x,y,w,h,r,color){
 ctx.fillStyle=color;
 ctx.beginPath();
 ctx.roundRect(x,y,w,h,r);
 ctx.fill();
}

function drawBackground(){
 let g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,'#f7a9d0');
 g.addColorStop(.55,'#ffd0ce');
 g.addColorStop(1,'#ffe3b8');
 ctx.fillStyle=g;
 ctx.fillRect(0,0,W,H);

 for(let i=0;i<7;i++){
  let x=((i*190-cam*.16)%(W+250)+W+250)%(W+250)-100;
  let y=100+(i%3)*65;
  ctx.fillStyle='#ffffff45';
  ctx.beginPath();
  ctx.arc(x,y,28,0,Math.PI*2);
  ctx.arc(x+32,y-10,38,0,Math.PI*2);
  ctx.arc(x+65,y,27,0,Math.PI*2);
  ctx.fill();
 }
 const sun=ctx.createRadialGradient(W*.82,H*.45,5,W*.82,H*.45,180);
 sun.addColorStop(0,'#fff7b955');
 sun.addColorStop(1,'#fff7b900');
 ctx.fillStyle=sun;
 ctx.fillRect(0,0,W,H);
}

function drawPlatforms(){
 for(const p of world){
  rounded(p.x,p.y,p.w,p.h,3,'#c82768');
  ctx.fillStyle='#ffcf56';
  ctx.fillRect(p.x,p.y,p.w,9);
  ctx.fillStyle='#f6a92d';
  ctx.fillRect(p.x,p.y+8,p.w,5);
  ctx.fillStyle='#ed397a';

  for(let x=p.x+10;x<p.x+p.w-5;x+=18){
   for(let y=p.y+28;y<p.y+p.h-5;y+=22){
    ctx.beginPath();
    ctx.arc(x,y,1.5,0,Math.PI*2);
    ctx.fill();
   }
  }
 }
}

function drawFinish(){
 const p=world[world.length-1];
 ctx.fillStyle='#fff';
 ctx.fillRect(goal+120,p.y-95,8,95);
 ctx.fillStyle='#ff4b99';
 ctx.beginPath();
 ctx.moveTo(goal+128,p.y-95);
 ctx.lineTo(goal+180,p.y-75);
 ctx.lineTo(goal+128,p.y-53);
 ctx.fill();
}

/* Real straight rope visual: no sagging curve. */
function drawRope(){
 if(!ropeOn)return;
 const a=pets[0],b=pets[1];
 if(a.fallen&&b.fallen)return;

 ctx.save();
 ctx.beginPath();
 ctx.moveTo(a.x,a.y);
 ctx.lineTo(b.x,b.y);
 ctx.strokeStyle='#98691f';
 ctx.lineWidth=6;
 ctx.lineCap='round';
 ctx.stroke();

 ctx.beginPath();
 ctx.moveTo(a.x,a.y);
 ctx.lineTo(b.x,b.y);
 ctx.strokeStyle='#ffe16a';
 ctx.lineWidth=3;
 ctx.stroke();

 // Small rope twist marks.
 const dx=b.x-a.x,dy=b.y-a.y;
 const dist=Math.hypot(dx,dy);
 const count=Math.floor(dist/12);

 ctx.strokeStyle='#bd8a2a';
 ctx.lineWidth=1.5;

 for(let i=1;i<count;i++){
  const t=i/count;
  const x=a.x+dx*t,y=a.y+dy*t;
  ctx.beginPath();
  ctx.arc(x,y,3,0,Math.PI*2);
  ctx.stroke();
 }
 ctx.restore();
}

function drawArrow(p){
 const pulse=Math.sin(performance.now()/180)*3;
 ctx.save();
 ctx.translate(p.x,p.y-55+pulse);
 ctx.rotate(direction===1?Math.PI/2:-Math.PI/2);
 ctx.shadowColor='#a72cba';
 ctx.shadowBlur=9;
 ctx.fillStyle='#d84be9';
 ctx.strokeStyle='#6c188f';
 ctx.lineWidth=2.5;
 ctx.beginPath();
 ctx.moveTo(0,12);
 ctx.lineTo(-12,-1);
 ctx.lineTo(-5,-1);
 ctx.lineTo(-5,-19);
 ctx.lineTo(5,-19);
 ctx.lineTo(5,-1);
 ctx.lineTo(12,-1);
 ctx.closePath();
 ctx.fill();ctx.stroke();
 ctx.restore();
}

function drawPet(p,i){
 const bob=p.ground?Math.sin(p.anim)*1.5:0;
 const x=p.x,y=p.y+bob;

 ctx.save();
 ctx.translate(x,y);

 if(i===active&&!p.fallen&&!p.rescuing&&!won){
  ctx.restore();
  drawArrow(p);
  ctx.save();
  ctx.translate(x,y);
 }

 ctx.globalAlpha=p.rescuing?.85:1;

 ctx.fillStyle='#7e345333';
 ctx.beginPath();
 ctx.ellipse(0,19,19,5,0,0,Math.PI*2);
 ctx.fill();

 // White circular character badge.
 ctx.fillStyle='#fff';
 ctx.strokeStyle='#b74f90';
 ctx.lineWidth=3;
 ctx.beginPath();
 ctx.arc(0,0,21,0,Math.PI*2);
 ctx.fill();ctx.stroke();

 ctx.font='30px Arial';
 ctx.textAlign='center';
 ctx.textBaseline='middle';
 ctx.fillText(skins[skin].emoji,0,1);

 ctx.fillStyle='#873b63';
 ctx.font='bold 9px Arial';
 ctx.fillText(i===0?'1':'2',0,31);

 ctx.restore();
}

function drawParticles(){
 for(const p of particles){
  ctx.globalAlpha=Math.max(0,p.life*2);
  ctx.fillStyle=p.color;
  ctx.beginPath();
  ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
  ctx.fill();
  ctx.globalAlpha=1;
 }
}

function drawProgress(){
 rounded(12,57,W-24,6,4,'#ffffff80');
 const furthest=Math.max(pets[0].x,pets[1].x);
 const progress=Math.min(1,Math.max(0,furthest/goal));
 rounded(12,57,(W-24)*progress,6,4,'#ff4f9d');
}

function draw(){
 ctx.clearRect(0,0,W,H);
 drawBackground();

 ctx.save();
 ctx.translate(-cam,0);
 drawPlatforms();
 drawFinish();
 drawRope();
 pets.forEach((p,i)=>drawPet(p,i));
 drawParticles();
 ctx.restore();

 drawProgress();
}

function loop(t){
 if(!running)return;
 const dt=Math.min(.025,(t-last)/1000||0);
 last=t;
 update(dt);
 draw();
 if(running)requestAnimationFrame(loop);
}

/* TOUCH INPUT */
function pointerDown(e){
 if($('overlay').style.display!=='none'||
    $('pause').style.display==='flex'||
    won)return;

 if(e.target.closest('button'))return;
 e.preventDefault();

 if(holding)return;

 holding=true;
 pointerId=e.pointerId;

 try{gameScreen.setPointerCapture(e.pointerId)}catch(err){}

 jump();
}

function pointerUp(e){
 if(!holding)return;
 if(pointerId!==null&&e.pointerId!==pointerId)return;
 holding=false;
 pointerId=null;
}

gameScreen.addEventListener('pointerdown',pointerDown);
gameScreen.addEventListener('pointerup',pointerUp);
gameScreen.addEventListener('pointercancel',pointerUp);
gameScreen.addEventListener('lostpointercapture',pointerUp);

$('playerBtn').addEventListener('pointerdown',e=>e.stopPropagation());
$('directionBtn').addEventListener('pointerdown',e=>e.stopPropagation());
$('ropeAdBtn').addEventListener('pointerdown',e=>e.stopPropagation());

$('playerBtn').onclick=switchPlayer;
$('directionBtn').onclick=switchDirection;

function removeRopeWithAd(){
 if(!running||paused||won||!ropeOn||adBusy)return;

 if(typeof window.showRewardedAd!=='function'){
  toast('REWARDED AD IS NOT CONNECTED YET');
  return;
 }

 holding=false;
 adBusy=true;
 toast('LOADING REWARDED AD...');

 try{
  window.showRewardedAd(function(completed){
   adBusy=false;
   if(completed===true){
    ropeOn=false;
    updateButtons();
    toast('ROPE REMOVED!');
    sound(850,.15,'triangle');
   }else{
    toast('AD NOT COMPLETED');
   }
  });
 }catch(e){
  adBusy=false;
  toast('AD COULD NOT BE LOADED');
 }
}
$('ropeAdBtn').onclick=removeRopeWithAd;

function win(){
 if(won)return;
 won=true;
 running=false;
 holding=false;
 sound(780,.3,'triangle');

 for(let i=0;i<60;i++){
  burst(goal+100+Math.random()*100,H*.4+Math.random()*100,
  ['#fff','#ff54a6','#ffd45c','#8be8dc'][i%4],1);
 }

 saved.done=[...new Set([...(saved.done||[]),level])];
 saved.unlocked=Math.max(saved.unlocked||1,level+1);
 save();

 setTimeout(()=>{
  showPanel(
   'LEVEL '+level+' COMPLETE!',
   'Amazing teamwork! Both pals reached the finish.',
   'NEXT LEVEL','LEVEL MENU',
   ()=>start(level+1),showLevels
  );
 },450);
}

function showPanel(title,desc,b1,b2,fn1,fn2){
 $('overlay').style.display='flex';
 $('bottomControls').style.display='none';
 $('panel').innerHTML=`
 <h1>${title}</h1>
 <div class="sub">${desc}</div>
 <button class="action" id="p1">${b1}</button>
 <button class="action secondary" id="p2">${b2}</button>
 <button class="action secondary" id="pmore">MORE GAMES · ST GAMES</button>`;
 $('p1').onclick=fn1;
 $('p2').onclick=fn2;
 $('pmore').onclick=goHome;
}

function showLevels(){
 $('overlay').style.display='flex';
 $('bottomControls').style.display='none';
 $('panel').innerHTML=`
 <h1>CHOOSE LEVEL</h1>
 <div class="sub">Complete levels to unlock more adventures.</div>
 <div class="grid" id="levelGrid"></div>
 <button class="action secondary" id="backMenu">BACK</button>
 <button class="action secondary" id="more2">MORE GAMES · ST GAMES</button>`;

 const grid=$('levelGrid');

 for(let i=1;i<=40;i++){
  const b=document.createElement('button');
  b.className='level '+((saved.done||[]).includes(i)?'done':'');
  b.textContent=i;
  b.disabled=i>(saved.unlocked||1);
  b.onclick=()=>start(i);
  grid.appendChild(b);
 }

 $('backMenu').onclick=menu;
 $('more2').onclick=goHome;
}

function showSkins(){
 $('overlay').style.display='flex';
 $('panel').innerHTML=`
 <h1>🐾 PET SKINS</h1>
 <div class="sub">Choose your favourite pet character.</div>
 <div class="skinGrid" id="skinGrid"></div>
 <button class="action secondary" id="skinBack">BACK</button>`;

 const grid=$('skinGrid');

 skins.forEach((s,i)=>{
  const b=document.createElement('button');
  b.className='skinItem '+(skin===i?'selected':'');
  b.innerHTML=s.emoji+'<small>'+s.name+'</small>';
  b.onclick=()=>{
   skin=i;
   saved.skin=skin;
   save();
   pets.forEach(p=>p.emoji=s.emoji);
   showSkins();
   toast(s.name+' SKIN SELECTED');
  };
  grid.appendChild(b);
 });

 $('skinBack').onclick=menu;
}

function menu(){
 running=false;
 holding=false;
 pointerId=null;
 $('pause').style.display='none';
 $('overlay').style.display='flex';
 $('bottomControls').style.display='none';

 $('panel').innerHTML=`
 <h1>ROPE PALS</h1>
 <div class="sub">
 TWO PETS · ONE ROPE · ONE ADVENTURE<br>
 Jump forward and help both pals reach the finish!
 </div>
 <button class="action" id="play">PLAY</button>
 <button class="action secondary" id="levelsBtn">SELECT LEVEL</button>
 <button class="action secondary" id="skinBtn">🐾 CHANGE PET SKINS</button>
 <button class="action secondary" id="more">MORE GAMES · ST GAMES</button>
 <div class="sub">Progress saves automatically on this device.</div>`;

 $('play').onclick=()=>start(saved.unlocked||1);
 $('levelsBtn').onclick=showLevels;
 $('skinBtn').onclick=showSkins;
 $('more').onclick=goHome;
}

function goHome(){
 location.href='../index.html';
}

$('pauseBtn').onclick=()=>{
 if($('overlay').style.display!=='none')return;
 paused=true;
 running=false;
 holding=false;
 pointerId=null;
 $('bottomControls').style.display='none';
 $('pause').style.display='flex';
};

$('resume').onclick=()=>{
 paused=false;
 $('pause').style.display='none';
 $('bottomControls').style.display='grid';
 last=performance.now();
 running=true;
 requestAnimationFrame(loop);
};

$('restart').onclick=()=>start(level);
$('home').onclick=menu;

makeLevel(1);
draw();

$('play').onclick=()=>start(saved.unlocked||1);
$('levelsBtn').onclick=showLevels;
$('more').onclick=goHome;

})();
</script>
</body>
</html>
