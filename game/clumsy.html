<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Clumsy Bird - Gaming Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: radial-gradient(circle at 50% 50%, #0f172a 0%, #020617 100%); font-family: 'Inter', sans-serif; user-select: none; }
    canvas { display: block; box-shadow: 0 0 30px rgba(56, 189, 248, 0.3); border-radius: 20px; }
  </style>
</head>
<body class="flex flex-col items-center justify-center h-screen text-white relative">

  <a href="../index.html" class="fixed top-3 left-3 z-50 bg-[#002b5b]/90 hover:bg-[#002b5b] text-white border border-cyan-400/40 px-3.5 py-2 rounded-xl text-xs font-extrabold flex items-center gap-2 shadow-lg backdrop-blur-md active:scale-95 transition">
    <i class="fa-solid fa-arrow-left text-cyan-300"></i><span>Hub</span>
  </a>

  <div class="relative flex flex-col items-center">
    <div class="flex justify-between w-full max-w-[360px] mb-2 px-2 text-xs font-extrabold tracking-wider">
      <span id="scoreDisplay" class="text-cyan-400 text-sm">SCORE: 0</span>
      <span id="bestDisplay" class="text-pink-400 text-sm">BEST: 0</span>
    </div>
    <div id="userStatus" class="text-[11px] text-slate-400 font-semibold mb-2">Checking cloud sync...</div>

    <canvas id="gameCanvas" width="360" height="460"></canvas>

    <div id="overlay" class="absolute inset-0 top-12 bg-black/70 backdrop-blur-sm rounded-[20px] flex flex-col items-center justify-center p-6 text-center z-20">
      <h1 id="overlayTitle" class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-pink-500 mb-2 drop-shadow">CLUMSY BIRD</h1>
      <p id="overlaySub" class="text-xs text-slate-300 mb-6 font-medium">Tap screen, click, or press Space to fly!</p>
      <button id="actionBtn" class="bg-gradient-to-r from-cyan-500 to-indigo-600 hover:opacity-90 text-white font-black px-6 py-3 rounded-2xl text-sm shadow-lg active:scale-95 transition">
        TAP TO START
      </button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
    import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBzLchy5M2fLne4c7Ghw1KNN8wVrlZdd8M",
      authDomain: "friendsgame-872f5.firebaseapp.com",
      databaseURL: "https://friendsgame-872f5-default-rtdb.firebaseio.com",
      projectId: "friendsgame-872f5",
      storageBucket: "friendsgame-872f5.firebasestorage.app",
      messagingSenderId: "522534013233",
      appId: "1:522534013233:web:f5faa6e6795023d0420810",
      measurementId: "G-PW5H3G97QR"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const bestDisplay = document.getElementById('bestDisplay');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlaySub = document.getElementById('overlaySub');
    const actionBtn = document.getElementById('actionBtn');
    const userStatus = document.getElementById('userStatus');

    let audioCtx = null;
    function playSound(type) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'jump') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
          osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'score') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.08);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
          osc.start(now); osc.stop(now + 0.2);
        } else if (type === 'hit') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(150, now);
          osc.frequency.linearRampToValueAtTime(40, now + 0.2);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
          osc.start(now); osc.stop(now + 0.2);
        }
      } catch (e) {}
    }

    let gameState = 'START';
    let score = 0;
    let highScore = parseInt(localStorage.getItem('clumsy_hi') || '0', 10);
    bestDisplay.textContent = `BEST: ${highScore}`;
    let currentUser = null;

    const realBirds = ['🐦', '🕊️', '🦅', '🦆', '🦉', '🦜'];
    let currentBirdEmoji = '🐦';

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        const name = user.displayName || user.email.split('@')[0];
        userStatus.innerHTML = `Player: <span class="text-cyan-300 font-bold">${name}</span> (Cloud Synced ☁️)`;
        try {
          const snapshot = await get(child(ref(db), `scores/${user.uid}/clumsy_high`));
          if (snapshot.exists()) {
            const cloudScore = parseInt(snapshot.val(), 10) || 0;
            if (cloudScore > highScore) { highScore = cloudScore; localStorage.setItem('clumsy_hi', highScore.toString()); }
            else if (highScore > cloudScore) { set(ref(db, `scores/${user.uid}/clumsy_high`), highScore); }
          } else if (highScore > 0) { set(ref(db, `scores/${user.uid}/clumsy_high`), highScore); }
          bestDisplay.textContent = `BEST: ${highScore}`;
        } catch (err) { console.error("Cloud fetch failed:", err); }
      } else {
        currentUser = null;
        userStatus.innerHTML = `<a href="../login.html" class="text-amber-300 underline font-bold">Login to save cloud score</a>`;
      }
    });

    function syncScoreToFirebase(newScore) {
      if (currentUser && newScore > 0) { set(ref(db, `scores/${currentUser.uid}/clumsy_high`), newScore); }
    }

    let bird = { x: 60, y: 200, radius: 16, gravity: 0.32, lift: -6.2, velocity: 0 };
    let pipes = [];
    let pipeWidth = 52;
    let frameCount = 0;

    function resetGame() {
      bird.y = 200; bird.velocity = 0; pipes = []; score = 0; frameCount = 0;
      currentBirdEmoji = realBirds[Math.floor(Math.random() * realBirds.length)];
      scoreDisplay.textContent = `SCORE: ${score}`;
      overlay.classList.add('hidden');
      gameState = 'PLAYING';
    }

    function triggerGameOver() {
      playSound('hit');
      gameState = 'GAMEOVER';
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('clumsy_hi', highScore.toString());
        bestDisplay.textContent = `BEST: ${highScore}`;
        syncScoreToFirebase(highScore);
      }
      overlayTitle.textContent = "GAME OVER";
      overlaySub.textContent = `Final Score: ${score}`;
      actionBtn.textContent = "PLAY AGAIN";
      overlay.classList.remove('hidden');
    }

    function handleInput() {
      if (gameState === 'START' || gameState === 'GAMEOVER') {
        resetGame();
      } else if (gameState === 'PLAYING') {
        bird.velocity = bird.lift;
        playSound('jump');
      }
    }

    window.addEventListener('keydown', (e) => { if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); handleInput(); } });
    canvas.addEventListener('click', handleInput);
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleInput(); }, { passive: false });
    actionBtn.addEventListener('click', handleInput);

    function update() {
      if (gameState !== 'PLAYING') return;

      bird.velocity += bird.gravity;
      bird.y += bird.velocity;

      if (bird.y + bird.radius >= canvas.height - 40 || bird.y - bird.radius <= 0) {
        triggerGameOver();
      }

      let currentGap = Math.max(95, 140 - Math.floor(score / 30) * 5);
      let currentSpeed = Math.min(5.5, 2.3 + (score / 40));
      let spawnRate = Math.max(70, 110 - Math.floor(score / 25) * 5);

      if (frameCount % spawnRate === 0) {
        let minHeight = 45;
        let maxHeight = canvas.height - currentGap - 80;
        let height = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;
        let obstacleTheme = Math.floor(score / 50) % 3;

        pipes.push({
          x: canvas.width,
          top: height,
          bottom: canvas.height - height - currentGap,
          passed: false,
          theme: obstacleTheme
        });
      }

      for (let i = pipes.length - 1; i >= 0; i--) {
        pipes[i].x -= currentSpeed;

        if (
          bird.x + bird.radius > pipes[i].x &&
          bird.x - bird.radius < pipes[i].x + pipeWidth &&
          (bird.y - bird.radius < pipes[i].top || bird.y + bird.radius > canvas.height - pipes[i].bottom - 40)
        ) {
          triggerGameOver();
        }

        if (!pipes[i].passed && pipes[i].x + pipeWidth < bird.x) {
          score += 10;
          scoreDisplay.textContent = `SCORE: ${score}`;
          pipes[i].passed = true;
          playSound('score');

          if (score > highScore) {
            highScore = score;
            bestDisplay.textContent = `BEST: ${highScore}`;
            localStorage.setItem('clumsy_hi', highScore.toString());
            syncScoreToFirebase(highScore);
          }
        }

        if (pipes[i].x + pipeWidth < 0) { pipes.splice(i, 1); }
      }
      frameCount++;
    }

    function render() {
      let skyPhase = Math.floor(score / 60) % 4;
      let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      if (skyPhase === 0) { grad.addColorStop(0, '#1e1b4b'); grad.addColorStop(1, '#4338ca'); }
      else if (skyPhase === 1) { grad.addColorStop(0, '#7c2d12'); grad.addColorStop(1, '#c2410c'); }
      else if (skyPhase === 2) { grad.addColorStop(0, '#064e3b'); grad.addColorStop(1, '#047857'); }
      else { grad.addColorStop(0, '#581c87'); grad.addColorStop(1, '#db2777'); }

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
      ctx.fillRect((frameCount * 0.5) % canvas.width, 50, 3, 3);
      ctx.fillRect((frameCount * 0.8) % canvas.width, 120, 4, 4);

      pipes.forEach(p => {
        let primaryColor = '#10b981', borderColor = '#059669';
        if (p.theme === 1) { primaryColor = '#38bdf8'; borderColor = '#0284c7'; }
        else if (p.theme === 2) { primaryColor = '#f43f5e'; borderColor = '#be123c'; }

        ctx.fillStyle = primaryColor;
        ctx.fillRect(p.x, 0, pipeWidth, p.top);
        ctx.strokeStyle = borderColor; ctx.lineWidth = 3;
        ctx.strokeRect(p.x, 0, pipeWidth, p.top);

        ctx.fillRect(p.x, canvas.height - p.bottom - 40, pipeWidth, p.bottom);
        ctx.strokeRect(p.x, canvas.height - p.bottom - 40, pipeWidth, p.bottom);
      });

      ctx.fillStyle = '#0f172a'; ctx.fillRect(0, canvas.height - 40, canvas.width, 40);
      ctx.fillStyle = '#34d399'; ctx.fillRect(0, canvas.height - 40, canvas.width, 6);

      ctx.save();
      ctx.translate(bird.x, bird.y);
      let targetRot = bird.velocity * 0.08;
      let rotation = Math.max(-0.5, Math.min(0.8, targetRot));
      ctx.rotate(rotation);
      ctx.font = "30px sans-serif";
      ctx.textAlign = "center"; 
      ctx.textBaseline = "middle";
      ctx.scale(1, 1);
      ctx.fillText(currentBirdEmoji, 0, 0);
      ctx.restore();
    }

    function gameLoop() { update(); render(); requestAnimationFrame(gameLoop); }
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
