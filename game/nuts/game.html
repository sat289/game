<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#21102f"><title>Nuts & Bolts - Game</title><link rel="stylesheet" href="style.css"></head><body>
<main class="game-screen"><header class="game-head"><button class="round" id="back">‹</button><div class="game-title"><small id="gameDiff">EASY</small><h2 id="gameLevel">Level 1</h2></div><button class="round reset" id="reset">⟲</button></header>
<div class="board-wrap"><div class="board" id="board"></div></div>
<nav class="tools"><button id="undo"><span>↶</span><b>Undo</b></button><button id="hint"><span>💡<i id="hintCount">2</i></span><b>Hint</b></button><button id="addBolt"><span>✚<i class="ad-dot">▣</i></span><b>Add bolt</b></button></nav>
<div class="modal hidden" id="winModal"><div class="dialog win-dialog"><div class="trophy">🏆</div><h1>LEVEL COMPLETE!</h1><p>Great sorting!</p><button class="primary next" id="next">NEXT LEVEL</button><button class="secondary" id="levels">LEVELS</button></div></div>
<div class="toast" id="toast"></div></main><script src="app.js"></script><script src="game.js"></script></body></html>
