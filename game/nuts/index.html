<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nuts and Bolts Puzzle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700&display=swap');

        body {
            font-family: 'Nunito', sans-serif;
            background: radial-gradient(circle at top, #3b1d52, #180b2a);
            color: white;
            overflow: hidden; /* Prevent scrolling */
            touch-action: none; /* Prevent pinch zoom and swipe */
        }

        h1, h2, h3, .brand-font {
            font-family: 'Fredoka One', cursive;
        }

        /* Bolt styles */
        .bolt-container {
            display: flex;
            flex-direction: column-reverse; /* Nuts stack from bottom up */
            align-items: center;
            position: relative;
            width: 70px;
            height: 220px;
            margin: 10px;
            cursor: pointer;
        }

        .bolt-stem {
            position: absolute;
            bottom: 12px; /* Above the base */
            width: 14px;
            height: 180px;
            background: repeating-linear-gradient(to bottom, #f3f4f6, #f3f4f6 4px, #9ca3af 4px, #9ca3af 6px);
            border-radius: 7px 7px 0 0;
            z-index: 1;
            box-shadow: inset -2px 0 4px rgba(0,0,0,0.3), inset 2px 0 4px rgba(255,255,255,0.5);
        }

        .bolt-base {
            position: absolute;
            bottom: 0;
            width: 64px;
            height: 16px;
            background: radial-gradient(ellipse at center, #6b7280 0%, #1f2937 100%);
            border-radius: 50%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.6);
            z-index: 3;
        }

        /* Nut styles */
        .nut {
            width: 64px;
            height: 28px;
            border-radius: 12px;
            margin-bottom: 2px;
            z-index: 2;
            position: relative;
            box-shadow: inset 0 3px 6px rgba(255,255,255,0.4), inset 0 -4px 6px rgba(0,0,0,0.4), 0 4px 5px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.15s ease-out;
        }
        
        .nut::after {
            content: '';
            width: 14px;
            height: 14px;
            background-color: #374151;
            border-radius: 50%;
            box-shadow: inset 0 3px 5px rgba(0,0,0,0.8), 0 1px 1px rgba(255,255,255,0.3);
        }

        .nut.selected {
            transform: translateY(-20px) rotate(8deg);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.4), inset 0 3px 6px rgba(255,255,255,0.4), inset 0 -4px 6px rgba(0,0,0,0.4);
            z-index: 10;
        }

        /* Colors */
        .color-red { background: linear-gradient(to bottom, #ef4444, #b91c1c); }
        .color-green { background: linear-gradient(to bottom, #22c55e, #15803d); }
        .color-blue { background: linear-gradient(to bottom, #3b82f6, #1d4ed8); }
        .color-yellow { background: linear-gradient(to bottom, #eab308, #a16207); }
        .color-orange { background: linear-gradient(to bottom, #f97316, #c2410c); }

        /* General UI */
        .btn {
            transition: transform 0.1s, filter 0.1s;
        }
        .btn:active {
            transform: scale(0.95);
            filter: brightness(0.9);
        }
        
        #confetti-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        /* Custom Scrollbar for Leaderboard */
        .custom-scroll::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: #1a0f2e; 
            border-radius: 4px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #6d28d9; 
            border-radius: 4px;
        }

    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen w-full relative">

    <canvas id="confetti-canvas"></canvas>

    <!-- Main Menu -->
    <div id="main-menu" class="flex flex-col items-center justify-center w-full max-w-md p-6 space-y-8 z-10 transition-opacity duration-300">
        <h1 class="text-5xl brand-font text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-orange-500 drop-shadow-lg text-center leading-tight">
            NUTS & BOLTS
        </h1>
        
        <div class="bg-purple-800 bg-opacity-60 px-6 py-2 rounded-full border border-purple-500 shadow-lg">
            <span class="text-gray-300 font-bold">Total Score: </span>
            <span id="menu-total-score" class="text-2xl font-bold text-green-400">0</span>
        </div>
        
        <div class="flex flex-col w-full space-y-4">
            <button onclick="startGame('easy')" class="btn w-full py-4 text-2xl font-bold bg-green-500 rounded-2xl shadow-[0_6px_0_#166534] active:shadow-[0_0px_0_#166534] active:translate-y-[6px]">EASY</button>
            <button onclick="startGame('medium')" class="btn w-full py-4 text-2xl font-bold bg-yellow-500 rounded-2xl shadow-[0_6px_0_#854d0e] active:shadow-[0_0px_0_#854d0e] active:translate-y-[6px]">MEDIUM</button>
            <button onclick="startGame('hard')" class="btn w-full py-4 text-2xl font-bold bg-red-500 rounded-2xl shadow-[0_6px_0_#991b1b] active:shadow-[0_0px_0_#991b1b] active:translate-y-[6px]">HARD</button>
        </div>

        <div class="flex space-x-4 w-full justify-center mt-6">
            <button onclick="showLeaderboard()" class="btn px-6 py-3 text-lg font-bold bg-purple-600 rounded-xl shadow-[0_4px_0_#4c1d95] active:shadow-[0_0px_0_#4c1d95] active:translate-y-[4px]">Leaderboard</button>
            <!-- Requested small button labeled 'game' -->
            <button onclick="alert('Game Info: Real Nuts and Bolts Sorting Game v1.0')" class="btn px-4 py-3 text-sm font-bold bg-gray-600 rounded-xl shadow-[0_4px_0_#374151] active:shadow-[0_0px_0_#374151] active:translate-y-[4px]">game</button>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="hidden flex-col items-center justify-between w-full h-full max-w-2xl p-4 z-10 absolute inset-0">
        <!-- Header -->
        <div class="flex justify-between items-center w-full py-4 px-2">
            <button onclick="showMenu()" class="btn bg-white text-purple-900 p-3 rounded-full shadow-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7" /></svg>
            </button>
            <div class="text-center">
                <div class="text-xs font-bold text-pink-300 uppercase tracking-widest" id="level-difficulty">EASY</div>
                <div class="text-2xl font-bold" id="level-display">Level 1</div>
            </div>
            <button onclick="restartLevel()" class="btn bg-white text-purple-900 p-3 rounded-full shadow-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
            </button>
        </div>

        <!-- Bolts Area -->
        <div id="bolts-container" class="flex flex-wrap justify-center items-end gap-x-4 gap-y-12 flex-1 content-center w-full pb-12">
            <!-- Dynamically generated bolts go here -->
        </div>

        <!-- Footer / Tools -->
        <div class="w-full flex justify-around items-end pb-8 px-4">
            <button onclick="undoMove()" id="undo-btn" class="btn flex flex-col items-center justify-center opacity-50 cursor-not-allowed">
                <div class="mb-1 text-gray-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6" /></svg>
                </div>
                <span class="font-bold text-sm text-gray-400">Undo</span>
            </button>
            
            <button onclick="alert('Hint feature coming soon!')" class="btn flex flex-col items-center justify-center relative">
                <div class="absolute -top-2 -right-2 bg-white text-black text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center border border-gray-300">2</div>
                <div class="mb-1 text-yellow-400 drop-shadow-[0_0_8px_rgba(250,204,21,0.6)]">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 fill-current" viewBox="0 0 24 24"><path d="M12 2C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7zm-1 19h2c0 .55-.45 1-1 1s-1-.45-1-1zm3.5-3H9.5v-1h5v1z"/></svg>
                </div>
                <span class="font-bold text-sm text-gray-300">Hint</span>
            </button>

            <button onclick="alert('Add bolt feature coming soon!')" class="btn flex flex-col items-center justify-center relative">
                <div class="absolute -top-2 -right-2 bg-green-500 text-white text-[10px] font-bold rounded flex items-center justify-center px-1 shadow">AD</div>
                <div class="mb-1 text-yellow-500 drop-shadow-[0_0_4px_rgba(234,179,8,0.5)]">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                </div>
                <span class="font-bold text-sm text-gray-300">Add bolt</span>
            </button>
        </div>
    </div>

    <!-- Leaderboard Screen -->
    <div id="leaderboard-screen" class="hidden flex-col items-center justify-start w-full h-full max-w-md p-6 z-20 absolute inset-0 bg-[#2c1945]">
        <div class="flex items-center justify-between w-full mb-8">
            <button onclick="showMenu()" class="btn bg-gray-700 p-3 rounded-full shadow-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
            </button>
            <h2 class="text-3xl brand-font text-white">Top Players</h2>
            <div class="w-12"></div> <!-- Spacer for centering -->
        </div>

        <div id="leaderboard-list" class="w-full flex-1 overflow-y-auto custom-scroll bg-[#1a0f2e] rounded-2xl p-4 shadow-inner">
            <div class="text-center text-gray-400 py-10">Loading...</div>
        </div>
    </div>

    <!-- Username Modal -->
    <div id="username-modal" class="hidden absolute inset-0 bg-black bg-opacity-80 z-50 flex items-center justify-center p-4">
        <div class="bg-purple-800 p-6 rounded-2xl shadow-2xl max-w-sm w-full text-center border-4 border-purple-600">
            <h3 class="text-2xl brand-font mb-4 text-yellow-400">Enter Username</h3>
            <p class="text-sm mb-4 text-gray-300">To save your progress on the leaderboard!</p>
            <input type="text" id="username-input" class="w-full p-3 rounded-lg text-black font-bold mb-4 outline-none focus:ring-4 ring-yellow-400" placeholder="Your name..." maxlength="15">
            <button onclick="saveUsername()" class="btn w-full py-3 font-bold bg-green-500 rounded-xl shadow-[0_4px_0_#166534] active:translate-y-[4px] active:shadow-none">Save</button>
        </div>
    </div>

    <!-- Win Modal -->
    <div id="win-modal" class="hidden absolute inset-0 bg-black bg-opacity-70 z-40 flex items-center justify-center p-4">
        <div class="bg-gradient-to-b from-yellow-400 to-orange-500 p-8 rounded-3xl shadow-2xl max-w-sm w-full text-center text-black border-4 border-white transform scale-0 transition-transform duration-500" id="win-box">
            <h2 class="text-4xl brand-font mb-2 text-white drop-shadow-md">AMAZING!</h2>
            <p class="font-bold text-lg mb-6 text-purple-900">Level Cleared!</p>
            <div class="flex space-x-4">
                <button onclick="showMenu()" class="btn flex-1 py-3 font-bold bg-white rounded-xl shadow-[0_4px_0_#d1d5db] active:translate-y-[4px] active:shadow-none">Menu</button>
                <button onclick="nextLevel()" class="btn flex-1 py-3 font-bold bg-purple-700 text-white rounded-xl shadow-[0_4px_0_#4c1d95] active:translate-y-[4px] active:shadow-none">Next Level</button>
            </div>
        </div>
    </div>


    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Initialization setup
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'nuts-bolts-puzzle-v1';
        let firebaseConfig = {};
        try {
            firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
                // Mock config for local testing if needed, though it will fail without real credentials.
                // It's expected that the environment provides a valid __firebase_config
            };
        } catch (e) {
            console.error("Firebase config error", e);
        }

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        let userId = null;
        let username = null;
        let totalScore = 0; // Total levels completed

        // Game State
        const maxNutsPerBolt = 4;
        let bolts = []; 
        let history = []; 
        let currentDifficulty = 'easy';
        let levelNumber = 1;
        let selectedBoltIndex = null;
        let isAnimating = false;
        let domBolts = [];

        // Colors available
        const COLORS = ['red', 'green', 'blue', 'yellow', 'orange'];
        const DIFF_CONFIG = {
            'easy': { colors: 3, totalBolts: 5 },
            'medium': { colors: 4, totalBolts: 6 },
            'hard': { colors: 5, totalBolts: 7 }
        };

        // --- Firebase Auth & User Data ---
        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                
                userId = auth.currentUser.uid;
                await loadUserData();
            } catch (error) {
                console.error("Auth error:", error);
            }
        }

        async function loadUserData() {
            if (!userId) return;
            try {
                // Read from public leaderboard path to see if they exist
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'leaderboard', userId);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    username = docSnap.data().username;
                    totalScore = docSnap.data().score || 0;
                    document.getElementById('menu-total-score').innerText = totalScore;
                }
            } catch (e) {
                console.error("Error loading user data:", e);
            }
        }

        async function saveScoreToFirebase() {
            if (!userId || !username) return;
            try {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'leaderboard', userId);
                await setDoc(docRef, {
                    username: username,
                    score: totalScore,
                    timestamp: Date.now()
                }, { merge: true });
                document.getElementById('menu-total-score').innerText = totalScore;
            } catch (e) {
                console.error("Error saving score:", e);
            }
        }

        async function fetchLeaderboard() {
            const listEl = document.getElementById('leaderboard-list');
            listEl.innerHTML = '<div class="text-center text-gray-400 py-10">Loading...</div>';
            
            if (!userId) return;

            try {
                const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'leaderboard');
                const querySnapshot = await getDocs(colRef); // Rule 2: No complex queries, sort in JS
                
                let players = [];
                querySnapshot.forEach((doc) => {
                    players.push({ id: doc.id, ...doc.data() });
                });

                // Sort descending by score
                players.sort((a, b) => b.score - a.score);
                players = players.slice(0, 50); // Top 50

                if (players.length === 0) {
                    listEl.innerHTML = '<div class="text-center text-gray-400 py-10">No scores yet.</div>';
                    return;
                }

                let html = '<div class="space-y-3">';
                players.forEach((p, index) => {
                    const isMe = p.id === userId;
                    html += `
                        <div class="flex justify-between items-center p-4 rounded-xl ${isMe ? 'bg-purple-600 border-2 border-yellow-400' : 'bg-[#2c1945] border border-purple-800'}">
                            <div class="flex items-center space-x-4">
                                <div class="font-bold text-xl ${index < 3 ? 'text-yellow-400' : 'text-gray-300'}">#${index + 1}</div>
                                <div class="font-bold truncate max-w-[120px]">${p.username} ${isMe ? '(You)' : ''}</div>
                            </div>
                            <div class="font-bold text-green-400">${p.score} <span class="text-xs text-gray-400">lvls</span></div>
                        </div>
                    `;
                });
                html += '</div>';
                listEl.innerHTML = html;

            } catch (e) {
                console.error("Error fetching leaderboard:", e);
                listEl.innerHTML = '<div class="text-center text-red-400 py-10">Failed to load leaderboard.</div>';
            }
        }


        // --- Global UI Functions ---
        window.showMenu = function() {
            document.getElementById('main-menu').classList.remove('hidden');
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('game-screen').style.display = ''; // Clear inline display style
            document.getElementById('leaderboard-screen').classList.add('hidden');
            document.getElementById('win-modal').classList.add('hidden');
        };

        window.showLeaderboard = function() {
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('leaderboard-screen').classList.remove('hidden');
            fetchLeaderboard();
        };

        window.saveUsername = function() {
            const input = document.getElementById('username-input').value.trim();
            if (input.length > 0) {
                username = input;
                document.getElementById('username-modal').classList.add('hidden');
                saveScoreToFirebase();
            }
        };

        window.startGame = function(difficulty) {
            currentDifficulty = difficulty;
            levelNumber = 1;
            
            // Check if username exists, if not, ask after auth completes
            if (userId && !username) {
                document.getElementById('username-modal').classList.remove('hidden');
            }

            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('game-screen').style.display = 'flex';
            
            generateLevel();
        };

        window.restartLevel = function() {
            if (isAnimating) return;
            generateLevel(true); // pass true to preserve exact same level state? Actually, let's just generate a new random one of same difficulty for simplicity, or we can cache initial state.
            // Let's implement caching initial state for real restart.
        };
        
        let initialBoltsState = [];

        function deepCopy(arr) {
            return JSON.parse(JSON.stringify(arr));
        }

        window.restartLevel = function() {
             if (isAnimating) return;
             bolts = deepCopy(initialBoltsState);
             history = [];
             selectedBoltIndex = null;
             updateUndoButton();
             renderBolts(true); // true = force instant render without animating from old state
        }

        window.nextLevel = function() {
            levelNumber++;
            totalScore++;
            document.getElementById('menu-total-score').innerText = totalScore;
            saveScoreToFirebase();
            document.getElementById('win-modal').classList.add('hidden');
            document.getElementById('win-box').classList.replace('scale-100', 'scale-0');
            generateLevel();
        };


        // --- Game Logic & Rendering ---
        function generateLevel() {
            document.getElementById('level-difficulty').innerText = currentDifficulty;
            document.getElementById('level-display').innerText = 'Level ' + levelNumber;
            history = [];
            selectedBoltIndex = null;
            updateUndoButton();
            
            const config = DIFF_CONFIG[currentDifficulty];
            const activeColors = COLORS.slice(0, config.colors);
            
            // Create a pool of nuts
            let pool = [];
            for (let c of activeColors) {
                for (let i=0; i<4; i++) pool.push(c);
            }
            
            // Shuffle pool
            for (let i = pool.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pool[i], pool[j]] = [pool[j], pool[i]];
            }

            // Distribute to bolts
            bolts = [];
            for (let i = 0; i < config.totalBolts; i++) {
                if (i < config.colors) {
                    bolts.push(pool.slice(i * 4, (i + 1) * 4));
                } else {
                    bolts.push([]);
                }
            }
            
            initialBoltsState = deepCopy(bolts);
            renderBolts(true);
        }

        function renderBolts(forceInstant = false) {
            const container = document.getElementById('bolts-container');
            container.innerHTML = '';
            domBolts = [];

            bolts.forEach((nutStack, boltIndex) => {
                const boltDiv = document.createElement('div');
                boltDiv.className = 'bolt-container';
                boltDiv.onclick = () => handleBoltClick(boltIndex);
                
                // Stem and Base
                const stem = document.createElement('div');
                stem.className = 'bolt-stem';
                const base = document.createElement('div');
                base.className = 'bolt-base';
                
                boltDiv.appendChild(base);
                boltDiv.appendChild(stem);
                
                // Add Nuts
                nutStack.forEach((color, nutIndex) => {
                    const nut = document.createElement('div');
                    nut.className = `nut color-${color}`;
                    // Bottom spacing logic inside flex column-reverse handles stacking!
                    // But we want the top nut to have a bottom margin based on position
                    // Actually, flex column-reverse stacks them perfectly with margin-bottom: 2px from CSS.
                    
                    if (selectedBoltIndex === boltIndex && nutIndex === nutStack.length - 1) {
                        nut.classList.add('selected');
                    }
                    
                    // We assign an ID to easily grab it for animations
                    nut.id = `nut-${boltIndex}-${nutIndex}`;
                    boltDiv.appendChild(nut);
                });

                container.appendChild(boltDiv);
                domBolts.push(boltDiv);
            });
        }

        // --- Interaction Logic ---
        function handleBoltClick(boltIndex) {
            if (isAnimating) return;

            if (selectedBoltIndex === null) {
                // Select if it has nuts
                if (bolts[boltIndex].length > 0) {
                    selectedBoltIndex = boltIndex;
                    renderBolts(); // re-render to show selected state
                }
            } else {
                if (selectedBoltIndex === boltIndex) {
                    // Deselect
                    selectedBoltIndex = null;
                    renderBolts();
                } else {
                    // Try to move
                    const sourceStack = bolts[selectedBoltIndex];
                    const targetStack = bolts[boltIndex];
                    
                    if (sourceStack.length === 0) {
                        selectedBoltIndex = null;
                        renderBolts();
                        return;
                    }

                    const topNut = sourceStack[sourceStack.length - 1];

                    // Valid move logic
                    if (targetStack.length < maxNutsPerBolt && 
                        (targetStack.length === 0 || targetStack[targetStack.length - 1] === topNut)) {
                        
                        // Execute Move
                        executeMove(selectedBoltIndex, boltIndex);
                    } else {
                        // Invalid move, just deselect or shake
                        selectedBoltIndex = null;
                        renderBolts();
                    }
                }
            }
        }

        function executeMove(fromIndex, toIndex, isUndo = false) {
            isAnimating = true;
            const sourceStack = bolts[fromIndex];
            const targetStack = bolts[toIndex];
            
            // Get the DOM element of the nut to move
            const nutIndex = sourceStack.length - 1;
            const nutEl = document.getElementById(`nut-${fromIndex}-${nutIndex}`);
            
            if (!nutEl) {
                // Fallback if DOM out of sync
                performStateMove(fromIndex, toIndex, isUndo);
                return;
            }

            // Remove selected state visually immediately
            nutEl.classList.remove('selected');

            // --- Fixed Positioning Animation Strategy ---
            const startRect = nutEl.getBoundingClientRect();
            const sourceBoltContainer = domBolts[fromIndex];
            const targetBoltContainer = domBolts[toIndex];
            
            // Find absolute lift Y (top of the bolt container)
            const liftY = Math.min(sourceBoltContainer.getBoundingClientRect().top, targetBoltContainer.getBoundingClientRect().top) - 50;
            
            // Create a dummy hidden nut in target to find ending position
            const dummy = document.createElement('div');
            dummy.className = 'nut'; 
            dummy.style.visibility = 'hidden';
            targetBoltContainer.appendChild(dummy);
            const endRect = dummy.getBoundingClientRect();
            dummy.remove();

            // Prepare animating element
            nutEl.style.position = 'fixed';
            nutEl.style.left = startRect.left + 'px';
            nutEl.style.top = startRect.top + 'px';
            nutEl.style.width = startRect.width + 'px';
            nutEl.style.height = startRect.height + 'px';
            nutEl.style.margin = '0';
            nutEl.style.zIndex = '100';
            
            // Move to body for pure fixed positioning without relative interference
            document.body.appendChild(nutEl);
            
            // Force reflow
            void nutEl.offsetWidth;
            
            // Apply transitions
            nutEl.style.transition = 'all 0.15s ease-in-out';
            
            // Step 1: Up
            nutEl.style.top = liftY + 'px';
            
            setTimeout(() => {
                // Step 2: Over
                nutEl.style.left = endRect.left + 'px';
                
                setTimeout(() => {
                    // Step 3: Down
                    nutEl.style.top = endRect.top + 'px';
                    
                    setTimeout(() => {
                        // Cleanup visually
                        nutEl.remove();
                        performStateMove(fromIndex, toIndex, isUndo);
                    }, 160);
                }, 160);
            }, 160);
        }

        function performStateMove(fromIndex, toIndex, isUndo) {
            const color = bolts[fromIndex].pop();
            bolts[toIndex].push(color);
            
            if (!isUndo) {
                history.push({ from: fromIndex, to: toIndex });
            }
            
            selectedBoltIndex = null;
            updateUndoButton();
            renderBolts();
            isAnimating = false;

            if (!isUndo) {
                checkWinCondition();
            }
        }

        window.undoMove = function() {
            if (isAnimating || history.length === 0) return;
            const lastMove = history.pop();
            // Reverse the move: from lastMove.to -> lastMove.from
            executeMove(lastMove.to, lastMove.from, true);
        };

        function updateUndoButton() {
            const btn = document.getElementById('undo-btn');
            if (history.length > 0) {
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
                btn.classList.add('active:translate-y-[4px]', 'active:shadow-none');
            } else {
                btn.classList.add('opacity-50', 'cursor-not-allowed');
                btn.classList.remove('active:translate-y-[4px]', 'active:shadow-none');
            }
        }

        function checkWinCondition() {
            let isWin = true;
            for (let i = 0; i < bolts.length; i++) {
                const stack = bolts[i];
                if (stack.length > 0) {
                    if (stack.length !== maxNutsPerBolt) {
                        isWin = false;
                        break;
                    }
                    const firstColor = stack[0];
                    for (let j = 1; j < stack.length; j++) {
                        if (stack[j] !== firstColor) {
                            isWin = false;
                            break;
                        }
                    }
                }
            }

            if (isWin) {
                fireConfetti();
                setTimeout(() => {
                    document.getElementById('win-modal').classList.remove('hidden');
                    // small delay for css transition scale
                    setTimeout(() => {
                        document.getElementById('win-box').classList.replace('scale-0', 'scale-100');
                    }, 50);
                }, 500);
            }
        }

        // --- Confetti Effect ---
        function fireConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            const particles = [];
            const colors = ['#ff3b3b', '#3bff3b', '#3b3bff', '#ffff3b', '#ff9d3b'];
            
            for(let i=0; i<150; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2 + 100,
                    r: Math.random() * 6 + 4,
                    dx: Math.random() * 20 - 10,
                    dy: Math.random() * -20 - 10,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    tilt: Math.random() * 10 - 5
                });
            }

            function render() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let active = false;
                particles.forEach(p => {
                    p.dy += 0.5; // gravity
                    p.x += p.dx;
                    p.y += p.dy;
                    p.tilt += 0.1;
                    
                    if (p.y < canvas.height) active = true;

                    ctx.beginPath();
                    ctx.lineWidth = p.r;
                    ctx.strokeStyle = p.color;
                    ctx.moveTo(p.x + p.tilt, p.y);
                    ctx.lineTo(p.x + p.tilt, p.y + p.r * 2);
                    ctx.stroke();
                });

                if (active) {
                    requestAnimationFrame(render);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }
            render();
        }

        // Handle window resize dynamically without breaking UI
        window.addEventListener('resize', () => {
            if (!isAnimating && document.getElementById('game-screen').style.display !== 'none') {
                renderBolts(true);
            }
        });

        // Init
        window.onload = () => {
            initAuth();
        };
    </script>
</body>
</html>
