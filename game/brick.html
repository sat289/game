<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cyber Brick Breaker - Gaming Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #070a13; font-family: 'Inter', sans-serif; user-select: none; }
    canvas { display: block; background-color: #070a13; box-shadow: 0 0 25px rgba(56, 189, 248, 0.2); }
  </style>
</head>
<body class="flex flex-col items-center justify-center h-screen text-white p-3 relative">

  <a href="../index.html" class="fixed top-3 left-3 z-50 bg-[#002b5b]/90 hover:bg-[#002b5b] text-white border border-cyan-400/40 px-3.5 py-2 rounded-xl text-xs font-extrabold flex items-center gap-2 shadow-lg backdrop-blur-md active:scale-95 transition">
    <i class="fa-solid fa-arrow-left text-cyan-300"></i><span>Hub</span>
  </a>

  <div class="flex justify-between w-full max-w-[320px] mb-2 px-2 text-sm font-extrabold tracking-wider">
    <span id="scoreEl" class="text-cyan-400">SCORE: 0</span>
    <span id="livesEl" class="text-pink-400">LIVES: 3</span>
  </div>

  <canvas id="breakCanvas" width="320" height="400" class="rounded-2xl border border-cyan-500/30"></canvas>
  <p class="text-[11px] text-slate-400 mt-3 font-semibold">Drag finger to slide paddle and smash blocks</p>

  <script>
    const canvas = document.getElementById('breakCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('scoreEl');
    const livesEl = document.getElementById('livesEl');

    let score = 0, lives = 3;
    let ball = { x: 160, y: 250, dx: 2.5, dy: -2.5, radius: 6 };
    let paddle = { x: 120, y: 380, width: 80, height: 10 };

    let bricks = [];
    const rowCount = 5, colCount = 6;
    const brickWidth = 46, brickHeight = 16, padding = 6, offsetTop = 30, offsetLeft = 14;

    function initBricks() {
      bricks = [];
      for(let r=0; r<rowCount; r++) {
        bricks[r] = [];
        for(let c=0; c<colCount; c++) {
          bricks[r][c] = { x: 0, y: 0, status: 1 };
        }
      }
    }
    initBricks();

    function update() {
      ball.x += ball.dx;
      ball.y += ball.dy;

      // Walls
      if (ball.x - ball.radius < 0 || ball.x + ball.radius > canvas.width) ball.dx = -ball.dx;
      if (ball.y - ball.radius < 0) ball.dy = -ball.dy;

      // Paddle collision
      if (ball.y + ball.radius >= paddle.y && ball.x >= paddle.x && ball.x <= paddle.x + paddle.width) {
        let hitPoint = ball.x - (paddle.x + paddle.width/2);
        ball.dx = hitPoint * 0.1;
        ball.dy = -Math.abs(ball.dy);
      }

      // Brick collisions
      for(let r=0; r<rowCount; r++) {
        for(let c=0; c<colCount; c++) {
          let b = bricks[r][c];
          if(b.status === 1) {
            let bx = c * (brickWidth + padding) + offsetLeft;
            let by = r * (brickHeight + padding) + offsetTop;
            b.x = bx; b.y = by;
            if(ball.x > bx && ball.x < bx + brickWidth && ball.y > by && ball.y < by + brickHeight) {
              ball.dy = -ball.dy;
              b.status = 0;
              score += 10;
              scoreEl.textContent = `SCORE: ${score}`;
            }
          }
        }
      }

      // Bottom loss
      if (ball.y > canvas.height) {
        lives--;
        livesEl.textContent = `LIVES: ${lives}`;
        if (lives <= 0) {
          alert("Game Over! Score: " + score);
          document.location.reload();
        } else {
          ball.x = 160; ball.y = 250; ball.dx = 2.5; ball.dy = -2.5;
        }
      }
    }

    function render() {
      ctx.fillStyle = '#070a13'; ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Bricks
      for(let r=0; r<rowCount; r++) {
        for(let c=0; c<colCount; c++) {
          if(bricks[r][c].status === 1) {
            ctx.fillStyle = r % 2 === 0 ? '#38bdf8' : '#a855f7';
            ctx.fillRect(bricks[r][c].x, bricks[r][c].y, brickWidth, brickHeight);
          }
        }
      }

      // Paddle
      ctx.fillStyle = '#34d399'; ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);

      // Ball
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2); ctx.fill();
    }

    function loop() { update(); render(); requestAnimationFrame(loop); }
    requestAnimationFrame(loop);

    window.addEventListener('mousemove', (e) => {
      let rect = canvas.getBoundingClientRect();
      paddle.x = e.clientX - rect.left - paddle.width / 2;
      paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, paddle.x));
    });
    canvas.addEventListener('touchmove', (e) => {
      let rect = canvas.getBoundingClientRect();
      paddle.x = e.touches[0].clientX - rect.left - paddle.width / 2;
      paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, paddle.x));
    }, { passive: true });
  </script>
</body>
</html>
