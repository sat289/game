<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071827">
  <meta name="description" content="Build your 3D virtual house across Andhra Pradesh in ST Virtual World by ST GAMES.">
  <title>ST Virtual World | ST GAMES</title>
  <link rel="icon" href="https://stgames.online/logo/logo.jpg">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="lib/maplibre-gl.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-theme="classic">
  <div id="map"></div>
  <div class="vignette"></div>

  <header class="topbar glass">
    <div class="brand">
      <img src="https://stgames.online/logo/logo.jpg" onerror="this.style.display='none'" alt="ST GAMES logo">
      <div>
        <b>ST VIRTUAL WORLD</b>
        <small>ANDHRA PRADESH · 3D VIRTUAL HOUSES</small>
      </div>
    </div>
    <div class="stats">
      <b id="houseCount">0</b>
      <small>HOUSES</small>
    </div>
  </header>

  <div class="search-wrap">
    <section class="searchbar glass">
      <span>⌕</span>
<input id="searchPlace" placeholder="Search @username to visit their house..." autocomplete="off">
      <button id="searchBtn" type="button">GO</button>
    </section>
    <div id="searchResults" class="search-results glass" hidden></div>
  </div>

  <div class="themebar glass">
    <span>THEME</span>
    <select id="themeSelect" aria-label="Select ST GAMES theme">
      <option value="classic">Classic Blue</option>
      <option value="gold">Royal Gold</option>
      <option value="black">Deep Black</option>
      <option value="neon">Neon Cyber</option>
    </select>
  </div>

  <div id="selectedPlaceBanner" class="selected-banner glass" hidden></div>

  <div id="placementBar" class="placement-bar glass" hidden>
    <div class="placement-info">
      <b>Drag marker or tap map to place house</b>
      <small><span id="placementPlaceLabel">—</span> · <span id="placementCoords">—</span></small>
    </div>
    <div class="actions">
      <button id="confirmSaveHouseBtn" class="primary" type="button">Confirm &amp; Save House</button>
      <button id="cancelPlaceBtn" class="secondary" type="button">Cancel</button>
    </div>
  </div>

  <nav class="bottom glass" aria-label="Main Navigation">
    <button data-open="explore" class="active" type="button">🌏<small>Explore</small></button>
    <button data-open="build" type="button">🏠<small>Build House</small></button>
    <button data-open="myhouse" type="button">📍<small>My House</small></button>
    <button data-open="help" type="button">ⓘ<small>Guide</small></button>
  </nav>

  <div id="panel" class="panel glass" aria-live="polite">
    <button class="close" id="closePanel" type="button" aria-label="Close panel">×</button>
    <div id="panelContent"></div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="lib/maplibre-gl.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
