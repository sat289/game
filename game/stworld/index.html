<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071827"><meta name="description" content="Build your virtual house in Andhra Pradesh with ST Virtual World.">
<title>ST Virtual World | ST GAMES</title>
<link rel="icon" href="https://stgames.online/logo/logo.jpg"><link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="lib/maplibre-gl.css"><link rel="stylesheet" href="css/style.css">
</head>
<body data-theme="classic">
<div id="map"></div><div class="vignette"></div>
<header class="topbar glass"><div class="brand"><img src="https://stgames.online/logo/logo.jpg" onerror="this.style.display='none'" alt="ST GAMES logo"><div><b>ST VIRTUAL WORLD</b><small>ANDHRA PRADESH · BUILD YOUR WORLD</small></div></div><div class="stats"><b id="houseCount">0</b><small>HOUSES</small></div></header>
<section class="searchbar glass"><span>⌕</span><input id="searchTown" placeholder="Search district or town..." autocomplete="off"><button id="searchBtn">GO</button></section>
<div class="themebar glass"><span>THEME</span><select id="themeSelect"><option value="classic">Classic Blue</option><option value="gold">Royal Gold</option><option value="black">Deep Black</option><option value="neon">Neon Cyber</option></select></div>
<div class="maphint glass">✦ Explore Andhra · Tap a town to choose your location</div>
<nav class="bottom glass"><button data-open="explore" class="active">🌏<small>Explore</small></button><button data-open="build">🏠<small>Build house</small></button><button data-open="account">👤<small>Account</small></button><button data-open="help">ⓘ<small>How it works</small></button></nav>
<div id="panel" class="panel glass" aria-live="polite"><button class="close" id="closePanel">×</button><div id="panelContent"></div></div>
<div id="toast" class="toast"></div>
<script src="lib/maplibre-gl.js"></script><script type="module" src="js/app.js"></script>
</body></html>
