<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071827"><title>ST Virtual World · Admin</title><link rel="stylesheet" href="../css/style.css"><style>body{overflow:auto;min-height:100%;padding:18px 12px 40px}.admin-wrap{max-width:850px;margin:0 auto}.admin-card{padding:18px;margin:14px 0}.request{border:1px solid #ffffff25;border-radius:13px;padding:12px;margin:10px 0}.request h3{margin:0 0 5px;font-size:14px}.request p{margin:4px 0}.tag{color:var(--line);font-size:10px}.admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}</style></head><body data-theme="classic"><main class="admin-wrap"><header class="glass admin-card"><h2>ST VIRTUAL WORLD · ADMIN</h2><p>Review player house requests and add houses manually.</p></header><section id="loginBox" class="glass admin-card"><h2>Admin sign in</h2><label class="field"><span>Admin email</span><input id="email" type="email"></label><label class="field"><span>Password</span><input id="password" type="password"></label><button class="primary" id="login">Sign in</button><div id="loginStatus" class="status"></div></section><section id="dashboard" hidden><section class="glass admin-card"><div class="admin-grid"><div><h2>Pending requests</h2><p class="muted">Approve a single house per player UID.</p></div><button class="secondary" id="refresh">Refresh queue</button></div><div id="requests"></div></section><section class="glass admin-card"><h2>Add a house manually</h2><p class="muted">Use this for admin-created community entries. Town-level position only; never add a private street address.</p><div class="admin-grid"><label class="field"><span>Instagram username</span><input id="mUser" maxlength="30"></label><label class="field"><span>District</span><select id="mDistrict"></select></label><label class="field"><span>Town</span><select id="mTown"></select></label><label class="field"><span>Landmark / house name</span><input id="mLandmark" maxlength="45"></label><label class="field"><span>House design</span><select id="mDesign"><option>Modern Villa</option><option>Classic Home</option><option>Glass Tower</option><option>Garden House</option><option>Royal Mansion</option></select></label></div><button class="primary" id="addManual">Add house</button><div id="manualStatus" class="status"></div></section><button class="secondary" id="logout">Sign out</button></section></main><script type="module" src="admin.js"></script></body></html>
