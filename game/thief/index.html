<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thief Puzzle - Home</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      background: #2b2b2b;
      color: #fff;
      display: flex;
      justify-content: center;
      padding: 14px;
      min-height: 100vh;
    }
    .app-container {
      width: 100%;
      max-width: 460px;
      background: #1e1e1e;
      border: 3px solid #ff9800;
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    h1 { text-align: center; font-size: 28px; font-weight: 900; color: #ff9800; letter-spacing: 0.5px; }
    .subtitle { text-align: center; font-size: 13px; color: #bbb; margin-top: -10px; font-weight: 600; }
    .card {
      background: #2a2a2a;
      border: 2px solid #444;
      border-radius: 16px;
      padding: 14px;
    }
    .card h3 { font-size: 16px; margin-bottom: 8px; color: #ffb74d; display: flex; justify-content: space-between; align-items: center; }
    .input-row { display: flex; gap: 8px; margin-top: 8px; }
    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 2px solid #555;
      border-radius: 10px;
      font-size: 14px;
      background: #111;
      color: #fff;
    }
    button {
      cursor: pointer;
      border: 2px solid #222;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 800;
      font-size: 14px;
      transition: transform 0.1s;
    }
    button:active { transform: scale(0.97); }
    .btn-play {
      background: linear-gradient(180deg, #54f000, #2db300);
      color: #fff;
      font-size: 19px;
      width: 100%;
      padding: 14px;
      box-shadow: 0 4px 0 #1b6e00;
      text-shadow: 0 1px 2px rgba(0,0,0,0.4);
    }
    .btn-google { background: #4285F4; color: #fff; width: 100%; margin-top: 8px; border-color: #1967d2; }
    .btn-orange { background: #ff9800; color: #000; border-color: #e65100; }
    .btn-page { background: #333; color: #fff; padding: 6px 12px; font-size: 13px; border-color: #555; }
    .btn-danger { background: #e53935; color: #fff; font-size: 12px; padding: 6px 10px; }
    .levels-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-top: 10px;
    }
    .lvl-btn {
      padding: 10px 2px;
      text-align: center;
      background: #0288d1;
      color: #fff;
      border-radius: 10px;
      border: 2px solid #01579b;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 3px 0 #01579b;
      font-size: 13px;
    }
    .lvl-btn.current { background: #ff9800; color: #000; border-color: #e65100; }
    .lvl-btn.locked { background: #333; color: #777; border-color: #444; cursor: not-allowed; box-shadow: none; }
    .pagination-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      font-size: 13px;
      font-weight: 800;
      color: #bbb;
    }
    .leaderboard-list { list-style: none; max-height: 200px; overflow-y: auto; }
    .leaderboard-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 6px;
      border-bottom: 1px dashed #444;
      font-size: 14px;
      color: #ddd;
    }
    .leaderboard-item:first-child { font-weight: 900; color: #ffb74d; font-size: 15px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="app-container">
    <h1>🕵️‍♂️ THIEF PUZZLE</h1>
    <p class="subtitle">1,050 High-Contrast Heist Levels</p>

    <div id="authSection" class="card">
      <h3>Player Login / Nickname</h3>
      <div class="input-row">
        <input type="text" id="guestNameInput" placeholder="Enter your username..." maxlength="18" />
        <button id="saveGuestBtn" class="btn-orange">Save</button>
      </div>
      <button id="googleLoginBtn" class="btn-google">Sign in with Google</button>
    </div>

    <div id="profileSection" class="card hidden">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div>
          <strong id="displayPlayerName" style="font-size:16px; color:#ffb74d;">Player</strong>
          <div style="font-size:12px; color:#aaa;">Unlocked Level: <span id="displayMaxLevel">1</span> / 1050</div>
        </div>
        <button id="switchUserBtn" class="btn-danger">Switch</button>
      </div>
    </div>

    <button id="continueBtn" class="btn-play">▶ PLAY LEVEL 1</button>

    <div class="card">
      <h3>
        <span>Select Level (1 - 1050)</span>
        <span id="pageIndicator" style="font-size:12px; color:#aaa;">Page 1/21</span>
      </h3>
      <div id="levelsGrid" class="levels-grid"></div>
      <div class="pagination-bar">
        <button id="prevPageBtn" class="btn-page">◀ Prev 50</button>
        <span id="rangeLabel">1 - 50</span>
        <button id="nextPageBtn" class="btn-page">Next 50 ▶</button>
      </div>
    </div>

    <div class="card">
      <h3>🏆 Global Leaderboard</h3>
      <ul id="leaderboardList" class="leaderboard-list">
        <li class="leaderboard-item">Loading scores...</li>
      </ul>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getDatabase, ref, set, get, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBzLchy5M2fLne4c7Ghw1KNN8wVrlZdd8M",
      authDomain: "friendsgame-872f5.firebaseapp.com",
      databaseURL: "https://friendsgame-872f5-default-rtdb.firebaseio.com",
      projectId: "friendsgame-872f5",
      storageBucket: "friendsgame-872f5.firebasestorage.app",
      messagingSenderId: "522534013233",
      appId: "1:522534013233:web:f5faa6e6795023d0420810",
      measurementId: "G-PW5H3G97QR"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const STORAGE_KEY = "thief_puzzle_player_v1";
    const TOTAL_LEVELS = 1050;
    const LEVELS_PER_PAGE = 50;

    let currentPlayer = JSON.parse(localStorage.getItem(STORAGE_KEY)) || null;
    let currentPage = 0;

    if (currentPlayer && currentPlayer.level) {
      currentPage = Math.floor((currentPlayer.level - 1) / LEVELS_PER_PAGE);
    }

    async function syncPlayerWithFirebase(player) {
      if (!player || !player.uid) return;
      try {
        const userRef = ref(db, `leaderboard/${player.uid}`);
        const snap = await get(userRef);
        if (snap.exists()) {
          const remote = snap.val();
          if (remote.level > player.level) player.level = remote.level;
        }
        await set(userRef, {
          username: player.username,
          level: player.level || 1,
          updatedAt: Date.now()
        });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(player));
        renderUI();
      } catch (e) {}
    }

    function renderUI() {
      const authSection = document.getElementById("authSection");
      const profileSection = document.getElementById("profileSection");
      const continueBtn = document.getElementById("continueBtn");
      const levelsGrid = document.getElementById("levelsGrid");

      if (currentPlayer && currentPlayer.username) {
        authSection.classList.add("hidden");
        profileSection.classList.remove("hidden");
        document.getElementById("displayPlayerName").textContent = currentPlayer.username;
        document.getElementById("displayMaxLevel").textContent = currentPlayer.level;
        continueBtn.textContent = `▶ CONTINUE (LEVEL ${currentPlayer.level})`;
      } else {
        authSection.classList.remove("hidden");
        profileSection.classList.add("hidden");
        continueBtn.textContent = `▶ START GAME (LEVEL 1)`;
      }

      const unlocked = currentPlayer ? currentPlayer.level : 1;
      const totalPages = Math.ceil(TOTAL_LEVELS / LEVELS_PER_PAGE);
      currentPage = Math.max(0, Math.min(totalPages - 1, currentPage));

      const startLvl = currentPage * LEVELS_PER_PAGE + 1;
      const endLvl = Math.min(TOTAL_LEVELS, startLvl + LEVELS_PER_PAGE - 1);

      document.getElementById("pageIndicator").textContent = `Page ${currentPage + 1}/${totalPages}`;
      document.getElementById("rangeLabel").textContent = `Levels ${startLvl} - ${endLvl}`;

      levelsGrid.innerHTML = "";
      for (let i = startLvl; i <= endLvl; i++) {
        const btn = document.createElement("div");
        const isLocked = i > unlocked;
        btn.className = "lvl-btn" + (isLocked ? " locked" : "") + (i === unlocked ? " current" : "");
        btn.textContent = i;
        if (!isLocked) {
          btn.onclick = () => {
            ensurePlayerExists();
            window.location.href = `level.html?level=${i}`;
          };
        }
        levelsGrid.appendChild(btn);
      }
    }

    function ensurePlayerExists() {
      if (!currentPlayer) {
        const typed = document.getElementById("guestNameInput").value.trim() || "Thief_" + Math.floor(Math.random() * 900 + 100);
        currentPlayer = {
          uid: "guest_" + Math.random().toString(36).substring(2, 10),
          username: typed,
          level: 1,
          isGoogle: false
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(currentPlayer));
        syncPlayerWithFirebase(currentPlayer);
      }
    }

    document.getElementById("prevPageBtn").onclick = () => {
      if (currentPage > 0) { currentPage--; renderUI(); }
    };
    document.getElementById("nextPageBtn").onclick = () => {
      if ((currentPage + 1) * LEVELS_PER_PAGE < TOTAL_LEVELS) { currentPage++; renderUI(); }
    };
    document.getElementById("saveGuestBtn").onclick = () => {
      const name = document.getElementById("guestNameInput").value.trim();
      if (!name) return alert("Please enter a username!");
      currentPlayer = {
        uid: currentPlayer?.uid || "guest_" + Math.random().toString(36).substring(2, 10),
        username: name,
        level: currentPlayer?.level || 1,
        isGoogle: false
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(currentPlayer));
      syncPlayerWithFirebase(currentPlayer);
      renderUI();
    };
    document.getElementById("googleLoginBtn").onclick = async () => {
      try {
        const res = await signInWithPopup(auth, new GoogleAuthProvider());
        currentPlayer = {
          uid: res.user.uid,
          username: res.user.displayName || "Thief Player",
          level: currentPlayer?.level || 1,
          isGoogle: true
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(currentPlayer));
        await syncPlayerWithFirebase(currentPlayer);
      } catch (e) {
        alert("Google Sign-In error: " + e.message);
      }
    };
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentPlayer = {
          uid: user.uid,
          username: user.displayName || "Thief Player",
          level: currentPlayer?.level || 1,
          isGoogle: true
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(currentPlayer));
        syncPlayerWithFirebase(currentPlayer);
      } else if (currentPlayer) {
        syncPlayerWithFirebase(currentPlayer);
      }
      renderUI();
    });
    document.getElementById("switchUserBtn").onclick = async () => {
      if (currentPlayer?.isGoogle) await signOut(auth);
      localStorage.removeItem(STORAGE_KEY);
      currentPlayer = null;
      renderUI();
    };
    document.getElementById("continueBtn").onclick = () => {
      ensurePlayerExists();
      window.location.href = `level.html?level=${currentPlayer.level}`;
    };

    onValue(ref(db, "leaderboard"), (snap) => {
      const list = document.getElementById("leaderboardList");
      list.innerHTML = "";
      if (!snap.exists()) {
        list.innerHTML = `<li class="leaderboard-item">No scores yet. Be #1!</li>`;
        return;
      }
      const arr = [];
      snap.forEach(c => arr.push(c.val()));
      arr.sort((a, b) => b.level - a.level || (a.updatedAt || 0) - (b.updatedAt || 0));
      arr.slice(0, 20).forEach((p, idx) => {
        const li = document.createElement("li");
        li.className = "leaderboard-item";
        li.innerHTML = `<span>#${idx + 1} ${p.username}</span><span>Level ${p.level}</span>`;
        list.appendChild(li);
      });
    });

    renderUI();
  </script>
</body>
</html>
