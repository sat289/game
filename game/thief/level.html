<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Thief Puzzle - Play Level</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body {
      background: #18181f;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      color: #fff;
    }
    .game-wrapper {
      width: 100%;
      max-width: 420px;
      height: 100vh;
      max-height: 840px;
      background: #23232c;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 3px solid #444;
      box-shadow: 0 12px 35px rgba(0,0,0,0.5);
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      background: #2b2b36;
      border-bottom: 2px solid #3b3b4a;
    }
    .home-circle {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(180deg, #ff9d2f, #e86f00);
      color: #fff;
      border: 2px solid #fff;
      box-shadow: 0 3px 8px rgba(0,0,0,0.3);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 19px;
      cursor: pointer;
    }
    .restart-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      color: #ff9800;
      font-weight: 800;
      font-size: 12px;
    }
    .restart-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid #fff;
      background: #ff9800;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 17px;
    }
    .level-title { font-size: 18px; font-weight: 800; color: #ffeb3b; }
    .prompt-text {
      text-align: center;
      font-size: 16px;
      padding: 10px 20px;
      min-height: 46px;
      color: #f5f5f5;
      font-weight: 700;
      background: #2c2c38;
      border-bottom: 2px solid #3b3b4a;
    }
    canvas {
      width: 100%;
      height: 440px;
      background: #fff8e8;
      touch-action: none;
      cursor: grab;
    }
    .bottom-bar {
      display: flex;
      justify-content: center;
      padding: 18px;
      background: #2b2b36;
      border-top: 2px solid #3b3b4a;
    }
    .hint-btn {
      background: linear-gradient(180deg, #29b6f6, #0288d1);
      color: #fff;
      border: 3px solid #fff;
      box-shadow: 0 4px 0 #01579b, 0 8px 15px rgba(0,0,0,0.3);
      border-radius: 40px;
      padding: 10px 42px;
      font-size: 20px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }
    /* Rewarded Ad Overlay Modal */
    .ad-modal {
      position: absolute;
      inset: 0;
      background: #000;
      z-index: 50;
      display: flex;
      flex-direction: column;
    }
    .ad-modal iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 15, 18, 0.9);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 26px;
      z-index: 30;
    }
    .hidden { display: none !important; }
    .trophy-card { text-align: center; }
    .RibbonText {
      font-size: 30px;
      font-weight: 900;
      padding: 8px 36px;
      border-radius: 30px;
      letter-spacing: 2px;
      color: #fff;
      margin-top: -12px;
      border: 3px solid #fff;
    }
    .RibbonText.win { background: linear-gradient(180deg, #ff2a85, #b8004f); }
    .RibbonText.fail { background: linear-gradient(180deg, #7e57c2, #4527a0); }
    .modal-btn {
      background: linear-gradient(180deg, #54f000, #2db300);
      color: #fff;
      border: 3px solid #111;
      border-radius: 16px;
      padding: 12px 48px;
      font-size: 24px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 5px 0 #1b6e00;
    }
  </style>
</head>
<body>
  <div class="game-wrapper">
    <div class="top-bar">
      <div class="home-circle" id="homeBtn">🏠</div>
      <div class="level-title" id="levelHeader">Level : 1</div>

    </div>

    <div class="prompt-text" id="promptText">Loading level...</div>

    <canvas id="gameCanvas" width="420" height="440"></canvas>

    <div class="bottom-bar">
      <button class="hint-btn" id="hintBtn">HINT <span>💡</span></button>
    </div>

    <!-- Rewarded Ad Overlay Container -->

      </div>
      <button id="modalActionBtn" class="modal-btn">» NEXT</button>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, set, push } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBzLchy5M2fLne4c7Ghw1KNN8wVrlZdd8M",
      authDomain: "friendsgame-872f5.firebaseapp.com",
      databaseURL: "https://friendsgame-872f5-default-rtdb.firebaseio.com",
      projectId: "friendsgame-872f5",
      storageBucket: "friendsgame-872f5.firebasestorage.app",
      messagingSenderId: "522534013233",
      appId: "1:522534013233:web:f5faa6e6795023d0420810",
      measurementId: "G-PW5H3G97QR"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const STORAGE_KEY = "thief_puzzle_player_v1";

    // Audio synthesizer
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function playSound(type) {
      try {
        if (!audioCtx) audioCtx = new AudioCtx();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === "pop") {
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.07);
          gain.gain.setValueAtTime(0.14, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.07);
          osc.start(now); osc.stop(now + 0.07);
        } else if (type === "win") {
          [523, 659, 784, 1046].forEach((freq, idx) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination);
            o.frequency.setValueAtTime(freq, now + idx * 0.09);
            g.gain.setValueAtTime(0.18, now + idx * 0.09);
            g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.09 + 0.25);
            o.start(now + idx * 0.09); o.stop(now + idx * 0.09 + 0.25);
          });
        } else if (type === "fail") {
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(210, now);
          osc.frequency.linearRampToValueAtTime(105, now + 0.35);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
          osc.start(now); osc.stop(now + 0.35);
        }
      } catch (e) {}
    }

    // 6 Video Levels
    const VIDEO_LEVELS = [
      {
        prompt: "I also want to eat roast chicken",
        thiefStyle: "bandana",
        ledge: { x1: 0, y1: 215, x2: 95, y2: 215 },
        table: { x: 255, y: 245, w: 95, h: 70 },
        thief: { x: 48, y: 140, shoulderX: 62, shoulderY: 132 },
        handStart: { x: 130, y: 270 },
        target: { x: 300, y: 232, r: 24, kind: "chicken" },
        pivots: [{ x: 175, y: 350, r: 24, kind: "rock" }],
        hazards: [
          { x: 215, y: 235, r: 34, kind: "girl" },
          { x: 380, y: 235, r: 32, kind: "boy" }
        ]
      },
      {
        prompt: "I also want love balloons",
        thiefStyle: "cap",
        thief: { x: 68, y: 325, shoulderX: 82, shoulderY: 315 },
        handStart: { x: 135, y: 290 },
        target: { x: 315, y: 110, r: 28, kind: "balloons" },
        pivots: [{ x: 105, y: 120, r: 30, kind: "bin" }],
        hazards: [
          { x: 250, y: 195, r: 38, kind: "cat" },
          { x: 365, y: 195, r: 35, kind: "dog" }
        ]
      },
      {
        prompt: "How to take away the treasure!",
        thiefStyle: "normal",
        thief: { x: 62, y: 225, shoulderX: 78, shoulderY: 215 },
        handStart: { x: 138, y: 232 },
        target: { x: 360, y: 255, r: 25, kind: "treasure" },
        pivots: [{ x: 200, y: 355, r: 16, kind: "rock" }],
        hazards: [
          { x: 200, y: 140, r: 32, kind: "door" },
          { x: 200, y: 225, r: 32, kind: "door" },
          { x: 285, y: 210, r: 35, kind: "guard" }
        ]
      },
      {
        prompt: "Take the lady's purse.",
        thiefStyle: "mask",
        streetFloor: true,
        bench: { x: 200, y: 275, w: 200 },
        thief: { x: 55, y: 270, shoulderX: 68, shoulderY: 260 },
        handStart: { x: 92, y: 195 },
        target: { x: 368, y: 258, r: 22, kind: "purse" },
        pivots: [
          { x: 95, y: 90, r: 22, kind: "lamp" },
          { x: 335, y: 90, r: 22, kind: "lamp" }
        ],
        hazards: [
          { x: 145, y: 270, r: 32, kind: "bin" },
          { x: 268, y: 245, r: 40, kind: "couple" }
        ]
      },
      {
        prompt: "Save him!",
        thiefStyle: "angel",
        floorLine: 385,
        thief: { x: 95, y: 90, shoulderX: 112, shoulderY: 95 },
        handStart: { x: 175, y: 155 },
        target: { x: 242, y: 258, r: 20, kind: "plug" },
        pivots: [{ x: 222, y: 362, r: 16, kind: "rock" }],
        hazards: [
          { x: 60, y: 290, r: 32, kind: "cat" },
          { x: 192, y: 258, r: 18, kind: "warhead" },
          { x: 350, y: 275, r: 38, kind: "villain" }
        ]
      },
      {
        prompt: "Help him get the fire extinguisher.",
        thiefStyle: "normal",
        thief: { x: 75, y: 145, shoulderX: 90, shoulderY: 138 },
        handStart: { x: 145, y: 190 },
        target: { x: 352, y: 355, r: 25, kind: "extinguisher" },
        pivots: [{ x: 190, y: 282, r: 22, kind: "flower" }],
        hazards: [
          { x: 298, y: 125, r: 38, kind: "fire" },
          { x: 110, y: 260, r: 32, kind: "fire" },
          { x: 100, y: 372, r: 32, kind: "fire" },
          { x: 295, y: 305, r: 34, kind: "fire" },
          { x: 246, y: 225, r: 22, kind: "hammer" }
        ]
      }
    ];

    function createSeededRandom(seed) {
      let s = seed * 2654435761 % 2147483647;
      if (s <= 0) s += 2147483646;
      return function () {
        s = (s * 16807) % 2147483647;
        return (s - 1) / 2147483646;
      };
    }

    function distToSegment(p, a, b) {
      const l2 = (b.x - a.x) ** 2 + (b.y - a.y) ** 2;
      if (l2 === 0) return Math.hypot(p.x - a.x, p.y - a.y);
      let t = ((p.x - a.x) * (b.x - a.x) + (p.y - a.y) * (b.y - a.y)) / l2;
      t = Math.max(0, Math.min(1, t));
      return Math.hypot(p.x - (a.x + t * (b.x - a.x)), p.y - (a.y + t * (b.y - a.y)));
    }

    function generateProceduralLevel(levelNum) {
      if (levelNum <= VIDEO_LEVELS.length) {
        return JSON.parse(JSON.stringify(VIDEO_LEVELS[levelNum - 1]));
      }
      const rand = createSeededRandom(levelNum * 97 + 13);
      const THIEF_STYLES = ["bandana", "cap", "mask", "angel", "normal"];
      const TARGET_TYPES = [
        { kind: "chicken", title: "Steal the roast chicken quietly!" },
        { kind: "treasure", title: "Grab the hidden gold treasure chest!" },
        { kind: "purse", title: "Snatch the luxury purse without being seen!" },
        { kind: "extinguisher", title: "Help him get the emergency extinguisher!" },
        { kind: "balloons", title: "Take the party balloons from the park!" },
        { kind: "diamond", title: "Steal the royal blue diamond!" },
        { kind: "key", title: "Grab the secret prison master key!" },
        { kind: "cat", title: "Rescue the fluffy cat!" },
        { kind: "dog", title: "Grab the playful puppy!" }
      ];
      const PIVOT_KINDS = ["rock", "bin", "flower", "lamp"];
      const HAZARD_KINDS = ["fire", "hammer", "cat", "dog", "guard", "villain", "cactus"];

      const targetChoice = TARGET_TYPES[(levelNum + Math.floor(rand() * 10)) % TARGET_TYPES.length];
      const thiefStyle = THIEF_STYLES[levelNum % THIEF_STYLES.length];
      const thiefOnLeft = levelNum % 4 !== 0;

      const thiefX = thiefOnLeft ? Math.floor(52 + rand() * 35) : Math.floor(335 + rand() * 30);
      const thiefY = Math.floor(110 + rand() * 210);
      const shoulderX = thiefOnLeft ? thiefX + 14 : thiefX - 14;
      const shoulderY = thiefY - 8;
      const targetX = thiefOnLeft ? Math.floor(315 + rand() * 55) : Math.floor(55 + rand() * 55);
      const targetY = Math.floor(95 + rand() * 250);

      const numPivots = 1 + (levelNum % 3);
      const pivots = [];
      for (let i = 0; i < numPivots; i++) {
        const progress = (i + 1) / (numPivots + 1);
        const px = Math.floor(105 + progress * 210 + (rand() * 50 - 25));
        const py = (levelNum + i) % 2 === 0 ? Math.floor(310 + rand() * 55) : Math.floor(75 + rand() * 55);
        pivots.push({ x: px, y: py, r: 22, kind: PIVOT_KINDS[(levelNum + i) % PIVOT_KINDS.length] });
      }

      const pathPoints = [{ x: shoulderX, y: shoulderY }, ...pivots, { x: targetX, y: targetY }];
      const hazards = [];
      const desiredHazards = Math.min(4, 2 + Math.floor((levelNum % 12) / 4));

      let attempts = 0;
      while (hazards.length < desiredHazards && attempts < 40) {
        attempts++;
        const hx = Math.floor(100 + rand() * 220);
        const hy = Math.floor(85 + rand() * 270);
        let clear = true;
        for (let s = 0; s < pathPoints.length - 1; s++) {
          if (distToSegment({ x: hx, y: hy }, pathPoints[s], pathPoints[s + 1]) < 62) clear = false;
        }
        if (Math.hypot(hx - thiefX, hy - thiefY) < 75) clear = false;
        if (Math.hypot(hx - targetX, hy - targetY) < 70) clear = false;
        if (clear) {
          hazards.push({ x: hx, y: hy, r: 30, kind: HAZARD_KINDS[(levelNum + hazards.length * 3) % HAZARD_KINDS.length] });
        }
      }

      return {
        prompt: `Level ${levelNum}: ${targetChoice.title}`,
        thiefStyle,
        thief: { x: thiefX, y: thiefY, shoulderX, shoulderY },
        handStart: { x: thiefOnLeft ? shoulderX + 45 : shoulderX - 45, y: Math.min(360, Math.max(70, shoulderY + 40)) },
        target: { x: targetX, y: targetY, r: 24, kind: targetChoice.kind },
        pivots,
        hazards
      };
    }

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const params = new URLSearchParams(window.location.search);
    let player = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
      uid: "guest_" + Math.random().toString(36).substring(2, 9),
      username: "Player",
      level: 1
    };
    let currentLevelNum = Math.max(1, parseInt(params.get("level")) || player.level || 1);

    let levelData = null;
    let hand = { x: 0, y: 0, r: 14 };
    let prevHand = { x: 0, y: 0 };
    let anchorPoints = [];
    let isDragging = false;
    let gameState = "PLAYING";
    let showHint = false;
    let animTick = 0;

    function loadLevel(lvlNum) {
      currentLevelNum = Math.max(1, Math.min(1050, lvlNum));
      levelData = generateProceduralLevel(currentLevelNum);

      document.getElementById("levelHeader").textContent = `Level : ${currentLevelNum}`;
      document.getElementById("promptText").textContent = levelData.prompt;
      document.getElementById("resultOverlay").classList.add("hidden");

      hand.x = levelData.handStart.x;
      hand.y = levelData.handStart.y;
      prevHand.x = hand.x; prevHand.y = hand.y;
      anchorPoints = [{ x: levelData.thief.shoulderX, y: levelData.thief.shoulderY }];
      gameState = "PLAYING";
      showHint = false;
    }

    function updatePhysics() {
      if (gameState !== "PLAYING") return;

      for (const piv of levelData.pivots) {
        const dx = hand.x - piv.x;
        const dy = hand.y - piv.y;
        const d = Math.hypot(dx, dy);
        const minDist = piv.r + 10;
        if (d < minDist && d > 0.001) {
          hand.x = piv.x + (dx / d) * minDist;
          hand.y = piv.y + (dy / d) * minDist;
        }
      }

      if (anchorPoints.length > 1) {
        const topAnchor = anchorPoints[anchorPoints.length - 1];
        const prevAnchor = anchorPoints[anchorPoints.length - 2];
        const piv = topAnchor.pivRef;
        if (piv) {
          const v1x = topAnchor.x - prevAnchor.x;
          const v1y = topAnchor.y - prevAnchor.y;
          const v2x = hand.x - topAnchor.x;
          const v2y = hand.y - topAnchor.y;
          const cross = v1x * v2y - v1y * v2x;
          if (cross * topAnchor.side > 280 || Math.hypot(hand.x - prevAnchor.x, hand.y - prevAnchor.y) < Math.hypot(topAnchor.x - prevAnchor.x, topAnchor.y - prevAnchor.y) - 10) {
            anchorPoints.pop();
          }
        }
      }

      const lastAnchor = anchorPoints[anchorPoints.length - 1];
      for (const piv of levelData.pivots) {
        if (lastAnchor.pivRef === piv) continue;
        const segDist = distToSegment(piv, lastAnchor, hand);
        const wrapRadius = piv.r + 7;
        const distAnchorToPiv = Math.hypot(piv.x - lastAnchor.x, piv.y - lastAnchor.y);
        const distAnchorToHand = Math.hypot(hand.x - lastAnchor.x, hand.y - lastAnchor.y);

        if (segDist < wrapRadius && distAnchorToHand > distAnchorToPiv) {
          const apx = piv.x - lastAnchor.x;
          const apy = piv.y - lastAnchor.y;
          const ahx = hand.x - lastAnchor.x;
          const ahy = hand.y - lastAnchor.y;
          const cross = apx * ahy - apy * ahx;
          const side = cross >= 0 ? 1 : -1;
          const baseAngle = Math.atan2(apy, apx);
          const offsetAngle = baseAngle + side * (Math.PI / 2);

          anchorPoints.push({
            x: piv.x + Math.cos(offsetAngle) * (piv.r + 9),
            y: piv.y + Math.sin(offsetAngle) * (piv.r + 9),
            pivRef: piv,
            side
          });
          playSound("pop");
          break;
        }
      }

      const chain = [...anchorPoints, hand];
      for (let i = 0; i < chain.length - 1; i++) {
        for (const haz of levelData.hazards) {
          if (distToSegment(haz, chain[i], chain[i + 1]) < haz.r - 4) {
            gameState = "FAIL";
            isDragging = false;
            playSound("fail");
            setTimeout(() => showModal("FAIL"), 800);
            return;
          }
        }
      }

      if (Math.hypot(hand.x - levelData.target.x, hand.y - levelData.target.y) < levelData.target.r + hand.r) {
        gameState = "RETRACTING";
        isDragging = false;
        playSound("pop");
      }

      prevHand.x = hand.x; prevHand.y = hand.y;
    }

    async function saveProgress(completedLevel) {
      const next = Math.min(1050, completedLevel + 1);
      if (next > (player.level || 1)) player.level = next;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(player));
      try {
        await set(ref(db, `leaderboard/${player.uid}`), {
          username: player.username,
          level: player.level,
          updatedAt: Date.now()
        });
        await push(ref(db, `history/${player.uid}`), {
          levelCompleted: completedLevel,
          timestamp: Date.now()
        });
      } catch (e) {}
    }

    function showModal(status) {
      const overlay = document.getElementById("resultOverlay");
      const wrap = document.getElementById("trophySvgWrap");
      const ribbon = document.getElementById("resultRibbon");
      const btn = document.getElementById("modalActionBtn");

      overlay.classList.remove("hidden");
      if (status === "WIN") {
        wrap.innerHTML = `<div style="font-size:85px;">🏆</div>`;
        ribbon.textContent = "YOU WIN";
        ribbon.className = "RibbonText win";
        btn.textContent = "» NEXT";
        btn.onclick = () => loadLevel(currentLevelNum + 1);
      } else {
        wrap.innerHTML = `<div style="font-size:85px;">🏆😢</div>`;
        ribbon.textContent = "FAILED";
        ribbon.className = "RibbonText fail";
        btn.textContent = "↻ Replay";
        btn.onclick = () => loadLevel(currentLevelNum);
      }
    }

    function drawAnimatedAvatar(x, y, role, state) {
      ctx.save();
      ctx.translate(x, y);
      ctx.strokeStyle = "#111";
      ctx.lineWidth = 3.5;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      const breathe = Math.sin(animTick * 0.15) * 1.5;

      if (role === "cat") {
        ctx.fillStyle = "#ffb74d";
        ctx.beginPath(); ctx.arc(0, 0 + breathe, 20, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(-16, -14); ctx.lineTo(-24, -28); ctx.lineTo(-8, -18);
        ctx.moveTo(16, -14); ctx.lineTo(24, -28); ctx.lineTo(8, -18);
        ctx.fill(); ctx.stroke();
        const tailWag = Math.sin(animTick * 0.3) * 12;
        ctx.beginPath(); ctx.moveTo(16, 12); ctx.quadraticCurveTo(32 + tailWag, 0, 26, -12); ctx.stroke();
        ctx.fillStyle = "#111";
        ctx.beginPath(); ctx.arc(-7, -4, 2.5, 0, Math.PI * 2); ctx.arc(7, -4, 2.5, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
        return;
      }

      if (role === "dog") {
        ctx.fillStyle = "#d7ccc8";
        ctx.beginPath(); ctx.ellipse(0, 0 + breathe, 22, 18, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = "#8d6e63";
        ctx.beginPath(); ctx.ellipse(-18, -4, 8, 12, 0.3, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(18, -4, 8, 12, -0.3, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = "#f06292";
        ctx.beginPath(); ctx.arc(0, 8, 5, 0, Math.PI); ctx.fill(); ctx.stroke();
        ctx.restore();
        return;
      }

      if (role === "angel") {
        ctx.fillStyle = "#e0f7fa";
        ctx.beginPath(); ctx.ellipse(-22, -5, 16, 8, -0.4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.strokeStyle = "#fbc02d";
        ctx.beginPath(); ctx.ellipse(0, -62, 14, 4, 0, 0, Math.PI * 2); ctx.stroke();
        ctx.strokeStyle = "#111";
      }

      if (role === "girl") {
        ctx.fillStyle = "#111";
        ctx.beginPath(); ctx.arc(-22, -45, 10, 0, Math.PI * 2); ctx.ellipse(-34, -38, 12, 7, -0.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#ff80ab";
        ctx.beginPath(); ctx.moveTo(0, -18); ctx.lineTo(-16, 26); ctx.lineTo(16, 26); ctx.closePath(); ctx.fill(); ctx.stroke();
      } else {
        ctx.fillStyle = role === "villain" ? "#d32f2f" : (role === "boy" ? "#ff9800" : "#1976d2");
        ctx.fillRect(-9, -18 + breathe, 18, 34); ctx.strokeRect(-9, -18 + breathe, 18, 34);
        ctx.fillStyle = "#fff"; ctx.fillRect(-10, 14 + breathe, 20, 12); ctx.strokeRect(-10, 14 + breathe, 20, 12);
      }

      ctx.beginPath();
      const runOffset = state === "WIN" && ["bandana", "cap", "normal", "mask"].includes(role) ? Math.sin(animTick * 0.4) * 10 : 0;
      ctx.moveTo(-5, 26); ctx.lineTo(-12 + runOffset, 56);
      ctx.moveTo(5, 26); ctx.lineTo(12 - runOffset, 56);
      ctx.stroke();

      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(0, -36, 18, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

      if (role === "bandana") {
        ctx.fillStyle = "#29b6f6"; ctx.fillRect(-17, -48, 34, 7); ctx.strokeRect(-17, -48, 34, 7);
      } else if (role === "cap") {
        ctx.fillStyle = "#1e88e5"; ctx.beginPath(); ctx.arc(0, -40, 17, Math.PI, 0); ctx.lineTo(25, -40); ctx.closePath(); ctx.fill(); ctx.stroke();
      } else if (role === "mask" || role === "guard") {
        ctx.fillStyle = "#222"; ctx.fillRect(-17, -43, 34, 10);
      }

      ctx.fillStyle = "#111";
      if (role === "girl" || role === "boy") {
        ctx.fillStyle = "#e91e63"; ctx.beginPath(); ctx.arc(-6, -38, 3.5, 0, Math.PI * 2); ctx.arc(6, -38, 3.5, 0, Math.PI * 2); ctx.fill();
      } else {
        const isBlinking = Math.floor(animTick / 35) % 8 === 0;
        if (!isBlinking) {
          ctx.beginPath(); ctx.arc(-6, -38, 2.5, 0, Math.PI * 2); ctx.arc(6, -38, 2.5, 0, Math.PI * 2); ctx.fill();
        } else {
          ctx.beginPath(); ctx.moveTo(-9, -38); ctx.lineTo(-3, -38); ctx.moveTo(3, -38); ctx.lineTo(9, -38); ctx.stroke();
        }
      }

      if (role === "villain") {
        ctx.fillStyle = "#43a047"; ctx.fillRect(-65, -26, 75, 16); ctx.strokeRect(-65, -26, 75, 16);
      }
      ctx.restore();
    }

    function drawObjectProp(x, y, r, kind) {
      ctx.save();
      ctx.translate(x, y);
      ctx.strokeStyle = "#222";
      ctx.lineWidth = 2.5;

      if (kind === "rock") {
        ctx.fillStyle = "#78909c";
        ctx.beginPath(); ctx.moveTo(-24, 14); ctx.lineTo(-18, -12); ctx.lineTo(6, -18); ctx.lineTo(24, -6); ctx.lineTo(26, 14);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.strokeStyle = "#455a64"; ctx.beginPath(); ctx.moveTo(-4, -8); ctx.lineTo(2, 6); ctx.stroke();
      } else if (kind === "bin") {
        ctx.fillStyle = "#81c784"; ctx.fillRect(-22, -26, 44, 52); ctx.strokeRect(-22, -26, 44, 52);
        ctx.fillStyle = "#4caf50"; ctx.fillRect(-26, -32, 52, 7); ctx.strokeRect(-26, -32, 52, 7);
        ctx.font = "16px sans-serif"; ctx.textAlign = "center"; ctx.fillText("♻️", 0, 5);
      } else if (kind === "flower") {
        ctx.fillStyle = "#a1887f"; ctx.beginPath(); ctx.moveTo(-14, 4); ctx.lineTo(14, 4); ctx.lineTo(10, 22); ctx.lineTo(-10, 22);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.strokeStyle = "#2e7d32"; ctx.beginPath(); ctx.moveTo(0, 4); ctx.lineTo(0, -12); ctx.stroke();
        ctx.fillStyle = "#ff4081";
        for (let a = 0; a < 5; a++) {
          const ang = (a * Math.PI * 2) / 5;
          ctx.beginPath(); ctx.arc(Math.cos(ang) * 6, -14 + Math.sin(ang) * 6, 4.5, 0, Math.PI * 2); ctx.fill();
        }
        ctx.fillStyle = "#ffeb3b"; ctx.beginPath(); ctx.arc(0, -14, 3.5, 0, Math.PI * 2); ctx.fill();
      } else if (kind === "fire") {
        const scale = 1 + Math.sin(animTick * 0.25 + x) * 0.08;
        ctx.scale(scale, scale);
        ctx.font = "40px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText("🔥", 0, 0);
      } else if (kind === "hammer") {
        ctx.rotate(-0.5);
        ctx.fillStyle = "#8d6e63"; ctx.fillRect(-4, -5, 8, 32); ctx.strokeRect(-4, -5, 8, 32);
        ctx.fillStyle = "#90a4ae"; ctx.fillRect(-16, -16, 32, 12); ctx.strokeRect(-16, -16, 32, 12);
      } else if (kind === "extinguisher") {
        ctx.fillStyle = "#e53935"; ctx.beginPath(); ctx.roundRect(-12, -14, 24, 34, 6); ctx.fill(); ctx.stroke();
        ctx.fillStyle = "#fff"; ctx.fillRect(-8, -2, 16, 10);
        ctx.fillStyle = "#222"; ctx.fillRect(-5, -20, 10, 7);
      } else if (kind === "chicken") {
        ctx.fillStyle = "#e67e22"; ctx.beginPath(); ctx.ellipse(0, 2, 22, 14, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      } else if (kind === "balloons") {
        ["#29b6f6", "#ff4081", "#ffeb3b"].forEach((c, i) => {
          ctx.fillStyle = c;
          ctx.beginPath(); ctx.arc((i - 1) * 15, -8, 13, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          ctx.beginPath(); ctx.moveTo((i - 1) * 15, 5); ctx.lineTo(0, 32); ctx.stroke();
        });
      } else if (kind === "treasure") {
        ctx.fillStyle = "#ffb300"; ctx.fillRect(-20, -14, 40, 28); ctx.strokeRect(-20, -14, 40, 28);
        ctx.fillStyle = "#fff"; ctx.fillRect(-5, -4, 10, 10);
      } else if (kind === "purse") {
        ctx.fillStyle = "#f48fb1"; ctx.beginPath(); ctx.roundRect(-18, -10, 36, 24, 6); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.arc(0, -10, 10, Math.PI, 0); ctx.stroke();
      } else if (kind === "lamp") {
        ctx.fillStyle = "#ffee58"; ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = "#37474f"; ctx.beginPath(); ctx.arc(0, -4, 19, Math.PI, 0); ctx.fill();
      } else if (kind === "door") {
        if (y < 200) {
          ctx.fillStyle = "#b0bec5"; ctx.fillRect(-8, -55, 16, 200); ctx.strokeRect(-8, -55, 16, 200);
          ctx.fillStyle = "#fbc02d"; ctx.beginPath(); ctx.arc(14, 65, 6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        }
      } else if (kind === "warhead" || kind === "plug") {
        if (kind === "warhead") {
          ctx.fillStyle = "#616161"; ctx.beginPath(); ctx.arc(0, 0, 15, Math.PI / 2, -Math.PI / 2);
          ctx.lineTo(26, -15); ctx.lineTo(26, 15); ctx.closePath(); ctx.fill(); ctx.stroke();
        } else {
          ctx.fillStyle = "#d32f2f"; ctx.fillRect(-8, -8, 16, 16); ctx.strokeRect(-8, -8, 16, 16);
        }
      } else if (kind === "cat" || kind === "dog") {
        drawAnimatedAvatar(0, 0, kind, "PLAYING");
      } else {
        const EMAP = { diamond: "💎", key: "🔑", pizza: "🍕", crown: "👑", gift: "🎁", cactus: "🌵" };
        ctx.font = "36px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(EMAP[kind] || "⭐", 0, 0);
      }
      ctx.restore();
    }

    function renderLoop() {
      animTick++;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (gameState === "RETRACTING") {
        const targetPt = anchorPoints[anchorPoints.length - 1];
        const dx = targetPt.x - hand.x;
        const dy = targetPt.y - hand.y;
        const dist = Math.hypot(dx, dy);
        const speed = 14;
        if (dist <= speed) {
          hand.x = targetPt.x; hand.y = targetPt.y;
          if (anchorPoints.length > 1) {
            anchorPoints.pop();
          } else {
            gameState = "WIN";
            playSound("win");
            saveProgress(currentLevelNum);
            setTimeout(() => showModal("WIN"), 800);
          }
        } else {
          hand.x += (dx / dist) * speed;
          hand.y += (dy / dist) * speed;
        }
        levelData.target.x = hand.x;
        levelData.target.y = hand.y;
      }

      ctx.save();
      ctx.strokeStyle = "#333"; ctx.lineWidth = 3;
      if (levelData.ledge) {
        ctx.beginPath(); ctx.moveTo(levelData.ledge.x1, levelData.ledge.y1); ctx.lineTo(levelData.ledge.x2, levelData.ledge.y2); ctx.stroke();
      }
      if (levelData.table) {
        const t = levelData.table;
        ctx.fillStyle = "#cfd8dc"; ctx.fillRect(t.x, t.y, t.w, 6); ctx.strokeRect(t.x, t.y, t.w, 6);
        ctx.strokeRect(t.x + 6, t.y + 6, 6, t.h); ctx.strokeRect(t.x + t.w - 12, t.y + 6, 6, t.h);
      }
      if (levelData.streetFloor) {
        ctx.fillStyle = "rgba(207, 216, 220, 0.55)"; ctx.fillRect(0, 325, canvas.width, 135);
      }
      if (levelData.bench) {
        ctx.fillStyle = "#d7ccc8"; ctx.fillRect(levelData.bench.x, levelData.bench.y, levelData.bench.w, 10);
        ctx.strokeRect(levelData.bench.x, levelData.bench.y, levelData.bench.w, 10);
      }
      if (levelData.floorLine) {
        ctx.fillStyle = "#8d6e63"; ctx.fillRect(0, levelData.floorLine, canvas.width, 8);
      }
      ctx.restore();

      if (showHint) {
        ctx.save();
        ctx.setLineDash([8, 6]);
        ctx.strokeStyle = "#00e676";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(levelData.thief.shoulderX, levelData.thief.shoulderY);
        levelData.pivots.forEach(p => ctx.lineTo(p.x, p.y));
        ctx.lineTo(levelData.target.x, levelData.target.y);
        ctx.stroke();
        ctx.restore();
      }

      drawAnimatedAvatar(levelData.thief.x, levelData.thief.y, levelData.thiefStyle || "normal", gameState);

      levelData.pivots.forEach(p => drawObjectProp(p.x, p.y, p.r, p.kind));

      levelData.hazards.forEach(h => {
        if (["cat", "dog", "girl", "boy", "guard", "villain"].includes(h.kind)) {
          drawAnimatedAvatar(h.x, h.y, h.kind, gameState);
        } else if (h.kind === "couple") {
          drawAnimatedAvatar(h.x - 18, h.y, "boy", gameState);
          drawAnimatedAvatar(h.x + 18, h.y, "girl", gameState);
        } else {
          drawObjectProp(h.x, h.y, h.r, h.kind);
        }
      });

      drawObjectProp(levelData.target.x, levelData.target.y, levelData.target.r, levelData.target.kind);

      ctx.save();
      ctx.lineWidth = 5; ctx.lineCap = "round"; ctx.lineJoin = "round";
      ctx.strokeStyle = (gameState === "RETRACTING" || gameState === "WIN") ? "#00e676" : (gameState === "FAIL" ? "#ff1744" : "#111");
      ctx.beginPath();
      ctx.moveTo(anchorPoints[0].x, anchorPoints[0].y);
      for (let i = 1; i < anchorPoints.length; i++) {
        ctx.lineTo(anchorPoints[i].x, anchorPoints[i].y);
      }
      ctx.lineTo(hand.x, hand.y);
      ctx.stroke();

      const prevPt = anchorPoints[anchorPoints.length - 1];
      const handAngle = Math.atan2(hand.y - prevPt.y, hand.x - prevPt.x);
      ctx.translate(hand.x, hand.y); ctx.rotate(handAngle);
      ctx.fillStyle = "#fff"; ctx.strokeStyle = "#111"; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      for (let f = -1; f <= 1; f++) {
        ctx.beginPath(); ctx.roundRect(6, f * 5 - 2, 9, 4, 2); ctx.fill(); ctx.stroke();
      }
      ctx.restore();

      requestAnimationFrame(renderLoop);
    }

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (cx - rect.left) * (canvas.width / rect.width),
        y: (cy - rect.top) * (canvas.height / rect.height)
      };
    }

    canvas.addEventListener("pointerdown", (e) => {
      if (gameState !== "PLAYING") return;
      const pos = getPos(e);
      if (Math.hypot(pos.x - hand.x, pos.y - hand.y) < 48) {
        isDragging = true;
      }
    });

    window.addEventListener("pointermove", (e) => {
      if (!isDragging || gameState !== "PLAYING") return;
      const pos = getPos(e);
      const steps = 4;
      const startX = hand.x; const startY = hand.y;
      const targetX = Math.max(16, Math.min(canvas.width - 16, pos.x));
      const targetY = Math.max(16, Math.min(canvas.height - 16, pos.y));

      for (let s = 1; s <= steps; s++) {
        if (gameState !== "PLAYING") break;
        hand.x = startX + ((targetX - startX) * s) / steps;
        hand.y = startY + ((targetY - startY) * s) / steps;
        updatePhysics();
      }
    });

    window.addEventListener("pointerup", () => { isDragging = false; });

    document.getElementById("homeBtn").onclick = () => window.location.href = "index.html";
    document.getElementById("restartBtn").onclick = () => loadLevel(currentLevelNum);

    // Rewarded Ad Integration (Opens ad.html and listens for postMessage)
    document.getElementById("hintBtn").onclick = () => {
      const adModal = document.getElementById("adModal");
      const adIframe = document.getElementById("adIframe");
      adIframe.src = "ad.html";
      adModal.classList.remove("hidden");
    };

    window.addEventListener("message", (event) => {
      if (event.data === "AD_COMPLETED") {
        const adModal = document.getElementById("adModal");
        const adIframe = document.getElementById("adIframe");
        adModal.classList.add("hidden");
        adIframe.src = "";
        // Reward granted: Show hint path
        showHint = true;
      }
    });

    loadLevel(currentLevelNum);
    requestAnimationFrame(renderLoop);
  </script>
</body>
</html>
