<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Thief Puzzle - ST Games</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', Tahoma, sans-serif; }
    html, body {
      width: 100%;
      height: 100%;
      background: #18181f;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: #fff;
    }
    .game-wrapper {
      width: 100%;
      max-width: 420px;
      height: 100%;
      max-height: 100vh;
      background: #1e1e24;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 2px solid #444;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    #quickSplash {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, #282836 0%, #14141a 100%);
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 14px;
      transition: opacity 0.35s ease;
    }
    .splash-logo {
      width: 115px;
      height: 115px;
      border-radius: 50%;
      border: 4px solid #ff9800;
      box-shadow: 0 0 25px rgba(255, 152, 0, 0.5);
      object-fit: cover;
      background: #222;
    }
    .splash-title {
      font-size: 30px;
      font-weight: 900;
      color: #ff9800;
      letter-spacing: 2px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: #2b2b36;
      border-bottom: 2px solid #3b3b4a;
      flex-shrink: 0;
    }
    .left-controls, .right-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      color: #ff9800;
      font-weight: 800;
      font-size: 10px;
    }
    .action-icon {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid #fff;
      background: linear-gradient(180deg, #ff9d2f, #e86f00);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    .level-title { font-size: 17px; font-weight: 900; color: #ffeb3b; }
    .prompt-text {
      text-align: center;
      font-size: 14px;
      padding: 6px 12px;
      color: #f5f5f5;
      font-weight: 700;
      background: #2c2c38;
      border-bottom: 2px solid #3b3b4a;
      flex-shrink: 0;
    }
    canvas {
      width: 100%;
      background: radial-gradient(circle at center, #2c2c38 0%, #1a1a22 100%);
      touch-action: none;
      cursor: grab;
      flex-grow: 1;
      display: block;
    }
    .bottom-bar {
      display: flex;
      justify-content: center;
      padding: 10px 16px;
      background: #2b2b36;
      border-top: 2px solid #3b3b4a;
      flex-shrink: 0;
    }
    .hint-btn {
      background: linear-gradient(180deg, #29b6f6, #0288d1);
      color: #fff;
      border: 2px solid #fff;
      box-shadow: 0 3px 0 #01579b, 0 6px 12px rgba(0,0,0,0.3);
      border-radius: 30px;
      padding: 8px 34px;
      font-size: 17px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    /* In-Game Level Selector Modal */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 15, 18, 0.94);
      z-index: 40;
      display: flex;
      flex-direction: column;
      padding: 16px;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .modal-header h2 { font-size: 18px; color: #ffeb3b; }
    .close-btn { background: #e53935; color: #fff; border: none; border-radius: 8px; padding: 6px 12px; font-weight: bold; cursor: pointer; }
    .levels-grid-modal {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      overflow-y: auto;
      flex-grow: 1;
      padding-right: 4px;
    }
    .grid-lvl-btn {
      background: #0288d1;
      color: #fff;
      border: 2px solid #111;
      border-radius: 8px;
      padding: 12px 0;
      text-align: center;
      font-weight: 900;
      font-size: 14px;
      cursor: pointer;
    }
    .grid-lvl-btn.locked { background: #424242; color: #757575; cursor: not-allowed; }
    .grid-lvl-btn.current { background: #ff9800; }

    .ad-modal {
      position: absolute;
      inset: 0;
      background: #000;
      z-index: 50;
      display: flex;
      flex-direction: column;
    }
    .ad-modal iframe { width: 100%; height: 100%; border: none; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 15, 18, 0.9);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 18px;
      z-index: 30;
    }
    .hidden { display: none !important; }
    .RibbonText {
      font-size: 28px;
      font-weight: 900;
      padding: 6px 30px;
      border-radius: 24px;
      letter-spacing: 2px;
      color: #fff;
      margin-top: -10px;
      border: 2px solid #fff;
    }
    .RibbonText.win { background: linear-gradient(180deg, #ff2a85, #b8004f); }
    .RibbonText.fail { background: linear-gradient(180deg, #7e57c2, #4527a0); }
    .modal-btn {
      background: linear-gradient(180deg, #54f000, #2db300);
      color: #fff;
      border: 2px solid #111;
      border-radius: 14px;
      padding: 10px 40px;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 0 #1b6e00;
    }
    .modal-home-btn {
      background: #ff9800;
      color: #fff;
      border: 2px solid #111;
      border-radius: 12px;
      padding: 8px 24px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="game-wrapper">
    <div id="quickSplash">
      <img
        class="splash-logo"
        src="../../logo/logo.jpg"
        alt="ST Games"
        onerror="if(!this.dataset.f1){this.dataset.f1=1;this.src='../logo/logo.jpg';}else if(!this.dataset.f2){this.dataset.f2=1;this.src='/game/logo/logo.jpg';}"
      />
      <div class="splash-title">ST GAMES</div>
      <div style="font-size:13px; color:#ccc; font-weight:600;">Loading level...</div>
    </div>

    <div class="top-bar">
      <div class="left-controls">
        <div class="action-btn" id="homeBtn" title="Home">
          <div class="action-icon">🏠</div>
          <span>Home</span>
        </div>
        <div class="action-btn" id="levelsModalBtn" title="Select Level">
          <div class="action-icon" style="background:#0288d1;">📋</div>
          <span>Levels</span>
        </div>
      </div>

      <div class="level-title" id="levelHeader">Level : 1</div>

      <div class="right-controls">
        <div class="action-btn" id="restartBtn" title="Restart">
          <div class="action-icon">↻</div>
          <span>ReStart</span>
        </div>
      </div>
    </div>

    <div class="prompt-text" id="promptText">Loading level...</div>

    <canvas id="gameCanvas" width="420" height="420"></canvas>

    <div class="bottom-bar">
      <button class="hint-btn" id="hintBtn">HINT <span>💡</span></button>
    </div>

    <div id="levelsModal" class="modal-overlay hidden">
      <div class="modal-header">
        <h2>Select Level (1 - 1050)</h2>
        <button id="closeModalBtn" class="close-btn">✕ Close</button>
      </div>
      <div id="modalLevelsGrid" class="levels-grid-modal"></div>
    </div>

    <div id="adModal" class="ad-modal hidden">
      <iframe id="adIframe" src=""></iframe>
    </div>

    <div id="resultOverlay" class="overlay hidden">
      <div class="trophy-card" style="text-align:center;">
        <div id="trophySvgWrap" style="font-size:75px;">🏆</div>
        <div id="resultRibbon" class="RibbonText win">YOU WIN</div>
      </div>
      <button id="modalActionBtn" class="modal-btn">» NEXT</button>
      <button id="modalHomeBtn" class="modal-home-btn">🏠 Home Menu</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, set, push } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBzLchy5M2fLne4c7Ghw1KNN8wVrlZdd8M",
      authDomain: "friendsgame-872f5.firebaseapp.com",
      databaseURL: "https://friendsgame-872f5-default-rtdb.firebaseio.com",
      projectId: "friendsgame-872f5",
      storageBucket: "friendsgame-872f5.firebasestorage.app",
      messagingSenderId: "522534013233",
      appId: "1:522534013233:web:f5faa6e6795023d0420810",
      measurementId: "G-PW5H3G97QR"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const STORAGE_KEY = "thief_puzzle_player_v1";

    let player = JSON.parse(localStorage.getItem(STORAGE_KEY)) || { uid: "guest_" + Math.random().toString(36).substring(2, 9), username: "Player", level: 1 };
    const params = new URLSearchParams(window.location.search);
    let currentLevelNum = Math.max(1, parseInt(params.get("level")) || player.level || 1);

    setTimeout(() => {
      const qs = document.getElementById("quickSplash");
      if (qs) qs.classList.add("hidden");
    }, 800);

    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function playSound(type) {
      try {
        if (!audioCtx) audioCtx = new AudioCtx();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;
        if (type === "pop") {
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.07);
          gain.gain.setValueAtTime(0.14, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.07);
          osc.start(now); osc.stop(now + 0.07);
        } else if (type === "win") {
          [523, 659, 784, 1046].forEach((freq, idx) => {
            const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination);
            o.frequency.setValueAtTime(freq, now + idx * 0.09);
            g.gain.setValueAtTime(0.18, now + idx * 0.09);
            g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.09 + 0.25);
            o.start(now + idx * 0.09); o.stop(now + idx * 0.09 + 0.25);
          });
        } else if (type === "fail") {
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(210, now);
          osc.frequency.linearRampToValueAtTime(105, now + 0.35);
          gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
          osc.start(now); osc.stop(now + 0.35);
        }
      } catch (e) {}
    }

    const VIDEO_LEVELS = [
      {
        prompt: "I also want to eat roast chicken",
        thiefStyle: "bandana",
        ledge: { x1: 0, y1: 190, x2: 95, y2: 190 },
        table: { x: 255, y: 220, w: 95, h: 60 },
        thief: { x: 48, y: 125, shoulderX: 62, shoulderY: 117 },
        handStart: { x: 130, y: 240 },
        target: { x: 300, y: 208, r: 24, kind: "chicken" },
        pivots: [{ x: 175, y: 310, r: 24, kind: "rock" }],
        hazards: [{ x: 215, y: 210, r: 34, kind: "girl" }, { x: 380, y: 210, r: 32, kind: "boy" }]
      },
      {
        prompt: "I also want love balloons",
        thiefStyle: "cap",
        thief: { x: 68, y: 285, shoulderX: 82, shoulderY: 275 },
        handStart: { x: 135, y: 250 },
        target: { x: 315, y: 95, r: 28, kind: "balloons" },
        pivots: [{ x: 105, y: 100, r: 30, kind: "bin" }],
        hazards: [{ x: 250, y: 170, r: 38, kind: "cat" }, { x: 365, y: 170, r: 35, kind: "dog" }]
      },
      {
        prompt: "How to take away the treasure!",
        thiefStyle: "normal",
        thief: { x: 62, y: 195, shoulderX: 78, shoulderY: 185 },
        handStart: { x: 138, y: 200 },
        target: { x: 360, y: 225, r: 25, kind: "treasure" },
        pivots: [{ x: 200, y: 320, r: 16, kind: "rock" }],
        hazards: [{ x: 200, y: 120, r: 32, kind: "door" }, { x: 200, y: 195, r: 32, kind: "door" }, { x: 285, y: 185, r: 35, kind: "guard" }]
      },
      {
        prompt: "Take the lady's purse.",
        thiefStyle: "mask",
        streetFloor: true,
        bench: { x: 200, y: 240, w: 200 },
        thief: { x: 55, y: 230, shoulderX: 68, shoulderY: 220 },
        handStart: { x: 92, y: 160 },
        target: { x: 368, y: 222, r: 22, kind: "purse" },
        pivots: [{ x: 95, y: 75, r: 22, kind: "lamp" }, { x: 335, y: 75, r: 22, kind: "lamp" }],
        hazards: [{ x: 145, y: 230, r: 32, kind: "bin" }, { x: 268, y: 210, r: 40, kind: "couple" }]
      },
      {
        prompt: "Save him!",
        thiefStyle: "angel",
        floorLine: 345,
        thief: { x: 95, y: 75, shoulderX: 112, shoulderY: 80 },
        handStart: { x: 175, y: 135 },
        target: { x: 242, y: 222, r: 20, kind: "plug" },
        pivots: [{ x: 222, y: 325, r: 16, kind: "rock" }],
        hazards: [{ x: 60, y: 250, r: 32, kind: "cat" }, { x: 192, y: 222, r: 18, kind: "warhead" }, { x: 350, y: 235, r: 38, kind: "villain" }]
      },
      {
        prompt: "Help him get the fire extinguisher.",
        thiefStyle: "normal",
        thief: { x: 75, y: 125, shoulderX: 90, shoulderY: 118 },
        handStart: { x: 145, y: 160 },
        target: { x: 352, y: 315, r: 25, kind: "extinguisher" },
        pivots: [{ x: 190, y: 245, r: 22, kind: "flower" }],
        hazards: [{ x: 298, y: 105, r: 38, kind: "fire" }, { x: 110, y: 230, r: 32, kind: "fire" }, { x: 100, y: 330, r: 32, kind: "fire" }, { x: 295, y: 270, r: 34, kind: "fire" }, { x: 246, y: 195, r: 22, kind: "hammer" }]
      }
    ];

    function createSeededRandom(seed) {
      let s = seed * 2654435761 % 2147483647;
      if (s <= 0) s += 2147483646;
      return function () {
        s = (s * 16807) % 2147483647;
        return (s - 1) / 2147483646;
      };
    }

    function distToSegment(p, a, b) {
      const l2 = (b.x - a.x) ** 2 + (b.y - a.y) ** 2;
      if (l2 === 0) return Math.hypot(p.x - a.x, p.y - a.y);
      let t = ((p.x - a.x) * (b.x - a.x) + (p.y - a.y) * (b.y - a.y)) / l2;
      t = Math.max(0, Math.min(1, t));
      return Math.hypot(p.x - (a.x + t * (b.x - a.x)), p.y - (a.y + t * (b.y - a.y)));
    }

    function generateProceduralLevel(levelNum) {
      if (levelNum <= VIDEO_LEVELS.length) return JSON.parse(JSON.stringify(VIDEO_LEVELS[levelNum - 1]));
      const rand = createSeededRandom(levelNum * 97 + 13);
      const THIEF_STYLES = ["bandana", "cap", "mask", "angel", "normal"];
      const TARGET_TYPES = [
        { kind: "chicken", title: "Steal the roast chicken quietly!" },
        { kind: "treasure", title: "Grab the hidden gold treasure chest!" },
        { kind: "purse", title: "Snatch the luxury purse without being seen!" },
        { kind: "extinguisher", title: "Help him get the emergency extinguisher!" },
        { kind: "balloons", title: "Take the party balloons from the park!" },
        { kind: "diamond", title: "Steal the royal blue diamond!" },
        { kind: "key", title: "Grab the secret prison master key!" },
        { kind: "cat", title: "Rescue the fluffy cat!" },
        { kind: "dog", title: "Grab the playful puppy!" }
      ];
      const PIVOT_KINDS = ["rock", "bin", "flower", "lamp"];
      const HAZARD_KINDS = ["fire", "hammer", "cat", "dog", "guard", "villain", "cactus"];

      const targetChoice = TARGET_TYPES[(levelNum + Math.floor(rand() * 10)) % TARGET_TYPES.length];
      const thiefStyle = THIEF_STYLES[levelNum % THIEF_STYLES.length];
      const thiefOnLeft = levelNum % 4 !== 0;

      const thiefX = thiefOnLeft ? Math.floor(52 + rand() * 35) : Math.floor(335 + rand() * 30);
      const thiefY = Math.floor(95 + rand() * 170);
      const shoulderX = thiefOnLeft ? thiefX + 14 : thiefX - 14;
      const shoulderY = thiefY - 8;
      const targetX = thiefOnLeft ? Math.floor(315 + rand() * 55) : Math.floor(55 + rand() * 55);
      const targetY = Math.floor(80 + rand() * 210);

      const numPivots = 1 + (levelNum % 3);
      const pivots = [];
      for (let i = 0; i < numPivots; i++) {
        const progress = (i + 1) / (numPivots + 1);
        const px = Math.floor(105 + progress * 210 + (rand() * 50 - 25));
        const py = (levelNum + i) % 2 === 0 ? Math.floor(270 + rand() * 40) : Math.floor(65 + rand() * 45);
        pivots.push({ x: px, y: py, r: 22, kind: PIVOT_KINDS[(levelNum + i) % PIVOT_KINDS.length] });
      }

      const pathPoints = [{ x: shoulderX, y: shoulderY }, ...pivots, { x: targetX, y: targetY }];
      const hazards = [];
      const desiredHazards = Math.min(4, 2 + Math.floor((levelNum % 12) / 4));

      let attempts = 0;
      while (hazards.length < desiredHazards && attempts < 40) {
        attempts++;
        const hx = Math.floor(100 + rand() * 220);
        const hy = Math.floor(75 + rand() * 220);
        let clear = true;
        for (let s = 0; s < pathPoints.length - 1; s++) {
          if (distToSegment({ x: hx, y: hy }, pathPoints[s], pathPoints[s + 1]) < 55) clear = false;
        }
        if (Math.hypot(hx - thiefX, hy - thiefY) < 65) clear = false;
        if (Math.hypot(hx - targetX, hy - targetY) < 60) clear = false;
        if (clear) {
          hazards.push({ x: hx, y: hy, r: 26, kind: HAZARD_KINDS[(levelNum + hazards.length * 3) % HAZARD_KINDS.length] });
        }
      }

      return {
        prompt: `Level ${levelNum}: ${targetChoice.title}`,
        thiefStyle,
        thief: { x: thiefX, y: thiefY, shoulderX, shoulderY },
        handStart: { x: thiefOnLeft ? shoulderX + 45 : shoulderX - 45, y: Math.min(310, Math.max(55, shoulderY + 38)) },
        target: { x: targetX, y: targetY, r: 24, kind: targetChoice.kind },
        pivots,
        hazards
      };
    }

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let levelData = null;
    let hand = { x: 0, y: 0, r: 14 };
    let prevHand = { x: 0, y: 0 };
    let anchorPoints = [];
    let isDragging = false;
    let gameState = "PLAYING";
    let showHint = false;
    let animTick = 0;

    function loadLevel(lvlNum) {
      currentLevelNum = Math.max(1, Math.min(1050, lvlNum));
      levelData = generateProceduralLevel(currentLevelNum);

      document.getElementById("levelHeader").textContent = `Level : ${currentLevelNum}`;
      document.getElementById("promptText").textContent = levelData.prompt;
      document.getElementById("resultOverlay").classList.add("hidden");

      hand.x = levelData.handStart.x;
      hand.y = levelData.handStart.y;
      prevHand.x = hand.x; prevHand.y = hand.y;
      anchorPoints = [{ x: levelData.thief.shoulderX, y: levelData.thief.shoulderY }];
      gameState = "PLAYING";
      showHint = false;
    }

    function updatePhysics() {
      if (gameState !== "PLAYING") return;

      for (const piv of levelData.pivots) {
        const dx = hand.x - piv.x;
        const dy = hand.y - piv.y;
        const d = Math.hypot(dx, dy);
        const minDist = piv.r + 10;
        if (d < minDist && d > 0.001) {
          hand.x = piv.x + (dx / d) * minDist;
          hand.y = piv.y + (dy / d) * minDist;
        }
      }

      if (anchorPoints.length > 1) {
        const topAnchor = anchorPoints[anchorPoints.length - 1];
        const prevAnchor = anchorPoints[anchorPoints.length - 2];
        const piv = topAnchor.pivRef;
        if (piv) {
          const v1x = topAnchor.x - prevAnchor.x;
          const v1y = topAnchor.y - prevAnchor.y;
          const v2x = hand.x - topAnchor.x;
          const v2y = hand.y - topAnchor.y;
          const cross = v1x * v2y - v1y * v2x;
          if (cross * topAnchor.side > 280 || Math.hypot(hand.x - prevAnchor.x, hand.y - prevAnchor.y) < Math.hypot(topAnchor.x - prevAnchor.x, topAnchor.y - prevAnchor.y) - 10) {
            anchorPoints.pop();
          }
        }
      }

      const lastAnchor = anchorPoints[anchorPoints.length - 1];
      for (const piv of levelData.pivots) {
        if (lastAnchor.pivRef === piv) continue;
        const segDist = distToSegment(piv, lastAnchor, hand);
        const wrapRadius = piv.r + 7;
        const distAnchorToPiv = Math.hypot(piv.x - lastAnchor.x, piv.y - lastAnchor.y);
        const distAnchorToHand = Math.hypot(hand.x - lastAnchor.x, hand.y - lastAnchor.y);

        if (segDist < wrapRadius && distAnchorToHand > distAnchorToPiv) {
          const apx = piv.x - lastAnchor.x;
          const apy = piv.y - lastAnchor.y;
          const ahx = hand.x - lastAnchor.x;
          const ahy = hand.y - lastAnchor.y;
          const cross = apx * ahy - apy * ahx;
          const side = cross >= 0 ? 1 : -1;
          const baseAngle = Math.atan2(apy, apx);
          const offsetAngle = baseAngle + side * (Math.PI / 2);

          anchorPoints.push({
            x: piv.x + Math.cos(offsetAngle) * (piv.r + 9),
            y: piv.y + Math.sin(offsetAngle) * (piv.r + 9),
            pivRef: piv,
            side
          });
          playSound("pop");
          break;
        }
      }

      const chain = [...anchorPoints, hand];
      for (let i = 0; i < chain.length - 1; i++) {
        for (const haz of levelData.hazards) {
          if (distToSegment(haz, chain[i], chain[i + 1]) < haz.r - 4) {
            gameState = "FAIL";
            isDragging = false;
            playSound("fail");
            setTimeout(() => showModal("FAIL"), 800);
            return;
          }
        }
      }

      if (Math.hypot(hand.x - levelData.target.x, hand.y - levelData.target.y) < levelData.target.r + hand.r) {
        gameState = "RETRACTING";
        isDragging = false;
        playSound("pop");
      }

      prevHand.x = hand.x; prevHand.y = hand.y;
    }

    async function saveProgress(completedLevel) {
      const next = Math.min(1050, completedLevel + 1);
      if (next > (player.level || 1)) player.level = next;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(player));
      try {
        await set(ref(db, `leaderboard/${player.uid}`), {
          username: player.username,
          level: player.level,
          updatedAt: Date.now()
        });
        await push(ref(db, `history/${player.uid}`), {
          levelCompleted: completedLevel,
          timestamp: Date.now()
        });
      } catch (e) {}
    }

    function showModal(status) {
      const overlay = document.getElementById("resultOverlay");
      const wrap = document.getElementById("trophySvgWrap");
      const ribbon = document.getElementById("resultRibbon");
      const btn = document.getElementById("modalActionBtn");

      overlay.classList.remove("hidden");
      if (status === "WIN") {
        wrap.innerHTML = `🏆`;
        ribbon.textContent = "YOU WIN";
        ribbon.className = "RibbonText win";
        btn.textContent = "» NEXT";
        btn.onclick = () => loadLevel(currentLevelNum + 1);
      } else {
        wrap.innerHTML = `🏆😢`;
        ribbon.textContent = "FAILED";
        ribbon.className = "RibbonText fail";
        btn.textContent = "↻ Replay";
        btn.onclick = () => loadLevel(currentLevelNum);
      }
    }

    // 3D Shaded Avatars & Props (Canvas 3D Rendered Look)
    function draw3DAvatar(x, y, role, state) {
      ctx.save();
      ctx.translate(x, y);
      ctx.strokeStyle = "#111";
      ctx.lineWidth = 3;
      ctx.lineCap = "round"; ctx.lineJoin = "round";

      const breathe = Math.sin(animTick * 0.15) * 1.5;

      if (role === "cat") {
        const grad = ctx.createRadialGradient(-4, -4, 2, 0, 0, 18);
        grad.addColorStop(0, "#ffcc80"); grad.addColorStop(1, "#f57c00");
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(0, 0 + breathe, 18, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = "#f57c00";
        ctx.beginPath(); ctx.moveTo(-14, -12); ctx.lineTo(-22, -24); ctx.lineTo(-7, -16); ctx.moveTo(14, -12); ctx.lineTo(22, -24); ctx.lineTo(7, -16); ctx.fill(); ctx.stroke();
        ctx.restore();
        return;
      }

      if (role === "dog") {
        const grad = ctx.createRadialGradient(-4, -4, 2, 0, 0, 20);
        grad.addColorStop(0, "#d7ccc8"); grad.addColorStop(1, "#8d6e63");
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.ellipse(0, 0 + breathe, 20, 16, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.restore();
        return;
      }

      const bodyGrad = ctx.createLinearGradient(-8, -16, 8, 16);
      bodyGrad.addColorStop(0, role === "villain" ? "#ef5350" : (role === "boy" ? "#ffa726" : "#42a5f5"));
      bodyGrad.addColorStop(1, role === "villain" ? "#c62828" : (role === "boy" ? "#ef6c00" : "#1565c0"));
      ctx.fillStyle = bodyGrad;
      ctx.fillRect(-8, -16 + breathe, 16, 30); ctx.strokeRect(-8, -16 + breathe, 16, 30);

      ctx.fillStyle = "#fff";
      ctx.fillRect(-9, 12 + breathe, 18, 10); ctx.strokeRect(-9, 12 + breathe, 18, 10);

      ctx.beginPath();
      const runOffset = state === "WIN" ? Math.sin(animTick * 0.4) * 8 : 0;
      ctx.moveTo(-4, 22); ctx.lineTo(-10 + runOffset, 48);
      ctx.moveTo(4, 22); ctx.lineTo(10 - runOffset, 48);
      ctx.stroke();

      const headGrad = ctx.createRadialGradient(-5, -40, 2, 0, -32, 16);
      headGrad.addColorStop(0, "#ffffff"); headGrad.addColorStop(1, "#e0e0e0");
      ctx.fillStyle = headGrad;
      ctx.beginPath(); ctx.arc(0, -32, 16, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

      if (role === "bandana") {
        ctx.fillStyle = "#0288d1"; ctx.fillRect(-15, -42, 30, 6); ctx.strokeRect(-15, -42, 30, 6);
      } else if (role === "cap") {
        ctx.fillStyle = "#0277bd"; ctx.beginPath(); ctx.arc(0, -35, 15, Math.PI, 0); ctx.lineTo(22, -35); ctx.closePath(); ctx.fill(); ctx.stroke();
      } else if (role === "mask" || role === "guard") {
        ctx.fillStyle = "#111"; ctx.fillRect(-15, -38, 30, 9);
      }

      ctx.fillStyle = "#111";
      const isBlinking = Math.floor(animTick / 35) % 8 === 0;
      if (!isBlinking) {
        ctx.beginPath(); ctx.arc(-5, -34, 2, 0, Math.PI * 2); ctx.arc(5, -34, 2, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.beginPath(); ctx.moveTo(-7, -34); ctx.lineTo(-3, -34); ctx.moveTo(3, -34); ctx.lineTo(7, -34); ctx.stroke();
      }
      ctx.restore();
    }

    function draw3DObjectProp(x, y, r, kind) {
      ctx.save();
      ctx.translate(x, y);
      ctx.strokeStyle = "#222";
      ctx.lineWidth = 2.5;

      if (kind === "rock") {
        const grad = ctx.createRadialGradient(-6, -6, 2, 0, 0, 20);
        grad.addColorStop(0, "#b0bec5"); grad.addColorStop(1, "#37474f");
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.moveTo(-20, 12); ctx.lineTo(-15, -10); ctx.lineTo(5, -15); ctx.lineTo(20, -5); ctx.lineTo(22, 12);
        ctx.closePath(); ctx.fill(); ctx.stroke();
      } else if (kind === "bin") {
        ctx.fillStyle = "#66bb6a"; ctx.fillRect(-18, -22, 36, 44); ctx.strokeRect(-18, -22, 36, 44);
        ctx.fillStyle = "#2e7d32"; ctx.fillRect(-22, -28, 44, 6); ctx.strokeRect(-22, -28, 44, 6);
        ctx.font = "14px sans-serif"; ctx.textAlign = "center"; ctx.fillText("♻️", 0, 4);
      } else if (kind === "flower") {
        ctx.fillStyle = "#8d6e63"; ctx.beginPath(); ctx.moveTo(-12, 4); ctx.lineTo(12, 4); ctx.lineTo(9, 18); ctx.lineTo(-9, 18);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillStyle = "#ec407a";
        for (let a = 0; a < 5; a++) {
          const ang = (a * Math.PI * 2) / 5;
          ctx.beginPath(); ctx.arc(Math.cos(ang) * 5, -12 + Math.sin(ang) * 5, 4, 0, Math.PI * 2); ctx.fill();
        }
        ctx.fillStyle = "#ffee58"; ctx.beginPath(); ctx.arc(0, -12, 3, 0, Math.PI * 2); ctx.fill();
      } else if (kind === "fire") {
        const scale = 1 + Math.sin(animTick * 0.25 + x) * 0.08;
        ctx.scale(scale, scale);
        ctx.font = "36px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText("🔥", 0, 0);
      } else if (kind === "extinguisher") {
        ctx.fillStyle = "#f44336"; ctx.beginPath(); ctx.roundRect(-10, -12, 20, 28, 5); ctx.fill(); ctx.stroke();
        ctx.fillStyle = "#fff"; ctx.fillRect(-6, -2, 12, 8);
      } else if (kind === "chicken") {
        ctx.fillStyle = "#fb8c00"; ctx.beginPath(); ctx.ellipse(0, 2, 18, 12, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      } else if (kind === "treasure") {
        ctx.fillStyle = "#ffb300"; ctx.fillRect(-18, -12, 36, 24); ctx.strokeRect(-18, -12, 36, 24);
      } else if (kind === "purse") {
        ctx.fillStyle = "#ec407a"; ctx.beginPath(); ctx.roundRect(-15, -8, 30, 20, 5); ctx.fill(); ctx.stroke();
      } else if (kind === "cat" || kind === "dog") {
        draw3DAvatar(0, 0, kind, "PLAYING");
      } else {
        const EMAP = { diamond: "💎", key: "🔑", pizza: "🍕", crown: "👑", gift: "🎁", cactus: "🌵", balloons: "🎈", lamp: "💡", door: "🚪", hammer: "🔨" };
        ctx.font = "30px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(EMAP[kind] || "⭐", 0, 0);
      }
      ctx.restore();
    }

    function renderLoop() {
      animTick++;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (gameState === "RETRACTING") {
        const targetPt = anchorPoints[anchorPoints.length - 1];
        const dx = targetPt.x - hand.x;
        const dy = targetPt.y - hand.y;
        const dist = Math.hypot(dx, dy);
        const speed = 14;
        if (dist <= speed) {
          hand.x = targetPt.x; hand.y = targetPt.y;
          if (anchorPoints.length > 1) {
            anchorPoints.pop();
          } else {
            gameState = "WIN";
            playSound("win");
            saveProgress(currentLevelNum);
            setTimeout(() => showModal("WIN"), 800);
          }
        } else {
          hand.x += (dx / dist) * speed;
          hand.y += (dy / dist) * speed;
        }
        levelData.target.x = hand.x;
        levelData.target.y = hand.y;
      }

      ctx.save();
      ctx.strokeStyle = "#444"; ctx.lineWidth = 2.5;
      if (levelData.ledge) { ctx.beginPath(); ctx.moveTo(levelData.ledge.x1, levelData.ledge.y1); ctx.lineTo(levelData.ledge.x2, levelData.ledge.y2); ctx.stroke(); }
      if (levelData.table) {
        const t = levelData.table;
        ctx.fillStyle = "#b0bec5"; ctx.fillRect(t.x, t.y, t.w, 5); ctx.strokeRect(t.x, t.y, t.w, 5);
      }
      if (levelData.streetFloor) { ctx.fillStyle = "rgba(180, 190, 200, 0.45)"; ctx.fillRect(0, 260, canvas.width, 160); }
      if (levelData.bench) { ctx.fillStyle = "#bcaaa4"; ctx.fillRect(levelData.bench.x, levelData.bench.y, levelData.bench.w, 8); ctx.strokeRect(levelData.bench.x, levelData.bench.y, levelData.bench.w, 8); }
      ctx.restore();

      if (showHint) {
        ctx.save();
        ctx.setLineDash([8, 6]);
        ctx.strokeStyle = "#00e676";
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.moveTo(levelData.thief.shoulderX, levelData.thief.shoulderY);
        levelData.pivots.forEach(p => ctx.lineTo(p.x, p.y));
        ctx.lineTo(levelData.target.x, levelData.target.y);
        ctx.stroke();
        ctx.restore();
      }

      draw3DAvatar(levelData.thief.x, levelData.thief.y, levelData.thiefStyle || "normal", gameState);

      levelData.pivots.forEach(p => draw3DObjectProp(p.x, p.y, p.r, p.kind));

      levelData.hazards.forEach(h => {
        if (["cat", "dog", "girl", "boy", "guard", "villain"].includes(h.kind)) {
          draw3DAvatar(h.x, h.y, h.kind, gameState);
        } else if (h.kind === "couple") {
          draw3DAvatar(h.x - 16, h.y, "boy", gameState);
          draw3DAvatar(h.x + 16, h.y, "girl", gameState);
        } else {
          draw3DObjectProp(h.x, h.y, h.r, h.kind);
        }
      });

      draw3DObjectProp(levelData.target.x, levelData.target.y, levelData.target.r, levelData.target.kind);

      // Elastic Arm
      ctx.save();
      ctx.lineWidth = 4.5; ctx.lineCap = "round"; ctx.lineJoin = "round";
      ctx.strokeStyle = (gameState === "RETRACTING" || gameState === "WIN") ? "#00e676" : (gameState === "FAIL" ? "#ff1744" : "#111");
      ctx.beginPath();
      ctx.moveTo(anchorPoints[0].x, anchorPoints[0].y);
      for (let i = 1; i < anchorPoints.length; i++) {
        ctx.lineTo(anchorPoints[i].x, anchorPoints[i].y);
      }
      ctx.lineTo(hand.x, hand.y);
      ctx.stroke();

      const prevPt = anchorPoints[anchorPoints.length - 1];
      const handAngle = Math.atan2(hand.y - prevPt.y, hand.x - prevPt.x);
      ctx.translate(hand.x, hand.y); ctx.rotate(handAngle);
      ctx.fillStyle = "#fff"; ctx.strokeStyle = "#111"; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      for (let f = -1; f <= 1; f++) {
        ctx.beginPath(); ctx.roundRect(5, f * 4 - 2, 8, 3.5, 2); ctx.fill(); ctx.stroke();
      }
      ctx.restore();

      requestAnimationFrame(renderLoop);
    }

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (cx - rect.left) * (canvas.width / rect.width),
        y: (cy - rect.top) * (canvas.height / rect.height)
      };
    }

    canvas.addEventListener("pointerdown", (e) => {
      if (gameState !== "PLAYING") return;
      const pos = getPos(e);
      if (Math.hypot(pos.x - hand.x, pos.y - hand.y) < 45) isDragging = true;
    });

    window.addEventListener("pointermove", (e) => {
      if (!isDragging || gameState !== "PLAYING") return;
      const pos = getPos(e);
      const steps = 4;
      const startX = hand.x; const startY = hand.y;
      const targetX = Math.max(16, Math.min(canvas.width - 16, pos.x));
      const targetY = Math.max(16, Math.min(canvas.height - 16, pos.y));
      for (let s = 1; s <= steps; s++) {
        if (gameState !== "PLAYING") break;
        hand.x = startX + ((targetX - startX) * s) / steps;
        hand.y = startY + ((targetY - startY) * s) / steps;
        updatePhysics();
      }
    });

    window.addEventListener("pointerup", () => { isDragging = false; });

    // Home buttons link to index.html?menu=1
    document.getElementById("homeBtn").onclick = () => {
      window.location.href = "index.html?menu=1";
    };
    document.getElementById("modalHomeBtn").onclick = () => {
      window.location.href = "index.html?menu=1";
    };

    document.getElementById("restartBtn").onclick = () => loadLevel(currentLevelNum);

    const levelsModal = document.getElementById("levelsModal");
    document.getElementById("levelsModalBtn").onclick = () => {
      const grid = document.getElementById("modalLevelsGrid");
      grid.innerHTML = "";
      const unlocked = player.level || 1;
      for (let i = 1; i <= 1050; i++) {
        const btn = document.createElement("div");
        const isLocked = i > unlocked;
        btn.className = "grid-lvl-btn" + (isLocked ? " locked" : "") + (i === currentLevelNum ? " current" : "");
        btn.textContent = i;
        if (!isLocked) {
          btn.onclick = () => {
            levelsModal.classList.add("hidden");
            loadLevel(i);
          };
        }
        grid.appendChild(btn);
      }
      levelsModal.classList.remove("hidden");
    };
    document.getElementById("closeModalBtn").onclick = () => levelsModal.classList.add("hidden");

    document.getElementById("hintBtn").onclick = () => {
      const adModal = document.getElementById("adModal");
      const adIframe = document.getElementById("adIframe");
      adIframe.src = "../../ad.html";
      adModal.classList.remove("hidden");
    };

    window.addEventListener("message", (event) => {
      if (event.data === "AD_COMPLETED") {
        const adModal = document.getElementById("adModal");
        const adIframe = document.getElementById("adIframe");
        adModal.classList.add("hidden");
        adIframe.src = "";
        showHint = true;
      }
    });

    loadLevel(currentLevelNum);
    requestAnimationFrame(renderLoop);
  </script>
</body>
</html>
