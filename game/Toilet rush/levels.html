<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Select Level - Toilet Rush</title>
  <style>
    * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #121212;
      display: flex; justify-content: center; align-items: center;
      font-family: 'Arial Rounded MT Bold', sans-serif;
    }
    #game-wrap {
      width: 100%; max-width: 400px;
      height: 100%; max-height: 800px;
      background: #ffffff;
      display: flex; flex-direction: column;
      padding: 20px 16px;
    }
    .menu-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px;
    }
    .home-btn {
      width: 44px; height: 44px;
      background: #f5d7a1; border: 2.5px solid #6e4427;
      border-radius: 50%; display: flex; justify-content: center; align-items: center;
      font-size: 22px; cursor: pointer;
    }
    .lvl-grid {
      display: grid; grid-template-columns: repeat(5, 1fr);
      gap: 10px; overflow-y: auto; padding: 4px;
    }
    .lvl-cell {
      background: #359be8; color: #fff; border: none;
      border-radius: 12px; height: 52px; font-size: 18px;
      font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 #1f6ca6;
    }
    .lvl-cell.active { background: #2ab807; box-shadow: 0 4px 0 #197004; }
  </style>
</head>
<body>

<div id="game-wrap">
  <div class="menu-header">
    <div class="home-btn" onclick="window.location.href='index.html'">⬅️</div>
    <h2>50 Levels</h2>
    <div style="width:44px;"></div>
  </div>
  <div class="lvl-grid" id="lvl-grid"></div>
</div>

<script>
  const grid = document.getElementById('lvl-grid');
  const savedLevel = parseInt(localStorage.getItem('toiletRushLevel') || '1', 10);

  for (let i = 1; i <= 50; i++) {
    const btn = document.createElement('button');
    btn.className = 'lvl-cell' + (i === savedLevel ? ' active' : '');
    btn.innerText = i;
    btn.onclick = () => {
      localStorage.setItem('toiletRushLevel', i);
      window.location.href = 'index.html?level=' + i;
    };
    grid.appendChild(btn);
  }
</script>
</body>
</html>
