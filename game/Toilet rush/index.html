<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Toilet Rush - 50 Levels</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Arial Rounded MT Bold', 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      touch-action: none;
    }
    #game-wrap {
      position: relative;
      width: 100vw;
      max-width: 400px;
      height: 100vh;
      max-height: 800px;
      background-color: #ffffff;
      background-image: 
        linear-gradient(to right, #efefef 1px, transparent 1px),
        linear-gradient(to bottom, #efefef 1px, transparent 1px);
      background-size: 22px 22px;
      overflow: hidden;
      box-shadow: 0 10px 35px rgba(0,0,0,0.6);
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      z-index: 1;
    }
    .top-bar {
      position: absolute;
      top: 18px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-left: 16px;
      z-index: 10;
      pointer-events: none;
    }
    .home-btn {
      width: 46px;
      height: 46px;
      background: #f5d7a1;
      border: 2.5px solid #6e4427;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 22px;
      cursor: pointer;
      pointer-events: auto;
      box-shadow: 0 3px 0 #6e4427;
    }
    .home-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #6e4427; }
    .more-badge {
      background: linear-gradient(90deg, #d834eb, #b5179e);
      color: #fff;
      padding: 6px 14px 6px 16px;
      border-radius: 25px 0 0 25px;
      font-size: 13px;
      font-weight: 900;
      text-align: center;
      cursor: pointer;
      pointer-events: auto;
      box-shadow: 0 3px 8px rgba(0,0,0,0.2);
    }
    .status-bar {
      position: absolute;
      top: 78px;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 35px;
      z-index: 10;
      pointer-events: none;
    }
    .timer-wrap, .level-wrap {
      font-size: 23px;
      color: #222;
      font-weight: 900;
    }
    .hint-btn {
      position: absolute;
      bottom: 45px;
      left: 50%;
      transform: translateX(-50%);
      width: 190px;
      height: 56px;
      background: linear-gradient(180deg, #63c7ff 0%, #359be8 100%);
      border: 3px solid #ffffff;
      border-radius: 35px;
      box-shadow: 0 5px 0 #2172b5, 0 8px 15px rgba(0,0,0,0.22);
      color: #fff;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 1px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      z-index: 10;
    }
    .hint-btn:active { transform: translateX(-50%) translateY(3px); box-shadow: 0 2px 0 #2172b5; }
    .modal {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 30;
    }
    .modal-home {
      position: absolute;
      top: 130px;
      right: 25px;
      width: 44px;
      height: 44px;
      background: #ffeb3b;
      border: 3px solid #222;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 22px;
      cursor: pointer;
    }
    .trophy-box { text-align: center; margin-bottom: 30px; }
    .trophy-emoji { font-size: 85px; }
    .banner {
      margin-top: -10px;
      padding: 10px 40px;
      font-size: 30px;
      font-weight: 900;
      color: #fff;
      border-radius: 30px;
      text-shadow: 0 3px 0 rgba(0,0,0,0.35);
      letter-spacing: 2px;
      border: 3px solid rgba(255,255,255,0.4);
    }
    .banner.win { background: linear-gradient(90deg, #d81b7a, #ff4da6, #d81b7a); }
    .banner.fail { background: linear-gradient(90deg, #4b3296, #7554d4, #4b3296); }
    .green-btn {
      width: 185px;
      height: 60px;
      background: linear-gradient(180deg, #5ef527 0%, #2ab807 100%);
      border: 3px solid #a6ff78;
      border-radius: 18px;
      box-shadow: 0 6px 0 #1b7a03;
      color: #fff;
      font-size: 24px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .green-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #1b7a03; }
  </style>
</head>
<body>

<div id="game-wrap">
  <div class="top-bar">
    <div class="home-btn" onclick="window.location.href='levels.html'">🏠</div>
    <div class="more-badge" onclick="window.location.href='levels.html'">🎮<br>MORE</div>
  </div>

  <div class="status-bar">
    <div class="timer-wrap">⏰ <span id="time-val">30s</span></div>
    <div class="level-wrap">Level: <span id="lvl-val">1</span></div>
  </div>

  <canvas id="canvas" width="390" height="780"></canvas>

  <button class="hint-btn" onclick="toggleHint()">HINT 📺</button>

  <div class="modal" id="modal">
    <div class="modal-home" onclick="window.location.href='levels.html'">🏠</div>
    <div class="trophy-box">
      <div class="trophy-emoji" id="m-icon">🏆</div>
      <div class="banner win" id="m-banner">YOU WIN</div>
    </div>
    <button class="green-btn" id="m-btn" onclick="handleModalBtn()">» NEXT</button>
  </div>
</div>

<script src="levels.js"></script>
<script src="script.js"></script>
</body>
</html>
