<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Toilet Rush - 50 Levels</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Arial Rounded MT Bold', 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      touch-action: none;
    }
    #game-wrap {
      position: relative;
      width: 100%;
      max-width: 400px;
      height: 100%;
      max-height: 800px;
      background-color: #ffffff;
      background-image: 
        linear-gradient(to right, #efefef 1px, transparent 1px),
        linear-gradient(to bottom, #efefef 1px, transparent 1px);
      background-size: 22px 22px;
      overflow: hidden;
      box-shadow: 0 10px 35px rgba(0,0,0,0.6);
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      z-index: 1;
    }
    /* Top Header Controls */
    .top-bar {
      position: absolute;
      top: 18px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-left: 16px;
      z-index: 10;
      pointer-events: none;
    }
    .home-btn {
      width: 46px;
      height: 46px;
      background: #f5d7a1;
      border: 2.5px solid #6e4427;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 22px;
      cursor: pointer;
      pointer-events: auto;
      box-shadow: 0 3px 0 #6e4427;
    }
    .home-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #6e4427; }
    .more-badge {
      background: linear-gradient(90deg, #d834eb, #b5179e);
      color: #fff;
      padding: 6px 14px 6px 16px;
      border-radius: 25px 0 0 25px;
      font-size: 13px;
      font-weight: 900;
      text-align: center;
      cursor: pointer;
      pointer-events: auto;
      box-shadow: 0 3px 8px rgba(0,0,0,0.2);
    }
    /* Status Bar (Timer & Level) */
    .status-bar {
      position: absolute;
      top: 78px;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 35px;
      z-index: 10;
      pointer-events: none;
    }
    .timer-wrap, .level-wrap {
      font-size: 23px;
      color: #222;
      font-weight: 900;
    }

    .hint-btn {
      position: absolute;
      bottom: 45px;
      left: 50%;
      transform: translateX(-50%);
      width: 190px;
      height: 5
