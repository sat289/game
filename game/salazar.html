<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Salazar - Alchemy Link Puzzle</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Fredoka:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --gold-light: #ffe875;
    --gold-mid: #e6ac27;
    --gold-dark: #8c5808;
    --slate-bg: #1e2733;
    --slate-tile: #2b394a;
    --slate-tile-alt: #253241;
  }

  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0d1218;
    font-family: 'Fredoka', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  #app {
    position: relative;
    width: min(100vw, 480px);
    height: 100dvh;
    overflow: hidden;
    background: #1b2430;
    box-shadow: 0 0 50px rgba(0,0,0,0.9);
  }

  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Fade transition overlay */
  #fadeOverlay {
    position: absolute;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
    z-index: 100;
  }
  #fadeOverlay.active {
    opacity: 1;
    pointer-events: auto;
  }

  /* Active Booster Banner */
  #boosterPrompt {
    position: absolute;
    top: 84px;
    left: 50%;
    transform: translateX(-50%);
    background: linear-gradient(180deg, #2d3c4f, #1a2430);
    border: 2px solid #f5be36;
    color: #ffe875;
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 800;
    box-shadow: 0 6px 20px rgba(0,0,0,0.7);
    z-index: 30;
    display: none;
    align-items: center;
    gap: 10px;
    white-space: nowrap;
  }
  #boosterPrompt button {
    background: #c93b3b;
    border: 1px solid #ff9494;
    color: #fff;
    border-radius: 10px;
    padding: 3px 9px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="app">
  <canvas id="gameCanvas"></canvas>
  <div id="boosterPrompt">
    <span id="boosterPromptText">Tap any tile to remove it!</span>
    <button id="cancelBoosterBtn">Cancel</button>
  </div>
  <div id="fadeOverlay"></div>
</div>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const fadeOverlay = document.getElementById('fadeOverlay');
  const boosterPrompt = document.getElementById('boosterPrompt');
  const cancelBoosterBtn = document.getElementById('cancelBoosterBtn');

  let W = 0, H = 0, dpr = 1;

  // Game States: 'MENU' | 'BOOSTERS' | 'GAME' | 'PAUSE'
  let state = 'MENU';
  let previousState = 'MENU';
  let soundEnabled = true;

  // Player Economy & Inventory
  let coins = 125;
  let displayCoins = 125;
  let boosters = {
    remove: 1,
    magnet: 0,
    sorter: 0,
    undo: 1
  };
  let activeBoosterMode = null; // 'remove'

  const BOOSTER_META = [
    { key: 'remove', title: '-1 Element', desc: 'Removes any item', cost: 200 },
    { key: 'magnet', title: 'Magnet', desc: 'Convert all items\ninto advanced', cost: 400 },
    { key: 'sorter', title: 'Sorter', desc: 'Sort all elements\non board.', cost: 800 },
    { key: 'undo',   title: 'Extra Undo', desc: 'Gives extra undo.', cost: 1000 }
  ];

  // 13 Alchemy Elements Progression
  const ELEMENTS = [
    null,
    { level: 1,  name: 'Clover',     color: '#5ec938', glow: '#98ff66' },
    { level: 2,  name: 'Mushroom',   color: '#e83865', glow: '#ff7a9c' },
    { level: 3,  name: 'Skull',      color: '#d9c49e', glow: '#fff0d1' },
    { level: 4,  name: 'Stone',      color: '#7546b8', glow: '#b88cff' },
    { level: 5,  name: 'Caldron',    color: '#52e038', glow: '#8aff73' },
    { level: 6,  name: 'Potion',     color: '#ff3b9a', glow: '#ff94c8' },
    { level: 7,  name: 'Crystal',    color: '#2dd8ff', glow: '#9eeeff' },
    { level: 8,  name: 'Scroll',     color: '#f5b82e', glow: '#ffe48f' },
    { level: 9,  name: 'Grimoire',   color: '#9d4edd', glow: '#e0aaff' },
    { level: 10, name: 'Familiar',   color: '#ffd166', glow: '#fff3b0' },
    { level: 11, name: 'Arcane Orb', color: '#06d6a0', glow: '#80ffdb' },
    { level: 12, name: 'Crown',      color: '#ff9f1c', glow: '#ffbf69' },
    { level: 13, name: 'Salazar',    color: '#ff4d6d', glow: '#ffb3c1' }
  ];

  // Grid Configuration (4 columns x 5 rows)
  const COLS = 4;
  const ROWS = 5;
  let grid = []; // grid[c][r] = { level, yOffset, vy, scale, pulse, starburst }
  let undoStack = [];
  let discovered = new Set([1, 2]); // Clover and Mushroom known at start

  // Active Drag Chain
  let chain = []; // [{c, r}]
  let isDragging = false;
  let pointerPos = { x: 0, y: 0 };
  let isAnimatingBoard = false;

  // Visual Effects
  let particles = [];
  let floatingTexts = [];
  let cauldronBubbles = [];
  let dustMotes = [];
  let activeTooltip = null; // { c, r, name, level, timer }
  let starbursts = []; // { x, y, radius, alpha, angle, timer }

  // Layout metrics
  let boardRect = { x: 0, y: 0, w: 0, h: 0, cell: 0 };
  let uiButtons = [];

  // Web Audio Synthesizer
  let audioCtx = null;
  function playTone(freq, type = 'sine', duration = 0.12, vol = 0.12, slideTo = null) {
    if (!soundEnabled) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, now + duration);
      gain.gain.setValueAtTime(vol, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + duration + 0.02);
    } catch (_) {}
  }

  function sfxSelect(chainLen) {
    const base = 320 + Math.min(chainLen, 14) * 45;
    playTone(base, 'triangle', 0.11, 0.14, base * 1.15);
  }
  function sfxMerge(level) {
    playTone(400 + level * 60, 'sine', 0.22, 0.18, 880 + level * 80);
    setTimeout(() => playTone(660 + level * 70, 'triangle', 0.25, 0.15, 1100), 70);
  }
  function sfxDiscovery() {
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
      setTimeout(() => playTone(f, 'triangle', 0.22, 0.16), i * 80);
    });
  }
  function sfxClick() {
    playTone(520, 'sine', 0.08, 0.12, 380);
  }
  function sfxCoin() {
    playTone(987.77, 'sine', 0.09, 0.1, 1318.5);
  }

  // Initialize ambient particles
  function initAmbient() {
    cauldronBubbles = [];
    for (let i = 0; i < 18; i++) {
      cauldronBubbles.push({
        x: (Math.random() - 0.5) * 90,
        y: Math.random() * -120,
        r: 3 + Math.random() * 6,
        vy: 25 + Math.random() * 40,
        vx: (Math.random() - 0.5) * 14,
        alpha: 0.3 + Math.random() * 0.7
      });
    }
    dustMotes = [];
    for (let i = 0; i < 32; i++) {
      dustMotes.push({
        x: Math.random(),
        y: Math.random(),
        r: 1 + Math.random() * 2.2,
        vx: 0.008 + Math.random() * 0.015,
        vy: 0.01 + Math.random() * 0.02,
        phase: Math.random() * Math.PI * 2
      });
    }
  }

  function resize() {
    const rect = document.getElementById('app').getBoundingClientRect();
    W = rect.width;
    H = rect.height;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Calculate 4x5 board dimensions
    const maxBoardW = W * 0.88;
    const maxBoardH = H * 0.68;
    const cell = Math.floor(Math.min(maxBoardW / COLS, maxBoardH / ROWS));
    const bw = cell * COLS;
    const bh = cell * ROWS;
    boardRect = {
      cell,
      w: bw,
      h: bh,
      x: Math.round((W - bw) / 2),
      y: Math.round(H - bh - Math.max(36, H * 0.06))
    };
  }

  window.addEventListener('resize', resize);

  // Switch screens with smooth black fade exactly like 00:01 & 00:03 in video
  function transitionTo(nextState, callback) {
    sfxClick();
    fadeOverlay.classList.add('active');
    setTimeout(() => {
      previousState = state;
      state = nextState;
      if (callback) callback();
      fadeOverlay.classList.remove('active');
    }, 320);
  }

  // Initialize Board with cascading drop-in animation
  function initBoard() {
    grid = Array.from({ length: COLS }, () => Array(ROWS).fill(null));
    undoStack = [];
    chain = [];
    activeTooltip = null;
    isAnimatingBoard = true;

    // Match the initial layout vibe from the video (mix of Clovers and Mushrooms)
    for (let c = 0; c < COLS; c++) {
      for (let r = 0; r < ROWS; r++) {
        const lvl = Math.random() < 0.58 ? 1 : 2;
        grid[c][r] = {
          level: lvl,
          yOffset: -boardRect.h - (ROWS - r) * boardRect.cell * 0.8 - c * 25,
          vy: 0,
          scale: 1,
          pulse: 0
        };
      }
    }
  }

  function cloneGridState() {
    return {
      coins,
      grid: grid.map(col => col.map(cell => ({ level: cell.level })))
    };
  }

  function saveUndoState() {
    undoStack.push(cloneGridState());
    if (undoStack.length > 10) undoStack.shift();
  }

  function performUndo() {
    if (boosters.undo <= 0 || undoStack.length === 0 || isAnimatingBoard) return;
    sfxClick();
    const prev = undoStack.pop();
    boosters.undo--;
    coins = prev.coins;
    displayCoins = coins;
    for (let c = 0; c < COLS; c++) {
      for (let r = 0; r < ROWS; r++) {
        grid[c][r] = {
          level: prev.grid[c][r].level,
          yOffset: -40,
          vy: 0,
          scale: 0.85,
          pulse: 0
        };
      }
    }
    isAnimatingBoard = true;
  }

  // Boosters Logic
  function activateBooster(key) {
    if (key === 'undo') {
      // Extra undo is passive or can be bought
      return;
    }
    if (boosters[key] <= 0) return;

    if (key === 'remove') {
      boosters.remove--;
      activeBoosterMode = 'remove';
      boosterPrompt.style.display = 'flex';
      if (state === 'BOOSTERS') transitionTo('GAME');
    } else if (key === 'magnet') {
      boosters.magnet--;
      const upgradeAction = () => {
        saveUndoState();
        // Find lowest level currently on board and upgrade all of them by +1
        let minLvl = 99;
        for (let c = 0; c < COLS; c++) {
          for (let r = 0; r < ROWS; r++) {
            if (grid[c][r] && grid[c][r].level < minLvl) minLvl = grid[c][r].level;
          }
        }
        for (let c = 0; c < COLS; c++) {
          for (let r = 0; r < ROWS; r++) {
            if (grid[c][r] && grid[c][r].level === minLvl) {
              grid[c][r].level = Math.min(13, minLvl + 1);
              grid[c][r].scale = 1.35;
              const pos = getCellCenter(c, r);
              spawnStarburst(pos.x, pos.y);
              spawnParticles(pos.x, pos.y, '#ffe875', 10);
            }
          }
        }
        sfxMerge(minLvl + 1);
      };
      if (state === 'BOOSTERS') {
        transitionTo('GAME', () => {
          if (!grid.length) initBoard();
          setTimeout(upgradeAction, 350);
        });
      } else {
        upgradeAction();
      }
    } else if (key === 'sorter') {
      boosters.sorter--;
      const sortAction = () => {
        saveUndoState();
        let allLevels = [];
        for (let c = 0; c < COLS; c++) {
          for (let r = 0; r < ROWS; r++) {
            allLevels.push(grid[c][r].level);
          }
        }
        allLevels.sort((a, b) => a - b);
        let idx = 0;
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            grid[c][r].level = allLevels[idx++];
            grid[c][r].scale = 1.25;
            const pos = getCellCenter(c, r);
            spawnParticles(pos.x, pos.y, '#70e3ff', 5);
          }
        }
        sfxDiscovery();
      };
      if (state === 'BOOSTERS') {
        transitionTo('GAME', () => {
          if (!grid.length) initBoard();
          setTimeout(sortAction, 350);
        });
      } else {
        sortAction();
      }
    }
  }

  cancelBoosterBtn.addEventListener('click', () => {
    if (activeBoosterMode === 'remove') {
      boosters.remove++;
      activeBoosterMode = null;
      boosterPrompt.style.display = 'none';
    }
  });

  function getCellCenter(c, r) {
    return {
      x: boardRect.x + (c + 0.5) * boardRect.cell,
      y: boardRect.y + (r + 0.5) * boardRect.cell
    };
  }

  function getCellFromPoint(x, y) {
    if (
      x < boardRect.x ||
      x > boardRect.x + boardRect.w ||
      y < boardRect.y ||
      y > boardRect.y + boardRect.h
    ) return null;
    const c = Math.floor((x - boardRect.x) / boardRect.cell);
    const r = Math.floor((y - boardRect.y) / boardRect.cell);
    if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return null;
    // Check distance to center so diagonal passes don't accidentally clip corners
    const center = getCellCenter(c, r);
    const dist = Math.hypot(x - center.x, y - center.y);
    if (dist > boardRect.cell * 0.48) return null;
    return { c, r };
  }

  function areAdjacent(a, b) {
    const dc = Math.abs(a.c - b.c);
    const dr = Math.abs(a.r - b.r);
    return (dc <= 1 && dr <= 1) && !(dc === 0 && dr === 0);
  }

  function spawnParticles(x, y, color, count = 16) {
    for (let i = 0; i < count; i++) {
      const ang = Math.random() * Math.PI * 2;
      const spd = 40 + Math.random() * 140;
      particles.push({
        x, y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd,
        r: 2.5 + Math.random() * 4,
        color,
        life: 0.45 + Math.random() * 0.35,
        maxLife: 0.8
      });
    }
  }

  function spawnStarburst(x, y) {
    starbursts.push({
      x, y,
      radius: boardRect.cell * 0.68,
      angle: 0,
      life: 0.55,
      maxLife: 0.55
    });
  }

  function spawnFloatingScore(x, y, amount) {
    floatingTexts.push({
      x, y,
      startX: x,
      startY: y,
      targetX: 95,
      targetY: 38,
      text: `+${amount}`,
      amount,
      progress: 0,
      phase: 'RISE' // 'RISE' then 'FLY'
    });
  }

  // Handle completing a chain of 2+ matching items
  function resolveChain() {
    if (chain.length < 2) {
      chain = [];
      return;
    }

    saveUndoState();

    const last = chain[chain.length - 1];
    const baseLevel = grid[last.c][last.r].level;
    const nextLevel = Math.min(13, baseLevel + 1);
    const pointsGained = chain.length * baseLevel;

    // Remove all linked items except the last one
    for (let i = 0; i < chain.length - 1; i++) {
      const { c, r } = chain[i];
      const pos = getCellCenter(c, r);
      spawnParticles(pos.x, pos.y, ELEMENTS[baseLevel].glow, 12);
      grid[c][r] = null;
    }

    // Upgrade the last tile
    const lastPos = getCellCenter(last.c, last.r);
    grid[last.c][last.r] = {
      level: nextLevel,
      yOffset: 0,
      vy: 0,
      scale: 1.42,
      pulse: 1
    };

    spawnStarburst(lastPos.x, lastPos.y);
    spawnParticles(lastPos.x, lastPos.y, '#fff5b8', 22);
    spawnFloatingScore(lastPos.x, lastPos.y - boardRect.cell * 0.3, pointsGained);
    sfxMerge(nextLevel);

    const isNewDiscovery = !discovered.has(nextLevel);
    if (isNewDiscovery) {
      discovered.add(nextLevel);
      sfxDiscovery();
    }

    chain = [];
    isAnimatingBoard = true;

    // Brief pause so player sees the glowing merged item before gravity drops tiles
    setTimeout(() => {
      applyGravityAndRefill(isNewDiscovery ? nextLevel : null);
    }, 210);
  }

  function applyGravityAndRefill(newlyDiscoveredLevel) {
    let discoveredCell = null;

    for (let c = 0; c < COLS; c++) {
      let writeRow = ROWS - 1;
      for (let r = ROWS - 1; r >= 0; r--) {
        if (grid[c][r] !== null) {
          if (writeRow !== r) {
            const fallDist = (writeRow - r) * boardRect.cell;
            grid[c][writeRow] = grid[c][r];
            grid[c][writeRow].yOffset = -fallDist;
            grid[c][writeRow].vy = 0;
            grid[c][r] = null;
          }
          if (newlyDiscoveredLevel && grid[c][writeRow].level === newlyDiscoveredLevel && !discoveredCell) {
            discoveredCell = { c, r: writeRow };
          }
          writeRow--;
        }
      }

      // Fill empty top slots with new Clovers (Lv 1) and Mushrooms (Lv 2)
      const emptyCount = writeRow + 1;
      for (let r = writeRow; r >= 0; r--) {
        const spawnLvl = Math.random() < 0.65 ? 1 : 2;
        grid[c][r] = {
          level: spawnLvl,
          yOffset: -(emptyCount + (writeRow - r) + 0.6) * boardRect.cell,
          vy: 0,
          scale: 1,
          pulse: 0
        };
      }
    }

    if (discoveredCell) {
      const elem = ELEMENTS[newlyDiscoveredLevel];
      activeTooltip = {
        c: discoveredCell.c,
        r: discoveredCell.r,
        name: elem.name,
        level: elem.level,
        timer: 2.8
      };
    }
  }

  // ==========================================
  // DRAWING HELPERS & CUSTOM VECTOR ARTWORK
  // ==========================================

  function drawOctagonButton(cx, cy, radius, renderIconFn, badgeCount = null) {
    ctx.save();
    const sides = 8;
    const drawPoly = (r) => {
      ctx.beginPath();
      for (let i = 0; i < sides; i++) {
        const a = (i * 2 * Math.PI) / sides + Math.PI / 8;
        const px = cx + Math.cos(a) * r;
        const py = cy + Math.sin(a) * r;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
    };

    // Drop shadow
    ctx.shadowColor = 'rgba(0,0,0,0.65)';
    ctx.shadowBlur = 8;
    ctx.shadowOffsetY = 4;

    // Outer Gold Rim
    const gradGold = ctx.createLinearGradient(cx, cy - radius, cx, cy + radius);
    gradGold.addColorStop(0, '#ffe875');
    gradGold.addColorStop(0.5, '#d4941c');
    gradGold.addColorStop(1, '#784804');
    drawPoly(radius);
    ctx.fillStyle = gradGold;
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = '#3b2202';
    ctx.stroke();

    // Inner Dark Slate Octagon
    const innerR = radius * 0.8;
    const gradInner = ctx.createRadialGradient(cx, cy - innerR * 0.3, 2, cx, cy, innerR);
    gradInner.addColorStop(0, '#3a4d63');
    gradInner.addColorStop(1, '#1d2733');
    drawPoly(innerR);
    ctx.fillStyle = gradInner;
    ctx.fill();
    ctx.strokeStyle = '#10161d';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Inner Icon
    if (renderIconFn) renderIconFn(cx, cy, radius * 0.42);

    // Red Notification Badge (like Undo count '1' in video)
    if (badgeCount !== null && badgeCount > 0) {
      const bx = cx + radius * 0.45;
      const by = cy + radius * 0.58;
      ctx.beginPath();
      ctx.arc(bx, by, 10, 0, Math.PI * 2);
      ctx.fillStyle = '#d92b2b';
      ctx.fill();
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = '#ff9c9c';
      ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.font = '800 11px Fredoka';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(badgeCount), bx, by + 0.5);
    }

    ctx.restore();
  }

  // Draw Dungeon Brick Wall + Sunbeams + Cobwebs
  function drawDungeonBackground(now, withSunbeams = true) {
    // Base dark blue-grey gradient
    const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
    bgGrad.addColorStop(0, '#161e29');
    bgGrad.addColorStop(0.5, '#202b38');
    bgGrad.addColorStop(1, '#141b24');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    // Brick pattern
    const brickH = 34;
    const brickW = 76;
    ctx.lineWidth = 2.5;
    for (let row = 0; row * brickH < H; row++) {
      const y = row * brickH;
      const offset = (row % 2) * (brickW / 2);
      for (let col = -1; col * brickW < W + brickW; col++) {
        const x = col * brickW + offset;
        // Subtle shade variation per brick
        const shade = ((row * 7 + col * 13) % 5) * 2;
        ctx.fillStyle = `rgb(${31 + shade}, ${42 + shade}, ${54 + shade})`;
        ctx.fillRect(x + 2, y + 2, brickW - 4, brickH - 4);
        // Top highlight on brick
        ctx.fillStyle = 'rgba(255,255,255,0.04)';
        ctx.fillRect(x + 2, y + 2, brickW - 4, 3);
      }
    }

    // Diagonal Warm Sunbeams from top-left (like 00:04 in video)
    if (withSunbeams) {
      ctx.save();
      const rayGrad = ctx.createLinearGradient(0, 0, W * 0.85, H * 0.65);
      rayGrad.addColorStop(0, 'rgba(255, 240, 175, 0.16)');
      rayGrad.addColorStop(0.5, 'rgba(255, 230, 140, 0.06)');
      rayGrad.addColorStop(1, 'rgba(255, 230, 140, 0)');
      ctx.fillStyle = rayGrad;

      const beams = [
        [0, 0, W * 0.25, 0, W * 0.95, H * 0.55, W * 0.55, H * 0.65],
        [0, H * 0.05, W * 0.12, 0, W * 0.65, H * 0.72, W * 0.25, H * 0.78]
      ];
      for (const b of beams) {
        ctx.beginPath();
        ctx.moveTo(b[0], b[1]);
        ctx.lineTo(b[2], b[3]);
        ctx.lineTo(b[4], b[5]);
        ctx.lineTo(b[6], b[7]);
        ctx.closePath();
        ctx.fill();
      }

      // Floating golden dust motes in the sunbeams
      for (const m of dustMotes) {
        m.x = (m.x + m.vx * 0.004) % 1;
        m.y = (m.y + m.vy * 0.004) % 0.7;
        const alpha = (0.25 + 0.25 * Math.sin(now * 0.003 + m.phase)) * (1 - m.y);
        ctx.fillStyle = `rgba(255, 238, 170, ${alpha})`;
        ctx.beginPath();
        ctx.arc(m.x * W, m.y * H, m.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    // Corner Cobwebs
    drawCobweb(0, H, 95, -Math.PI / 2, 0);
    drawCobweb(W, H, 95, -Math.PI, -Math.PI / 2);
    if (state === 'MENU') {
      drawCobweb(0, 0, 120, 0, Math.PI / 2);
    }
  }

  function drawCobweb(ox, oy, radius, startAng, endAng) {
    ctx.save();
    ctx.strokeStyle = 'rgba(200, 220, 240, 0.14)';
    ctx.lineWidth = 1.2;
    const strands = 6;
    for (let i = 0; i <= strands; i++) {
      const a = startAng + (i / strands) * (endAng - startAng);
      ctx.beginPath();
      ctx.moveTo(ox, oy);
      ctx.lineTo(ox + Math.cos(a) * radius, oy + Math.sin(a) * radius);
      ctx.stroke();
    }
    for (let ring = 1; ring <= 4; ring++) {
      const r = (ring / 4) * radius;
      ctx.beginPath();
      for (let i = 0; i <= strands; i++) {
        const a = startAng + (i / strands) * (endAng - startAng);
        const px = ox + Math.cos(a) * r;
        const py = oy + Math.sin(a) * r;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.quadraticCurveTo(ox + Math.cos(a - 0.12) * (r * 0.9), oy + Math.sin(a - 0.12) * (r * 0.9), px, py);
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  // Draw the 13 Alchemy Items (Clover, Mushroom, Skull, Stone, Caldron, etc.)
  function drawElementItem(cx, cy, size, level, isSelected = false, now = 0) {
    ctx.save();
    ctx.translate(cx, cy);

    const r = size * 0.4;

    // Selection glow aura (like 00:07, 00:10, 00:25 in video)
    if (isSelected) {
      const pulse = 1 + 0.06 * Math.sin(now * 0.015);
      ctx.scale(pulse, pulse);
      ctx.shadowColor = '#fff799';
      ctx.shadowBlur = 18;
    } else {
      ctx.shadowColor = 'rgba(0,0,0,0.45)';
      ctx.shadowBlur = 6;
      ctx.shadowOffsetY = 3;
    }

    switch (level) {
      case 1: {
        // LEVEL 1: 4-LEAF CLOVER (exact match to video)
        // Small stem
        ctx.strokeStyle = '#3a8c1e';
        ctx.lineWidth = r * 0.16;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(r * 0.25, r * 0.65, r * 0.45, r * 0.85);
        ctx.stroke();

        // 4 Heart-shaped leaves rotated at 45, 135, 225, 315 deg
        for (let i = 0; i < 4; i++) {
          ctx.save();
          ctx.rotate((i * Math.PI) / 2 + Math.PI / 4);
          const leafGrad = ctx.createRadialGradient(0, -r * 0.45, r * 0.05, 0, -r * 0.45, r * 0.55);
          leafGrad.addColorStop(0, '#99e64b');
          leafGrad.addColorStop(0.7, '#52b528');
          leafGrad.addColorStop(1, '#2b7311');
          ctx.fillStyle = leafGrad;

          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.bezierCurveTo(-r * 0.55, -r * 0.25, -r * 0.65, -r * 0.95, 0, -r * 0.72);
          ctx.bezierCurveTo(r * 0.65, -r * 0.95, r * 0.55, -r * 0.25, 0, 0);
          ctx.fill();

          ctx.strokeStyle = '#235e0d';
          ctx.lineWidth = 1.5;
          ctx.stroke();

          // Center leaf vein
          ctx.strokeStyle = '#82d93b';
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.moveTo(0, -r * 0.08);
          ctx.lineTo(0, -r * 0.55);
          ctx.stroke();
          ctx.restore();
        }
        break;
      }

      case 2: {
        // LEVEL 2: RED SPOTTED MUSHROOM (exact match to video)
        // Beige Stem
        const stemGrad = ctx.createLinearGradient(-r * 0.35, 0, r * 0.35, 0);
        stemGrad.addColorStop(0, '#e3ceb0');
        stemGrad.addColorStop(0.5, '#fff3e0');
        stemGrad.addColorStop(1, '#b89f7d');
        ctx.fillStyle = stemGrad;
        ctx.beginPath();
        ctx.moveTo(-r * 0.26, -r * 0.05);
        ctx.quadraticCurveTo(-r * 0.38, r * 0.75, -r * 0.15, r * 0.85);
        ctx.lineTo(r * 0.18, r * 0.85);
        ctx.quadraticCurveTo(r * 0.4, r * 0.75, r * 0.26, -r * 0.05);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#6e5638';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Red Cap
        const capGrad = ctx.createRadialGradient(-r * 0.2, -r * 0.45, r * 0.1, 0, -r * 0.2, r * 0.95);
        capGrad.addColorStop(0, '#ff6388');
        capGrad.addColorStop(0.55, '#db1d4b');
        capGrad.addColorStop(1, '#8a0a28');
        ctx.fillStyle = capGrad;
        ctx.beginPath();
        ctx.moveTo(-r * 0.88, -r * 0.02);
        ctx.bezierCurveTo(-r * 0.95, -r * 0.95, r * 0.95, -r * 0.95, r * 0.88, -r * 0.02);
        ctx.quadraticCurveTo(0, r * 0.18, -r * 0.88, -r * 0.02);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#61061b';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Pinkish-white spots on cap
        ctx.fillStyle = 'rgba(255, 225, 232, 0.85)';
        const spots = [
          [-0.42, -0.32, 0.13],
          [0.05, -0.55, 0.15],
          [0.45, -0.28, 0.12],
          [-0.12, -0.2, 0.1]
        ];
        for (const [sx, sy, sr] of spots) {
          ctx.beginPath();
          ctx.arc(r * sx, r * sy, r * sr, 0, Math.PI * 2);
          ctx.fill();
        }
        break;
      }

      case 3: {
        // LEVEL 3: SKULL ("Skull 3 from 13" at 00:12 in video)
        const skullGrad = ctx.createRadialGradient(-r * 0.2, -r * 0.3, r * 0.1, 0, 0, r * 0.9);
        skullGrad.addColorStop(0, '#fff5dc');
        skullGrad.addColorStop(0.65, '#d6be96');
        skullGrad.addColorStop(1, '#947a53');
        ctx.fillStyle = skullGrad;

        ctx.beginPath();
        ctx.arc(0, -r * 0.14, r * 0.72, Math.PI * 0.85, Math.PI * 0.15, false);
        ctx.lineTo(r * 0.46, r * 0.45);
        ctx.quadraticCurveTo(r * 0.45, r * 0.76, 0, r * 0.76);
        ctx.quadraticCurveTo(-r * 0.45, r * 0.76, -r * 0.46, r * 0.45);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#4a3922';
        ctx.lineWidth = 1.8;
        ctx.stroke();

        // Eye sockets
        ctx.fillStyle = '#261c10';
        ctx.beginPath();
        ctx.ellipse(-r * 0.27, -r * 0.05, r * 0.2, r * 0.23, -0.15, 0, Math.PI * 2);
        ctx.ellipse(r * 0.27, -r * 0.05, r * 0.2, r * 0.23, 0.15, 0, Math.PI * 2);
        ctx.fill();

        // Nose cavity
        ctx.beginPath();
        ctx.moveTo(0, r * 0.15);
        ctx.lineTo(-r * 0.11, r * 0.36);
        ctx.lineTo(r * 0.11, r * 0.36);
        ctx.closePath();
        ctx.fill();

        // Teeth notches
        ctx.strokeStyle = '#4a3922';
        ctx.lineWidth = 1.5;
        for (let t = -1; t <= 1; t++) {
          ctx.beginPath();
          ctx.moveTo(t * r * 0.18, r * 0.52);
          ctx.lineTo(t * r * 0.18, r * 0.74);
          ctx.stroke();
        }
        break;
      }

      case 4: {
        // LEVEL 4: STONE ("Stone 4 from 13" at 00:52 in video - purple rune stone with spiral)
        const stoneGrad = ctx.createRadialGradient(-r * 0.2, -r * 0.2, r * 0.1, 0, 0, r * 0.85);
        stoneGrad.addColorStop(0, '#9d6be0');
        stoneGrad.addColorStop(0.6, '#6237a0');
        stoneGrad.addColorStop(1, '#3c1e6b');
        ctx.fillStyle = stoneGrad;

        ctx.beginPath();
        ctx.moveTo(-r * 0.75, r * 0.25);
        ctx.quadraticCurveTo(-r * 0.85, -r * 0.45, -r * 0.2, -r * 0.62);
        ctx.quadraticCurveTo(r * 0.45, -r * 0.68, r * 0.78, -r * 0.15);
        ctx.quadraticCurveTo(r * 0.9, r * 0.52, r * 0.2, r * 0.62);
        ctx.quadraticCurveTo(-r * 0.65, r * 0.68, -r * 0.75, r * 0.25);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#241042';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Glowing Spiral Rune
        ctx.strokeStyle = '#c9a6ff';
        ctx.lineWidth = 2.2;
        ctx.lineCap = 'round';
        ctx.beginPath();
        for (let a = 0; a < Math.PI * 3.6; a += 0.2) {
          const sr = (a / (Math.PI * 3.6)) * r * 0.42;
          const px = Math.cos(a) * sr;
          const py = Math.sin(a) * sr;
          if (a === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.stroke();
        break;
      }

      case 5: {
        // LEVEL 5: CALDRON ("Caldron 5 from 13" at 01:25 in video - dark pot with bubbling green slime)
        const potGrad = ctx.createRadialGradient(-r * 0.25, 0, r * 0.1, 0, r * 0.1, r * 0.85);
        potGrad.addColorStop(0, '#6c7a89');
        potGrad.addColorStop(0.6, '#38424d');
        potGrad.addColorStop(1, '#1c2229');
        ctx.fillStyle = potGrad;

        // Pot belly
        ctx.beginPath();
        ctx.arc(0, r * 0.12, r * 0.72, -0.2, Math.PI + 0.2, false);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#12161a';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Pot rim
        ctx.fillStyle = '#495663';
        ctx.beginPath();
        ctx.roundRect(-r * 0.76, -r * 0.42, r * 1.52, r * 0.24, 6);
        ctx.fill();
        ctx.stroke();

        // Bubbling neon green potion inside & dripping over rim
        ctx.fillStyle = '#68f73e';
        ctx.beginPath();
        ctx.ellipse(0, -r * 0.32, r * 0.62, r * 0.14, 0, 0, Math.PI * 2);
        ctx.fill();

        // Green drips
        ctx.beginPath();
        ctx.arc(-r * 0.35, -r * 0.2, r * 0.1, 0, Math.PI * 2);
        ctx.arc(r * 0.25, -r * 0.18, r * 0.12, 0, Math.PI * 2);
        ctx.arc(0, -r * 0.44, r * 0.14, 0, Math.PI * 2);
        ctx.fill();
        break;
      }

      default: {
        // LEVELS 6 - 13: Radiant Alchemy Artifacts (Potion, Crystal, Scroll, Grimoire, etc.)
        const elem = ELEMENTS[level] || ELEMENTS[13];
        const grad = ctx.createRadialGradient(-r * 0.2, -r * 0.25, r * 0.1, 0, 0, r * 0.85);
        grad.addColorStop(0, elem.glow);
        grad.addColorStop(0.6, elem.color);
        grad.addColorStop(1, '#1f1033');
        ctx.fillStyle = grad;

        if (level === 6) {
          // Magic Potion Flask
          ctx.beginPath();
          ctx.arc(0, r * 0.22, r * 0.58, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.fillStyle = '#d4a359';
          ctx.fillRect(-r * 0.18, -r * 0.65, r * 0.36, r * 0.35);
        } else {
          // Faceted Arcane Gem / Artifact with level emblem
          ctx.beginPath();
          const sides = 6;
          for (let i = 0; i < sides; i++) {
            const a = (i * Math.PI * 2) / sides - Math.PI / 2;
            const px = Math.cos(a) * r * 0.78;
            const py = Math.sin(a) * r * 0.78;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = '#ffe875';
          ctx.lineWidth = 2.2;
          ctx.stroke();

          ctx.fillStyle = '#fff';
          ctx.font = `800 ${Math.round(r * 0.65)}px Fredoka`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(String(level), 0, 2);
        }
        break;
      }
    }

    ctx.restore();
  }

  // Draw Crackling Golden Lightning Line between linked tiles (exact match to 00:10, 00:25)
  function drawLightningLink(p1, p2, now) {
    ctx.save();
    const dx = p2.x - p1.x;
    const dy = p2.y - p1.y;
    const dist = Math.hypot(dx, dy);
    const steps = Math.max(4, Math.floor(dist / 12));
    const nx = -dy / dist;
    const ny = dx / dist;

    // Outer yellow glow
    ctx.strokeStyle = '#ffdf4d';
    ctx.shadowColor = '#ffae00';
    ctx.shadowBlur = 14;
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    const pts = [{ x: p1.x, y: p1.y }];
    for (let i = 1; i < steps; i++) {
      const t = i / steps;
      const jitter = Math.sin(now * 0.04 + i * 7.3) * 4.5;
      pts.push({
        x: p1.x + dx * t + nx * jitter,
        y: p1.y + dy * t + ny * jitter
      });
    }
    pts.push({ x: p2.x, y: p2.y });

    ctx.beginPath();
    pts.forEach((p, idx) => (idx === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y)));
    ctx.stroke();

    // Inner white-hot core
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2.2;
    ctx.stroke();
    ctx.restore();
  }

  function drawSparkleStar(x, y, radius) {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = '#ffe875';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const r = i % 2 === 0 ? radius : radius * 0.22;
      const a = (i * Math.PI) / 4;
      if (i === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
      else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawWizardAndCauldron(now) {
    ctx.save();
    const wizX = W * 0.36;
    const wizY = H - 115;
    const bob = Math.sin(now * 0.004) * 3;

    // Wizard Purple Robe & Raised Arms
    ctx.fillStyle = '#722ed1';
    ctx.strokeStyle = '#22075e';
    ctx.lineWidth = 2.5;

    // Left & Right raised sleeves
    ctx.beginPath();
    ctx.moveTo(wizX - 15, wizY - 35 + bob);
    ctx.quadraticCurveTo(wizX - 68, wizY - 45 + bob, wizX - 75, wizY - 82 + bob);
    ctx.lineTo(wizX - 50, wizY - 92 + bob);
    ctx.quadraticCurveTo(wizX - 35, wizY - 58 + bob, wizX, wizY - 50 + bob);
    ctx.fill();
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(wizX + 15, wizY - 35 + bob);
    ctx.quadraticCurveTo(wizX + 68, wizY - 45 + bob, wizX + 75, wizY - 82 + bob);
    ctx.lineTo(wizX + 50, wizY - 92 + bob);
    ctx.quadraticCurveTo(wizX + 35, wizY - 58 + bob, wizX, wizY - 50 + bob);
    ctx.fill();
    ctx.stroke();

    // Wizard Hands
    ctx.fillStyle = '#ffccc7';
    ctx.beginPath();
    ctx.arc(wizX - 65, wizY - 92 + bob, 11, 0, Math.PI * 2);
    ctx.arc(wizX + 65, wizY - 92 + bob, 11, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Robe Torso with gold trim
    ctx.fillStyle = '#722ed1';
    ctx.beginPath();
    ctx.moveTo(wizX - 42, wizY + 85);
    ctx.lineTo(wizX - 28, wizY - 55 + bob);
    ctx.lineTo(wizX + 28, wizY - 55 + bob);
    ctx.lineTo(wizX + 42, wizY + 85);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Gold robe collar & stripe
    ctx.strokeStyle = '#fadb14';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(wizX, wizY - 50 + bob);
    ctx.lineTo(wizX, wizY + 85);
    ctx.stroke();

    // Face
    ctx.fillStyle = '#ffccc7';
    ctx.beginPath();
    ctx.arc(wizX, wizY - 75 + bob, 22, 0, Math.PI * 2);
    ctx.fill();

    // Big Googly Eyes

  function drawBoosterIcon(cx, cy, key) {
    ctx.save();
    ctx.strokeStyle = '#141c24';
    ctx.fillStyle = '#141c24';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    if (key === 'remove') {
      // Crossed diagonal X
      ctx.beginPath();
      ctx.moveTo(cx - 12, cy - 12);
      ctx.lineTo(cx + 12, cy + 12);
      ctx.moveTo(cx + 12, cy - 12);
      ctx.lineTo(cx - 12, cy + 12);
      ctx.stroke();
    } else if (key === 'magnet') {
      // 8-ray burst
      for (let i = 0; i < 8; i++) {
        const a = (i * Math.PI) / 4;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(a) * 5, cy + Math.sin(a) * 5);
        ctx.lineTo(cx + Math.cos(a) * 14, cy + Math.sin(a) * 14);
        ctx.stroke();
      }
    } else if (key === 'sorter') {
      // 3 stacked triangles
      const tris = [[0, -8], [-9, 8], [9, 8]];
      for (const [ox, oy] of tris) {
        ctx.beginPath();
        ctx.moveTo(cx + ox, cy + oy - 6);
        ctx.lineTo(cx + ox - 6, cy + oy + 5);
        ctx.lineTo(cx + ox + 6, cy + oy + 5);
        ctx.closePath();
        ctx.fill();
      }
    } else if (key === 'undo') {
      // Circular undo arrow
      ctx.beginPath();
      ctx.arc(cx, cy, 11, 0.3, Math.PI * 1.65);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(cx + 4, cy - 15);
      ctx.lineTo(cx + 13, cy - 10);
      ctx.lineTo(cx + 4, cy - 4);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  function drawSkullCoin(cx, cy, r) {
    ctx.save();
    const g = ctx.createRadialGradient(cx - r * 0.2, cy - r * 0.2, 1, cx, cy, r);
    g.addColorStop(0, '#fff394');
    g.addColorStop(0.7, '#f5b825');
    g.addColorStop(1, '#9e6304');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#573400';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Tiny skull eyes inside coin
    ctx.fillStyle = '#573400';
    ctx.beginPath();
    ctx.arc(cx - r * 0.3, cy - r * 0.1, r * 0.18, 0, Math.PI * 2);
    ctx.arc(cx + r * 0.3, cy - r * 0.1, r * 0.18, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawOrnateGoldFrame(x, y, w, h, withTopSkull = true) {
    ctx.save();
    // Outer shadow
    ctx.shadowColor = 'rgba(0,0,0,0.75)';
    ctx.shadowBlur = 16;
    ctx.shadowOffsetY = 6;

    // Dark slate base
    ctx.fillStyle = '#243140';
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, 8);
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;

    // Metallic Gold Border
    const borderGrad = ctx.createLinearGradient(x, y, x + w, y + h);
    borderGrad.addColorStop(0, '#ffe875');
    borderGrad.addColorStop(0.35, '#d4941c');
    borderGrad.addColorStop(0.7, '#ffe066');
    borderGrad.addColorStop(1, '#8c5606');
    ctx.strokeStyle = borderGrad;
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, 8);
    ctx.stroke();

    ctx.strokeStyle = '#472b02';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(x + 3, y + 3, w - 6, h - 6);

    // Golden corner clasps
    const corners = [
      [x, y], [x + w, y], [x, y + h], [x + w, y + h]
    ];
    ctx.fillStyle = '#ffd54f';
    ctx.strokeStyle = '#5c3702';
    for (const [cx, cy] of corners) {
      ctx.beginPath();
      ctx.arc(cx, cy, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }

    // Top-center Golden Skull Emblem (exact match to board top in video)
    if (withTopSkull) {
      const sx = x + w / 2;
      const sy = y;
      ctx.fillStyle = '#f5be36';
      ctx.strokeStyle = '#472b02';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.arc(sx, sy - 2, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.fillRect(sx - 5, sy + 4, 10, 6);

      ctx.fillStyle = '#261802';
      ctx.beginPath();
      ctx.arc(sx - 3.5, sy - 2, 2.2, 0, Math.PI * 2);
      ctx.arc(sx + 3.5, sy - 2, 2.2, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  // ==========================================
  // SCREEN 3: IN-GAME BOARD & HUD (00:04 - 01:26)
  // ==========================================
  function drawGameScreen(now, dt) {
    drawDungeonBackground(now, true);
    uiButtons = [];

    // Smooth coin counter roll-up
    if (displayCoins < coins) {
      displayCoins = Math.min(coins, displayCoins + Math.max(1, (coins - displayCoins) * 10 * dt));
    } else if (displayCoins > coins) {
      displayCoins = coins;
    }

    // Top-Left Score / Coin Box
    const scoreBoxX = 16;
    const scoreBoxY = 18;
    const scoreBoxW = 148;
    const scoreBoxH = 42;
    drawOrnateGoldFrame(scoreBoxX, scoreBoxY, scoreBoxW, scoreBoxH, false);
    drawSkullCoin(scoreBoxX + 24, scoreBoxY + scoreBoxH / 2, 11);

    ctx.fillStyle = '#ffd53d';
    ctx.font = '800 22px Fredoka';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(Math.round(displayCoins)), scoreBoxX + scoreBoxW - 14, scoreBoxY + scoreBoxH / 2 + 1);

    // Top-Right 3 Octagonal Buttons: Star (Boosters), Undo (with badge), Pause
    const btnY = 39;
    const starX = W - 166;
    const undoX = W - 104;
    const pauseX = W - 42;

    // 1. Star Booster Button
    drawOctagonButton(starX, btnY, 25, (cx, cy, s) => {
      ctx.fillStyle = '#141c24';
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const r = i % 2 === 0 ? s * 1.05 : s * 0.45;
        const a = (i * Math.PI) / 5 - Math.PI / 2;
        if (i === 0) ctx.moveTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
        else ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
      }
      ctx.closePath();
      ctx.fill();
    });
    uiButtons.push({
      x: starX - 26, y: btnY - 26, w: 52, h: 52,
      onClick: () => transitionTo('BOOSTERS')
    });

    // 2. Undo Button with Red Badge
    drawOctagonButton(undoX, btnY, 25, (cx, cy, s) => {
      ctx.strokeStyle = '#ffce3b';
      ctx.lineWidth = 3.2;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(cx, cy, s * 0.72, 0.3, Math.PI * 1.65);
      ctx.stroke();
      ctx.fillStyle = '#ffce3b';
      ctx.beginPath();
      ctx.moveTo(cx + 2, cy - s * 1.05);
      ctx.lineTo(cx + s * 0.9, cy - s * 0.65);
      ctx.lineTo(cx + 2, cy - s * 0.25);
      ctx.closePath();
      ctx.fill();
    }, boosters.undo);
    uiButtons.push({
      x: undoX - 26, y: btnY - 26, w: 52, h: 52,
      onClick: () => performUndo()
    });

    // 3. Pause Button
    drawOctagonButton(pauseX, btnY, 25, (cx, cy, s) => {
      ctx.fillStyle = '#ffce3b';
      ctx.fillRect(cx - s * 0.55, cy - s * 0.65, s * 0.38, s * 1.3);
      ctx.fillRect(cx + s * 0.17, cy - s * 0.65, s * 0.38, s * 1.3);
    });
    uiButtons.push({
      x: pauseX - 26, y: btnY - 26, w: 52, h: 52,
      onClick: () => { sfxClick(); state = 'PAUSE'; }
    });

    // Draw 4x5 Game Board Frame
    drawOrnateGoldFrame(boardRect.x, boardRect.y, boardRect.w, boardRect.h, true);

    // Draw Grid Cells & Gold Diamond Intersection Studs
    const { x: bx, y: by, cell } = boardRect;
    for (let c = 0; c < COLS; c++) {
      for (let r = 0; r < ROWS; r++) {
        const cx = bx + c * cell;
        const cy = by + r * cell;
        ctx.fillStyle = (c + r) % 2 === 0 ? '#2c3b4d' : '#263445';
        ctx.fillRect(cx + 3, cy + 3, cell - 6, cell - 6);

        // Highlight selected tiles in current drag chain
        if (chain.some(item => item.c === c && item.r === r)) {
          ctx.fillStyle = 'rgba(255, 238, 120, 0.18)';
          ctx.fillRect(cx + 3, cy + 3, cell - 6, cell - 6);
        }
      }
    }

    // Gold Diamond Studs at internal cell intersections (exact match to video)
    for (let c = 1; c < COLS; c++) {
      for (let r = 1; r < ROWS; r++) {
        const ix = bx + c * cell;
        const iy = by + r * cell;
        ctx.save();
        ctx.translate(ix, iy);
        ctx.rotate(Math.PI / 4);
        ctx.fillStyle = '#243140';
        ctx.strokeStyle = '#e0a526';
        ctx.lineWidth = 2;
        ctx.fillRect(-5, -5, 10, 10);
        ctx.strokeRect(-5, -5, 10, 10);
        ctx.restore();
      }
    }

    // Draw Lightning Links between chained cells
    if (chain.length >= 2) {
      for (let i = 0; i < chain.length - 1; i++) {
        const p1 = getCellCenter(chain[i].c, chain[i].r);
        const p2 = getCellCenter(chain[i + 1].c, chain[i + 1].r);
        drawLightningLink(p1, p2, now);
      }
    }

    // Draw Spinning Golden Starbursts behind newly merged items
    for (let i = starbursts.length - 1; i >= 0; i--) {
      const sb = starbursts[i];
      sb.life -= dt;
      sb.angle += dt * 2.2;
      if (sb.life <= 0) {
        starbursts.splice(i, 1);
        continue;
      }
      const alpha = Math.max(0, sb.life / sb.maxLife);
      ctx.save();
      ctx.translate(sb.x, sb.y);
      ctx.rotate(sb.angle);
      ctx.globalAlpha = alpha;
      const g = ctx.createRadialGradient(0, 0, 4, 0, 0, sb.radius);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(0.5, '#ffe875');
      g.addColorStop(1, 'rgba(255, 200, 40, 0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      const rays = 12;
      for (let k = 0; k < rays * 2; k++) {
        const rad = k % 2 === 0 ? sb.radius : sb.radius * 0.35;
        const a = (k * Math.PI) / rays;
        if (k === 0) ctx.moveTo(Math.cos(a) * rad, Math.sin(a) * rad);
        else ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // Update & Draw Board Items (Clipped inside board frame during drop-in)
    ctx.save();
    ctx.beginPath();
    ctx.rect(boardRect.x + 3, boardRect.y + 3, boardRect.w - 6, boardRect.h - 6);
    ctx.clip();

    let anyFalling = false;
    for (let c = 0; c < COLS; c++) {
      for (let r = 0; r < ROWS; r++) {
        const tile = grid[c] && grid[c][r];
        if (!tile) continue;

        if (tile.yOffset < 0) {
          tile.vy += 2600 * dt;
          tile.yOffset += tile.vy * dt;
          if (tile.yOffset >= 0) {
            tile.yOffset = 0;
            tile.vy = 0;
            tile.scale = 1.12; // subtle landing squash/bounce
          } else {
            anyFalling = true;
          }
        }

        if (tile.scale > 1) {
          tile.scale = Math.max(1, tile.scale - dt * 2.2);
        } else if (tile.scale < 1) {
          tile.scale = Math.min(1, tile.scale + dt * 2.2);
        }

        const pos = getCellCenter(c, r);
        const isSelected = chain.some(item => item.c === c && item.r === r);
        drawElementItem(pos.x, pos.y + tile.yOffset, cell * tile.scale, tile.level, isSelected, now);
      }
    }
    isAnimatingBoard = anyFalling;
    ctx.restore();

    // Draw Floating Next-Level Preview Icon next to the last tile in the chain (like 00:07, 00:10, 00:25)
    if (chain.length >= 2) {
      const last = chain[chain.length - 1];
      const baseLvl = grid[last.c][last.r].level;
      const previewLvl = Math.min(13, baseLvl + 1);
      const pos = getCellCenter(last.c, last.r);
      const px = pos.x + cell * 0.36;
      const py = pos.y - cell * 0.36;

      ctx.save();
      ctx.fillStyle = 'rgba(20, 28, 38, 0.85)';
      ctx.strokeStyle = '#ffe875';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(px, py, cell * 0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      drawElementItem(px, py, cell * 0.42, previewLvl, false, now);
      ctx.restore();
    }

    // Draw Discovery Tooltip Banner ("Skull 3 from 13", "Stone 4 from 13", "Caldron 5 from 13")
    if (activeTooltip) {
      activeTooltip.timer -= dt;
      if (activeTooltip.timer <= 0) {
        activeTooltip = null;
      } else {
        const pos = getCellCenter(activeTooltip.c, activeTooltip.r);
        const tw = 128;
        const th = 50;
        const tx = Math.max(12, Math.min(W - tw - 12, pos.x - tw / 2));
        const ty = pos.y - cell * 0.45 - th - 10;

        ctx.save();
        ctx.fillStyle = 'rgba(14, 20, 27, 0.94)';
        ctx.strokeStyle = '#ffd53d';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.roundRect(tx, ty, tw, th, 8);
        ctx.fill();
        ctx.stroke();

        // Pointer triangle
        ctx.beginPath();
        ctx.moveTo(pos.x - 8, ty + th);
        ctx.lineTo(pos.x + 8, ty + th);
        ctx.lineTo(pos.x, ty + th + 9);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#ffd53d';
        ctx.font = '800 16px Fredoka';
        ctx.textAlign = 'center';
        ctx.fillText(activeTooltip.name, tx + tw / 2, ty + 20);

        ctx.fillStyle = '#ffffff';
        ctx.font = '700 13px Fredoka';
        ctx.fillText(`${activeTooltip.level} from 13`, tx + tw / 2, ty + 39);
        ctx.restore();
      }
    }

    // Update & Draw Sparkle Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      if (p.life <= 0) {
        particles.splice(i, 1);
        continue;
      }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Update & Draw Floating "+N" Score Popups flying to Top-Left Score Bar
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
      const ft = floatingTexts[i];
      ft.progress += dt * 1.45;
      if (ft.progress >= 1) {
        coins += ft.amount;
        sfxCoin();
        floatingTexts.splice(i, 1);
        continue;
      }
      let curX, curY;
      if (ft.progress < 0.35) {
        // Rise slightly above merged tile
        const t = ft.progress / 0.35;
        curX = ft.startX;
        curY = ft.startY - t * 22;
      } else {
        // Fly to top-left coin bar
        const t = (ft.progress - 0.35) / 0.65;
        const ease = t * t * (3 - 2 * t);
        curX = ft.startX + (ft.targetX - ft.startX) * ease;
        curY = (ft.startY - 22) + (ft.targetY - (ft.startY - 22)) * ease;
      }

      ctx.save();
      ctx.font = '800 24px Fredoka';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.strokeStyle = '#3b2000';
      ctx.lineWidth = 4;
      ctx.strokeText(ft.text, curX, curY);
      ctx.fillStyle = '#ffe047';
      ctx.fillText(ft.text, curX, curY);
      ctx.restore();
    }

    // Pause Modal Overlay
    if (state === 'PAUSE') {
      ctx.fillStyle = 'rgba(8, 12, 18, 0.78)';
      ctx.fillRect(0, 0, W, H);

      const mw = 280, mh = 230;
      const mx = (W - mw) / 2, my = (H - mh) / 2;
      drawOrnateGoldFrame(mx, my, mw, mh, true);

      ctx.fillStyle = '#ffd53d';
      ctx.font = '800 28px Fredoka';
      ctx.textAlign = 'center';
      ctx.fillText('PAUSED', W / 2, my + 48);

      const modalBtns = [
        { label: 'RESUME', y: my + 82, action: () => { sfxClick(); state = 'GAME'; } },
        { label: 'RESTART', y: my + 132, action: () => { sfxClick(); state = 'GAME'; initBoard(); } },
        { label: 'MAIN MENU', y: my + 182, action: () => transitionTo('MENU') }
      ];
      uiButtons = [];
      for (const mb of modalBtns) {
        ctx.fillStyle = '#2d4054';
        ctx.strokeStyle = '#f5be36';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(W / 2 - 90, mb.y - 18, 180, 38, 10);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#fff29c';
        ctx.font = '800 16px Fredoka';
        ctx.fillText(mb.label, W / 2, mb.y + 2);
        uiButtons.push({
          x: W / 2 - 90, y: mb.y - 18, w: 180, h: 38,
          onClick: mb.action
        });
      }
    }
  }

  // ==========================================
  // INPUT HANDLING (POINTER DOWN / MOVE / UP)
  // ==========================================
  function getCanvasCoords(e) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: e.clientX - rect.left,
      y: e.clientY - rect.top
    };
  }

  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    const pt = getCanvasCoords(e);
    pointerPos = pt;

    // Check UI Buttons first
    for (const b of uiButtons) {
      if (pt.x >= b.x && pt.x <= b.x + b.w && pt.y >= b.y && pt.y <= b.y + b.h) {
        b.onClick();
        return;
      }
    }

    if (state !== 'GAME' || isAnimatingBoard) return;

    activeTooltip = null;
    const cellHit = getCellFromPoint(pt.x, pt.y);
    if (!cellHit) return;

    // Check if "-1 Element" Booster is active
    if (activeBoosterMode === 'remove') {
      saveUndoState();
      const pos = getCellCenter(cellHit.c, cellHit.r);
      spawnParticles(pos.x, pos.y, '#ff6b6b', 20);
      grid[cellHit.c][cellHit.r] = null;
      activeBoosterMode = null;
      boosterPrompt.style.display = 'none';
      sfxMerge(2);
      applyGravityAndRefill(null);
      return;
    }

    // Start new drag chain
    isDragging = true;
    chain = [cellHit];
    sfxSelect(1);
  });

  canvas.addEventListener('pointermove', (e) => {
    if (!isDragging || state !== 'GAME') return;
    const pt = getCanvasCoords(e);
    pointerPos = pt;

    const cellHit = getCellFromPoint(pt.x, pt.y);
    if (!cellHit) return;

    const last = chain[chain.length - 1];
    if (cellHit.c === last.c && cellHit.r === last.r) return;

    // Check if backtracking onto the previous tile in the chain (like 00:26 - 00:31 in video)
    if (chain.length >= 2) {
      const prev = chain[chain.length - 2];
      if (cellHit.c === prev.c && cellHit.r === prev.r) {
        chain.pop();
        sfxSelect(chain.length);
        return;
      }
    }

    // Check if tile is already in chain
    if (chain.some(item => item.c === cellHit.c && item.r === cellHit.r)) return;

    // Must be adjacent (8 directions) and have the same element level
    const firstLevel = grid[chain[0].c][chain[0].r].level;
    const targetTile = grid[cellHit.c][cellHit.r];
    if (targetTile && targetTile.level === firstLevel && areAdjacent(last, cellHit)) {
      chain.push(cellHit);
      sfxSelect(chain.length);
    }
  });

  window.addEventListener('pointerup', () => {
    if (!isDragging) return;
    isDragging = false;
    resolveChain();
  });

  // ==========================================
  // MAIN GAME LOOP
  // ==========================================
  let lastTime = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - lastTime) / 1000 || 0.016);
    lastTime = now;

    ctx.clearRect(0, 0, W, H);

    if (state === 'MENU') {
      drawMenuScreen(now);
    } else if (state === 'BOOSTERS') {
      drawBoostersScreen(now);
    } else if (state === 'GAME' || state === 'PAUSE') {
      drawGameScreen(now, dt);
    }

    requestAnimationFrame(loop);
  }

  initAmbient();
  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
