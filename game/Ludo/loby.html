<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Ludo Lobby</title>
  <style>
 body{font-family:Arial;padding:18px;background:#fafafa}
 .card{max-width:720px;margin:20px auto;padding:16px;background:#fff;border-radius:8px;box-shadow:0 6px 14px rgba(0,0,0,.06)}
 label{display:block;margin-top:8px}
 .start{margin-top:12px;background:#10b981;color:#fff;padding:10px 12px;border-radius:6px;text-decoration:none}
  </style>
</head>
<body>
  <div class="card">
 <h2>Lobby — Local Players</h2>
 <form id="lobby">
 <label>Players (2–4): 
 <select id="players">
 <option value="2">2</option>
 <option value="3">3</option>
 <option value="4" selected>4</option>
 </select>
 </label>
 <label>Human players (enter names, leave blank for CPU):</label>
 <div id="names">
 <input placeholder="Player 1 name" /><br/>
 <input placeholder="Player 2 name" /><br/>
 <input placeholder="Player 3 name" /><br/>
 <input placeholder="Player 4 name" /><br/>
 </div>
 <a id="start" class="start" href="#">Start Game</a>
 <p style="margin-top:12px;color:#666;font-size:13px">For online play, integrate a WebSocket server to sync lobby and moves. </p>
 </form>
  </div>

  <script>
 document.getElementById('players').addEventListener('change', e=>{
 const n = +e.target.value;
 const inputs = document.querySelectorAll('#names input');
 inputs.forEach((el, i)=> el.style.display = (i < n ? 'block' : 'none'));
 });
 document.getElementById('start').addEventListener('click', (ev)=>{
 ev.preventDefault();
 const n = +document.getElementById('players').value;
 const names = Array.from(document.querySelectorAll('#names input')).slice(0,n).map(i=>i.value||('Player '+(Array.from(document.querySelectorAll('#names input')).indexOf(i)+1)));
 // pass config via URL (simple)
 location.href = 'game.html?players=' + encodeURIComponent(JSON.stringify(names));
 });
 // initialize
 document.getElementById('players').dispatchEvent(new Event('change'));
  </script>
</body>
</html>
