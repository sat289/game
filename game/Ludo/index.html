<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro 3D Ludo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar / Controls -->
    <aside class="control-panel">
      <h1>PRO LUDO 3D</h1>
      
      <div class="mode-selector">
        <label for="game-mode">Game Mode:</label>
        <select id="game-mode">
          <option value="bot">Vs Computer (Bot)</option>
          <option value="local">Pass & Play (Friends)</option>
          <option value="online">Online (Firebase)</option>
        </select>
        <button id="new-game-btn">New Game</button>
      </div>

      <div class="status-box">
        <div id="turn-indicator" class="turn-badge red">RED'S TURN</div>
        <p id="status-message">Roll the dice to start!</p>
      </div>

      <!-- 3D Dice Container -->
      <div class="scene">
        <div class="cube" id="dice-cube">
          <div class="cube__face cube__face--1">⚀</div>
          <div class="cube__face cube__face--2">⚁</div>
          <div class="cube__face cube__face--3">⚂</div>
          <div class="cube__face cube__face--4">⚃</div>
          <div class="cube__face cube__face--5">⚄</div>
          <div class="cube__face cube__face--6">⚅</div>
        </div>
      </div>
      <button id="roll-btn" class="primary-btn">ROLL DICE</button>

      <div class="storage-controls">
        <button id="clear-save-btn" class="secondary-btn">Reset Saved Data</button>
      </div>
    </aside>

    <!-- Main Ludo Board -->
    <main class="board-wrapper">
      <div id="ludo-board" class="ludo-board"></div>
    </main>
  </div>

  <!-- Firebase SDK (Optional: Configure in game.js for Online Mode) -->
  <script type="module" src="game.js"></script>
</body>
</html>
