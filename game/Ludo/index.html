<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro Ludo Ultimate - 1v1, 2v2, 3v3</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Firebase & Auto Cloud Sync Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
    import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBzLchy5M2fLne4c7Ghw1KNN8wVrlZdd8M",
      authDomain: "friendsgame-872f5.firebaseapp.com",
      databaseURL: "https://friendsgame-872f5-default-rtdb.firebaseio.com",
      projectId: "friendsgame-872f5",
      storageBucket: "friendsgame-872f5.firebasestorage.app",
      messagingSenderId: "522534013233",
      appId: "1:522534013233:web:f5faa6e6795023d0420810",
      measurementId: "G-PW5H3G97QR"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const GAME_KEY = "ludo_ultimate";

    let currentUser = null;
    let currentHighScore = parseInt(localStorage.getItem(`${GAME_KEY}_hi`) || "0", 10);

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        document.getElementById("login-status").textContent = "Cloud Sync: Active (Online)";
        try {
          const snapshot = await get(child(ref(db), `scores/${user.uid}/${GAME_KEY}_high`));
          if (snapshot.exists()) {
            const cloudScore = parseInt(snapshot.val(), 10) || 0;
            if (cloudScore > currentHighScore) {
              currentHighScore = cloudScore;
              localStorage.setItem(`${GAME_KEY}_hi`, currentHighScore.toString());
            }
          }
        } catch (err) {
          console.error("Firebase sync error:", err);
        }
      } else {
        currentUser = null;
        document.getElementById("login-status").textContent = "Guest Mode (Local Storage)";
      }
    });

    window.submitScore = function(newScore) {
      const val = parseInt(newScore, 10);
      if (isNaN(val)) return;
      if (val > currentHighScore) {
        currentHighScore = val;
        localStorage.setItem(`${GAME_KEY}_hi`, currentHighScore.toString());
        if (currentUser) {
          set(ref(db, `scores/${currentUser.uid}/${GAME_KEY}_high`), currentHighScore);
        }
      }
    };
  </script>
</head>
<body>
  <div class="app-container">
    <!-- కంట్రోల్ ప్యానెల్ (Sidebar) -->
    <aside class="control-panel">
      <h2>ULTIMATE LUDO</h2>
      <div id="login-status" class="status-pill">Loading Auth...</div>

      <div class="setting-group">
        <label>Game Mode / Players</label>
        <select id="match-mode">
          <option value="1v1">1 vs 1 (Red vs Yellow)</option>
          <option value="2v2">2 vs 2 (Team Battle)</option>
          <option value="3v3">3 vs 3 (Multiplayer)</option>
          <option value="bot">Vs Smart Bot</option>
        </select>
      </div>

      <div class="turn-box">
        <div id="turn-badge" class="turn-indicator red">RED'S TURN</div>
        <div id="step-counter" class="step-counter">Steps Moved: 0</div>
      </div>

      <!-- 3D క్లియర్ డైస్ (3D Dice UI) -->
      <div class="dice-container">
        <div class="dice-cube" id="dice-cube">
          <div class="face front">1</div>
          <div class="face back">6</div>
          <div class="face right">3</div>
          <div class="face left">4</div>
          <div class="face top">5</div>
          <div class="face bottom">2</div>
        </div>
      </div>
      <button id="roll-dice-btn" class="primary-btn">🎲 ROLL DICE</button>

      <div class="footer-buttons">
        <button id="new-game-btn" class="secondary-btn">New Match</button>
        <button id="sound-toggle-btn" class="secondary-btn">🔊 Sound: ON</button>
      </div>
    </aside>

    <!-- లూడో బోర్డ్ (Main Board) -->
    <main class="board-wrapper">
      <div id="ludo-board" class="ludo-board"></div>
    </main>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
