<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real Ludo Game - Ultimate Timepass</title>
  <link rel="stylesheet" href="style.css">

  <!-- Firebase & Cloud Sync Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
    import { getDatabase, ref, set, get, child, onValue } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBzLchy5M2fLne4c7Ghw1KNN8wVrlZdd8M",
      authDomain: "friendsgame-872f5.firebaseapp.com",
      databaseURL: "https://friendsgame-872f5-default-rtdb.firebaseio.com",
      projectId: "friendsgame-872f5",
      storageBucket: "friendsgame-872f5.firebasestorage.app",
      messagingSenderId: "522534013233",
      appId: "1:522534013233:web:f5faa6e6795023d0420810",
      measurementId: "G-PW5H3G97QR"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const GAME_KEY = "real_ludo_game";

    let currentUser = null;
    let currentHighScore = parseInt(localStorage.getItem(`${GAME_KEY}_hi`) || "0", 10);

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        document.getElementById("auth-status").textContent = "☁️ క్లౌడ్ సింక్ అయింది (Online)";
        try {
          const snapshot = await get(child(ref(db), `scores/${user.uid}/${GAME_KEY}_high`));
          if (snapshot.exists()) {
            const cloudScore = parseInt(snapshot.val(), 10) || 0;
            if (cloudScore > currentHighScore) {
              currentHighScore = cloudScore;
              localStorage.setItem(`${GAME_KEY}_hi`, currentHighScore.toString());
            }
          }
        } catch (err) {
          console.error("Firebase sync error:", err);
        }
      } else {
        currentUser = null;
        document.getElementById("auth-status").textContent = "💾 లోకల్ స్టోరేజ్ మోడ్ (Offline)";
      }
    });

    window.submitScore = function(newScore) {
      const val = parseInt(newScore, 10);
      if (isNaN(val)) return;
      if (val > currentHighScore) {
        currentHighScore = val;
        localStorage.setItem(`${GAME_KEY}_hi`, currentHighScore.toString());
        if (currentUser) {
          set(ref(db, `scores/${currentUser.uid}/${GAME_KEY}_high`), currentHighScore);
        }
      }
    };

    window.LudoFirebase = { db, ref, set, get, onValue };
  </script>
</head>
<body>
  <div class="game-wrapper">
    <!-- సైడ్‌బార్ కంట్రోల్ ప్యానెల్ -->
    <div class="sidebar">
      <div class="brand-title">🎲 PRO LUDO 3D</div>
      <div id="auth-status" class="auth-badge">కనెక్షన్ తనిఖీ చేయబడుతోంది...</div>

      <div class="control-group">
        <label>గేమ్ మోడ్ (Game Mode)</label>
        <select id="game-mode-select">
          <option value="bot">స్మార్ట్ బాట్‌తో ఆడండి (Vs Bot)</option>
          <option value="local">ఫ్రెండ్స్‌తో కలిసి ఆడండి (Pass & Play)</option>
          <option value="online">ఆన్‌లైన్ రూమ్ కోడ్ (Online)</option>
        </select>
      </div>

      <!-- ఆన్‌లైన్ రూమ్ కోడ్ బాక్స్ -->
      <div id="online-lobby" class="online-lobby hidden">
        <div class="room-code-display" id="room-code-label">ROOM: ------</div>
        <input type="text" id="room-input-code" placeholder="6 అంకెల కోడ్ ఎంటర్ చేయండి" maxlength="6">
        <div class="room-btn-row">
          <button id="create-room-btn" class="btn-sm">రూమ్ సృష్టించు</button>
          <button id="join-room-btn" class="btn-sm">జాయిన్ అవ్వು</button>
        </div>
      </div>

      <div class="turn-display">
        <div id="turn-indicator" class="turn-badge red">RED'S TURN</div>
        <div id="score-tracker" class="score-text">స్కోర్: 0</div>
      </div>

      <!-- స్పష్టమైన క్లియర్ 3D డైస్ -->
      <div class="dice-viewport">
        <div class="dice-3d" id="dice-3d">
          <div class="dice-face face-front">1</div>
          <div class="dice-face face-back">6</div>
          <div class="dice-face face-right">3</div>
          <div class="dice-face face-left">4</div>
          <div class="dice-face face-top">5</div>
          <div class="dice-face face-bottom">2</div>
        </div>
      </div>

      <button id="roll-dice-btn" class="roll-btn">డైస్ రోల్ చేయండి (ROLL)</button>

      <div class="bottom-actions">
        <button id="restart-btn" class="btn-action">కొత్త గేమ్</button>
        <button id="sound-toggle-btn" class="btn-action">🔊 సౌండ్: ఆన్</button>
      </div>
    </div>

    <!-- లూడో బోర్డ్ ఏరియా -->
    <div class="board-container">
      <div id="ludo-board" class="ludo-board"></div>
    </div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
