<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pro Ludo 3D King - Ultimate Edition</title>
  <link rel="stylesheet" href="style.css">
  <!-- Canvas Confetti for Winning Celebration -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Firebase Cloud Sync & Live Multiplayer -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
    import { getDatabase, ref, set, get, child, onValue } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBzLchy5M2fLne4c7Ghw1KNN8wVrlZdd8M",
      authDomain: "friendsgame-872f5.firebaseapp.com",
      databaseURL: "https://friendsgame-872f5-default-rtdb.firebaseio.com",
      projectId: "friendsgame-872f5",
      storageBucket: "friendsgame-872f5.firebasestorage.app",
      messagingSenderId: "522534013233",
      appId: "1:522534013233:web:f5faa6e6795023d0420810",
      measurementId: "G-PW5H3G97QR"
    };

    try {
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getDatabase(app);
      const GAME_KEY = "pro_ludo_3d_king";

      let currentUser = null;
      let currentHighScore = parseInt(localStorage.getItem(`${GAME_KEY}_hi`) || "0", 10);

      onAuthStateChanged(auth, async (user) => {
        const statusEl = document.getElementById("auth-status");
        if (user) {
          currentUser = user;
          if (statusEl) statusEl.textContent = "Cloud Synced (Online)";
          try {
            const snapshot = await get(child(ref(db), `scores/${user.uid}/${GAME_KEY}_high`));
            if (snapshot.exists()) {
              const cloudScore = parseInt(snapshot.val(), 10) || 0;
              if (cloudScore > currentHighScore) {
                currentHighScore = cloudScore;
                localStorage.setItem(`${GAME_KEY}_hi`, currentHighScore.toString());
              }
            }
          } catch (err) {
            console.warn("Firebase read error:", err);
          }
        } else {
          currentUser = null;
          if (statusEl) statusEl.textContent = "Guest Mode (Local Storage)";
        }
      });

      window.submitScore = function(newScore) {
        const val = parseInt(newScore, 10);
        if (isNaN(val)) return;
        if (val > currentHighScore) {
          currentHighScore = val;
          localStorage.setItem(`${GAME_KEY}_hi`, currentHighScore.toString());
          if (currentUser) {
            set(ref(db, `scores/${currentUser.uid}/${GAME_KEY}_high`), currentHighScore);
          }
        }
      };

      window.LudoFirebase = { db, ref, set, get, onValue };
    } catch (e) {
      console.warn("Firebase init skipped:", e);
    }
  </script>
</head>
<body data-theme="classic">

  <!-- Daily Bonus Popup -->
  <div id="daily-bonus-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <h2>🎁 Daily Login Bonus!</h2>
      <p>Claim your free 250 Gold Coins for playing today!</p>
      <button type="button" onclick="window.claimDailyBonus()" class="glow-btn">Claim +250 Coins</button>
    </div>
  </div>

  <!-- Entrance Home Screen (Same Model as Screenshot) -->
  <div id="home-screen" class="home-screen">
    <div class="home-card">
      <div class="game-badge">INDIA'S NO. 1 LUDO</div>
      <h1 class="glow-title">PRO LUDO 3D KING</h1>
      <p class="sub-text">Choose your battle mode and enjoy seamless multiplayer action!</p>
      
      <div class="home-mode-select">
        <label for="select-player-mode">Choose Match Mode:</label>
        <select id="select-player-mode">
          <option value="1v1">1 vs 1 (Red vs Yellow)</option>
          <option value="2v2">2 vs 2 (Team Battle)</option>
          <option value="1v3">1 vs 3 (Solo vs 3 Bots)</option>
          <option value="4player" selected>4 Players Free-For-All</option>
          <option value="rush">Quick Rush (2 Tokens Out)</option>
        </select>
      </div>

      <div class="home-buttons">
        <button type="button" id="main-start-btn" onclick="window.startLudoGame()" class="glow-btn">🎮 START GAME</button>
      </div>
    </div>
  </div>

  <!-- Main Game Screen -->
  <div id="game-screen" class="game-wrapper hidden">
    <div class="sidebar">
      <div class="brand-title">👑 LUDO KING PRO</div>
      
      <div class="economy-pills">
        <span class="pill">🪙 <strong id="coin-count">500</strong></span>
        <span class="pill">⭐ XP <strong id="xp-count">0</strong></span>
      </div>
      
      <div id="auth-status" class="auth-badge">Guest Mode (Local Storage)</div>

      <div class="settings-grid">
        <div class="control-group">
          <label>Opponent Mode</label>
          <select id="game-mode-select" onchange="window.changeConnectionMode(this.value)">
            <option value="bot">Play vs Smart Bot</option>
            <option value="local">Pass & Play (Friends)</option>
            <option value="online">Online Room Code</option>
          </select>
        </div>
        <div class="control-group">
          <label>Board Theme</label>
          <select id="theme-select" onchange="window.changeBoardTheme(this.value)">
            <option value="classic">Classic Board</option>
            <option value="cyber">Neon Cyberpunk</option>
            <option value="royal">Royal Gold</option>
          </select>
        </div>
      </div>

      <!-- Online Room Code Lobby -->
      <div id="online-lobby" class="online-lobby hidden">
        <div class="room-code-display" id="room-code-label">ROOM: ------</div>
        <input type="text" id="room-input-code" placeholder="Enter 6-Digit Code" maxlength="6">
        <div class="room-btn-row">
          <button type="button" onclick="window.createOnlineRoom()" class="btn-sm">Create Room</button>
          <button type="button" onclick="window.joinOnlineRoom()" class="btn-sm">Join Room</button>
        </div>
      </div>

      <!-- Turn & Countdown Timer -->
      <div class="turn-display">
        <div class="turn-header-row">
          <div id="turn-indicator" class="turn-badge red">RED'S TURN</div>
          <div class="timer-pill">⏱️ <span id="timer-sec">15</span>s</div>
        </div>
        <div class="timer-bar-bg">
          <div id="timer-bar" class="timer-bar-fill"></div>
        </div>
        <div id="status-msg" class="score-text">Tap ROLL DICE to begin!</div>
      </div>

      <!-- True 3D Rotating Dice Cube with Dots -->
      <div class="scene" onclick="window.handleRollDice()">
        <div class="cube" id="dice-cube">
          <div class="cube__face cube__face--1"><span class="pip red-pip"></span></div>
          <div class="cube__face cube__face--2"><span class="pip"></span><span class="pip"></span></div>
          <div class="cube__face cube__face--3"><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
          <div class="cube__face cube__face--4"><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
          <div class="cube__face cube__face--5"><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
          <div class="cube__face cube__face--6"><span class="pip green-pip"></span><span class="pip green-pip"></span><span class="pip green-pip"></span><span class="pip green-pip"></span><span class="pip green-pip"></span><span class="pip green-pip"></span></div>
        </div>
      </div>

      <button type="button" id="roll-dice-btn" onclick="window.handleRollDice()" class="roll-btn">🎲 ROLL DICE</button>

      <!-- Live Emoji Tray -->
      <div class="emoji-tray">
        <button type="button" class="emoji-btn" onclick="window.triggerEmoji('😂')">😂</button>
        <button type="button" class="emoji-btn" onclick="window.triggerEmoji('🔥')">🔥</button>
        <button type="button" class="emoji-btn" onclick="window.triggerEmoji('👏')">👏</button>
        <button type="button" class="emoji-btn" onclick="window.triggerEmoji('😎')">😎</button>
        <button type="button" class="emoji-btn" onclick="window.triggerEmoji('😭')">😭</button>
      </div>

      <div class="bottom-actions">
        <button type="button" onclick="window.backToHome()" class="btn-action">🏠 Home Menu</button>
        <button type="button" id="sound-toggle-btn" onclick="window.toggleSound()" class="btn-action">🔊 Sound: ON</button>
      </div>
    </div>

    <!-- Main 15x15 Ludo Board -->
    <main class="board-container" id="board-container">
      <div id="emoji-floater" class="emoji-floater"></div>
      <div id="ludo-board" class="ludo-board"></div>
    </main>
  </div>

  <!-- Standard Script Load (Guaranteed execution on Mobile & GitHub Pages) -->
  <script src="game.js"></script>
</body>
</html>
