<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classic Ludo Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Control Panel Sidebar -->
    <aside class="control-panel">
      <h2>CLASSIC LUDO</h2>
      
      <div class="mode-selector">
        <label for="game-mode">Game Mode</label>
        <select id="game-mode">
          <option value="bot">Vs Smart Bot</option>
          <option value="local">Pass & Play (Local)</option>
          <option value="online">Online (Firebase)</option>
        </select>
      </div>

      <div class="status-box">
        <div id="turn-indicator" class="turn-badge red">RED'S TURN</div>
        <p id="status-message">Roll the dice to start!</p>
      </div>

      <!-- 3D Dice Display -->
      <div class="scene">
        <div class="cube" id="dice-cube">
          <div class="cube__face cube__face--1">⚀</div>
          <div class="cube__face cube__face--2">⚁</div>
          <div class="cube__face cube__face--3">⚂</div>
          <div class="cube__face cube__face--4">⚃</div>
          <div class="cube__face cube__face--5">⚄</div>
          <div class="cube__face cube__face--6">⚅</div>
        </div>
      </div>
      
      <button id="roll-btn" class="primary-btn">ROLL DICE</button>

      <div class="action-buttons">
        <button id="new-game-btn" class="secondary-btn">New Game</button>
        <button id="reset-storage-btn" class="secondary-btn">Reset Storage</button>
      </div>
    </aside>

    <!-- Main Ludo Board Container -->
    <main class="board-wrapper">
      <div id="ludo-board" class="ludo-board"></div>
    </main>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
