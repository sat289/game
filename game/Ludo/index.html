<!DOCTYPE html>
<html lang="తెలుగు">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ప్రో లూడో గేమ్</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- స్టార్ట్ గేమ్ హోమ్ స్క్రీన్ (మొదట కనిపించే పేజీ) -->
  <div id="home-screen" class="home-screen">
    <div class="home-content">
      <h1>ప్రో లూడో గేమ్</h1>
      <!-- లూడో లోగో లేదా ఇమేజ్ -->
      <img src="https://images.unsplash.com/photo-1610890716171-6b1bb98ffd09?w=300&auto=format&fit=crop&q=80" alt="లూడో బోర్డ్" class="ludo-logo">
      <p>ఆటను ప్రారంభించడానికి కింద ఉన్న బటన్‌ను క్లిక్ చేయండి</p>
      <button id="start-game-btn" class="start-btn">స్టార్ట్ గేమ్ (Start Game)</button>
    </div>
  </div>

  <!-- మెయిన్ గేమ్ కంటైనర్ (ఆట మొదలయ్యాక కనిపిస్తుంది) -->
  <div id="game-container" class="app-container hidden">
    <!-- కంట్రోల్ ప్యానెల్ (Sidebar) -->
    <aside class="control-panel">
      <h2>లూడో అల్టిమేట్</h2>
      
      <div class="setting-group">
        <label>గేమ్ మోడ్</label>
        <select id="match-mode">
          <option value="1v1">1 vs 1 (ఎరుపు vs పసుపు)</option>
          <option value="bot">స్మార్ట్ బాట్ (Vs Bot)</option>
        </select>
      </div>

      <div class="turn-box">
        <div id="turn-badge" class="turn-indicator red">ఎరుపు వంతు</div>
        <div id="step-counter" class="step-counter">కదిలిన అడుగులు: 0</div>
      </div>

      <!-- 3D డైస్ -->
      <div class="dice-container">
        <div class="dice-cube" id="dice-cube">
          <div class="face front">1</div>
          <div class="face back">6</div>
          <div class="face right">3</div>
          <div class="face left">4</div>
          <div class="face top">5</div>
          <div class="face bottom">2</div>
        </div>
      </div>
      <button id="roll-dice-btn" class="primary-btn">🎲 డైస్ రోల్ చేయండి</button>

      <div class="footer-buttons">
        <button id="back-home-btn" class="secondary-btn">హోమ్ పేజీ</button>
        <button id="sound-toggle-btn" class="secondary-btn">🔊 సౌండ్: ఆన్</button>
      </div>
    </aside>

    <!-- లూడో బోర్డ్ -->
    <main class="board-wrapper">
      <div id="ludo-board" class="ludo-board"></div>
    </main>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
