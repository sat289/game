<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knife Hit - Ultimate 50 Levels Edition</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            background: radial-gradient(circle at center, #0b3c5d 0%, #1d2731 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .game-wrapper {
            position: relative;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.85);
            border-radius: 18px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.12);
        }
        canvas {
            background: linear-gradient(135deg, #0d3b66 0%, #04151f 100%);
            display: block;
            cursor: pointer;
        }
        .hud-top {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
            pointer-events: none;
            text-shadow: 0 2px 5px rgba(0,0,0,0.6);
        }
        .hud-stage {
            position: absolute;
            top: 65px;
            width: 100%;
            text-align: center;
            font-size: 18px;
            color: #f4d35e;
            font-weight: 700;
            letter-spacing: 2px;
            pointer-events: none;
            text-transform: uppercase;
        }
        .store-btn {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #ffcc00;
            color: #000;
            border: none;
            padding: 10px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 22px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <div class="hud-top">
            <span id="scoreVal" style="color: #f4d35e;">0</span>
            <span id="appleVal" style="color: #ff4d4d;">🍎 0</span>
        </div>
        <div class="hud-stage" id="stageVal">STAGE 1</div>
        <canvas id="gameCanvas" width="420" height="680"></canvas>
        <button class="store-btn" id="storeBtn" onclick="toggleStore()">🔪 KNIFE STORE</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'hit') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'apple') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(550, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(950, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'crash') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(130, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(30, audioCtx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            } else if (type === 'clear') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(450, audioCtx.currentTime);
                osc.frequency.setValueAtTime(650, audioCtx.currentTime + 0.1);
                osc.frequency.setValueAtTime(850, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        let score = 0;
        let apples = 0;
        let stage = 1;
        let maxStages = 50; // 50 లెవెల్స్
        let totalKnives = 7;
        let knivesLeft = totalKnives;
        let isGameOver = false;
        let isStageCleared = false;
        let isInStore = false;
        let particles = [];
        let screenShake = 0;

        // స్టోర్ కోసం మరిన్ని కొత్త కత్తులు
        let knivesList = [
            { id: 1, name: "Classic Red", price: 0, unlocked: true, color: "#d9534f" },
            { id: 2, name: "Neon Blue", price: 40, unlocked: false, color: "#00bcd4" },
            { id: 3, name: "Golden Blade", price: 80, unlocked: false, color: "#ffcc00" },
            { id: 4, name: "Emerald", price: 150, unlocked: false, color: "#00e676" },
            { id: 5, name: "Purple Magic", price: 250, unlocked: false, color: "#9c27b0" },
            { id: 6, name: "Fire Dagger", price: 350, unlocked: false, color: "#ff5722" },
            { id: 7, name: "Cyber Pink", price: 500, unlocked: false, color: "#e91e63" },
            { id: 8, name: "Royal Silver", price: 700, unlocked: false, color: "#e0e0e0" },
            { id: 9, name: "Shadow Black", price: 1000, unlocked: false, color: "#212121" }
        ];
        let currentKnifeIndex = 0;

        let log = {
            x: canvas.width / 2,
            y: 210,
            radius: 80,
            angle: 0,
            speed: 0.03,
            direction: 1
        };

        let stuckKnives = [];
        let apple = { angle: 1.8, collected: false };

        let currentKnife = {
            x: canvas.width / 2,
            y: 580,
            width: 14,
            height: 65,
            moving: false
        };

        function initStage() {
            knivesLeft = totalKnives + Math.floor((stage - 1) / 3);
            stuckKnives = [];
            apple.collected = false;
            apple.angle = Math.random() * Math.PI * 2;
            
            // లెవెల్స్ పెరిగే కొద్దీ వేగం మరియు కఠినత పెరుగుతుంది
            log.speed = 0.025 + (stage * 0.0022);
            log.direction = (stage % 2 === 0) ? -1 : 1;

            isStageCleared = false;
            currentKnife.moving = false;
            currentKnife.y = 580;
        }

        function toggleStore() {
            isInStore = !isInStore;
            document.getElementById("storeBtn").innerText = isInStore ? "BACK TO GAME" : "🔪 KNIFE STORE";
        }

        function spawnParticles(x, y, colorCount = 15, isFire = false) {
            for (let i = 0; i < colorCount; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8 - (isFire ? 2 : 0),
                    radius: Math.random() * 4 + 2,
                    color: isFire ? (Math.random() > 0.5 ? '#ff4500' : '#ffcc00') : '#00ffff',
                    alpha: 1,
                    decay: Math.random() * 0.03 + 0.02
                });
            }
        }

        function drawLog() {
            ctx.save();
            ctx.translate(log.x, log.y);
            ctx.rotate(log.angle);

            ctx.beginPath();
            ctx.arc(0, 0, log.radius + 8, 0, Math.PI * 2);
            ctx.fillStyle = "#e09f3e";
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = "#5c2e0b";
            ctx.stroke();

            let woodGrad = ctx.createRadialGradient(0, 0, 10, 0, 0, log.radius);
            woodGrad.addColorStop(0, "#ffe0b2");
            woodGrad.addColorStop(0.6, "#f4d35e");
            woodGrad.addColorStop(1, "#8b5a2b");

            ctx.beginPath();
            ctx.arc(0, 0, log.radius, 0, Math.PI * 2);
            ctx.fillStyle = woodGrad;
            ctx.fill();

            ctx.lineWidth = 2;
            ctx.strokeStyle = "rgba(0, 0, 0, 0.2)";
            ctx.beginPath(); ctx.arc(0, 0, log.radius * 0.65, 0, Math.PI * 2); ctx.stroke();
            ctx.beginPath(); ctx.arc(0, 0, log.radius * 0.35, 0, Math.PI * 2); ctx.stroke();

            if (!apple.collected) {
                ctx.save();
                ctx.rotate(apple.angle);
                ctx.translate(0, -log.radius - 15);
                ctx.fillStyle = "#ff1744";
                ctx.beginPath();
                ctx.arc(0, 0, 12, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "#00e676";
                ctx.fillRect(-2, -17, 4, 8);
                ctx.restore();
            }

            ctx.restore();
        }

        // కత్తులు సర్కిల్ బయట ఎడ్జ్ వద్ద గుచ్చుకుని స్పష్టంగా కనిపించేలా రెండర్ చేయడం
        function drawKnife(x, y, isStuck = false, customColor = null) {
            ctx.save();
            let color = customColor || knivesList[currentKnifeIndex].color;

            if (!isStuck) {
                ctx.fillStyle = "rgba(0, 229, 255, 0.15)";
                ctx.fillRect(x - 6, y, 12, 65);
            }

            let bladeGrad = ctx.createLinearGradient(x - 4, y, x + 4, y);
            bladeGrad.addColorStop(0, "#b0bec5");
            bladeGrad.addColorStop(0.5, "#ffffff");
            bladeGrad.addColorStop(1, "#cfd8dc");

            ctx.fillStyle = bladeGrad;
            ctx.beginPath();
            ctx.moveTo(x - 4, y + 40);
            ctx.lineTo(x, y);
            ctx.lineTo(x + 4, y + 40);
            ctx.closePath();
            ctx.fill();
            ctx.fillRect(x - 3, y + 40, 6, 12);

            ctx.fillStyle = color;
            ctx.fillRect(x - 6, y + 52, 12, 32);
            
            ctx.fillStyle = "#1a1a1a";
            ctx.fillRect(x - 8, y + 50, 16, 4);
            ctx.fillRect(x - 5, y + 84, 10, 4);

            ctx.restore();
        }

        function drawStuckKnives() {
            stuckKnives.forEach(k => {
                ctx.save();
                ctx.translate(log.x, log.y);
                ctx.rotate(k.angle);
                // లాగ్ ఎడ్జ్ దగ్గర కరెక్ట్‌గా గుచ్చుకునేలా పొజిషన్ చేయడం[span_3](start_span)[span_3](end_span)
                drawKnife(0, -log.radius, true, k.color);
                ctx.restore();
            });
            drawKnife(currentKnife.x, currentKnife.y, false);
        }

        function drawLeftIcons() {
            let limit = Math.min(knivesLeft, 12);
            for (let i = 0; i < limit; i++) {
                ctx.save();
                ctx.translate(25, 540 + (i * 10));
                ctx.scale(0.3, 0.3);
                drawKnife(0, 0, true);
                ctx.restore();
            }
        }

        function drawStore() {
            ctx.fillStyle = "rgba(4, 21, 35, 0.96)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#ffcc00";
            ctx.font = "bold 24px 'Segoe UI', sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("KNIFE STORE", canvas.width / 2, 50);

            ctx.fillStyle = "#ffffff";
            ctx.font = "14px 'Segoe UI', sans-serif";
            ctx.fillText("Unlock & Equip Epic Knives", canvas.width / 2, 75);

            let startX = 45;
            let startY = 110;
            let spacingX = 105;
            let spacingY = 105;

            knivesList.forEach((knife, index) => {
                let col = index % 3;
                let row = Math.floor(index / 3);
                let x = startX + (col * spacingX);
                let y = startY + (row * spacingY);

                ctx.fillStyle = (currentKnifeIndex === index) ? "#103748" : "#0d2b38";
                ctx.strokeStyle = (currentKnifeIndex === index) ? "#00e676" : "#ffffff33";
                ctx.lineWidth = 2;
                ctx.fillRect(x, y, 90, 95);
                ctx.strokeRect(x, y, 90, 95);

                ctx.save();
                ctx.translate(x + 45, y + 40);
                ctx.scale(0.45, 0.45);
                drawKnife(0, -30, true, knife.color);
                ctx.restore();

                ctx.fillStyle = knife.unlocked ? "#00e676" : "#ffcc00";
                ctx.font = "bold 11px 'Segoe UI', sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(knife.unlocked ? (currentKnifeIndex === index ? "ACTIVE" : "EQUIP") : `🍎 ${knife.price}`, x + 45, y + 82);
            });

            ctx.fillStyle = "#ffffff";
            ctx.font = "13px 'Segoe UI', sans-serif";
            ctx.fillText("Click any item to select or buy!", canvas.width / 2, 630);
        }

        function update() {
            if (isInStore || isGameOver || isStageCleared) return;

            log.angle += log.speed * log.direction;
            apple.angle += log.speed * log.direction;

            if (screenShake > 0) screenShake--;

            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= p.decay;
                if (p.alpha <= 0) particles.splice(index, 1);
            });

            if (currentKnife.moving) {
                currentKnife.y -= 27;

                let distance = Math.hypot(currentKnife.x - log.x, currentKnife.y - log.y);
                if (distance <= log.radius + 10) {
                    
                    if (!apple.collected) {
                        let knifeAngle = Math.atan2(currentKnife.y - log.y, currentKnife.x - log.x) - log.angle;
                        let diffAngle = Math.abs(knifeAngle - apple.angle);
                        if (diffAngle < 0.3) {
                            apple.collected = true;
                            apples += 35; // యాపిల్స్‌కి మరింత ఎక్కువ బోనస్
                            spawnParticles(currentKnife.x, currentKnife.y, 25, true);
                            playSound('apple');
                        }
                    }

                    for (let k of stuckKnives) {
                        let angleDiff = Math.abs(k.angle - (Math.atan2(currentKnife.y - log.y, currentKnife.x - log.x) - log.angle));
                        if (angleDiff < 0.26 || angleDiff > Math.PI * 2 - 0.26) {
                            isGameOver = true;
                            screenShake = 22;
                            spawnParticles(currentKnife.x, currentKnife.y, 35, true);
                            playSound('crash');
                            return;
                        }
                    }

                    stuckKnives.push({ 
                        angle: Math.atan2(currentKnife.y - log.y, currentKnife.x - log.x) - log.angle,
                        color: knivesList[currentKnifeIndex].color 
                    });
                    score += 20;
                    knivesLeft--;
                    screenShake = 6;
                    spawnParticles(currentKnife.x, log.y + log.radius, 12, false);
                    playSound('hit');

                    currentKnife.moving = false;
                    currentKnife.y = 580;

                    if (knivesLeft === 0) {
                        isStageCleared = true;
                        apples += 15; // స్టేజ్ క్లియర్ బోనస్ ఆపిల్స్
                        playSound('clear');
                    }
                }
            }
        }

        function render() {
            ctx.save();
            if (screenShake > 0) {
                let ox = (Math.random() - 0.5) * 12;
                let oy = (Math.random() - 0.5) * 12;
                ctx.translate(ox, oy);
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (isInStore) {
                drawStore();
                ctx.restore();
                return;
            }

            drawLog();
            drawLeftIcons();
            drawStuckKnives();

            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            if (isGameOver) {
                ctx.fillStyle = "rgba(4, 15, 24, 0.92)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ff1744";
                ctx.font = "bold 32px 'Segoe UI', sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 20);
                ctx.font = "16px 'Segoe UI', sans-serif";
                ctx.fillStyle = "#ffffff";
                ctx.fillText("Click anywhere to restart", canvas.width / 2, canvas.height / 2 + 25);
            } else if (isStageCleared) {
                ctx.fillStyle = "rgba(4, 15, 24, 0.92)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#00e676";
                ctx.font = "bold 30px 'Segoe UI', sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(`STAGE ${stage} CLEARED!`, canvas.width / 2, canvas.height / 2 - 20);
                ctx.font = "16px 'Segoe UI', sans-serif";
                ctx.fillStyle = "#ffffff";
                ctx.fillText(stage >= maxStages ? "You Completed All 50 Levels! 🎉" : "Click to advance next stage", canvas.width / 2, canvas.height / 2 + 25);
            }

            ctx.restore();

            document.getElementById("scoreVal").innerText = score;
            document.getElementById("appleVal").innerText = "🍎 " + apples;
            document.getElementById("stageVal").innerText = "STAGE " + stage + " / " + maxStages;
            document.getElementById("storeBtn").style.display = (isGameOver || isStageCleared) ? "none" : "block";
        }

        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        canvas.addEventListener("click", (e) => {
            if (isInStore) {
                let rect = canvas.getBoundingClientRect();
                let mouseX = e.clientX - rect.left;
                let mouseY = e.clientY - rect.top;

                let startX = 45;
                let startY = 110;
                let spacingX = 105;
                let spacingY = 105;

                knivesList.forEach((knife, index) => {
                    let col = index % 3;
                    let row = Math.floor(index / 3);
                    let x = startX + (col * spacingX);
                    let y = startY + (row * spacingY);

                    if (mouseX >= x && mouseX <= x + 90 && mouseY >= y && mouseY <= y + 95) {
                        if (knife.unlocked) {
                            currentKnifeIndex = index;
                        } else if (apples >= knife.price) {
                            apples -= knife.price;
                            knife.unlocked = true;
                            currentKnifeIndex = index;
                        }
                    }
                });
                return;
            }

            if (isGameOver) {
                score = 0;
                apples = 0;
                stage = 1;
                isGameOver = false;
                initStage();
            } else if (isStageCleared) {
                if (stage < maxStages) {
                    stage++;
                    initStage();
                } else {
                    stage = 1;
                    initStage();
                }
            } else if (!currentKnife.moving) {
                currentKnife.moving = true;
            }
        });

        initStage();
        gameLoop();
    </script>
</body>
</html>
