<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knife Hit - Multi-Level Pro</title>
    <style>
        body {
            margin: 0;
            background-color: #0b2531;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            background-color: #0d2b38;
            box-shadow: 0 0 25px rgba(0,0,0,0.6);
            cursor: pointer;
        }
        .top-bar {
            position: absolute;
            top: 20px;
            width: 380px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
        }
        .stage-info {
            text-align: center;
            position: absolute;
            top: 55px;
            font-size: 16px;
            color: #ffcc00;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <span id="scoreText" style="color: #ffcc00;">స్కోర్: 0</span>
        <span id="appleText" style="color: #ff4d4d;">🍎 0</span>
    </div>
    <div class="stage-info">
        <div id="stageText">Stage I</div>
    </div>

    <canvas id="gameCanvas" width="400" height="600"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Web Audio API for Sound Effects
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'hit') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'apple') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.15);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'gameover') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.4);
                gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            } else if (type === 'win') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.1);
                osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.2);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        let score = 0;
        let apples = 0;
        let currentStage = 1;
        let totalKnives = 5;
        let knivesLeft = totalKnives;
        let gameOver = false;
        let stageCleared = false;

        let log = {
            x: canvas.width / 2,
            y: 200,
            radius: 70,
            angle: 0,
            speed: 0.03
        };

        let stuckKnives = [];
        let apple = { angle: 1.5, collected: false };

        let currentKnife = {
            x: canvas.width / 2,
            y: 500,
            width: 12,
            height: 45,
            moving: false
        };

        function initStage() {
            knivesLeft = totalKnives + (currentStage - 1) * 2; // ప్రతి లెవెల్‌కి కత్తులు పెరుగుతాయి
            stuckKnives = [];
            apple.collected = false;
            apple.angle = Math.random() * Math.PI * 2;
            log.speed = 0.025 + (currentStage * 0.008); // లెవెల్ మారుతున్న కొద్దీ స్పీడ్ పెరుగుతుంది
            stageCleared = false;
            currentKnife.moving = false;
            currentKnife.y = 500;
        }

        function drawLog() {
            ctx.save();
            ctx.translate(log.x, log.y);
            ctx.rotate(log.angle);
            
            // రింగ్
            ctx.beginPath();
            ctx.arc(0, 0, log.radius + 6, 0, Math.PI * 2);
            ctx.fillStyle = "#e09f3e";
            ctx.fill();
            ctx.closePath();

            // లాగ్ బాడీ
            ctx.beginPath();
            ctx.arc(0, 0, log.radius, 0, Math.PI * 2);
            ctx.fillStyle = "#f4d35e";
            ctx.fill();

            ctx.lineWidth = 3;
            ctx.strokeStyle = "#e9c46a";
            ctx.beginPath(); ctx.arc(0, 0, log.radius * 0.7, 0, Math.PI * 2); ctx.stroke();
            ctx.beginPath(); ctx.arc(0, 0, log.radius * 0.4, 0, Math.PI * 2); ctx.stroke();

            if (!apple.collected) {
                ctx.save();
                ctx.rotate(apple.angle);
                ctx.translate(0, -log.radius - 12);
                ctx.fillStyle = "red";
                ctx.beginPath();
                ctx.arc(0, 0, 10, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "green";
                ctx.fillRect(-2, -14, 4, 6);
                ctx.restore();
            }

            ctx.restore();
        }

        function drawKnifeGraphic(x, y) {
            ctx.fillStyle = "#e0e0e0";
            ctx.fillRect(x - 3, y, 6, 25);
            ctx.fillStyle = "#d9534f";
            ctx.fillRect(x - 5, y + 25, 10, 20);
        }

        function drawKnives() {
            stuckKnives.forEach(k => {
                ctx.save();
                ctx.translate(log.x, log.y);
                ctx.rotate(k.angle);
                drawKnifeGraphic(0, 0);
                ctx.restore();
            });
            drawKnifeGraphic(currentKnife.x, currentKnife.y);
        }

        function drawSideLeftKnives() {
            let count = Math.min(knivesLeft, 10);
            for (let i = 0; i < count; i++) {
                ctx.save();
                ctx.translate(35, 470 + (i * 12));
                ctx.scale(0.4, 0.4);
                drawKnifeGraphic(0, 0);
                ctx.restore();
            }
        }

        function update() {
            if (gameOver || stageCleared) return;

            log.angle += log.speed;
            apple.angle += log.speed;

            if (currentKnife.moving) {
                currentKnife.y -= 20;

                let dist = Math.hypot(currentKnife.x - log.x, currentKnife.y - log.y);
                if (dist <= log.radius + 15) {
                    
                    // యాపిల్ చెక్
                    if (!apple.collected) {
                        let knifeAngle = Math.atan2(currentKnife.y - log.y, currentKnife.x - log.x) - log.angle;
                        let angleDiff = Math.abs(knifeAngle - apple.angle);
                        if (angleDiff < 0.25) {
                            apple.collected = true;
                            apples += 5;
                            playSound('apple');
                        }
                    }

                    // కత్తుల కొలిషన్ చెక్
                    for (let k of stuckKnives) {
                        let diff = Math.abs(k.angle - (Math.atan2(currentKnife.y - log.y, currentKnife.x - log.x) - log.angle));
                        if (diff < 0.25 || diff > Math.PI * 2 - 0.25) {
                            gameOver = true;
                            playSound('gameover');
                            return;
                        }
                    }

                    stuckKnives.push({ angle: Math.atan2(currentKnife.y - log.y, currentKnife.x - log.x) - log.angle });
                    score += 10;
                    knivesLeft--;
                    playSound('hit');

                    currentKnife.moving = false;
                    currentKnife.y = 500;

                    if (knivesLeft === 0) {
                        stageCleared = true;
                        playSound('win');
                    }
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawLog();
            drawSideLeftKnives();
            drawKnives();

            if (gameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ff4d4d";
                ctx.font = "bold 26px Arial";
                ctx.textAlign = "center";
                ctx.fillText("గేమ్ ఓవర్!", canvas.width / 2, canvas.height / 2 - 20);
                ctx.font = "15px Arial";
                ctx.fillStyle = "white";
                ctx.fillText("మళ్లీ ఆడేందుకు ఇక్కడ క్లిక్ చేయండి", canvas.width / 2, canvas.height / 2 + 20);
            } else if (stageCleared) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#5cb85c";
                ctx.font = "bold 26px Arial";
                ctx.textAlign = "center";
                ctx.fillText(`స్టేజ్ ${currentStage} విజయవంతం!`, canvas.width / 2, canvas.height / 2 - 20);
                ctx.font = "15px Arial";
                ctx.fillStyle = "white";
                ctx.fillText("తదుపరి స్టేజ్ కోసం క్లిక్ చేయండి", canvas.width / 2, canvas.height / 2 + 20);
            }

            document.getElementById("scoreText").innerText = "స్కోర్: " + score;
            document.getElementById("appleText").innerText = "🍎 " + apples;
            document.getElementById("stageText").innerText = "Stage " + currentStage;
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        window.addEventListener("click", () => {
            if (gameOver) {
                score = 0;
                apples = 0;
                currentStage = 1;
                gameOver = false;
                initStage();
            } else if (stageCleared) {
                currentStage++;
                initStage();
            } else if (!currentKnife.moving) {
                currentKnife.moving = true;
            }
        });

        initStage();
        gameLoop();
    </script>
</body>
</html>
