```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temple Run 3D - Advanced Edition</title>
    <!-- Firebase SDK included as requested -->
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js" type="module"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0b0f19;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
            box-sizing: border-box;
        }
        .header-ui {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .hud-card {
            background: rgba(0, 0, 0, 0.75);
            border: 2px solid #c59b27;
            color: #ffd700;
            padding: 10px 20px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            text-shadow: 1px 1px #000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            pointer-events: auto;
        }
        .title-banner {
            text-align: center;
            color: #e6c65c;
            font-size: 32px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 3px 3px #000, 0 0 20px rgba(230, 198, 92, 0.6);
        }
        .footer-ui {
            text-align: center;
            padding-bottom: 10px;
        }
        .instruction {
            display: inline-block;
            background: linear-gradient(135deg, #8b5a2b, #5c3a1e);
            color: #fff;
            padding: 12px 28px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            border: 1px solid #ffd700;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
            pointer-events: auto;
            letter-spacing: 1px;
        }
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.92);
            border: 3px solid #ffd700;
            padding: 35px 55px;
            text-align: center;
            border-radius: 16px;
            color: #fff;
            display: none;
            pointer-events: auto;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.6);
        }
        #game-over h2 {
            color: #ffd700;
            margin-top: 0;
            font-size: 34px;
        }
        #game-over button {
            background: linear-gradient(135deg, #c59b27, #8b5a2b);
            border: 1px solid #ffd700;
            color: #fff;
            padding: 12px 28px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        #game-over button:hover {
            background: #ffd700;
            color: #000;
            transform: scale(1.05);
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffd700;
            font-size: 26px;
            font-weight: bold;
            text-shadow: 2px 2px #000;
            pointer-events: none;
        }
    </style>
    <!-- Three.js Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="loading">Loading Advanced Temple Grounds...</div>
    <div id="canvas-container"></div>

    <div id="ui-overlay">
        <div class="header-ui">
            <div class="hud-card">SCORE: <span id="score-val">0</span></div>
            <div class="hud-card">🪙 COINS: <span id="coin-val">0</span></div>
        </div>
        <div class="title-banner">Temple Run - 3D Endless</div>
        <div class="footer-ui">
            <div class="instruction">Arrow Keys / A,D: Lanes | W / Space: Jump | S: Slide Under</div>
        </div>
    </div>

    <div id="game-over">
        <h2>CAUGHT BY THE MONSTER!</h2>
        <p>The ancient temple guardian got you.</p>
        <p>Final Score: <span id="final-score">0</span></p>
        <button onclick="restartGame()">Try Again</button>
    </div>

    <script>
        // --- 1. SCENE, CAMERA & RENDERER SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x05080f);
        scene.fog = new THREE.FogExp2(0x05080f, 0.022);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3.2, 5.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // --- 2. LIGHTING SYSTEM ---
        const ambientLight = new THREE.AmbientLight(0xfff2cc, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffeedd, 1.4);
        dirLight.position.set(10, 25, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const torchLight = new THREE.PointLight(0xff6600, 2.5, 14);
        torchLight.position.set(0, 3, -4);
        scene.add(torchLight);

        // --- 3. MODULAR INFINITE PATH & OBSTACLES ---
        const laneWidth = 2.4;
        const trackLength = 100;
        const roadGroup = new THREE.Group();
        scene.add(roadGroup);

        const stoneMat = new THREE.MeshStandardMaterial({ color: 0x3d3832, roughness: 0.85 });
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x1f1a15, roughness: 0.9 });
        const obstacleMat = new THREE.MeshStandardMaterial({ color: 0x5c1d1d, roughness: 0.6 }); // Red stone barrier
        const coinMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.8, roughness: 0.2 });

        const segments = [];
        const obstacles = [];
        const coinsList = [];

        for (let i = 0; i < 5; i++) {
            const segment = new THREE.Group();
            
            // Floor
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(8, trackLength), stoneMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            segment.add(floor);

            // Walls
            const leftWall = new THREE.Mesh(new THREE.BoxGeometry(1.5, 8, trackLength), wallMat);
            leftWall.position.set(-4.75, 4, 0);
            segment.add(leftWall);

            const rightWall = new THREE.Mesh(new THREE.BoxGeometry(1.5, 8, trackLength), wallMat);
            rightWall.position.set(4.75, 4, 0);
            segment.add(rightWall);

            // Add obstacles or coins randomly per segment
            if (i > 0) {
                const laneChoice = Math.floor(Math.random() * 3) - 1;
                const obsType = Math.random() > 0.5 ? 'jump' : 'slide'; // Jump over or Slide under
                
                const obsGeo = obsType === 'jump' ? new THREE.BoxGeometry(2, 0.8, 0.8) : new THREE.BoxGeometry(2, 2, 0.8);
                const obsY = obsType === 'jump' ? 0.4 : 1.5;
                const obstacle = new THREE.Mesh(obsGeo, obstacleMat);
                obstacle.position.set(laneChoice * laneWidth, obsY, - (i * 20));
                obstacle.castShadow = true;
                obstacle.userData = { type: obsType, lane: laneChoice };
                segment.add(obstacle);
                obstacles.push(obstacle);

                // Add Collectible Coin
                const coin = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.1, 16), coinMat);
                coin.rotation.x = Math.PI / 2;
                coin.position.set((laneChoice === 0 ? 1 : 0) * laneWidth, 1, - (i * 20) + 5);
                segment.add(coin);
                coinsList.push(coin);
            }

            segment.position.z = -i * trackLength;
            roadGroup.add(segment);
            segments.push(segment);
        }

        // --- 4. 3D HUMAN RUNNER AVATAR ---
        const playerGroup = new THREE.Group();
        
        const skinMat = new THREE.MeshStandardMaterial({ color: 0xd8b29d, roughness: 0.6 });
        const shirtMat = new THREE.MeshStandardMaterial({ color: 0xf5f5f5, roughness: 0.7 }); 
        const pantsMat = new THREE.MeshStandardMaterial({ color: 0x2a3b4c, roughness: 0.8 }); 
        const hairMat = new THREE.MeshStandardMaterial({ color: 0x5c2c16, roughness: 0.5 }); 

        const head = new THREE.Mesh(new THREE.SphereGeometry(0.18, 16, 16), skinMat);
        head.position.set(0, 1.8, 0);
        playerGroup.add(head);

        const hair = new THREE.Mesh(new THREE.SphereGeometry(0.19, 16, 16), hairMat);
        hair.position.set(0, 1.85, -0.02);
        playerGroup.add(hair);

        const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.12, 0.55, 12), shirtMat);
        torso.position.set(0, 1.3, 0);
        playerGroup.add(torso);

        const limbGeo = new THREE.CylinderGeometry(0.045, 0.035, 0.5, 8);
        const leftArm = new THREE.Mesh(limbGeo, shirtMat);
        leftArm.position.set(-0.22, 1.3, 0);
        playerGroup.add(leftArm);

        const rightArm = new THREE.Mesh(limbGeo, shirtMat);
        rightArm.position.set(0.22, 1.3, 0);
        playerGroup.add(rightArm);

        const leftLeg = new THREE.Mesh(limbGeo, pantsMat);
        leftLeg.position.set(-0.09, 0.75, 0);
        playerGroup.add(leftLeg);

        const rightLeg = new THREE.Mesh(limbGeo, pantsMat);
        rightLeg.position.set(0.09, 0.75, 0);
        playerGroup.add(rightLeg);

        playerGroup.position.set(0, 0, 0);
        scene.add(playerGroup);

        // --- 5. CHASING TEMPLE MONSTER ---
        const monkeyGroup = new THREE.Group();
        const monkeyMat = new THREE.MeshStandardMaterial({ color: 0x1f1108, roughness: 0.9 });
        const mHead = new THREE.Mesh(new THREE.SphereGeometry(0.6, 14, 14), monkeyMat);
        mHead.position.set(0, 2.2, 0);
        monkeyGroup.add(mHead);
        
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
        const leftEye = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 8), eyeMat);
        leftEye.position.set(-0.22, 2.3, 0.5);
        monkeyGroup.add(leftEye);
        const rightEye = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 8), eyeMat);
        rightEye.position.set(0.22, 2.3, 0.5);
        monkeyGroup.add(rightEye);

        monkeyGroup.position.set(0, 0, 4.2); // Positioned right behind runner
        scene.add(monkeyGroup);

        document.getElementById('loading').style.display = 'none';

        // --- 6. CONTROLS & GAMEPLAY LOGIC ---
        let currentLane = 0; // -1, 0, 1
        let targetX = 0;
        let isJumping = false;
        let isSliding = false;
        let jumpVelocity = 0;
        let slideTimer = 0;
        
        let gameSpeed = 0.55;
        let score = 0;
        let coins = 0;
        let isGameOver = false;

        window.addEventListener('keydown', (e) => {
            if (isGameOver) return;

            if ((e.key === 'ArrowLeft' || e.key === 'a') && currentLane > -1) {
                currentLane--;
            } else if ((e.key === 'ArrowRight' || e.key === 'd') && currentLane < 1) {
                currentLane++;
            } else if ((e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') && !isJumping && !isSliding) {
                isJumping = true;
                jumpVelocity = 0.26;
            } else if ((e.key === 'ArrowDown' || e.key === 's') && !isJumping && !isSliding) {
                isSliding = true;
                playerGroup.scale.set(1, 0.45, 1);
                slideTimer = 35;
            }
            targetX = currentLane * laneWidth;
        });

        // --- 7. ANIMATION LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            if (isGameOver) return;
            requestAnimationFrame(animate);

            const time = clock.getElapsedTime();

            // Smooth lateral movement
            playerGroup.position.x += (targetX - playerGroup.position.x) * 0.25;

            // Jump handling
            if (isJumping) {
                playerGroup.position.y += jumpVelocity;
                jumpVelocity -= 0.015;
                if (playerGroup.position.y <= 0) {
                    playerGroup.position.y = 0;
                    isJumping = false;
                }
            }

            // Slide handling
            if (isSliding) {
                slideTimer--;
                if (slideTimer <= 0) {
                    isSliding = false;
                    playerGroup.scale.set(1, 1, 1);
                }
            }

            // Limb running motion
            leftArm.rotation.x = Math.sin(time * 16) * 0.8;
            rightArm.rotation.x = -Math.sin(time * 16) * 0.8;
            leftLeg.rotation.x = -Math.sin(time * 16) * 0.8;
            rightLeg.rotation.x = Math.sin(time * 16) * 0.8;

            // Infinite track movement
            segments.forEach(seg => {
                seg.position.z += gameSpeed;
                if (seg.position.z > trackLength / 2) {
                    seg.position.z -= trackLength * segments.length;
                    // Reset obstacles / positions dynamically
                }
            });

            // Collision Detection with Obstacles
            obstacles.forEach(obs => {
                const worldPos = new THREE.Vector3();
                obs.getWorldPosition(worldPos);

                // Check proximity collision
                if (Math.abs(worldPos.z - playerGroup.position.z) < 0.6 && currentLane === obs.userData.lane) {
                    if (obs.userData.type === 'jump' && playerGroup.position.y < 0.4) {
                        triggerGameOver();
                    } else if (obs.userData.type === 'slide' && !isSliding) {
                        triggerGameOver();
                    }
                }
            });

            // Camera banking follow
            camera.position.x = playerGroup.position.x * 0.35;
            camera.position.y = 3.2 + (isJumping ? 0.4 : 0);
            camera.lookAt(playerGroup.position.x * 0.2, 1.5, -3);

            // Score update
            score += Math.floor(gameSpeed * 2);
            document.getElementById('score-val').innerText = score;
            document.getElementById('coin-val').innerText = coins;

            gameSpeed += 0.0002; // Progressive acceleration
            renderer.render(scene, camera);
        }

        function triggerGameOver() {
            isGameOver = true;
            document.getElementById('final-score').innerText = score;
            document.getElementById('game-over').style.display = 'block';
        }

        function restartGame() {
            isGameOver = false;
            score = 0;
            coins = 0;
            gameSpeed = 0.55;
            currentLane = 0;
            targetX = 0;
            playerGroup.position.set(0, 0, 0);
            document.getElementById('game-over').style.display = 'none';
            animate();
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
