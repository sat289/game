<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Temple Run - Jungle River Edition</title>
    <!-- Firebase SDK included as requested -->
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js" type="module"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0b1a11;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #ui-overlay {
            position: absolute;
            top: 0;

            border-radius: 16px;

            display: none;
            pointer-events: auto;
            box-shadow: 0 0 40px rgba(76, 175, 80, 0.6);

            transform: translate(-50%, -50%);

            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px #000;
            pointer-events: none;
        }
    </style>
    <!-- Three.js Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="loading">Loading Jungle River Bridge...</div>
    <div id="canvas-container"></div>

    <div id="ui-overlay">
        <div class="header-ui">
            <div class="hud-card">SCORE: <span id="score-val">0</span></div>
            <div class="hud-card">🪙 <span id="coin-val">0</span></div>
        </div>
        <div class="title-banner">Jungle Bridge Run</div>
        <div class="footer-ui">
            <div class="instruction">Swipe Left/Right: Lanes | Swipe Up: Jump | Swipe Down: Slide</div>
        </div>
    </div>

    <div id="game-over">
        <h2>CAUGHT BY MONSTER!</h2>
        <p>Final Score: <span id="final-score">0</span></p>
        <button onclick="restartGame()">Play Again</button>
    </div>

    <script>
        // --- 1. SETUP SCENE, CAMERA & RENDERER ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a1c12);
        scene.fog = new THREE.FogExp2(0x0a1c12, 0.02);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3.2, 5.2);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // --- 2. LIGHTING SYSTEM ---
        const ambientLight = new THREE.AmbientLight(0xd4edda, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xfff3cd, 1.2);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- 3. OPEN GREENERY, RIVERS & BRIDGE SETUP ---
        const laneWidth = 2.0;
        const trackLength = 100;
        const roadGroup = new THREE.Group();
        scene.add(roadGroup);

        const bridgeMat = new THREE.MeshStandardMaterial({ color: 0x4a3b32, roughness: 0.9 }); // Wooden stone bridge
        const riverMat = new THREE.MeshStandardMaterial({ color: 0x1e88e5, roughness: 0.1, metalness: 0.8 }); // Water river
        const grassMat = new THREE.MeshStandardMaterial({ color: 0x2e7d32, roughness: 0.9 }); // Greenery ground
        const obstacleMat = new THREE.MeshStandardMaterial({ color: 0x6d4c41, roughness: 0.7 }); // Log barrier

        const segments = [];
        const obstacles = [];
        const sceneryElements = [];

        for (let i = 0; i < 5; i++) {
            const segment = new THREE.Group();
            
            // Narrow Center Bridge (No walls on sides!)
            const bridge = new THREE.Mesh(new THREE.BoxGeometry(6, 0.4, trackLength), bridgeMat);
            bridge.position.set(0, -0.2, 0);
            bridge.receiveShadow = true;
            segment.add(bridge);

            // Left & Right Open Greenery Banks & Rivers
            const leftRiver = new THREE.Mesh(new THREE.PlaneGeometry(25, trackLength), riverMat);
            leftRiver.rotation.x = -Math.PI / 2;
            leftRiver.position.set(-15, -0.5, 0);
            segment.add(leftRiver);

            const rightRiver = new THREE.Mesh(new THREE.PlaneGeometry(25, trackLength), riverMat);
            rightRiver.rotation.x = -Math.PI / 2;
            rightRiver.position.set(15, -0.5, 0);
            segment.add(rightRiver);

            // 3D Trees on sides for Greenery effect
            for (let t = -40; t <= 40; t += 20) {
                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.8, 5, 8), bridgeMat);
                trunk.position.set(-8, 2, t);
                segment.add(trunk);
                
                const foliage = new THREE.Mesh(new THREE.ConeGeometry(3, 6, 8), grassMat);
                foliage.position.set(-8, 6, t);
                segment.add(foliage);

                const trunkR = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.8, 5, 8), bridgeMat);
                trunkR.position.set(8, 2, t);
                segment.add(trunkR);

                const foliageR = new THREE.Mesh(new THREE.ConeGeometry(3, 6, 8), grassMat);
                foliageR.position.set(8, 6, t);
                segment.add(foliageR);
            }

            // Random Obstacles on Bridge
            if (i > 0) {
                const laneChoice = Math.floor(Math.random() * 3) - 1;
                const obsType = Math.random() > 0.5 ? 'jump' : 'slide';
                
                const obsGeo = obsType === 'jump' ? new THREE.BoxGeometry(1.6, 0.6, 0.6) : new THREE.BoxGeometry(1.6, 1.6, 0.6);
                const obsY = obsType === 'jump' ? 0.3 : 1.1;
                const obstacle = new THREE.Mesh(obsGeo, obstacleMat);
                obstacle.position.set(laneChoice * laneWidth, obsY, - (i * 20));
                obstacle.castShadow = true;
                obstacle.userData = { type: obsType, lane: laneChoice };
                segment.add(obstacle);
                obstacles.push(obstacle);
            }

            segment.position.z = -i * trackLength;
            roadGroup.add(segment);
            segments.push(segment);
        }

        // --- 4. 3D HUMAN RUNNER AVATAR ---
        const playerGroup = new THREE.Group();
        const skinMat = new THREE.MeshStandardMaterial({ color: 0xd8b29d, roughness: 0.6 });
        const shirtMat = new THREE.MeshStandardMaterial({ color: 0xf5f5f5, roughness: 0.7 }); 
        const pantsMat = new THREE.MeshStandardMaterial({ color: 0x2a3b4c, roughness: 0.8 }); 
        const hairMat = new THREE.MeshStandardMaterial({ color: 0x5c2c16, roughness: 0.5 }); 

        const head = new THREE.Mesh(new THREE.SphereGeometry(0.18, 16, 16), skinMat);
        head.position.set(0, 1.8, 0);
        playerGroup.add(head);

        const hair = new THREE.Mesh(new THREE.SphereGeometry(0.19, 16, 16), hairMat);
        hair.position.set(0, 1.85, -0.02);
        playerGroup.add(hair);

        const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.12, 0.55, 12), shirtMat);
        torso.position.set(0, 1.3, 0);
        playerGroup.add(torso);

        const limbGeo = new THREE.CylinderGeometry(0.045, 0.035, 0.5, 8);
        const leftArm = new THREE.Mesh(limbGeo, shirtMat);
        leftArm.position.set(-0.22, 1.3, 0);
        playerGroup.add(leftArm);

        const rightArm = new THREE.Mesh(limbGeo, shirtMat);
        rightArm.position.set(0.22, 1.3, 0);
        playerGroup.add(rightArm);

        const leftLeg = new THREE.Mesh(limbGeo, pantsMat);
        leftLeg.position.set(-0.09, 0.75, 0);
        playerGroup.add(leftLeg);

        const rightLeg = new THREE.Mesh(limbGeo, pantsMat);
        rightLeg.position.set(0.09, 0.75, 0);
        playerGroup.add(rightLeg);

        playerGroup.position.set(0, 0, 0);
        scene.add(playerGroup);

        // --- 5. CHASING MONSTER ---
        const monkeyGroup = new THREE.Group();
        const monkeyMat = new THREE.MeshStandardMaterial({ color: 0x2e1c0c, roughness: 0.9 });
        const mHead = new THREE.Mesh(new THREE.SphereGeometry(0.55, 12, 12), monkeyMat);
        mHead.position.set(0, 2.1, 0);
        monkeyGroup.add(mHead);
        
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
        const leftEye = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 8), eyeMat);
        leftEye.position.set(-0.2, 2.2, 0.45);
        monkeyGroup.add(leftEye);
        const rightEye = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 8), eyeMat);
        rightEye.position.set(0.2, 2.2, 0.45);
        monkeyGroup.add(rightEye);

        monkeyGroup.position.set(0, 0, 4.0);
        scene.add(monkeyGroup);

        document.getElementById('loading').style.display = 'none';

        // --- 6. TOUCH & KEYBOARD CONTROLS ---
        let currentLane = 0; // -1, 0, 1
        let targetX = 0;
        let isJumping = false;
        let isSliding = false;
        let jumpVelocity = 0;
        let slideTimer = 0;
        
        let gameSpeed = 0.55;
        let score = 0;
        let coins = 0;
        let isGameOver = false;

        let touchStartX = 0;
        let touchStartY = 0;

        window.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        window.addEventListener('touchend', (e) => {
            if (isGameOver) return;
            let deltaX = e.changedTouches[0].clientX - touchStartX;
            let deltaY = e.changedTouches[0].clientY - touchStartY;

            if (Math.abs(deltaX) > Math.abs(deltaY)) {
                if (deltaX > 35 && currentLane < 1) currentLane++;
                else if (deltaX < -35 && currentLane > -1) currentLane--;
            } else {
                if (deltaY < -35 && !isJumping && !isSliding) {
                    isJumping = true;
                    jumpVelocity = 0.25;
                } else if (deltaY > 35 && !isJumping && !isSliding) {
                    isSliding = true;
                    playerGroup.scale.set(1, 0.45, 1);
                    slideTimer = 35;
                }
            }
            targetX = currentLane * laneWidth;
        }, { passive: true });

        window.addEventListener('keydown', (e) => {
            if (isGameOver) return;
            if ((e.key === 'ArrowLeft' || e.key === 'a') && currentLane > -1) currentLane--;
            else if ((e.key === 'ArrowRight' || e.key === 'd') && currentLane < 1) currentLane++;
            else if ((e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') && !isJumping && !isSliding) {
                isJumping = true;
                jumpVelocity = 0.25;
            } else if ((e.key === 'ArrowDown' || e.key === 's') && !isJumping && !isSliding) {
                isSliding = true;
                playerGroup.scale.set(1, 0.45, 1);
                slideTimer = 35;
            }
            targetX = currentLane * laneWidth;
        });

        // --- 7. ANIMATION LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            if (isGameOver) return;
            requestAnimationFrame(animate);

            const time = clock.getElapsedTime();

            playerGroup.position.x += (targetX - playerGroup.position.x) * 0.25;

            if (isJumping) {
                playerGroup.position.y += jumpVelocity;
                jumpVelocity -= 0.015;
                if (playerGroup.position.y <= 0) {
                    playerGroup.position.y = 0;
                    isJumping = false;
                }
            }

            if (isSliding) {
                slideTimer--;
                if (slideTimer <= 0) {
                    isSliding = false;
                    playerGroup.scale.set(1, 1, 1);
                }
            }

            leftArm.rotation.x = Math.sin(time * 16) * 0.8;
            rightArm.rotation.x = -Math.sin(time * 16) * 0.8;
            leftLeg.rotation.x = -Math.sin(time * 16) * 0.8;
            rightLeg.rotation.x = Math.sin(time * 16) * 0.8;

            segments.forEach(seg => {
                seg.position.z += gameSpeed;
                if (seg.position.z > trackLength / 2) {
                    seg.position.z -= trackLength * segments.length;
                }
            });

            obstacles.forEach(obs => {
                const worldPos = new THREE.Vector3();
                obs.getWorldPosition(worldPos);

                if (Math.abs(worldPos.z - playerGroup.position.z) < 0.6 && currentLane === obs.userData.lane) {
                    if (obs.userData.type === 'jump' && playerGroup.position.y < 0.4) {
                        triggerGameOver();
                    } else if (obs.userData.type === 'slide' && !isSliding) {
                        triggerGameOver();
                    }
                }
            });

            camera.position.x = playerGroup.position.x * 0.35;
            camera.position.y = 3.2 + (isJumping ? 0.4 : 0);
            camera.lookAt(playerGroup.position.x * 0.2, 1.5, -3);

            score += Math.floor(gameSpeed * 2);
            document.getElementById('score-val').innerText = score;
            document.getElementById('coin-val').innerText = coins;

            gameSpeed += 0.00015;
            renderer.render(scene, camera);
        }

        function triggerGameOver() {
            isGameOver = true;
            document.getElementById('final-score').innerText = score;
            document.getElementById('game-over').style.display = 'block';
        }

        function restartGame() {
            isGameOver = false;
            score = 0;
            coins = 0;
            gameSpeed = 0.55;
            currentLane = 0;
            targetX = 0;
            playerGroup.position.set(0, 0, 0);
            document.getElementById('game-over').style.display = 'none';
            animate();
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
