<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temple Run - Retro Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #1a1a1a;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: #fff;
        }
        #gameContainer {
            position: relative;
            width: 480px;
            height: 640px;
            background: linear-gradient(to bottom, #4a3b32 0%, #2b1f1d 40%, #1f2421 100%);
            border: 4px solid #8b5a2b;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .ui-element {
            position: absolute;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        #scoreBoard {
            top: 15px;
            left: 15px;
            font-size: 18px;
            color: #ffd700;
        }
        #coinBoard {
            top: 40px;
            left: 15px;
            font-size: 18px;
            color: #ffaa00;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            transition: all 0.3s;
        }
        h1 {
            color: #d4af37;
            font-size: 36px;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        p {
            font-size: 16px;
            margin-bottom: 25px;
            line-height: 1.5;
            color: #ddd;
        }
        button {
            background-color: #8b5a2b;
            color: white;
            border: 2px solid #d4af37;
            padding: 12px 30px;
            font-size: 18px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            box-shadow: 0 4px 0 #5c3a1a;
            transition: 0.1s;
        }
        button:hover {
            background-color: #a06b3a;
        }
        button:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 #5c3a1a;
        }
        .controls-hint {
            margin-top: 30px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <canvas id="gameCanvas" width="480" height="640"></canvas>
        
        <div id="scoreBoard" class="ui-element">SCORE: <span id="scoreVal">0</span></div>
        <div id="coinBoard" class="ui-element">COINS: <span id="coinVal">0</span></div>
        
        <div id="overlay">
            <h1 id="title">TEMPLE RUN</h1>
            <p id="description">Escape the demon monkeys! Dodge obstacles and collect golden coins along the ancient pathway.</p>
            <button id="actionBtn" onclick="initGame()">START RUN</button>
            <div class="controls-hint">
                Controls:<br>
                ⬅️ Left Arrow / A — Move Left<br>
                ➡️ Right Arrow / D — Move Right<br>
                ⬆️ Up Arrow / W / Space — Jump
            </div>
        </div>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI Elements
    const overlay = document.getElementById('overlay');
    const title = document.getElementById('title');
    const description = document.getElementById('description');
    const actionBtn = document.getElementById('actionBtn');
    const scoreVal = document.getElementById('scoreVal');
    const coinVal = document.getElementById('coinVal');

    // Game state configuration
    let gameActive = false;
    let score = 0;
    let coins = 0;
    let speed = 5;
    let distanceTraveled = 0;

    // Track layout configuration (3 lanes)
    const lanes = [-1, 0, 1]; // Left, Center, Right
    
    // Player Configuration
    let player = {
        lane: 0,          // Current Target Lane (-1, 0, 1)
        currentX: 240,    // Visual X-coordinate interpolation
        y: 500,           // Base ground level height mapping
        jumpY: 0,         // Active jump altitude modifier
        isJumping: false,
        jumpVelocity: 0,
        gravity: 0.6,
        width: 30,
        height: 50,
        color: '#ff4757'
    };

    // Entities Arrays
    let obstacles = [];
    let coinEntities = [];
    let decorativeElements = []; // side walls/pillars for speed illusion

    // Event Listeners for Movement
    window.addEventListener('keydown', (e) => {
        if (!gameActive) return;
        
        if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') {
            if (player.lane > -1) player.lane--;
        }
        if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') {
            if (player.lane < 1) player.lane++;
        }
        if ((e.key === 'ArrowUp' || e.key.toLowerCase() === 'w' || e.key === ' ') && !player.isJumping) {
            player.isJumping = true;
            player.jumpVelocity = 12;
        }
    });

    function initGame() {
        // Reset system values
        score = 0;
        coins = 0;
        speed = 6;
        distanceTraveled = 0;
        obstacles = [];
        coinEntities = [];
        decorativeElements = [];
        player.lane = 0;
        player.currentX = 240;
        player.jumpY = 0;
        player.isJumping = false;
        
        // Hide Main Screen
        overlay.style.display = 'none';
        gameActive = true;
        
        // Generate initial side pillars
        for (let i = 0; i < 6; i++) {
            decorativeElements.push({ z: i * 120 });
        }
    }

    function gameOver() {
        gameActive = false;
        overlay.style.display = 'flex';
        title.innerText = "WASTED!";
        title.style.color = "#ff4757";
        description.innerHTML = `The demons caught you.<br><br><strong>Final Score:</strong> ${Math.floor(score)}<br><strong>Coins Collected:</strong> ${coins}`;
        actionBtn.innerText = "RUN AGAIN";
    }

    // Mathematical Perspective Projection function
    // Translates standard (X, Z) lane matrix coordinate system into canvas space coordinates
    function project3D(lane, z, heightModifier = 0) {
        const horizonY = 240; // Vanishing point level
        const screenHeight = 640;
        
        // Normalize Depth Scale (Closer objects scale up exponentially)
        const scale = 120 / (120 + z); 
        const vanishX = 240;
        const laneWidth = 140;

        const x3D = vanishX + (lane * laneWidth * scale);
        const y3D = horizonY + ((screenHeight - horizonY) * scale) - heightModifier * scale;
        const size = 40 * scale;

        return { x: x3D, y: y3D, size: size };
    }

    function spawnEntities() {
        distanceTraveled += speed;
        
        // Progressively ramp up velocity engine 
        if (speed < 18) speed += 0.001;

        // Spawn Side Pillars
        decorativeElements.forEach(p => p.z -= speed);
        if (decorativeElements[0] && decorativeElements[0].z < -5) {
            decorativeElements.shift();
            decorativeElements.push({ z: 650 });
        }

        // Periodic Random Hazard & Asset Generation
        if (Math.random() < 0.02 && (obstacles.length === 0 || obstacles[obstacles.length-1].z < 400)) {
            let targetLane = lanes[Math.floor(Math.random() * lanes.length)];
            let type = Math.random() > 0.3 ? 'tree' : 'low-bar'; // high jumping hurdles vs normal blocks
            obstacles.push({ lane: targetLane, z: 600, type: type });
        }

        if (Math.random() < 0.03 && (coinEntities.length === 0 || coinEntities[coinEntities.length-1].z < 500)) {
            let targetLane = lanes[Math.floor(Math.random() * lanes.length)];
            // Avoid spawning directly inside a known solid hazard
            if (!obstacles.some(o => o.lane === targetLane && Math.abs(o.z - 600) < 50)) {
                coinEntities.push({ lane: targetLane, z: 600 });
            }
        }
    }

    function updatePhysics() {
        // Linear interpolation for smooth horizontal track switching transitions
        const targetX = 240 + (player.lane * 100);
        player.currentX += (targetX - player.currentX) * 0.25;

        // Jump physics trajectory calculation engine
        if (player.isJumping) {
            player.jumpY += player.jumpVelocity;
            player.jumpVelocity -= player.gravity;
            if (player.jumpY <= 0) {
                player.jumpY = 0;
                player.isJumping = false;
            }
        }

        // Process active hazards 
        for (let i = obstacles.length - 1; i >= 0; i--) {
            let obs = obstacles[i];
            obs.z -= speed;

            // Project 3D positions onto 2D viewport
            let proj = project3D(obs.lane, obs.z);

            // Frame collision validation checkpoint
            if (obs.z > 10 && obs.z < 60) { 
                if (player.lane === obs.lane) {
                    let hit = false;
                    if (obs.type === 'tree' && player.jumpY < 30) hit = true; 
                    if (obs.type === 'low-bar' && player.jumpY > 25) hit = false; // can clear low-bars via jump depth
                    else if (obs.type === 'low-bar' && player.jumpY <= 25) hit = true;
