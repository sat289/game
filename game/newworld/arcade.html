<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🕹️ Sheru Bhai Arcade — ST Games (Low-RAM 60fps)</title>
  <link rel="stylesheet" href="./style.css?v=33" />
  <style>
    body.arcade-body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #0f172a 0%, #020617 75%);
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    .arc-header {
      width: 100%;
      max-width: 440px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }
    .arc-title {
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0.4px;
      background: linear-gradient(90deg, #22d3ee, #facc15);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .arc-tabs {
      width: 100%;
      max-width: 440px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }
    .arc-tab {
      padding: 9px 6px;
      border-radius: 12px;
      border: 1px solid rgba(56, 189, 248, 0.35);
      background: rgba(15, 23, 42, 0.85);
      color: #cbd5e1;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }
    .arc-tab.active {
      background: linear-gradient(135deg, #06b6d4, #2563eb);
      color: #ffffff;
      border-color: #fde047;
      box-shadow: 0 0 14px rgba(34, 211, 238, 0.45);
    }
    .arc-stage {
      position: relative;
      width: 100%;
      max-width: 420px;
      border-radius: 18px;
      overflow: hidden;
      border: 2px solid rgba(56, 189, 248, 0.5);
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.65);
      background: #020617;
    }
    #arc-canvas {
      display: block;
      width: 100%;
      height: auto;
      touch-action: none;
    }
    .arc-stats {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      padding: 8px 12px;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.25);
      font-size: 12px;
      font-weight: 800;
    }
    .arc-controls {
      width: 100%;
      max-width: 420px;
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    .arc-btn {
      flex: 1;
      padding: 15px 10px;
      border-radius: 14px;
      border: 1px solid rgba(56, 189, 248, 0.5);
      background: rgba(15, 23, 42, 0.9);
      color: #ffffff;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      touch-action: none;
    }
    .arc-btn.primary {
      background: linear-gradient(135deg, #f59e0b, #ec4899);
      border-color: #fef08a;
    }
    .arc-btn:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body class="arcade-body">
  <div class="arc-header">
    <a href="./index.html" class="back-hub-btn" style="text-decoration:none;">← Back to City</a>
    <div class="arc-title">🦁 SHERU BHAI ARCADE</div>
    <span style="font-size:10px;color:#4ade80;font-weight:800;">60FPS LOW-RAM</span>
  </div>

  <div class="arc-tabs">
    <button class="arc-tab active" data-game="highway">🏎️ Highway Rush</button>
    <button class="arc-tab" data-game="rocket">🚀 ISRO Rocket</button>
    <button class="arc-tab" data-game="cricket">🏏 Super Over</button>
  </div>

  <div class="arc-stage">
    <canvas id="arc-canvas" width="380" height="480"></canvas>
  </div>

  <div class="arc-stats">
    <span id="arc-score">Score: 0</span>
    <span id="arc-info" style="color:#38bdf8;">Tap Start!</span>
    <span id="arc-best" style="color:#facc15;">Best: 0</span>
  </div>

  <div class="arc-controls">
    <button id="arc-left" class="arc-btn">◀ LEFT</button>
    <button id="arc-action" class="arc-btn primary">⚡ PLAY / HIT</button>
    <button id="arc-right" class="arc-btn">RIGHT ▶</button>
  </div>

  <script type="module" src="./arcade-games.js?v=33"></script>
</body>
</html>
