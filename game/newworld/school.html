<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🏫 School & College Campus Inside — Sheru Bhai City 3D</title>
  <link rel="stylesheet" href="./style.css?v=34" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body class="interior-body">
  <div id="int-canvas" style="position:fixed;inset:0;width:100%;height:100%;"></div>

  <div class="int-top-hud glass-card">
    <div>
      <div class="plot-badge" style="margin-bottom:4px;">3D CAMPUS EXPLORER</div>
      <h3 id="int-title" style="margin:0;font-size:15px;">🏫 School & College Campus Inside</h3>
      <p id="int-sub" style="margin:2px 0 0;font-size:11px;color:#94a3b8;">Drag right side to look • Walk outside door to exit!</p>
    </div>
    <button id="btn-exit-city" class="drive-pill danger" style="padding:9px 14px;font-size:12px;">🚪 Exit Outside</button>
  </div>

  <div id="int-floor-bar" class="int-floor-bar hidden"></div>

  <div class="ff-controls-layer">
    <div id="int-joy-base" class="ff-joy-base">
      <div id="int-joy-knob" class="ff-joy-knob"></div>
    </div>
    <div class="ff-action-cluster">
      <button id="int-btn-sprint" class="ff-circle-btn sprint">🏃 RUN</button>
      <button id="int-btn-jump" class="ff-circle-btn jump">⬆ JUMP</button>
    </div>
  </div>

  <script type="module">
    import { bootInteriorScene } from "./interior-engine.js?v=34";
    bootInteriorScene("school");
  </script>
</body>
</html>
