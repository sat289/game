<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🏏 Cricket Stadium Arena Inside — Sheru Bhai City 3D</title>
  <link rel="stylesheet" href="./style.css?v=33" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body class="interior-body">
  <div id="int-canvas" style="position:fixed;inset:0;width:100%;height:100%;"></div>

  <div class="int-top-hud glass-card">
    <div>
      <div class="plot-badge" style="margin-bottom:4px;">3D STADIUM EXPLORER</div>
      <h3 id="int-title" style="margin:0;font-size:15px;">🏏 Cricket Stadium Arena Inside</h3>
      <p id="int-sub" style="margin:2px 0 0;font-size:11px;color:#94a3b8;">Explore Inside in 3D • Drag to Look</p>
    </div>
    <button id="btn-exit-city" class="drive-pill danger" style="padding:9px 14px;font-size:12px;">🚪 Exit to City</button>
  </div>

  <div class="int-touch-controls">
    <div class="drive-pad-left">
      <button id="walk-left" class="drive-ctrl-btn">◀</button>
      <button id="walk-right" class="drive-ctrl-btn">▶</button>
    </div>
    <div class="drive-pedals">
      <button id="walk-down" class="drive-ctrl-btn brake">⬇ BACK</button>
      <button id="walk-up" class="drive-ctrl-btn gas">⬆ WALK</button>
    </div>
  </div>

  <script type="module">
    import { bootInteriorScene } from "./interior-engine.js?v=33";
    bootInteriorScene("stadium");
  </script>
</body>
</html>
