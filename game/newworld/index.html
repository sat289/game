<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Follower Nagaram 3D — ST Games</title>
  <link rel="stylesheet" href="./style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- Public Top HUD (Read-Only Visitor Experience) -->
  <header id="top-hud" class="hud-element">
    <div class="brand-group">
      <a href="https://stgames.online/" class="back-hub-btn" title="Back to ST Games">← Hub</a>
      <div class="brand-badge">
        <div class="brand-title" id="town-title">FOLLOWER NAGARAM</div>
        <div class="brand-stats">
          <span id="stat-day">Day 1</span>
          <span>•</span>
          <span id="stat-houses">0 Places</span>
        </div>
      </div>
    </div>

    <div class="search-box">
      <input type="text" id="search-input" placeholder="Search @username or mall..." autocomplete="off" />
      <button id="search-btn" title="Find in Town">🔍</button>
    </div>
  </header>

  <!-- Read-Only Place / House Info Card -->
  <div id="plot-card" class="glass-card hidden hud-element">
    <button id="close-plot-card" class="close-x">✕</button>
    <div class="plot-badge" id="card-badge">AVAILABLE PLOT</div>
    <h3 id="card-owner">Open Land</h3>
    <p id="card-role">Follow on Instagram to get your building here!</p>
    <div class="card-meta">
      <span id="card-type">OPEN</span>
      <span id="card-day"></span>
    </div>
    <a id="card-website-btn" href="https://stgames.online/" target="_blank" rel="noopener" class="primary-btn full-width hidden" style="display:block;text-align:center;text-decoration:none;">🌐 Open stgames.online</a>
  </div>

  <div id="toast" class="hidden"></div>

  <script type="module" src="./public-app.js"></script>
</body>
</html>
