<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Follower Town 3D — ST Games</title>
  <link rel="stylesheet" href="./style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- Public Top HUD (Read-Only Visitor Experience) -->
  <header id="top-hud" class="hud-element">
    <div class="brand-group">
      <a href="https://stgames.online/" class="back-hub-btn" title="Back to ST Games">← Hub</a>
      <div class="brand-badge">
        <div class="brand-title" id="town-title">FOLLOWER TOWN</div>
        <div class="brand-stats">
          <span id="stat-day">Day 1</span>
          <span>•</span>
          <span id="stat-houses">0 Houses</span>
        </div>
      </div>
    </div>

    <div class="search-box">
      <input type="text" id="search-input" placeholder="Find @username..." autocomplete="off" />
      <button id="search-btn" title="Find My House">🔍</button>
    </div>
  </header>

  <!-- Read-Only Plot Info Card -->
  <div id="plot-card" class="glass-card hidden hud-element">
    <button id="close-plot-card" class="close-x">✕</button>
    <div class="plot-badge" id="card-plot-id">PLOT #1</div>
    <h3 id="card-owner">Available Plot</h3>
    <p id="card-role">Waiting for a follower to move in!</p>
    <div class="card-meta">
      <span id="card-type">EMPTY</span>
      <span id="card-day"></span>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="hidden"></div>

  <script type="module" src="./public-app.js"></script>
</body>
</html>
