<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe 3D</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body class="bg-black text-white flex items-center justify-center min-h-screen m-0 select-none">

  <div class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-3">
    <div class="bg-[#101626] border border-white/15 rounded-3xl p-5 max-w-[390px] w-full flex flex-col items-center relative shadow-[0_10px_40px_rgba(0,0,0,0.8)]">
      
      <h3 class="text-lg font-black text-[#ff3838] tracking-wider mb-2 flex items-center gap-1.5">
        ❌⭕ TIC-TAC-TOE 3D
      </h3>

      <!-- Mode Selector -->
      <div class="flex gap-2 mb-3 w-full">
        <button id="modeBotBtn" class="flex-1 py-1.5 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 border bg-[#00f2fe]/20 border-[#00f2fe] text-[#00f2fe]">
          🤖 vs Bot
        </button>
        <button id="modePvpBtn" class="flex-1 py-1.5 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 border bg-white/5 border-white/10 text-white/60">
          👤 1v1 Local
        </button>
      </div>

      <!-- Difficulty Selector -->
      <div id="difficultyContainer" class="flex gap-2 mb-3 text-[11px] font-semibold items-center">
        <span class="text-white/60">Bot AI:</span>
        <button id="diffEasyBtn" class="px-2 py-0.5 rounded-lg text-white/60">
          Easy
        </button>
        <button id="diffImpossibleBtn" class="px-2 py-0.5 rounded-lg bg-red-500 text-white font-bold">
          Unbeatable 😈
        </button>
      </div>

      <!-- Score Board -->
      <div class="grid grid-cols-3 gap-2 w-full text-center mb-3">
        <div class="bg-white/5 border border-white/10 rounded-xl p-1.5">
          <div class="text-[10px] text-white/60 font-bold">X (YOU)</div>
          <div id="scoreX" class="text-base font-black text-[#00f2fe]">0</div>
        </div>
        <div class="bg-white/5 border border-white/10 rounded-xl p-1.5">
          <div class="text-[10px] text-white/60 font-bold">TIES</div>
          <div id="scoreTies" class="text-base font-black text-[#ffd700]">0</div>
        </div>
        <div class="bg-white/5 border border-white/10 rounded-xl p-1.5">
          <div id="player2Label" class="text-[10px] text-white/60 font-bold">BOT (O)</div>
          <div id="scoreO" class="text-base font-black text-[#ff007f]">0</div>
        </div>
      </div>

      <!-- 3x3 Grid -->
      <div id="boardGrid" class="grid grid-cols-3 gap-2.5 p-3 rounded-2xl bg-gradient-to-br from-[#1b2438] to-[#0a0e18] border border-white/15 shadow-[0_0_25px_rgba(0,0,0,0.6)] w-full aspect-square max-w-[280px]">
        <!-- Cells generated by JS -->
      </div>

      <!-- Status / Message -->
      <div class="mt-4 text-center">
        <div id="statusMessage" class="text-xs text-white/70 font-semibold mb-2">
          Turn: <span class="text-[#00f2fe]">X</span>
        </div>

        <button id="resetBtn" class="bg-white/10 hover:bg-white/20 border border-white/20 px-4 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1.5 active:scale-95 transition mx-auto">
          🔄 Reset Board
        </button>
      </div>

    </div>
  </div>

  <script>
    const winningLines = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
      [0, 3, 6], [1, 4, 7], [2, 5, 8], // Columns
      [0, 4, 8], [2, 4, 6]             // Diagonals
    ];

    let board = Array(9).fill(null);
    let isXNext = true;
    let mode = 'bot'; // 'bot' | 'pvp'
    let difficulty = 'impossible'; // 'easy' | 'impossible'
    let scores = { X: 0, O: 0, ties: 0 };
    let isBotThinking = false;

    const boardGrid = document.getElementById('boardGrid');
    const statusMessage = document.getElementById('statusMessage');
    const scoreXEl = document.getElementById('scoreX');
    const scoreOEl = document.getElementById('scoreO');
    const scoreTiesEl = document.getElementById('scoreTies');
    const player2Label = document.getElementById('player2Label');
    const difficultyContainer = document.getElementById('difficultyContainer');

    const modeBotBtn = document.getElementById('modeBotBtn');
    const modePvpBtn = document.getElementById('modePvpBtn');
    const diffEasyBtn = document.getElementById('diffEasyBtn');
    const diffImpossibleBtn = document.getElementById('diffImpossibleBtn');
    const resetBtn = document.getElementById('resetBtn');

    function checkWinner(squares) {
      for (const [a, b, c] of winningLines) {
        if (squares[a] && squares[a] === squares[b] && squares[a] === squares[c]) {
          return { winner: squares[a], line: [a, b, c] };
        }
      }
      if (squares.every((sq) => sq !== null)) {
        return { winner: 'Tie', line: null };
      }
      return null;
    }

    function minimax(newBoard, depth, isMaximizing) {
      const res = checkWinner(newBoard);
      if (res?.winner === 'O') return 10 - depth;
      if (res?.winner === 'X') return depth - 10;
      if (res?.winner === 'Tie') return 0;

      if (isMaximizing) {
        let maxEval = -Infinity;
        for (let i = 0; i < 9; i++) {
          if (!newBoard[i]) {
            newBoard[i] = 'O';
            const evaluation = minimax(newBoard, depth + 1, false);
            newBoard[i] = null;
            maxEval = Math.max(maxEval, evaluation);
          }
        }
        return maxEval;
      } else {
        let minEval = Infinity;
        for (let i = 0; i < 9; i++) {
          if (!newBoard[i]) {
            newBoard[i] = 'X';
            const evaluation = minimax(newBoard, depth + 1, true);
            newBoard[i] = null;
            minEval = Math.min(minEval, evaluation);
          }
        }
        return minEval;
      }
    }

    function makeBotMove() {
      const available = board.map((val, idx) => (val === null ? idx : null)).filter((val) => val !== null);
      if (available.length === 0) return;

      let move;
      if (difficulty === 'easy' || Math.random() < 0.25) {
        move = available[Math.floor(Math.random() * available.length)];
      } else {
        let bestScore = -Infinity;
        move = available[0];
        for (const idx of available) {
          board[idx] = 'O';
          const score = minimax(board, 0, false);
          board[idx] = null;
          if (score > bestScore) {
            bestScore = score;
            move = idx;
          }
        }
      }

      board[move] = 'O';
      isXNext = true;
      isBotThinking = false;

      const check = checkWinner(board);
      if (check?.winner === 'O') {
        scores.O++;
      } else if (check?.winner === 'Tie') {
        scores.ties++;
      }
      render();
    }

    function handleCellClick(idx) {
      const result = checkWinner(board);
      if (board[idx] || result || isBotThinking) return;

      const currentPlayer = isXNext ? 'X' : 'O';
      board[idx] = currentPlayer;

      const check = checkWinner(board);
      if (check) {
        if (check.winner === 'X') {
          if (typeof confetti === 'function') confetti({ particleCount: 70, spread: 60 });
          scores.X++;
        } else if (check.winner === 'O') {
          scores.O++;
        } else if (check.winner === 'Tie') {
          scores.ties++;
        }
        render();
        return;
      }

      if (mode === 'bot') {
        isXNext = false;
        isBotThinking = true;
        render();
        setTimeout(() => {
          makeBotMove();
        }, 350);
      } else {
        isXNext = !isXNext;
        render();
      }
    }

    function resetGame() {
      board = Array(9).fill(null);
      isXNext = true;
      isBotThinking = false;
      render();
    }

    function updateControlsUI() {
      if (mode === 'bot') {
        modeBotBtn.className = "flex-1 py-1.5 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 border bg-[#00f2fe]/20 border-[#00f2fe] text-[#00f2fe]";
        modePvpBtn.className = "flex-1 py-1.5 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 border bg-white/5 border-white/10 text-white/60";
        difficultyContainer.classList.remove('hidden');
        player2Label.textContent = 'BOT (O)';
      } else {
        modePvpBtn.className = "flex-1 py-1.5 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 border bg-[#ff007f]/20 border-[#ff007f] text-[#ff007f]";
        modeBotBtn.className = "flex-1 py-1.5 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 border bg-white/5 border-white/10 text-white/60";
        difficultyContainer.classList.add('hidden');
        player2Label.textContent = 'O (P2)';
      }

      if (difficulty === 'easy') {
        diffEasyBtn.className = "px-2 py-0.5 rounded-lg bg-emerald-500 text-black font-bold";
        diffImpossibleBtn.className = "px-2 py-0.5 rounded-lg text-white/60";
      } else {
        diffImpossibleBtn.className = "px-2 py-0.5 rounded-lg bg-red-500 text-white font-bold";
        diffEasyBtn.className = "px-2 py-0.5 rounded-lg text-white/60";
      }
    }

    function render() {
      const result = checkWinner(board);

      // Update scores
      scoreXEl.textContent = scores.X;
      scoreOEl.textContent = scores.O;
      scoreTiesEl.textContent = scores.ties;

      // Render cells
      boardGrid.innerHTML = '';
      board.forEach((cell, idx) => {
        const isWinningCell = result?.line?.includes(idx);
        const btn = document.createElement('button');
        
        let classes = "rounded-xl text-3xl font-black flex items-center justify-center border transition-all duration-200 active:scale-95 ";
        if (cell === 'X') {
          classes += "text-[#00f2fe] drop-shadow-[0_0_10px_rgba(0,242,254,0.8)] border-[#00f2fe]/40 bg-[#00f2fe]/10 ";
        } else if (cell === 'O') {
          classes += "text-[#ff007f] drop-shadow-[0_0_10px_rgba(255,0,127,0.8)] border-[#ff007f]/40 bg-[#ff007f]/10 ";
        } else {
          classes += "bg-white/5 border-white/10 hover:bg-white/10 ";
        }

        if (isWinningCell) {
          classes += "ring-2 ring-[#ffd700] scale-105 ";
        }

        btn.className = classes;
        btn.textContent = cell || '';
        btn.addEventListener('click', () => handleCellClick(idx));
        boardGrid.appendChild(btn);
      });

      // Update status message
      if (result) {
        statusMessage.className = "text-sm font-black mb-2";
        if (result.winner === 'Tie') {
          statusMessage.innerHTML = `<span class="text-[#ffd700]">It's a Tie! 🤝</span>`;
        } else {
          const colorClass = result.winner === 'X' ? 'text-[#00f2fe]' : 'text-[#ff007f]';
          statusMessage.innerHTML = `<span class="${colorClass}">🎉 Player ${result.winner} Wins!</span>`;
        }
      } else {
        statusMessage.className = "text-xs text-white/70 font-semibold mb-2";
        const turnColor = isXNext ? 'text-[#00f2fe]' : 'text-[#ff007f]';
        statusMessage.innerHTML = `Turn: <span class="${turnColor}">${isXNext ? 'X' : 'O'}</span>`;
      }
    }

    // Event Listeners
    modeBotBtn.addEventListener('click', () => {
      mode = 'bot';
      updateControlsUI();
      resetGame();
    });

    modePvpBtn.addEventListener('click', () => {
      mode = 'pvp';
      updateControlsUI();
      resetGame();
    });

    diffEasyBtn.addEventListener('click', () => {
      difficulty = 'easy';
      updateControlsUI();
    });

    diffImpossibleBtn.addEventListener('click', () => {
      difficulty = 'impossible';
      updateControlsUI();
    });

    resetBtn.addEventListener('click', resetGame);

    // Initial load
    updateControlsUI();
    render();
  </script>
</body>
</html>
