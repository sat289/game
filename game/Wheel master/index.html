<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wheel Master - 50 Levels Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <header id="game-header">
            <div id="level-indicator">లెవెల్: <span id="current-level">1</span> / 50</div>
            <div id="score-indicator">స్కోర్: <span id="score">0</span></div>
            <button id="pause-btn">పాజ్</button>
        </header>

        <canvas id="gameCanvas" width="800" height="450"></canvas>

        <div id="controls">
            <button id="left-btn">◀ వెనక్కి</button>
            <button id="jump-btn">⬆ జంప్</button>
            <button id="right-btn">ముందుకు ▶</button>
        </div>
 
        <div id="start-screen" class="screen">
            <h1>Wheel Master 3D Style</h1>
            <p>50 ఛాలెంజింగ్ లెవెల్స్‌తో అద్భుతమైన గేమ్!</p>
            <button id="start-btn">గేమ్ ప్రారంభించండి</button>
        </div>

        <div id="pause-screen" class="screen hidden">
            <h2>గేమ్ ఆగిపోయింది (Paused)</h2>
            <button id="resume-btn">తిరిగి ప్రారంభించు</button>
        </div>

        <div id="gameover-screen" class="screen hidden">
            <h2 id="end-title">లెవెల్ పూర్తయింది!</h2>
            <button id="next-btn">తదుపరి లెవెల్</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
