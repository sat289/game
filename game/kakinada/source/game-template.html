<style>

.tb.on{background:#ffc83daa}
@media (pointer:coarse){.tb{display:flex}#help{display:none}}

<script>
"use strict";
const D=JSON.parse(document.getElementById('d').textContent);
const dec=a=>{const o=new Float32Array(a.length);for(let i=0;i<a.length;i++)o[i]=a[i]/10;return o};
const $=id=>document.getElementById(id);
const X0=-5300,Z0=-6400,C=3,GW=Math.ceil(10700/C),GH=Math.ceil(12800/C);

const rgb=h=>[(h>>16&255)/255,(h>>8&255)/255,(h&255)/255];

const sm=t=>t*t*(3-2*t);
// ---------- renderer ----------
const cv=$('c');const R=new THREE.WebGLRenderer({canvas:cv,antialias:true,logarithmicDepthBuffer:true});
R.setPixelRatio(Math.min(devicePixelRatio,1.75));
const scene=new THREE.Scene();scene.background=new THREE.Color(0xbcd9ee);scene.fog=new THREE.Fog(0xbcd9ee,160,1300);
const cam=new THREE.PerspectiveCamera(62,1,.5,2600);
scene.add(new THREE.HemisphereLight(0xffffff,0x887766,.85));
const sun=new THREE.DirectionalLight(0xfff2d8,.9);sun.position.set(-300,500,200);scene.add(sun);
function resize(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',resize);resize();
// ---------- world data ----------
const roads=D.roads.map(r=>({cls:r[0],br:r[1],name:r[2],p:dec(r[3])}));
const WID={5:15,4:12,3:9,2:6.5,1:4.5},RC={5:0x3b3b40,4:0x404045,3:0x48484d,2:0x505055,1:0x5d5b57};
const SEG=[],SG=new Map(),SC=40;
function segAdd(s){const i=SEG.length;SEG.push(s);const hw=s[6]+2;
 const a=Math.floor((Math.min(s[0],s[2])-hw)/SC),b=Math.floor((Math.max(s[0],s[2])+hw)/SC),c=Math.floor((Math.min(s[1],s[3])-hw)/SC),d=Math.floor((Math.max(s[1],s[3])+hw)/SC);
 for(let x=a;x<=b;x++)for(let z=c;z<=d;z++){const k=x*100000+z;let l=SG.get(k);if(!l)SG.set(k,l=[]);l.push(i)}}

 if(l)for(const i of l){const s=SEG[i],dx=s[2]-s[0],dz=s[3]-s[1],L2=dx*dx+dz*dz||1;let t=((x-s[0])*dx+(z-s[1])*dz)/L2;t=t<0?0:t>1?1:t;

// ---------- build ----------
function build(){
 const root=new THREE.Group();scene.add(root);
 const lam=new THREE.MeshLambertMaterial({vertexColors:true,side:THREE.DoubleSide}),bas=new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.DoubleSide});
 // ground
 const gm=new THREE.Mesh(new THREE.PlaneGeometry(40000,40000).rotateX(-Math.PI/2),new THREE.MeshLambertMaterial({color:0xc2c593}));gm.position.y=-.2;root.add(gm);
 const shapeMesh=(p,col,y)=>{const pts=[];for(let i=0;i<p.length;i+=2)pts.push(new THREE.Vector2(p[i],-p[i+1]));const g=new THREE.ShapeGeometry(new THREE.Shape(pts)).rotateX(-Math.PI/2);const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:col,side:THREE.DoubleSide}));m.position.y=y;root.add(m)};
 // sea
 const coast=dec(D.coast),n=coast.length;const sea=Array.from(coast);const ex=Math.max(coast[n-2],coast[0])+6000;

 for(const w of D.water){const p=dec(w[1]);shapeMesh(p,w[0]?0x6f9460:0x4b95b5,-.05);fillPoly(p,2)}

  for(let i=0;i+3<p.length;i+=2){const dx=p[i+2]-p[i],dz=p[i+3]-p[i+1],L=Math.hypot(dx,dz)||1,nx=-dz/L*hw,nz=dx/L*hw,col=rgb(0x4a8fa8);
   wm.quad([p[i]+nx,0,p[i+1]+nz],[p[i+2]+nx,0,p[i+3]+nz],[p[i+2]-nx,0,p[i+3]-nz],[p[i]-nx,0,p[i+1]-nz],[0,1,0],col)}}
 root.add(wm.mesh(bas));
 // roads
 const rm=new MB(false),bm=new MB(true),tl=[];
 for(const r of roads){const p=r.p,m=p.length/2;if(m<2)continue;const w=WID[r.cls],hs=new Float32Array(m);let len=0;const cum=[0];
  for(let i=1;i<m;i++){len+=Math.hypot(p[2*i]-p[2*i-2],p[2*i+1]-p[2*i-1]);cum.push(len)}

  const L=[],Rr=[];

   L.push([p[2*i]-tz*w/2,hs[i]+y0,p[2*i+1]+tx*w/2]);Rr.push([p[2*i]+tz*w/2,hs[i]+y0,p[2*i+1]-tx*w/2])}
  for(let i=0;i<m-1;i++){rm.quad(L[i],L[i+1],Rr[i+1],Rr[i],[0,1,0],col);
   segAdd([p[2*i],p[2*i+1],p[2*i+2],p[2*i+3],hs[i]+y0,hs[i+1]+y0,w/2,r.name||'']);
   if(el&&Math.max(hs[i],hs[i+1])>.4){const cc=rgb(0xb9b6ae);for(const S of[L,Rr]){const A=S[i],B=S[i+1];bm.quad([A[0],A[1]-.8,A[2]],[B[0],B[1]-.8,B[2]],[B[0],B[1]+.9,B[2]],[A[0],A[1]+.9,A[2]],[(S===L?-1:1)*(B[2]-A[2]),0,(S===L?1:-1)*(B[0]-A[0])],cc)}}}
  if(r.cls>=4&&!el){const cm=rgb(0xe9d68a);for(let i=0;i<m-1;i++){const A=[(L[i][0]+Rr[i][0])/2,.13,(L[i][2]+Rr[i][2])/2],B=[(L[i+1][0]+Rr[i+1][0])/2,.13,(L[i+1][2]+Rr[i+1][2])/2];
   const dx=B[0]-A[0],dz=B[2]-A[2],l=Math.hypot(dx,dz)||1,nx=-dz/l*.15,nz=dx/l*.15;rm.quad([A[0]+nx,.13,A[2]+nz],[B[0]+nx,.13,B[2]+nz],[B[0]-nx,.13,B[2]-nz],[A[0]-nx,.13,A[2]-nz],[0,1,0],cm)}}
  if(el){stamp(Array.from(p),w/2,4);if(pk>2.5)for(let s=25;s<len-20;s+=24){let i=1;while(i<m-1&&cum[i]<s)i++;const t=(s-cum[i-1])/((cum[i]-cum[i-1])||1),x=p[2*i-2]+(p[2*i]-p[2*i-2])*t,z=p[2*i-1]+(p[2*i+1]-p[2*i-1])*t,h=hs[i-1]+(hs[i]-hs[i-1])*t;bm.box(x,z,1.6,-.2,h-.6,rgb(0x9a978f))}}
  if(r.cls>=3&&!el)tl.push(r)}
 root.add(rm.mesh(bas));root.add(bm.mesh(lam));
 // buildings
 const bb=new MB(true),pal=[0xd9c7a8,0xe8d8c0,0xc9b79c,0xe5b9a0,0xb8c4cc,0xd7d3c6,0xe9e0a8,0xc7a79a,0xa9c4b5,0xf0c9c9,0xcfd8dc];
 D.buildings.forEach((b,k)=>{const p=dec(b[1]),m=p.length/2;if(m<3)return;fillPoly(p,1);
  let cx=0,cz=0,ar=0;for(let i=0;i<m;i++){const j=(i+1)%m;cx+=p[2*i];cz+=p[2*i+1];ar+=p[2*i]*p[2*j+1]-p[2*j]*p[2*i+1]}cx/=m;cz/=m;ar=Math.abs(ar/2);
  const hr=((k*9301+49297)%233280)/233280;let h=b[0]>0?b[0]:(ar>500?8+hr*5:3.8+hr*4.2);const col=rgb(pal[k%pal.length]),rc=rgb(0x8a8680);
  for(let i=0;i<m;i++){const j=(i+1)%m,ax=p[2*i],az=p[2*i+1],bx=p[2*j],bz=p[2*j+1];let nx=bz-az,nz=-(bx-ax);const l=Math.hypot(nx,nz)||1;nx/=l;nz/=l;
   if(nx*((ax+bx)/2-cx)+nz*((az+bz)/2-cz)<0){nx=-nx;nz=-nz}bb.quad([ax,0,az],[bx,0,bz],[bx,h,bz],[ax,h,az],[nx,0,nz],col)}

 // trees

  for(let s=rnd()*30;s<L;s+=26+rnd()*14){const side=rnd()<.5?-1:1,o=w/2+2.6,x=p[i]+dx*s/L-dz/L*o*side,z=p[i+1]+dz*s/L+dx/L*o*side,k=gi(x,z);if(k<0||G[k])continue;if(groundAt(x,z,0))continue;tp.push(x,z)}}}

// ---------- minimap ----------
const MS=.2,mmOff=document.createElement('canvas');mmOff.width=Math.ceil(10700*MS);mmOff.height=Math.ceil(12800*MS);

 const poly=(p,f)=>{c.beginPath();for(let i=0;i<p.length;i+=2){const[a,b]=T(p[i],p[i+1]);i?c.lineTo(a,b):c.moveTo(a,b)}c.closePath();c.fillStyle=f;c.fill()};
 for(const p of D.parks)poly(dec(p),'#8fb36a');poly(sea,'#2f7fb0');for(const w of D.water)poly(dec(w[1]),w[0]?'#6f9460':'#4b95b5');
 c.lineCap='round';c.strokeStyle='#4a8fa8';for(const r of D.rivers){c.lineWidth=Math.max(2,r[0]*MS);const p=dec(r[1]);c.beginPath();for(let i=0;i<p.length;i+=2){const[a,b]=T(p[i],p[i+1]);i?c.lineTo(a,b):c.moveTo(a,b)}c.stroke()}
 for(const b of D.buildings)poly(dec(b[1]),'#b3ada2');
 for(const pass of[0,1]){for(const r of roads){if((r.br>0)!==!!pass)continue;c.strokeStyle=pass?'#f2994a':r.cls>=4?'#fff':'#f4f1e8';c.lineWidth=Math.max(1.6,WID[r.cls]*MS*(r.cls>=4?1.3:1));const p=r.p;c.beginPath();for(let i=0;i<p.length;i+=2){const[a,b]=T(p[i],p[i+1]);i?c.lineTo(a,b):c.moveTo(a,b)}c.stroke()}}}
const mc=$('mm').getContext('2d');
function drawMini(){mc.clearRect(0,0,300,300);mc.save();mc.beginPath();mc.arc(150,150,150,0,7);mc.clip();mc.fillStyle='#8a9';mc.fillRect(0,0,300,300);
 mc.save();mc.translate(150,150);mc.rotate(car.a+Math.PI);mc.scale(2,2);mc.translate(-(car.x-X0)*MS,-(car.z-Z0)*MS);mc.drawImage(mmOff,0,0);mc.restore();
 if(mis){const k=2*MS,dx=(mis.t.x-car.x)*k,dz=(mis.t.z-car.z)*k,d=Math.hypot(dx,dz),f=d>125?125/d:1;mc.save();mc.translate(150,150);mc.rotate(car.a+Math.PI);mc.fillStyle='#ffc83d';mc.strokeStyle='#000';mc.lineWidth=2;mc.beginPath();mc.arc(dx*f,dz*f,9,0,7);mc.fill();mc.stroke();mc.restore()}
 mc.restore();mc.save();mc.translate(150,150);mc.fillStyle='#e53935';mc.strokeStyle='#fff';mc.lineWidth=3;mc.beginPath();mc.moveTo(0,-14);mc.lineTo(10,10);mc.lineTo(0,5);mc.lineTo(-10,10);mc.closePath();mc.fill();mc.stroke();mc.restore()}
// ---------- car ----------
const car={x:0,z:0,y:0,a:0,v:0,st:0,last:{x:0,z:0,a:0},cash:0};
const carM=new THREE.Group();carM.rotation.order='YXZ';
{const mat=c=>new THREE.MeshLambertMaterial({color:c});const bd=new THREE.Mesh(new THREE.BoxGeometry(1.9,.7,4.3),mat(0xd62828));bd.position.y=.75;carM.add(bd);
 const cb=new THREE.Mesh(new THREE.BoxGeometry(1.6,.6,2.1),mat(0x9fc5e8));cb.position.set(0,1.35,-.2);carM.add(cb);
 for(const[x,z]of[[-.95,1.35],[.95,1.35],[-.95,-1.35],[.95,-1.35]]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,.3,12).rotateZ(Math.PI/2),mat(0x151515));w.position.set(x,.38,z);carM.add(w)}
 for(const x of[-.65,.65]){const l=new THREE.Mesh(new THREE.BoxGeometry(.4,.2,.1),new THREE.MeshBasicMaterial({color:0xfff3b0}));l.position.set(x,.8,2.16);carM.add(l)}scene.add(carM)}
function place(x,z,a){car.x=x;car.z=z;car.a=a;car.v=0;car.y=(groundAt(x,z,0)||{h:0}).h;camSnap=true}
// ---------- input ----------
const K={};addEventListener('keydown',e=>{K[e.code]=1;if(e.code==='KeyR')respawn();if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault()});addEventListener('keyup',e=>K[e.code]=0);
const T={l:0,r:0,g:0,b:0};for(const[id,k]of[['bl','l'],['br','r'],['bg','g'],['bb','b']]){const e=$(id);e.addEventListener('pointerdown',ev=>{T[k]=1;e.classList.add('on');e.setPointerCapture(ev.pointerId)});const up=()=>{T[k]=0;e.classList.remove('on')};e.addEventListener('pointerup',up);e.addEventListener('pointercancel',up)}
// ---------- missions ----------
const pois=D.poi.map(p=>({k:p[0],n:p[1],x:p[2]/10,z:p[3]/10})).filter(p=>Math.abs(p.x)<5000&&Math.abs(p.z)<6000);
const food=pois.filter(p=>p.k==='food'),dest=pois.filter(p=>['shop','hospital','school','gov','worship','transport'].includes(p.k));
let mis=null,beam=null,msgT=0;
const rp=a=>a[Math.floor(Math.random()*a.length)];
function flash(t){const m=$('msg');m.textContent=t;m.style.opacity=1;clearTimeout(msgT);msgT=setTimeout(()=>m.style.opacity=0,2200)}
function newMission(){let a;for(let i=0;i<40;i++){a=rp(food);const d=Math.hypot(a.x-car.x,a.z-car.z);if(d>250&&d<3500)break}
 mis={s:0,a,b:null,t:a,time:0};setBeam(a);updMis()}
function setBeam(t){if(!beam){beam=new THREE.Mesh(new THREE.CylinderGeometry(4,4,300,16,1,true).translate(0,150,0),new THREE.MeshBasicMaterial({color:0xffc83d,transparent:true,opacity:.45,side:THREE.DoubleSide,depthWrite:false}));scene.add(beam)}beam.position.set(t.x,0,t.z)}
function updMis(){$('mis').innerHTML=mis?(mis.s?`📦 Deliver to <b>${mis.b.n}</b> · ${Math.max(0,mis.time|0)}s left`:`🍽️ Pick up food at <b>${mis.a.n}</b>`):''}
function missionTick(dt){if(!mis)return;if(mis.s){mis.time-=dt;if(mis.time<=0){flash('Too slow! New order…');newMission();return}}
 if(Math.hypot(mis.t.x-car.x,mis.t.z-car.z)<16){if(!mis.s){let b;for(let i=0;i<40;i++){b=rp(dest);const d=Math.hypot(b.x-car.x,b.z-car.z);if(d>300&&d<3200)break}
   mis.s=1;mis.b=b;mis.t=b;mis.time=Math.hypot(b.x-car.x,b.z-car.z)/8+50;setBeam(b);flash('Order picked up!')}
  else{const r=Math.round(100+mis.time*2);car.cash+=r;flash('Delivered! +₹'+r);newMission()}}
 $('cash').textContent='₹'+car.cash;updMis()}
// ---------- sim ----------
let camSnap=true,lastSafeT=0,shake=0;
function blocked(x,z,a){const s=Math.sin(a),c=Math.cos(a);for(const[u,w]of[[0,0],[.95,2.1],[-.95,2.1],[.95,-2.1],[-.95,-2.1],[.95,0],[-.95,0]]){const k=gi(x+c*u+s*w,z+(-s)*u+c*w);if(k>=0&&(G[k]&1))return 1}return 0}
function respawn(){car.x=car.last.x;car.z=car.last.z;car.a=car.last.a;car.v=0;car.y=(groundAt(car.x,car.z,0)||{h:0}).h;camSnap=true}
function step(dt){
 const th=(K.KeyW||K.ArrowUp||T.g?1:0)-(K.KeyS||K.ArrowDown||T.b?1:0),sIn=(K.KeyD||K.ArrowRight||T.r?1:0)-(K.KeyA||K.ArrowLeft||T.l?1:0);
 const gd=groundAt(car.x,car.z,car.y),off=!gd;let v=car.v;const boost=K.ShiftLeft||K.ShiftRight;
 let acc=0;if(th>0)acc=(boost?20:15)*Math.max(0,1-v/(boost?50:38));else if(th<0)acc=v>.6?-32:(v>-9?-9:0);
 acc-=v*(.1+(off?.5:0))+Math.sign(v)*.4;if(K.Space)acc-=Math.sign(v)*26;
 v+=acc*dt;if(th===0&&Math.abs(v)<.3)v=0;car.st+=(sIn-car.st)*Math.min(1,dt*7);
 const yaw=car.st*Math.max(-1,Math.min(1,v/5))*(1.7/(1+Math.abs(v)*.05))*(K.Space?1.5:1);car.a-=yaw*dt;
 const s=Math.sin(car.a),c=Math.cos(car.a);let nx=car.x+s*v*dt,nz=car.z+c*v*dt;
 if(car.y<3&&blocked(nx,nz,car.a)){if(!blocked(nx,car.z,car.a)){nz=car.z;v*=.7}else if(!blocked(car.x,nz,car.a)){nx=car.x;v*=.7}else{nx=car.x;nz=car.z;shake=Math.min(1,Math.abs(v)/20);v*=-.3}}
 car.x=nx;car.z=nz;car.v=v;
 const g2=groundAt(car.x,car.z,car.y),hh=g2?g2.h:0,hf=(groundAt(car.x+s*2.1,car.z+c*2.1,car.y)||{h:hh}).h,hb=(groundAt(car.x-s*2.1,car.z-c*2.1,car.y)||{h:hh}).h;
 car.y+=(hh-car.y)*Math.min(1,dt*14);
 const k=gi(car.x,car.z);if(k>=0&&(G[k]&2)&&!(G[k]&4)&&car.y<.6){flash('💦 Splash! Back to the road');respawn()}
 lastSafeT+=dt;if(g2&&k>=0&&!(G[k]&2)&&lastSafeT>1.5&&Math.abs(v)>2){lastSafeT=0;car.last={x:car.x,z:car.z,a:car.a}}
 carM.position.set(car.x,car.y,car.z);carM.rotation.y=car.a;carM.rotation.x=-Math.atan2(hf-hb,4.2)*.9;carM.rotation.z=car.st*Math.min(1,Math.abs(v)/30)*.05;
 // camera
 const dist=9.5+Math.min(4,Math.abs(v)*.1),tx=car.x-s*dist,tz=car.z-c*dist,ty=car.y+4.4+Math.abs(v)*.03;
 if(camSnap){cam.position.set(tx,ty,tz);camSnap=false}else{const f=1-Math.pow(.0009,dt);cam.position.x+=(tx-cam.position.x)*f;cam.position.y+=(ty-cam.position.y)*f;cam.position.z+=(tz-cam.position.z)*f}
 if(shake>0){cam.position.x+=(Math.random()-.5)*shake;cam.position.y+=(Math.random()-.5)*shake*.5;shake=Math.max(0,shake-dt*3)}
 cam.lookAt(car.x+s*7,car.y+1.4,car.z+c*7);const fv=62+Math.min(18,Math.abs(v)*.4);if(Math.abs(cam.fov-fv)>.3){cam.fov+=(fv-cam.fov)*.1;cam.updateProjectionMatrix()}
 $('spd').firstChild.nodeValue=Math.round(Math.abs(v)*3.6);
 let nm=g2?g2.name:'';if(nm||g2)$('street').textContent=nm||'Unnamed road';else{let b=null,bd=3600;for(const p of pois){const d=(p.x-car.x)**2+(p.z-car.z)**2;if(d<bd){bd=d;b=p}}$('street').textContent=b?'Near '+b.n:'Off-road'}
 missionTick(dt);
}
let prev=0,running=false;
function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,(t-prev)/1000||0);prev=t;if(running)step(dt);if(beam)beam.rotation.y+=dt;R.render(scene,cam);if(running)drawMini()}
// ---------- start ----------
setTimeout(()=>{try{build();
 let best=null,bd=1e12;for(const r of roads){if(r.cls<4||r.br)continue;for(let i=0;i<r.p.length;i+=2){const d=r.p[i]**2+r.p[i+1]**2;if(d<bd){bd=d;best={r,i}}}}
 const r=best.r,i=Math.min(best.i,r.p.length-4);const a=Math.atan2(r.p[i+2]-r.p[i],r.p[i+3]-r.p[i+1]);place(r.p[i],r.p[i+1],a);car.last={x:car.x,z:car.z,a};
 carM.position.set(car.x,car.y,car.z);carM.rotation.y=a;cam.position.set(car.x-Math.sin(a)*10,5,car.z-Math.cos(a)*10);cam.lookAt(car.x,1,car.z);
 const b=$('go');b.disabled=false;b.textContent='Start driving';$('ovp').textContent='Roads, flyovers, canals, buildings and coastline are all from your map files.';
 b.onclick=()=>{$('ov').style.display='none';running=true;newMission()};requestAnimationFrame(loop)}catch(e){$('ovp').textContent='Error: '+e.message;console.error(e)}},60);
