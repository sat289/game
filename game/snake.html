<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cyber Snake - Gaming Hub</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body {
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      background: radial-gradient(circle at 50% 50%, #151c33 0%, #080c16 100%);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-3 text-white">

  <!-- Main Game Card -->
  <div class="bg-[#101626] border border-white/15 rounded-3xl p-5 max-w-[380px] w-full flex flex-col items-center relative shadow-[0_10px_40px_rgba(0,0,0,0.8)]">
    
    <!-- Close / Exit button back to Gaming Hub -->
    <a href="../index.html" class="absolute top-4 right-4 text-white/60 hover:text-white p-2 rounded-full bg-white/5 active:scale-95 transition" title="Exit to Hub">
      <i class="fa-solid fa-xmark text-lg"></i>
    </a>

    <h3 class="text-lg font-black text-[#00f2fe] tracking-wider mb-2 flex items-center gap-1.5">
      🐍 CYBER SNAKE
    </h3>

    <!-- Score Header -->
    <div class="flex justify-between w-full text-xs font-black uppercase tracking-wider mb-3 px-2">
      <span id="scoreText" class="text-[#00f0ff] drop-shadow-[0_0_8px_rgba(0,240,255,0.6)]">
        SCORE: 0
      </span>
      <span id="highScoreText" class="text-[#ff007b] drop-shadow-[0_0_8px_rgba(255,0,123,0.6)]">
        BEST: 0
      </span>
    </div>

    <!-- Canvas Frame -->
    <div class="relative rounded-2xl p-[3px] bg-gradient-to-br from-[#00f0ff] to-[#ff007b] shadow-[0_0_30px_rgba(108,92,231,0.4)]">
      <canvas id="gameCanvas" width="320" height="320" class="block bg-[#0d0c15] rounded-[13px]"></canvas>

      <!-- Game Over Modal Overlay -->
      <div id="gameOverOverlay" class="hidden absolute inset-0 bg-black/85 rounded-[13px] flex flex-col items-center justify-center p-4">
        <span class="text-2xl font-black text-[#ff3838] tracking-widest mb-1">GAME OVER</span>
        <p id="finalScoreText" class="text-xs text-white/80 mb-3">Final Score: 0</p>
        <button id="restartBtn" class="bg-gradient-to-r from-[#00f2fe] to-[#0072ff] text-slate-950 font-black px-4 py-2 rounded-xl text-xs flex items-center gap-1.5 shadow-lg active:scale-95 transition">
          <i class="fa-solid fa-rotate-left"></i> PLAY AGAIN
        </button>
      </div>
    </div>

    <!-- Mobile D-Pad Touch Controls -->
    <div class="grid grid-cols-3 gap-2 mt-4">
      <div></div>
      <button id="btnUp" class="w-14 h-14 bg-white/5 hover:bg-white/10 active:bg-[#00f0ff]/30 active:scale-95 border border-white/15 rounded-xl flex items-center justify-center text-[#00f0ff] transition text-xl">
        <i class="fa-solid fa-arrow-up"></i>
      </button>
      <div></div>

      <button id="btnLeft" class="w-14 h-14 bg-white/5 hover:bg-white/10 active:bg-[#00f0ff]/30 active:scale-95 border border-white/15 rounded-xl flex items-center justify-center text-[#00f0ff] transition text-xl">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
      <button id="btnDown" class="w-14 h-14 bg-white/5 hover:bg-white/10 active:bg-[#00f0ff]/30 active:scale-95 border border-white/15 rounded-xl flex items-center justify-center text-[#00f0ff] transition text-xl">
        <i class="fa-solid fa-arrow-down"></i>
      </button>
      <button id="btnRight" class="w-14 h-14 bg-white/5 hover:bg-white/10 active:bg-[#00f0ff]/30 active:scale-95 border border-white/15 rounded-xl flex items-center justify-center text-[#00f0ff] transition text-xl">
        <i class="fa-solid fa-arrow-right"></i>
      </button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreText = document.getElementById('scoreText');
    const highScoreText = document.getElementById('highScoreText');
    const finalScoreText = document.getElementById('finalScoreText');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const restartBtn = document.getElementById('restartBtn');

    const gridSize = 16;
    const tileCount = 20;

    let score = 0;
    let highScore = parseInt(localStorage.getItem('cyber_snake_hi') || '0', 10);
    highScoreText.textContent = `BEST: ${highScore}`;

    let snake = [
      { x: 10, y: 10 },
      { x: 10, y: 11 },
      { x: 10, y: 12 }
    ];
    let dir = { x: 0, y: -1 };
    let nextDir = { x: 0, y: -1 };
    let food = { x: 5, y: 5 };
    let speed = 110;
    let isGameOver = false;
    let loopTimeout = null;

    function generateFood() {
      let newFood;
      while (true) {
        newFood = {
          x: Math.floor(Math.random() * tileCount),
          y: Math.floor(Math.random() * tileCount)
        };
        const collidesWithSnake = snake.some(s => s.x === newFood.x && s.y === newFood.y);
        if (!collidesWithSnake) break;
      }
      food = newFood;
    }

    function changeDirection(dx, dy) {
      if (dx !== 0 && dir.x === -dx) return;
      if (dy !== 0 && dir.y === -dy) return;
      nextDir = { x: dx, y: dy };
    }

    function resetGame() {
      if (loopTimeout) clearTimeout(loopTimeout);
      snake = [
        { x: 10, y: 10 },
        { x: 10, y: 11 },
        { x: 10, y: 12 }
      ];
      dir = { x: 0, y: -1 };
      nextDir = { x: 0, y: -1 };
      score = 0;
      speed = 110;
      isGameOver = false;
      scoreText.textContent = `SCORE: 0`;
      gameOverOverlay.classList.add('hidden');
      generateFood();
      tick();
    }

    function triggerGameOver() {
      isGameOver = true;
      finalScoreText.textContent = `Final Score: ${score}`;
      gameOverOverlay.classList.remove('hidden');
    }

    function tick() {
      if (isGameOver) return;

      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // Wall Collision
      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        triggerGameOver();
        return;
      }

      // Self Collision
      if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
        triggerGameOver();
        return;
      }

      snake.unshift(head);

      // Check Food
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreText.textContent = `SCORE: ${score}`;
        if (score > highScore) {
          highScore = score;
          highScoreText.textContent = `BEST: ${highScore}`;
          localStorage.setItem('cyber_snake_hi', highScore.toString());
        }
        generateFood();
        speed = Math.max(65, speed - 1);
      } else {
        snake.pop();
      }

      // Render
      render();

      loopTimeout = setTimeout(tick, speed);
    }

    function render() {
      ctx.fillStyle = '#0d0c15';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid Lines
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
      ctx.lineWidth = 1;
      for (let i = 0; i < tileCount; i++) {
        ctx.beginPath();
        ctx.moveTo(i * gridSize, 0);
        ctx.lineTo(i * gridSize, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i * gridSize);
        ctx.lineTo(canvas.width, i * gridSize);
        ctx.stroke();
      }

      // Draw Food
      ctx.shadowBlur = 12;
      ctx.shadowColor = '#ff007b';
      ctx.fillStyle = '#ff007b';
      ctx.beginPath();
      ctx.arc(
        food.x * gridSize + gridSize / 2,
        food.y * gridSize + gridSize / 2,
        gridSize / 2 - 2,
        0,
        Math.PI * 2
      );
      ctx.fill();

      // Draw Snake
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#00f0ff';
      snake.forEach((seg, idx) => {
        ctx.fillStyle = idx === 0 ? '#00f0ff' : (idx % 2 === 0 ? '#38bdf8' : '#818cf8');
        ctx.fillRect(
          seg.x * gridSize + 1,
          seg.y * gridSize + 1,
          gridSize - 2,
          gridSize - 2
        );
      });
      ctx.shadowBlur = 0;
    }

    // Keyboard controls
    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'KeyW'].includes(e.code)) {
        e.preventDefault();
        changeDirection(0, -1);
      } else if (['ArrowDown', 'KeyS'].includes(e.code)) {
        e.preventDefault();
        changeDirection(0, 1);
      } else if (['ArrowLeft', 'KeyA'].includes(e.code)) {
        e.preventDefault();
        changeDirection(-1, 0);
      } else if (['ArrowRight', 'KeyD'].includes(e.code)) {
        e.preventDefault();
        changeDirection(1, 0);
      }
    });

    // Touch button bindings
    document.getElementById('btnUp').onclick = () => changeDirection(0, -1);
    document.getElementById('btnDown').onclick = () => changeDirection(0, 1);
    document.getElementById('btnLeft').onclick = () => changeDirection(-1, 0);
    document.getElementById('btnRight').onclick = () => changeDirection(1, 0);
    restartBtn.onclick = resetGame;

    // Start initial game
    resetGame();
  </script>
</body>
</html>
