<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wave Space</title>

<style>
* {
  box-sizing: border-box;
  user-select: none;
}

body {
  margin: 0;
  overflow: hidden;
  background: #050816;
  font-family: Arial, sans-serif;
}

canvas {
  display: block;
  width: 100vw;
  height: 100vh;
}

#scoreBox {
  position: fixed;
  top: 20px;
  left: 0;
  width: 100%;
  text-align: center;
  color: white;
  font-size: 28px;
  font-weight: bold;
  z-index: 2;
}

#startScreen,
#gameOver {
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  color: white;
  text-align: center;
  z-index: 3;
  background: rgba(0,0,0,.35);
}

#gameOver {
  display: none;
}

h1 {
  font-size: 42px;
  margin: 0 0 15px;
}

p {
  font-size: 18px;
}

button {
  padding: 14px 30px;
  border: none;
  border-radius: 10px;
  font-size: 18px;
  cursor: pointer;
  background: #00e5ff;
  color: #001018;
  font-weight: bold;
}
</style>
</head>

<body>

<div id="scoreBox">Score: <span id="score">0</span></div>

<div id="startScreen">
  <h1>WAVE SPACE</h1>
  <p>Hold SPACE / Click / Touch to fly up</p>
  <button onclick="startGame()">START GAME</button>
</div>

<div id="gameOver">
  <h1>GAME OVER</h1>
  <p>Your Score: <span id="finalScore">0</span></p>
  <button onclick="startGame()">PLAY AGAIN</button>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();

window.addEventListener("resize", resize);

let running = false;
let holding = false;
let score = 0;
let speed = 5;
let frame = 0;
let obstacles = [];

const player = {
  x: 150,
  y: 300,
  size: 24,
  velocity: 0,
  rotation: 0
};

function resetGame() {
  score = 0;
  speed = 5;
  frame = 0;
  obstacles = [];

  player.x = Math.min(150, canvas.width * 0.25);
  player.y = canvas.height / 2;
  player.velocity = 0;

  document.getElementById("score").textContent = score;
}

function startGame() {
  resetGame();

  document.getElementById("startScreen").style.display = "none";
  document.getElementById("gameOver").style.display = "none";

  running = true;
}

function createObstacle() {
  const gap = Math.max(150, canvas.height * 0.28);
  const margin = 70;

  const maxTop = canvas.height - gap - margin * 2;
  const topHeight = margin + Math.random() * maxTop;

  obstacles.push({
    x: canvas.width + 80,
    width: 70,
    topHeight: topHeight,
    bottomY: topHeight + gap,
    passed: false
  });
}

function update() {
  if (!running) return;

  frame++;

  // Wave movement
  if (holding) {
    player.velocity -= 0.55;
    player.rotation -= 0.08;
  } else {
    player.velocity += 0.55;
    player.rotation += 0.08;
  }

  player.velocity = Math.max(-9, Math.min(9, player.velocity));
  player.y += player.velocity;

  // Create obstacles
  if (frame % 110 === 0) {
    createObstacle();
  }

  // Move obstacles
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const obs = obstacles[i];
    obs.x -= speed;

    if (!obs.passed && obs.x + obs.width < player.x) {
      obs.passed = true;
      score++;
      document.getElementById("score").textContent = score;

      if (score % 5 === 0) {
        speed += 0.4;
      }
    }

    if (obs.x + obs.width < -20) {
      obstacles.splice(i, 1);
    }
  }

  // Screen collision
  if (
    player.y - player.size / 2 <= 0 ||
    player.y + player.size / 2 >= canvas.height
  ) {
    endGame();
  }

  // Obstacle collision
  for (const obs of obstacles) {
    const left = player.x - player.size / 2;
    const right = player.x + player.size / 2;
    const top = player.y - player.size / 2;
    const bottom = player.y + player.size / 2;

    const insideX =
      right > obs.x &&
      left < obs.x + obs.width;

    const hitTop = top < obs.topHeight;
    const hitBottom = bottom > obs.bottomY;

    if (insideX && (hitTop || hitBottom)) {
      endGame();
    }
  }
}

function drawBackground() {
  ctx.fillStyle = "#050816";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Stars
  ctx.fillStyle = "rgba(255,255,255,0.35)";
  for (let i = 0; i < 70; i++) {
    const x = (i * 137 + frame * 0.2) % canvas.width;
    const y = (i * 83) % canvas.height;

    ctx.fillRect(x, y, 2, 2);
  }
}

function drawPlayer() {
  ctx.save();

  ctx.translate(player.x, player.y);
  ctx.rotate(player.rotation);

  // Glow
  ctx.shadowColor = "#00e5ff";
  ctx.shadowBlur = 20;

  ctx.fillStyle = "#00e5ff";
  ctx.fillRect(
    -player.size / 2,
    -player.size / 2,
    player.size,
    player.size
  );

  ctx.fillStyle = "white";
  ctx.fillRect(-5, -5, 10, 10);

  ctx.restore();
}

function drawObstacles() {
  for (const obs of obstacles) {

    ctx.shadowColor = "#9c27ff";
    ctx.shadowBlur = 15;

    ctx.fillStyle = "#7c3aed";

    // Top obstacle
    ctx.fillRect(
      obs.x,
      0,
      obs.width,
      obs.topHeight
    );

    // Bottom obstacle
    ctx.fillRect(
      obs.x,
      obs.bottomY,
      obs.width,
      canvas.height - obs.bottomY
    );

    ctx.shadowBlur = 0;

    // Neon edges
    ctx.fillStyle = "#d8b4fe";

    ctx.fillRect(
      obs.x,
      obs.topHeight - 5,
      obs.width,
      5
    );

    ctx.fillRect(
      obs.x,
      obs.bottomY,
      obs.width,
      5
    );
  }
}

function draw() {
  drawBackground();
  drawObstacles();
  drawPlayer();
}

function endGame() {
  if (!running) return;

  running = false;

  document.getElementById("finalScore").textContent = score;
  document.getElementById("gameOver").style.display = "flex";
}

// Keyboard controls
window.addEventListener("keydown", e => {
  if (e.code === "Space") {
    e.preventDefault();
    holding = true;
  }
});

window.addEventListener("keyup", e => {
  if (e.code === "Space") {
    holding = false;
  }
});

// Mouse controls
window.addEventListener("mousedown", () => {
  holding = true;
});

window.addEventListener("mouseup", () => {
  holding = false;
});

// Touch controls
window.addEventListener("touchstart", e => {
  e.preventDefault();
  holding = true;
}, { passive: false });

window.addEventListener("touchend", () => {
  holding = false;
});

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
