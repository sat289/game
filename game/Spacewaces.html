<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Wave Space</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  overflow: hidden;
  background: #050816;
  font-family: Arial, sans-serif;
}

canvas {
  display: block;
  width: 100vw;
  height: 100vh;
  touch-action: none;
}

#scoreBox {
  position: fixed;
  top: 20px;
  left: 0;
  width: 100%;
  text-align: center;
  color: white;
  font-size: 26px;
  font-weight: bold;
  z-index: 2;
  pointer-events: none;
}

.screen {
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  color: white;
  text-align: center;
  z-index: 10;
  background: rgba(0, 0, 0, 0.45);
}

#gameOver {
  display: none;
}

h1 {
  font-size: 42px;
  margin: 0 0 15px;
}

p {
  font-size: 18px;
  margin: 10px;
}

button {
  padding: 15px 35px;
  margin-top: 20px;
  border: none;
  border-radius: 12px;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
  background: #00e5ff;
  color: #001018;
}
</style>
</head>

<body>

<div id="scoreBox">
  Score: <span id="score">0</span>
</div>

<div id="startScreen" class="screen">
  <h1>WAVE SPACE</h1>
  <p>Hold the screen to fly up</p>
  <button id="startButton">START GAME</button>
</div>

<div id="gameOver" class="screen">
  <h1>GAME OVER</h1>
  <p>Your Score: <span id="finalScore">0</span></p>
  <button id="restartButton">PLAY AGAIN</button>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const startScreen = document.getElementById("startScreen");
const gameOverScreen = document.getElementById("gameOver");
const startButton = document.getElementById("startButton");
const restartButton = document.getElementById("restartButton");

let running = false;
let holding = false;
let score = 0;
let speed = 5;
let frame = 0;
let obstacles = [];

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

resizeCanvas();
window.addEventListener("resize", resizeCanvas);

const player = {
  x: 150,
  y: 300,
  size: 28,
  velocity: 0,
  rotation: 0
};

function resetGame() {
  score = 0;
  speed = 5;
  frame = 0;
  obstacles = [];

  player.x = Math.min(150, canvas.width * 0.25);
  player.y = canvas.height / 2;
  player.velocity = 0;
  player.rotation = 0;

  document.getElementById("score").textContent = score;
}

function startGame() {
  resetGame();

  holding = false;
  running = true;

  startScreen.style.display = "none";
  gameOverScreen.style.display = "none";
}

startButton.addEventListener("click", startGame);
restartButton.addEventListener("click", startGame);

/* Mobile touch support for buttons */
startButton.addEventListener("touchend", function(e) {
  e.preventDefault();
  startGame();
});

restartButton.addEventListener("touchend", function(e) {
  e.preventDefault();
  startGame();
});

function createObstacle() {
  const gap = Math.max(170, canvas.height * 0.30);
  const margin = 50;

  const availableSpace = canvas.height - gap - margin * 2;

  const topHeight =
    margin + Math.random() * Math.max(50, availableSpace);

  obstacles.push({
    x: canvas.width + 80,
    width: 70,
    topHeight: topHeight,
    bottomY: topHeight + gap,
    passed: false
  });
}

function update() {
  if (!running) return;

  frame++;

  /* Wave movement */
  if (holding) {
    player.velocity -= 0.55;
    player.rotation -= 0.08;
  } else {
    player.velocity += 0.55;
    player.rotation += 0.08;
  }

  player.velocity = Math.max(-9, Math.min(9, player.velocity));
  player.y += player.velocity;

  /* Create obstacles */
  if (frame % 110 === 0) {
    createObstacle();
  }

  /* Move obstacles */
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const obs = obstacles[i];

    obs.x -= speed;

    if (!obs.passed && obs.x + obs.width < player.x) {
      obs.passed = true;

      score++;
      document.getElementById("score").textContent = score;

      if (score % 5 === 0) {
        speed += 0.4;
      }
    }

    if (obs.x + obs.width < 0) {
      obstacles.splice(i, 1);
    }
  }

  /* Screen collision */
  if (
    player.y - player.size / 2 <= 0 ||
    player.y + player.size / 2 >= canvas.height
  ) {
    endGame();
    return;
  }

  /* Obstacle collision */
  for (const obs of obstacles) {
    const playerLeft = player.x - player.size / 2;
    const playerRight = player.x + player.size / 2;
    const playerTop = player.y - player.size / 2;
    const playerBottom = player.y + player.size / 2;

    const insideX =
      playerRight > obs.x &&
      playerLeft < obs.x + obs.width;

    if (
      insideX &&
      (
        playerTop < obs.topHeight ||
        playerBottom > obs.bottomY
      )
    ) {
      endGame();
      return;
    }
  }
}

function drawBackground() {
  ctx.fillStyle = "#050816";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "rgba(255,255,255,0.4)";

  for (let i = 0; i < 60; i++) {
    const x = (i * 137 + frame * 0.3) % canvas.width;
    const y = (i * 83) % canvas.height;

    ctx.fillRect(x, y, 2, 2);
  }
}

function drawObstacles() {
  for (const obs of obstacles) {
    ctx.shadowColor = "#9c27ff";
    ctx.shadowBlur = 15;

    ctx.fillStyle = "#7c3aed";

    ctx.fillRect(
      obs.x,
      0,
      obs.width,
      obs.topHeight
    );

    ctx.fillRect(
      obs.x,
      obs.bottomY,
      obs.width,
      canvas.height - obs.bottomY
    );

    ctx.shadowBlur = 0;

    ctx.fillStyle = "#d8b4fe";

    ctx.fillRect(
      obs.x,
      obs.topHeight - 5,
      obs.width,
      5
    );

    ctx.fillRect(
      obs.x,
      obs.bottomY,
      obs.width,
      5
    );
  }
}

function drawPlayer() {
  ctx.save();

  ctx.translate(player.x, player.y);
  ctx.rotate(player.rotation);

  ctx.shadowColor = "#00e5ff";
  ctx.shadowBlur = 20;

  ctx.fillStyle = "#00e5ff";

  ctx.fillRect(
    -player.size / 2,
    -player.size / 2,
    player.size,
    player.size
  );

  ctx.fillStyle = "white";
  ctx.fillRect(-6, -6, 12, 12);

  ctx.restore();
}

function draw() {
  drawBackground();
  drawObstacles();
  drawPlayer();
}

function endGame() {
  if (!running) return;

  running = false;
  holding = false;

  document.getElementById("finalScore").textContent = score;
  gameOverScreen.style.display = "flex";
}

/* Keyboard controls */
window.addEventListener("keydown", function(e) {
  if (e.code === "Space" && running) {
    e.preventDefault();
    holding = true;
  }
});

window.addEventListener("keyup", function(e) {
  if (e.code === "Space") {
    holding = false;
  }
});

/* Mouse controls - canvas only */
canvas.addEventListener("mousedown", function() {
  if (running) holding = true;
});

canvas.addEventListener("mouseup", function() {
  holding = false;
});

canvas.addEventListener("mouseleave", function() {
  holding = false;
});

/* Mobile touch controls - canvas only */
canvas.addEventListener("touchstart", function(e) {
  if (running) {
    e.preventDefault();
    holding = true;
  }
}, { passive: false });

canvas.addEventListener("touchend", function(e) {
  e.preventDefault();
  holding = false;
}, { passive: false });

canvas.addEventListener("touchcancel", function() {
  holding = false;
});

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
