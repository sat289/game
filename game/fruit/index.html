<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Fruit Merge Reloaded - ST Games</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Loading Screen -->
  <div id="loadingScreen">
    <h1 class="text-3xl font-extrabold mb-4">Fruit Merge Reloaded</h1>
    <div class="w-64 h-2.5 bg-neutral-800 rounded-full overflow-hidden">
      <div id="loadingBarFill" class="h-full bg-amber-400 w-full animate-pulse"></div>
    </div>
  </div>

  <div class="wood-floor"></div>

  <!-- Top HUD -->
  <header class="w-full max-w-md px-3 pt-3 z-20 flex items-center justify-between">
    <a href="../index.html" class="hub-back-btn"><i class="fa-solid fa-arrow-left"><span>Hub</span></a>
    <div id="syncBadge" class="glass-pill px-3 py-1 rounded-full text-xs font-bold text-amber-900">Syncing...</div>
    <div class="flex gap-1.5">
      <button onclick="openLeaderboard()" class="glass-pill w-9 h-9 rounded-full flex items-center justify-center text-amber-600"><i class="fa-solid fa-trophy"></i></button>
      <button onclick="toggleMute()" class="glass-pill w-9 h-9 rounded-full flex items-center justify-center text-amber-800"><i id="muteIcon" class="fa-solid fa-volume-high"></i></button>
    </div>
  </header>

  <!-- Score Board -->
  <section class="w-full max-w-md px-3 z-20 flex items-center justify-between my-1">
    <div class="flex gap-2">
      <div class="glass-pill rounded-2xl px-3 py-1">
        <div class="text-[10px] font-bold text-amber-700">SCORE</div>
        <div id="scoreVal" class="text-xl font-black text-amber-950">0</div>
      </div>
      <div class="glass-pill rounded-2xl px-3 py-1">
        <div class="text-[10px] font-bold text-rose-600">BEST</div>
        <div id="bestScoreVal" class="text-xl font-black text-amber-950">0</div>
      </div>
    </div>
    <div class="glass-pill rounded-2xl px-3 py-1 flex items-center gap-2">
      <div class="text-right text-[10px] font-bold text-amber-700">NEXT</div>
      <canvas id="nextFruitCanvas" width="38" height="38" class="w-9 h-9"></canvas>
    </div>
  </section>

  <div id="hammerNotice" class="hidden fixed top-28 z-30 bg-rose-600 text-white text-xs font-bold px-4 py-1.5 rounded-full shadow-lg animate-bounce">
    🔨 Tap any fruit to smash it!
  </div>

  <main class="relative z-10 flex-1 flex items-center justify-center w-full max-w-md px-2">
    <canvas id="gameCanvas" width="360" height="470" class="rounded-b-2xl"></canvas>
  </main>

  <footer class="w-full max-w-md px-3 pb-3 z-20 flex gap-2">
    <button onclick="activateHammer()" id="btnHammer" class="booster-btn">🔨<span id="hammerCount" class="absolute -top-1 -right-1 bg-rose-600 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center">2</span></button>
    <button onclick="activateShake()" id="btnShake" class="booster-btn">🫨<span id="shakeCount" class="absolute -top-1 -right-1 bg-amber-600 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center">2</span></button>
    <button onclick="activateSwap()" id="btnSwap" class="booster-btn">🔄<span id="swapCount" class="absolute -top-1 -right-1 bg-teal-600 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center">3</span></button>
    <div class="glass-pill flex-1 rounded-2xl px-2 py-1 overflow-hidden">
      <div class="text-[9px] font-bold text-amber-800 mb-0.5 text-center">Evolution Chain →</div>
      <canvas id="evoChainCanvas" width="180" height="24" class="w-full h-6"></canvas>
    </div>
  </footer>

  <!-- Game Over Modal -->
  <div id="gameOverModal" class="fixed inset-0 z-50 hidden bg-slate-950/80 flex items-center justify-center p-4">
    <div class="bg-amber-50 border-4 border-amber-400 rounded-3xl max-w-sm w-full p-6 text-center">
      <h2 class="text-2xl font-black text-amber-950 mb-2">Jar Overflowed!</h2>
      <button onclick="restartGame()" class="w-full py-3 rounded-2xl font-bold bg-teal-600 text-white">Play Again</button>
    </div>
  </div>

  <!-- Leaderboard Modal -->
  <div id="leaderboardModal" class="fixed inset-0 z-50 hidden bg-slate-950/80 flex items-center justify-center p-4">
    <div class="bg-amber-50 border-4 border-amber-400 rounded-3xl max-w-sm w-full p-5 flex flex-col max-h-[80vh]">
      <div class="flex justify-between pb-2 border-b border-amber-200">
        <h3 class="font-black text-amber-950">Leaderboard</h3>
        <button onclick="closeLeaderboard()">✕</button>
      </div>
      <div id="leaderboardList" class="flex-1 overflow-y-auto space-y-2 my-3"></div>
    </div>
  </div>

  <script src="firebase.js"></script>
  <script src="game.js"></script>
</body>
</html>
