<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knife Hit 3D - 20 Levels Pro</title>
    <style>
        body {
            margin: 0;
            background-color: #0b2531;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            background: radial-gradient(circle, #103748 0%, #071922 100%);
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            cursor: pointer;
        }
        .top-bar {
            position: absolute;
            top: 15px;
            width: 380px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
        }
        .stage-info {
            text-align: center;
            position: absolute;
            top: 45px;
            font-size: 16px;
            color: #ffcc00;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <span id="scoreText" style="color: #ffcc00;">స్కోర్: 0</span>
        <span id="appleText" style="color: #ff4d4d;">🍎 0</span>
    </div>
    <div class="stage-info">
        <div id="stageText">Stage 1 / 20</div>
    </div>

    <canvas id="gameCanvas" width="400" height="600"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Web Audio API Sound System
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'hit') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(350, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'apple') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(500, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'gameover') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(140, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            } else if (type === 'win') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.setValueAtTime(660, audioCtx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                osc.start(); osc.stop(audioCtx.currentTime + 0.25);
            }
        }

        let score = 0;
        let apples = 0;
        let currentStage = 1;
        let maxStages = 20;
        let totalKnives = 6;
        let knivesLeft = totalKnives;
        let gameOver = false;
        let stageCleared = false;
        let shakeTimer = 0;

        let log = {
            x: canvas.width / 2,
            y: 190,
            radius: 75,
            angle: 0,
            speed: 0.03,
            direction: 1
        };

        let stuckKnives = [];
        let apple = { angle: 1.5, collected: false };

        let currentKnife = {
            x: canvas.width / 2,
            y: 500,
            width: 14,
            height: 48,
            moving: false
        };

        // లెవెల్ బట్టి కత్తుల రంగులు మారే విధానం
        function getKnifeColors(stage) {
            const themes = [
                { handle: "#d9534f", accent: "#c9302c" }, // Stage 1-5: రెడ్
                { href: "#337ab7", accent: "#286090" },   // Stage 6-10: బ్లూ
                { handle: "#f0ad4e", accent: "#ec971f" }, // Stage 11-15: గోల్డెన్
                { handle: "#5cb85c", accent: "#4cae4c" }  // Stage 16-20: గ్రీన్
            ];
            return themes[Math.floor((stage - 1) / 5)] || themes[0];
        }

        function initStage() {
            knivesLeft = totalKnives + Math.floor(currentStage / 2);
            stuckKnives = [];
            apple.collected = false;
            apple.angle = Math.random() * Math.PI * 2;
            
            // కఠినతను పెంచడం (స్పీడ్ మరియు దిశ మార్పు)
            log.speed = 0.025 + (currentStage * 0.004);
            log.direction = (currentStage % 2 === 0) ? -1 : 1; // ఒక్కో లెవెల్‌లో దిశ మారుతుంది
            
            stageCleared = false;
            currentKnife.moving = false;
            currentKnife.y = 500;
        }

        function drawLog() {
            ctx.save();
            ctx.translate(log.x, log.y);
            ctx.rotate(log.angle);
            
            // 3D వుడెన్ లాగ్ గ్రేడియంట్
            let grad = ctx.createRadialGradient(0, 0, 10, 0, 0, log.radius);
            grad.addColorStop(0, "#f4d35e");
            grad.addColorStop(0.7, "#e09f3e");
            grad.addColorStop(1, "#8b5a2b");

            ctx.beginPath();
            ctx.arc(0, 0, log.radius + 6, 0, Math.PI * 2);
            ctx.fillStyle = "#5c2e0b";
            ctx.fill();
            ctx.closePath();

            ctx.beginPath();
            ctx.arc(0, 0, log.radius, 0, Math.PI * 2);
            ctx.fillStyle = grad;
            ctx.fill();

            // చెక్క రింగ్స్ (Texture)
            ctx.lineWidth = 2;
            ctx.strokeStyle = "rgba(139, 90, 43, 0.4)";
            ctx.beginPath(); ctx.arc(0, 0, log.radius * 0.6, 0, Math.PI * 2); ctx.stroke();
            ctx.beginPath(); ctx.arc(0, 0, log.radius * 0.3, 0, Math.PI * 2); ctx.stroke();

            // యాపిల్ డ్రా చేయడం
            if (!apple.collected) {
                ctx.save();
                ctx.rotate(apple.angle);
                ctx.translate(0, -log.radius - 12);
                ctx.fillStyle = "#ff3333";
                ctx.beginPath();
                ctx.arc(0, 0, 11, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "#2ecc71";
                ctx.fillRect(-2, -15, 4, 7);
                ctx.restore();
            }

            ctx.restore();
        }

        function drawKnifeGraphic(x, y, stage) {
            let colors = getKnifeColors(stage);

            // మెటాలిక్ 3D బ్లేడ్ షేడో & షైన్
            ctx.fillStyle = "#b0b0b0";
            ctx.fillRect(x - 3, y, 6, 28);
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(x - 3, y, 2, 28); // హైలైట్

            // హ్యాండిల్ 3D లుక్
            ctx.fillStyle = colors.handle;
            ctx.fillRect(x - 6, y + 28, 12, 22);
            ctx.fillStyle = colors.accent;
            ctx.fillRect(x - 6, y + 38, 12, 12);
        }

        function drawKnives() {
            stuckKnives.forEach(k => {
                ctx.save();
                ctx.translate(log.x, log.y);
                ctx.rotate(k.angle);
                drawKnifeGraphic(0, 0, currentStage);
                ctx.restore();
            });
            drawKnifeGraphic(currentKnife.x, currentKnife.y, currentStage);
        }

        function drawSideLeftKnives() {
            let count = Math.min(knivesLeft, 12);
            for (let i = 0; i < count; i++) {
                ctx.save();
                ctx.translate(30, 460 + (i * 10));
                ctx.scale(0.35, 0.35);
                drawKnifeGraphic(0, 0, currentStage);
                ctx.restore();
            }
        }

        function update() {
            if (gameOver || stageCleared) return;

            // లాగ్ రొటేషన్ విత్ డైరెక్షన్
            log.angle += log.speed * log.direction;
            apple.angle += log.speed * log.direction;

            if (shakeTimer > 0) shakeTimer--;

            if (currentKnife.moving) {
                currentKnife.y -= 22;

                let dist = Math.hypot(currentKnife.x - log.x, currentKnife.y - log.y);
                if (dist <= log.radius + 15) {
                    
                    // యాపిల్ క్యాచ్ చెక్
                    if (!apple.collected) {
                        let knifeAngle = Math.atan2(currentKnife.y - log.y, currentKnife.x - log.x) - log.angle;
                        let angleDiff = Math.abs(knifeAngle - apple.angle);
                        if (angleDiff < 0.28) {
                            apple.collected = true;
                            apples += 25; // మరింత ఎక్కువ యాపిల్ బోనస్ పాయింట్లు
                            playSound('apple');
                        }
                    }

                    // కత్తుల కొలిషన్ (తాకడం) చెక్
                    for (let k of stuckKnives) {
                        let diff = Math.abs(k.angle - (Math.atan2(currentKnife.y - log.y, currentKnife.x - log.x) - log.angle));
                        if (diff < 0.25 || diff > Math.PI * 2 - 0.25) {
                            gameOver = true;
                            shakeTimer = 15;
                            playSound('gameover');
                            return;
                        }
                    }

                    stuckKnives.push({ angle: Math.atan2(currentKnife.y - log.y, currentKnife.x - log.x) - log.angle });
                    score += 15;
                    knivesLeft--;
                    shakeTimer = 8;
                    playSound('hit');

                    currentKnife.moving = false;
                    currentKnife.y = 500;

                    if (knivesLeft === 0) {
                        stageCleared = true;
                        playSound('win');
                    }
                }
            }
        }

        function draw() {
            ctx.save();
            // స్క్రీన్ షేక్ ఎఫెక్ట్
            if (shakeTimer > 0) {
                let offsetX = (Math.random() - 0.5) * 8;
                let offsetY = (Math.random() - 0.5) * 8;
                ctx.translate(offsetX, offsetY);
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawLog();
            drawSideLeftKnives();
            drawKnives();

            if (gameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ff4d4d";
                ctx.font = "bold 26px Arial";
                ctx.textAlign = "center";
                ctx.fillText("గేమ్ ఓవర్!", canvas.width / 2, canvas.height / 2 - 20);
                ctx.font = "15px Arial";
                ctx.fillStyle = "white";
                ctx.fillText("మళ్లీ ఆడేందుకు ఇక్కడ క్లిక్ చేయండి", canvas.width / 2, canvas.height / 2 + 20);
            } else if (stageCleared) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#5cb85c";
                ctx.font = "bold 24px Arial";
                ctx.textAlign = "center";
                ctx.fillText(`స్టేజ్ ${currentStage} విజయవంతం!`, canvas.width / 2, canvas.height / 2 - 20);
                ctx.font = "15px Arial";
                ctx.fillStyle = "white";
                ctx.fillText(currentStage >= maxStages ? "అన్ని లెవెల్స్ పూర్తి అయ్యాయి! 🎉" : "తదుపరి స్టేజ్ కోసం క్లిక్ చేయండి", canvas.width / 2, canvas.height / 2 + 20);
            }

            ctx.restore();

            document.getElementById("scoreText").innerText = "స్కోర్: " + score;
            document.getElementById("appleText").innerText = "🍎 " + apples;
            document.getElementById("stageText").innerText = `Stage ${currentStage} / ${maxStages}`;
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        window.addEventListener("click", () => {
            if (gameOver) {
                score = 0;
                apples = 0;
                currentStage = 1;
                gameOver = false;
                initStage();
            } else if (stageCleared) {
                if (currentStage < maxStages) {
                    currentStage++;
                    initStage();
                } else {
                    currentStage = 1; // రీస్టార్ట్ ఫ్రమ్ వన్
                    score = 0;
                    initStage();
                }
            } else if (!currentKnife.moving) {
                currentKnife.moving = true;
            }
        });

        initStage();
        gameLoop();
    </script>
</body>
</html>
