<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Glass - Liquid Flow 50 Levels</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #eef2f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
            user-select: none;
        }

        #game-container {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 700px;
            background: #ffffff;
            position: relative;
            box-shadow: 0 12px 35px rgba(0,0,0,0.18);
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid #e2e8f0;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #ffffff;
        }

        .hidden {
            display: none !important;
        }

        /* Level Select Screen */
        #level-select-screen {
            padding: 20px;
            box-sizing: border-box;
            background: #ffffff;
        }

        .header-title {
            text-align: center;
            color: #00acc1;
            font-size: 28px;
            font-weight: 900;
            margin: 15px 0 20px 0;
            letter-spacing: 2px;
        }

        .levels-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            overflow-y: auto;
            max-height: 550px;
            padding: 8px;
            justify-items: center;
        }

        .level-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(145deg, #ffd54f, #ffb300);
            border: none;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(255, 179, 0, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .level-btn:active {
            transform: scale(0.92);
        }

        .level-btn.locked {
            background: #e2e8f0;
            color: #94a3b8;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Gameplay Screen */
        #game-screen {
            background-color: #ffffff;
            background-image: 
                linear-gradient(to right, #f1f5f9 1px, transparent 1px),
                linear-gradient(to bottom, #f1f5f9 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            background: rgba(255,255,255,0.94);
            z-index: 10;
            border-bottom: 1px solid #f1f5f9;
        }

        .icon-btn {
            background: #ffffff;
            border: 2px solid #cbd5e1;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.06);
        }

        .icon-btn:active {
            transform: scale(0.92);
        }

        .level-indicator {
            font-weight: 800;
            color: #334155;
            font-size: 18px;
        }

        .meter-container {
            width: 140px;
            height: 14px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #cbd5e1;
        }

        #ink-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #84cc16, #65a30d);
            transition: width 0.05s linear;
        }

        canvas {
            display: block;
            width: 100%;
            height: calc(100% - 65px);
            cursor: crosshair;
        }

        /* Modal Overlay */
        .modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.55);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(3px);
        }

        .modal-content {
            background: white;
            padding: 28px;
            border-radius: 20px;
            text-align: center;
            width: 260px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.6); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-content h2 {
            margin: 0 0 8px 0;
            color: #0284c7;
            font-size: 26px;
        }

        .stars {
            font-size: 32px;
            margin-bottom: 12px;
        }

        .modal-btn {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            border: none;
            padding: 13px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.35);
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- Level Select Screen -->
    <div id="level-select-screen" class="screen">
        <div class="header-title">LEVELS</div>
        <div class="levels-grid" id="levels-grid"></div>
    </div>

    <!-- Gameplay Screen -->
    <div id="game-screen" class="screen hidden">
        <div class="top-bar">
            <button class="icon-btn" onclick="returnToLevels()">🏠</button>
            <div class="level-indicator" id="current-level-text">LEVEL 1</div>
            <div class="meter-container">
                <div id="ink-fill"></div>
            </div>
            <button class="icon-btn" onclick="restartLevel()">🔄</button>
        </div>
        <canvas id="gameCanvas" width="400" height="635"></canvas>
    </div>

    <!-- Victory Modal -->
    <div id="victory-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Happy Glass!</h2>
            <div class="stars">⭐⭐⭐</div>
            <p style="color:#64748b; margin: 0 0 18px 0;">Level Completed!</p>
            <button class="modal-btn" onclick="nextLevel()">NEXT LEVEL ▶</button>
        </div>
    </div>
</div>

<script>
    // ==========================================
    // 1. SYNTHESIZED SOUND ENGINE (Web Audio API)
    // ==========================================
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playSound(type) {
        try {
            initAudio();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;

            if (type === 'draw') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(180 + Math.random() * 60, now);
                gain.gain.setValueAtTime(0.02, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.03);
            } else if (type === 'pour') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                const f = 320 + (glass.filled * 3.2) + Math.random() * 80;
                osc.frequency.setValueAtTime(f, now);
                gain.gain.setValueAtTime(0.015, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.06);
            } else if (type === 'win') {
                [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + i * 0.08);
                    gain.gain.setValueAtTime(0.09, now + i * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.45);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + i * 0.08);
                    osc.stop(now + i * 0.08 + 0.45);
                });
            }
        } catch (e) {}
    }

    // ==========================================
    // 2. METABALL LIQUID SHADER BUFFER
    // ==========================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Offscreen canvas used to blend fluid particles into a continuous liquid stream
    const fluidCanvas = document.createElement('canvas');
    fluidCanvas.width = 400;
    fluidCanvas.height = 635;
    const fluidCtx = fluidCanvas.getContext('2d');

    let currentLevel = 1;
    let unlockedLevel = 1;
    let gameState = 'drawing';
    let ink = 100;

    let lines = [];
    let currentLine = null;
    let isDrawing = false;

    let pipe = {};
    let glass = {};
    let obstacles = [];
    let particles = [];
    let spawnTimer = 0;
    let totalSpawned = 0;
    const MAX_WATER_PARTICLES = 260;
    let waveTime = 0;

    // Build 50 Level Buttons
    const gridContainer = document.getElementById('levels-grid');
    for (let i = 1; i <= 50; i++) {
        const btn = document.createElement('button');
        btn.className = 'level-btn' + (i > 1 ? ' locked' : '');
        btn.id = `lvl-btn-${i}`;
        btn.innerText = i;
        btn.onclick = () => {
            if (i <= unlockedLevel) {
                initAudio();
                startLevel(i);
            }
        };
        gridContainer.appendChild(btn);
    }

    function updateLevelButtons() {
        for (let i = 1; i <= 50; i++) {
            const btn = document.getElementById(`lvl-btn-${i}`);
            if (i <= unlockedLevel) btn.classList.remove('locked');
            else btn.classList.add('locked');
        }
    }

    function returnToLevels() {
        gameState = 'menu';
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('level-select-screen').classList.remove('hidden');
        document.getElementById('victory-modal').classList.add('hidden');
        updateLevelButtons();
    }

    function startLevel(lvl) {
        currentLevel = lvl;
        document.getElementById('current-level-text').innerText = `LEVEL ${lvl}`;
        document.getElementById('level-select-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        document.getElementById('victory-modal').classList.add('hidden');
        setupLevelData(lvl);
        resetLevelState();
    }

    function restartLevel() {
        resetLevelState();
    }

    function resetLevelState() {
        gameState = 'drawing';
        ink = 100;
        document.getElementById('ink-fill').style.width = '100%';
        lines = [];
        particles = [];
        spawnTimer = 0;
        totalSpawned = 0;
        glass.filled = 0;
    }

    function setupLevelData(lvl) {
        if (lvl === 1) {
            pipe = { x: 55, y: 95, w: 38, h: 30, angle: 0 };
            glass = { x: 270, y: 455, w: 68, h: 88, taper: 9, filled: 0 };
            obstacles = [];
        } else {
            let pipeX = 45 + ((lvl * 37) % 260);
            pipe = { x: pipeX, y: 75, w: 38, h: 30 };

            let glassX = 260 - ((lvl * 53) % 200);
            if (Math.abs(glassX - pipeX) < 65) {
                glassX = (pipeX + 130) % 270 + 35;
            }
            let glassY = 460 - ((lvl * 11) % 70);
            glass = { x: glassX, y: glassY, w: 68, h: 88, taper: 9, filled: 0 };

            obstacles = [];
            let count = Math.min(Math.floor(lvl / 3) + 1, 4);
            for (let i = 0; i < count; i++) {
                let ox = 50 + ((lvl * 43 + i * 85) % 240);
                let oy = 185 + ((lvl * 29 + i * 70) % 190);
                let ow = 60 + ((lvl + i * 17) % 45);
                let oh = 16;
                if (Math.abs(oy - glass.y) > 40) {
                    obstacles.push({ x: ox, y: oy, w: ow, h: oh });
                }
            }
        }

        // Solid glass side walls & bottom so water only enters from top rim
        glass.walls = [
            { x1: glass.x, y1: glass.y, x2: glass.x + glass.taper, y2: glass.y + glass.h },
            { x1: glass.x + glass.w, y1: glass.y, x2: glass.x + glass.w - glass.taper, y2: glass.y + glass.h },
            { x1: glass.x + glass.taper, y1: glass.y + glass.h, x2: glass.x + glass.w - glass.taper, y2: glass.y + glass.h }
        ];
    }

    // ==========================================
    // 3. SMOOTH DRAWING & FLUID FLOW PHYSICS
    // ==========================================
    function getCanvasCoords(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        return {
            x: (e.clientX - rect.left) * scaleX,
            y: (e.clientY - rect.top) * scaleY
        };
    }

    canvas.addEventListener('pointerdown', (e) => {
        if (gameState !== 'drawing' || ink <= 0) return;
        initAudio();
        isDrawing = true;
        currentLine = [getCanvasCoords(e)];
    });

    canvas.addEventListener('pointermove', (e) => {
        if (!isDrawing || gameState !== 'drawing' || ink <= 0) return;
        const pt = getCanvasCoords(e);
        const last = currentLine[currentLine.length - 1];
        const dist = Math.hypot(pt.x - last.x, pt.y - last.y);

        if (dist > 4) {
            currentLine.push(pt);
            ink = Math.max(0, ink - dist * 0.11);
            document.getElementById('ink-fill').style.width = ink + '%';
            playSound('draw');
            if (ink <= 0) finishDrawing();
        }
    });

    window.addEventListener('pointerup', () => {
        if (!isDrawing) return;
        finishDrawing();
    });

    function finishDrawing() {
        isDrawing = false;
        if (currentLine && currentLine.length > 1) {
            lines.push(currentLine);
        }
        currentLine = null;
        if (gameState === 'drawing') {
            gameState = 'running';
        }
    }

    // Smooth non-bouncy slide collision against lines & walls
    function resolveSegmentSlide(p, x1, y1, x2, y2, radius) {
        const dx = x2 - x1;
        const dy = y2 - y1;
        const lenSq = dx * dx + dy * dy;
        if (lenSq === 0) return;

        let t = ((p.x - x1) * dx + (p.y - y1) * dy) / lenSq;
        t = Math.max(0, Math.min(1, t));

        const cx = x1 + t * dx;
        const cy = y1 + t * dy;
        const distX = p.x - cx;
        const distY = p.y - cy;
        const dist = Math.hypot(distX, distY);

        if (dist < radius && dist > 0.0001) {
            const nx = distX / dist;
            const ny = distY / dist;

            // Project particle strictly onto the surface so it glides as a stream
            p.x = cx + nx * radius;
            p.y = cy + ny * radius;

            // Remove normal velocity component (inelastic slide = 0 bounce!)
            const vn = p.vx * nx + p.vy * ny;
            if (vn < 0) {
                p.vx -= vn * nx;
                p.vy -= vn * ny;
                // Slight tangential acceleration to keep stream flowing smoothly
                p.vx *= 0.992;
                p.vy *= 0.992;
            }
        }
    }

    function updateFluidPhysics() {
        waveTime += 0.14;
        if (gameState !== 'running') return;

        // Spawn continuous tight stream of water particles from pipe nozzle
        if (totalSpawned < MAX_WATER_PARTICLES) {
            for (let k = 0; k < 2; k++) {
                particles.push({
                    x: pipe.x + pipe.w / 2 + (Math.random() - 0.5) * 3,
                    y: pipe.y + pipe.h - 2 + (k * 2.5),
                    vx: (Math.random() - 0.5) * 0.15,
                    vy: 2.2,
                    collected: false,
                    active: true
                });
                totalSpawned++;
            }
            if (totalSpawned % 6 === 0) playSound('pour');
        }

        const subSteps = 4;
        for (let step = 0; step < subSteps; step++) {
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                if (!p.active || p.collected) continue;

                p.vy += 0.18 / subSteps;
                p.x += p.vx / subSteps;
                p.y += p.vy / subSteps;

                // Check entry through open top of glass
                const waterSurfaceY = (glass.y + glass.h - 10) - ((glass.h - 26) * (glass.filled / 100));
                if (
                    p.x > glass.x + 7 &&
                    p.x < glass.x + glass.w - 7 &&
                    p.y >= glass.y + 4 &&
                    p.y <= glass.y + glass.h - 6
                ) {
                    // Once particle hits the liquid surface inside the glass, merge into glass pool
                    if (p.y >= waterSurfaceY - 4) {
                        p.collected = true;
                        glass.filled = Math.min(100, glass.filled + 0.55);
                        if (glass.filled >= 100) {
                            setTimeout(triggerWin, 300);
                        }
                        continue;
                    }
                }

                // Slide along user-drawn lines
                for (let line of lines) {
                    for (let j = 0; j < line.length - 1; j++) {
                        resolveSegmentSlide(p, line[j].x, line[j].y, line[j + 1].x, line[j + 1].y, 6.5);
                    }
                }

                // Slide along solid glass exterior walls
                for (let w of glass.walls) {
                    resolveSegmentSlide(p, w.x1, w.y1, w.x2, w.y2, 5.5);
                }

                // Slide along obstacles
                for (let obs of obstacles) {
                    resolveSegmentSlide(p, obs.x, obs.y, obs.x + obs.w, obs.y, 5);
                    resolveSegmentSlide(p, obs.x, obs.y, obs.x, obs.y + obs.h, 5);
                    resolveSegmentSlide(p, obs.x + obs.w, obs.y, obs.x + obs.w, obs.y + obs.h, 5);
                }

                if (p.y > canvas.height + 30 || p.x < -30 || p.x > canvas.width + 30) {
                    p.active = false;
                }
            }

            // Cohesive stream interaction: pull nearby stream particles together so they don't separate into balls
            if (step === 0) {
                for (let i = 0; i < particles.length; i++) {
                    const p1 = particles[i];
                    if (!p1.active || p1.collected) continue;
                    // Check neighbors in spawn order (creates surface tension along the stream)
                    for (let j = Math.max(0, i - 4); j < Math.min(particles.length, i + 4); j++) {
                        if (i === j) continue;
                        const p2 = particles[j];
                        if (!p2.active || p2.collected) continue;
                        const dx = p2.x - p1.x;
                        const dy = p2.y - p1.y;
                        const d = Math.hypot(dx, dy);
                        if (d > 2 && d < 22) {
                            // Gentle cohesion + velocity smoothing
                            p1.vx = p1.vx * 0.92 + p2.vx * 0.08;
                            p1.vy = p1.vy * 0.92 + p2.vy * 0.08;
                        } else if (d > 0.01 && d <= 5) {
                            // Gentle pressure separation
                            const push = (5 - d) * 0.08;
                            p1.x -= (dx / d) * push;
                            p1.y -= (dy / d) * push;
                        }
                    }
                }
            }
        }
    }

    function triggerWin() {
        if (gameState === 'won') return;
        gameState = 'won';
        playSound('win');
        if (currentLevel === unlockedLevel && unlockedLevel < 50) {
            unlockedLevel++;
        }
        document.getElementById('victory-modal').classList.remove('hidden');
    }

    function nextLevel() {
        if (currentLevel < 50) startLevel(currentLevel + 1);
        else returnToLevels();
    }

    // ==========================================
    // 4. CONTINUOUS WATER & 3D GLASS RENDERER
    // ==========================================
    function renderMetaballWaterStream() {
        fluidCtx.clearRect(0, 0, fluidCanvas.width, fluidCanvas.height);

        // 1. Draw connected liquid ribbons between consecutive stream particles
        fluidCtx.lineCap = 'round';
        fluidCtx.lineJoin = 'round';
        for (let i = 0; i < particles.length - 1; i++) {
            const p1 = particles[i];
            const p2 = particles[i + 1];
            if (!p1.active || p1.collected || !p2.active || p2.collected) continue;
            const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
            if (dist < 32) {
                fluidCtx.strokeStyle = '#0ea5e9';
                fluidCtx.lineWidth = 13;
                fluidCtx.beginPath();
                fluidCtx.moveTo(p1.x, p1.y);
                fluidCtx.lineTo(p2.x, p2.y);
                fluidCtx.stroke();
            }
        }

        // 2. Draw soft overlapping fluid blobs
        for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            if (!p.active || p.collected) continue;
            fluidCtx.fillStyle = '#0ea5e9';
            fluidCtx.beginPath();
            fluidCtx.arc(p.x, p.y, 7.5, 0, Math.PI * 2);
            fluidCtx.fill();
        }

        // 3. Draw inner bright glossy liquid core along the stream
        for (let i = 0; i < particles.length - 1; i++) {
            const p1 = particles[i];
            const p2 = particles[i + 1];
            if (!p1.active || p1.collected || !p2.active || p2.collected) continue;
            const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
            if (dist < 32) {
                fluidCtx.strokeStyle = '#38bdf8';
                fluidCtx.lineWidth = 7;
                fluidCtx.beginPath();
                fluidCtx.moveTo(p1.x, p1.y);
                fluidCtx.lineTo(p2.x, p2.y);
                fluidCtx.stroke();

                // White specular liquid shine
                fluidCtx.strokeStyle = 'rgba(255, 255, 255, 0.65)';
                fluidCtx.lineWidth = 2.2;
                fluidCtx.beginPath();
                fluidCtx.moveTo(p1.x - 1.5, p1.y - 1.5);
                fluidCtx.lineTo(p2.x - 1.5, p2.y - 1.5);
                fluidCtx.stroke();
            }
        }

        ctx.drawImage(fluidCanvas, 0, 0);
    }

    function draw3DGlass() {
        const gx = glass.x;
        const gy = glass.y;
        const gw = glass.w;
        const gh = glass.h;
        const taper = glass.taper;

        // 1. Soft drop shadow underneath the glass base
        ctx.fillStyle = 'rgba(15, 23, 42, 0.12)';
        ctx.beginPath();
        ctx.ellipse(gx + gw / 2, gy + gh + 2, (gw - taper) / 2 + 4, 5, 0, 0, Math.PI * 2);
        ctx.fill();

        // 2. Back rim of the 3D tumbler
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.55)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(gx + gw / 2, gy, gw / 2, 5, 0, Math.PI, 0, false);
        ctx.stroke();

        // 3. Water pooled inside the glass (clipped to interior)
        if (glass.filled > 0) {
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(gx + 4, gy + 2);
            ctx.lineTo(gx + taper + 3, gy + gh - 9);
            ctx.lineTo(gx + gw - taper - 3, gy + gh - 9);
            ctx.lineTo(gx + gw - 4, gy + 2);
            ctx.closePath();
            ctx.clip();

            const maxFillHeight = gh - 25;
            const currentFillH = maxFillHeight * (glass.filled / 100);
            const surfaceY = gy + gh - 9 - currentFillH;

            const liqGrad = ctx.createLinearGradient(gx, surfaceY, gx, gy + gh);
            liqGrad.addColorStop(0, '#38bdf8');
            liqGrad.addColorStop(0.4, '#0ea5e9');
            liqGrad.addColorStop(1, '#0284c7');
            ctx.fillStyle = liqGrad;

            ctx.beginPath();
            ctx.moveTo(gx, gy + gh);
            for (let x = gx; x <= gx + gw; x += 3) {
                const wave = Math.sin(x * 0.09 + waveTime) * (glass.filled < 100 ? 2.2 : 1.0);
                ctx.lineTo(x, surfaceY + wave);
            }
            ctx.lineTo(gx + gw, gy + gh);
            ctx.closePath();
            ctx.fill();

            // Meniscus surface glow ring
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            for (let x = gx; x <= gx + gw; x += 3) {
                const wave = Math.sin(x * 0.09 + waveTime) * (glass.filled < 100 ? 2.2 : 1.0);
                if (x === gx) ctx.moveTo(x, surfaceY + wave);
                else ctx.lineTo(x, surfaceY + wave);
            }
            ctx.stroke();
            ctx.restore();
        }

        // 4. Translucent 3D Crystal Glass Body
        const bodyGrad = ctx.createLinearGradient(gx, gy, gx + gw, gy);
        bodyGrad.addColorStop(0, 'rgba(226, 232, 240, 0.65)');
        bodyGrad.addColorStop(0.18, 'rgba(255, 255, 255, 0.35)');
        bodyGrad.addColorStop(0.5, 'rgba(241, 245, 249, 0.12)');
        bodyGrad.addColorStop(0.82, 'rgba(226, 232, 240, 0.3)');
        bodyGrad.addColorStop(1, 'rgba(148, 163, 184, 0.65)');

        ctx.fillStyle = bodyGrad;
        ctx.beginPath();
        ctx.moveTo(gx, gy);
        ctx.lineTo(gx + taper, gy + gh);
        ctx.lineTo(gx + gw - taper, gy + gh);
        ctx.lineTo(gx + gw, gy);
        ctx.closePath();
        ctx.fill();

        // 5. Heavy Solid Crystal Bottom Base block
        const baseGrad = ctx.createLinearGradient(gx + taper, gy + gh - 10, gx + gw - taper, gy + gh);
        baseGrad.addColorStop(0, 'rgba(203, 213, 225, 0.85)');
        baseGrad.addColorStop(0.5, 'rgba(248, 250, 252, 0.95)');
        baseGrad.addColorStop(1, 'rgba(148, 163, 184, 0.85)');
        ctx.fillStyle = baseGrad;
        ctx.beginPath();
        ctx.moveTo(gx + taper - 1, gy + gh - 9);
        ctx.lineTo(gx + gw - taper + 1, gy + gh - 9);
        ctx.lineTo(gx + gw - taper, gy + gh);
        ctx.lineTo(gx + taper, gy + gh);
        ctx.closePath();
        ctx.fill();

        // 6. Dashed Fill Target Line near the top of the glass
        const fillLineY = gy + 18;
        ctx.save();
        ctx.setLineDash([4, 4]);
        ctx.strokeStyle = 'rgba(100, 116, 139, 0.55)';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(gx + 4, fillLineY);
        ctx.lineTo(gx + gw - 4, fillLineY);
        ctx.stroke();
        ctx.restore();

        // 7. Glossy 3D Vertical Specular Highlights
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.lineWidth = 3.5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(gx + 7, gy + 10);
        ctx.lineTo(gx + taper + 5, gy + gh - 15);
        ctx.stroke();

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(gx + gw - 7, gy + 12);
        ctx.lineTo(gx + gw - taper - 5, gy + gh - 16);
        ctx.stroke();

        // 8. Crisp Outer Glass Walls Outline
        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 3.5;
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(gx, gy);
        ctx.lineTo(gx + taper, gy + gh);
        ctx.lineTo(gx + gw - taper, gy + gh);
        ctx.lineTo(gx + gw, gy);
        ctx.stroke();

        // Front top rim highlight curve
        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.ellipse(gx + gw / 2, gy, gw / 2, 5, 0, 0, Math.PI, false);
        ctx.stroke();

        // 9. Cute Happy Glass Character Face
        const fx = gx + gw / 2;
        const fy = gy + gh / 2 + 4;

        // Rosy Cheeks
        ctx.fillStyle = 'rgba(244, 114, 182, 0.45)';
        ctx.beginPath();
        ctx.ellipse(fx - 15, fy + 2, 4.2, 2.6, 0, 0, Math.PI * 2);
        ctx.ellipse(fx + 15, fy + 2, 4.2, 2.6, 0, 0, Math.PI * 2);
        ctx.fill();

        // Eyes
        ctx.fillStyle = '#1e293b';
        ctx.beginPath();
        ctx.arc(fx - 10, fy - 4, 3.6, 0, Math.PI * 2);
        ctx.arc(fx + 10, fy - 4, 3.6, 0, Math.PI * 2);
        ctx.fill();

        // Cute white eye shine dots
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(fx - 11.2, fy - 5.2, 1.3, 0, Math.PI * 2);
        ctx.arc(fx + 8.8, fy - 5.2, 1.3, 0, Math.PI * 2);
        ctx.fill();

        // Mouth Expression
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 2.2;
        ctx.lineCap = 'round';
        ctx.beginPath();
        if (glass.filled >= 95) {
            // Big open joyful mouth
            ctx.fillStyle = '#ef4444';
            ctx.arc(fx, fy + 2, 6.5, 0, Math.PI, false);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        } else if (glass.filled > 10) {
            // Happy smile while filling
            ctx.arc(fx, fy + 1, 5.5, 0.15 * Math.PI, 0.85 * Math.PI, false);
            ctx.stroke();
        } else {
            // Sad thirsty mouth before water arrives
            ctx.arc(fx, fy + 8, 5, 1.15 * Math.PI, 1.85 * Math.PI, false);
            ctx.stroke();
        }
    }

    function drawScene() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. Render Continuous Liquid Water Flow
        renderMetaballWaterStream();

        // 2. Draw 3D Pipe Spout
        const pGrad = ctx.createLinearGradient(pipe.x, pipe.y, pipe.x + pipe.w, pipe.y);
        pGrad.addColorStop(0, '#64748b');
        pGrad.addColorStop(0.4, '#cbd5e1');
        pGrad.addColorStop(1, '#475569');
        ctx.fillStyle = pGrad;
        ctx.fillRect(pipe.x, pipe.y, pipe.w, pipe.h);
        
        // Pipe flange collar
        ctx.fillStyle = '#475569';
        ctx.beginPath();
        ctx.roundRect(pipe.x - 4, pipe.y + pipe.h - 8, pipe.w + 8, 8, 3);
        ctx.fill();

        // 3. Draw Obstacles
        obstacles.forEach(obs => {
            const oGrad = ctx.createLinearGradient(obs.x, obs.y, obs.x, obs.y + obs.h);
            oGrad.addColorStop(0, '#475569');
            oGrad.addColorStop(1, '#1e293b');
            ctx.fillStyle = oGrad;
            ctx.beginPath();
            ctx.roundRect(obs.x, obs.y, obs.w, obs.h, 4);
            ctx.fill();
        });

        // 4. Draw 3D Glass
        draw3DGlass();

        // 5. Draw User Pencil Lines
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        lines.forEach(line => {
            if (line.length < 2) return;
            ctx.beginPath();
            ctx.moveTo(line[0].x, line[0].y);
            for (let i = 1; i < line.length; i++) {
                ctx.lineTo(line[i].x, line[i].y);
            }
            ctx.stroke();
        });

        if (currentLine && currentLine.length > 1) {
            ctx.beginPath();
            ctx.moveTo(currentLine[0].x, currentLine[0].y);
            for (let i = 1; i < currentLine.length; i++) {
                ctx.lineTo(currentLine[i].x, currentLine[i].y);
            }
            ctx.stroke();
        }
    }

    function loop() {
        updateFluidPhysics();
        drawScene();
        requestAnimationFrame(loop);
    }

    loop();
</script>
