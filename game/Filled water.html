<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Glass Deluxe - 50 Levels</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            font-family: 'Arial Rounded MT Bold', 'Helvetica Rounded', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            touch-action: none;
        }

        #game-wrapper {
            width: 100%;
            max-width: 412px;
            height: 100%;
            max-height: 780px;
            background: #ffffff;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 0 3px #334155;
            border-radius: 14px;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        .hidden {
            display: none !important;
        }

        /* Level Selection Overlay */
        #level-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            background-image: 
                linear-gradient(to right, #f1f5f9 1px, transparent 1px),
                linear-gradient(to bottom, #f1f5f9 1px, transparent 1px);
            background-size: 22px 22px;
            display: flex;
            flex-direction: column;
            padding: 18px;
            z-index: 50;
            animation: fadeIn 0.25s ease-out;
        }

        .menu-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .menu-header {
            font-size: 22px;
            font-weight: 900;
            color: #1e293b;
            letter-spacing: 1px;
        }

        .menu-close-btn, .menu-exit-btn {
            padding: 8px 14px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 14px;
            cursor: pointer;
            border: 2px solid #1e293b;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .menu-close-btn {
            background: #38bdf8;
            color: #fff;
            box-shadow: 0 3px 0 #0284c7;
        }

        .menu-exit-btn {
            background: #ef4444;
            color: #fff;
            box-shadow: 0 3px 0 #b91c1c;
        }

        .levels-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            overflow-y: auto;
            padding: 10px 5px 30px 5px;
            flex: 1;
            justify-items: center;
            align-content: start;
        }

        .lvl-item {
            width: 54px;
            height: 54px;
            border-radius: 14px;
            background: linear-gradient(180deg, #a3e635 0%, #65a30d 100%);
            border: 2.5px solid #1e293b;
            color: #fff;
            font-size: 19px;
            font-weight: 900;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 0 #3f6212;
            transition: transform 0.1s;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }

        .lvl-item:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #3f6212;
        }

        .lvl-item.locked {
            background: #e2e8f0;
            color: #94a3b8;
            border-color: #94a3b8;
            box-shadow: 0 4px 0 #cbd5e1;
            cursor: not-allowed;
            text-shadow: none;
        }

        /* Win / Retry Overlay */
        #win-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(2px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 30;
            animation: fadeIn 0.35s ease-out;
        }

        .win-banner {
            font-size: 32px;
            font-weight: 900;
            color: #0284c7;
            text-shadow: 0 3px 0 #e0f2fe, 0 4px 10px rgba(0,0,0,0.15);
            letter-spacing: 1px;
            animation: popBounce 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .win-buttons-row {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        @keyframes popBounce {
            0% { transform: scale(0.3); opacity: 0; }
            80% { transform: scale(1.08); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .grid-circle-btn {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: #ffffff;
            border: 2.5px solid #1e293b;
            box-shadow: 0 4px 0 #64748b;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            animation: slideLeft 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .grid-icon {
            display: grid;
            grid-template-columns: repeat(2, 10px);
            gap: 3px;
        }

        .grid-icon span {
            width: 10px;
            height: 10px;
            background: #f59e0b;
            border: 1.5px solid #78350f;
            border-radius: 2px;
        }

        .next-pill-btn {
            height: 52px;
            padding: 0 28px;
            border-radius: 26px;
            background: linear-gradient(180deg, #a3e635 0%, #65a30d 100%);
            border: 2.5px solid #1e293b;
            box-shadow: 0 4px 0 #3f6212, inset 0 2px 0 rgba(255,255,255,0.45);
            color: #1e293b;
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            animation: slideRight 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .next-pill-btn:active, .grid-circle-btn:active {
            transform: translateY(3px);
        }

        /* Exit Confirmation Modal & Goodbye Screen */
        #exit-modal, #goodbye-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            animation: fadeIn 0.2s ease-out;
        }

        .exit-card {
            background: #ffffff;
            width: 85%;
            max-width: 310px;
            border-radius: 22px;
            border: 3px solid #1e293b;
            padding: 24px 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            animation: popBounce 0.3s ease-out;
        }

        .exit-icon-big {
            font-size: 46px;
            margin-bottom: 8px;
        }

        .exit-title {
            font-size: 22px;
            font-weight: 900;
            color: #1e293b;
            margin: 0 0 8px 0;
        }

        .exit-sub {
            font-size: 14px;
            color: #64748b;
            margin: 0 0 20px 0;
            line-height: 1.4;
        }

        .exit-actions {
            display: flex;
            gap: 12px;
        }

        .btn-yes, .btn-no {
            flex: 1;
            padding: 12px 0;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 900;
            border: 2.5px solid #1e293b;
            cursor: pointer;
        }

        .btn-yes {
            background: #ef4444;
            color: #ffffff;
            box-shadow: 0 4px 0 #991b1b;
        }

        .btn-no {
            background: #84cc16;
            color: #1e293b;
            box-shadow: 0 4px 0 #3f6212;
        }

        .btn-yes:active, .btn-no:active {
            transform: translateY(3px);
        }

        @keyframes slideLeft {
            from { transform: translateX(-80px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes slideRight {
            from { transform: translateX(80px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>

<div id="game-wrapper">
    <canvas id="gameCanvas" width="400" height="720"></canvas>

    <!-- Win / Retry Overlay -->
    <div id="win-overlay" class="hidden">
        <div class="win-banner" id="win-banner-text">AWESOME! 🎉</div>
        <div class="win-buttons-row">
            <div class="grid-circle-btn" onclick="openLevelMenu()" title="Levels">
                <div class="grid-icon">
                    <span></span><span></span>
                    <span></span><span></span>
                </div>
            </div>
            <button class="next-pill-btn" id="overlay-action-btn" onclick="handleNextButton()">
                <span id="overlay-btn-text">NEXT</span>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="white" stroke="#1e293b" stroke-width="2.5">
                    <path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- 50 Levels Menu -->
    <div id="level-menu" class="hidden">
        <div class="menu-top-bar">
            <button class="menu-close-btn" onclick="closeLevelMenu()">▶ PLAY</button>
            <div class="menu-header">50 LEVELS</div>
            <button class="menu-exit-btn" onclick="openExitModal()">🚪 EXIT</button>
        </div>
        <div class="levels-grid" id="levels-grid"></div>
    </div>

    <!-- Exit Confirmation Dialog -->
    <div id="exit-modal" class="hidden">
        <div class="exit-card">
            <div class="exit-icon-big">🚪</div>
            <h3 class="exit-title">EXIT GAME?</h3>
            <p class="exit-sub">మీరు గేమ్ నుండి బయటకు వెళ్లాలనుకుంటున్నారా?<br>(మీ లెవెల్స్ సేవ్ చేయబడ్డాయి)</p>
            <div class="exit-actions">
                <button class="btn-no" onclick="closeExitModal()">NO (ఆడతాను)</button>
                <button class="btn-yes" onclick="confirmExitGame()">YES (EXIT)</button>
            </div>
        </div>
    </div>

    <!-- Goodbye Screen after Exit -->
    <div id="goodbye-screen" class="hidden">
        <div class="exit-card">
            <div class="exit-icon-big">🥳🥛</div>
            <h3 class="exit-title">THANK YOU!</h3>
            <p class="exit-sub">హ్యాపీ గ్లాస్ గేమ్ ఆడినందుకు ధన్యవాదాలు! మళ్ళీ ఆడటానికి క్రింది బటన్ నొక్కండి.</p>
            <button class="btn-no" style="width:100%; padding:14px;" onclick="resumeFromExit()">▶ PLAY AGAIN</button>
        </div>
    </div>
</div>

<script>
    // =====================================================
    // 1. ENHANCED SOUND EFFECTS (Web Audio API)
    // =====================================================
    let audioCtx = null;

    function initAudio() {
        try {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        } catch (e) {}
    }

    function playSound(type) {
        try {
            initAudio();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;

            if (type === 'pencil') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(240 + Math.random() * 120, now);
                gain.gain.setValueAtTime(0.028, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.03);
            } 
            else if (type === 'water') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                const f = 320 + (glass.filled * 3.8) + Math.random() * 90;
                osc.frequency.setValueAtTime(f, now);
                osc.frequency.exponentialRampToValueAtTime(f * 1.28, now + 0.065);
                gain.gain.setValueAtTime(0.022, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.065);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.065);
            }
            else if (type === 'splash') {
                // Pop droplet sound when entering glass
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                const base = 480 + (glass.filled * 4.2);
                osc.frequency.setValueAtTime(base, now);
                osc.frequency.exponentialRampToValueAtTime(base * 1.45, now + 0.05);
                gain.gain.setValueAtTime(0.03, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.05);
            }
            else if (type === 'click') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(620, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.05);
                gain.gain.setValueAtTime(0.07, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.05);
            }
            else if (type === 'win') {
                const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98];
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.07);
                    gain.gain.setValueAtTime(0.12, now + idx * 0.07);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.5);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + idx * 0.07);
                    osc.stop(now + idx * 0.07 + 0.5);
                });
            }
            else if (type === 'lose') {
                const notes = [380, 320, 260];
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.12);
                    gain.gain.setValueAtTime(0.05, now + idx * 0.12);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.25);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + idx * 0.12);
                    osc.stop(now + idx * 0.12 + 0.25);
                });
            }
        } catch (e) {}
    }

    // =====================================================
    // 2. CANVAS, PARTICLES & ANIMATION STATE
    // =====================================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const waterLayer = document.createElement('canvas');
    waterLayer.width = 400;
    waterLayer.height = 720;
    const wCtx = waterLayer.getContext('2d');

    let currentLevel = 1;
    let unlockedLevel = parseInt(localStorage.getItem('happyGlassExact50') || '1', 10);
    let gameState = 'drawing'; // 'drawing', 'pouring', 'won', 'lost', 'paused'
    let inkPercent = 100;
    let showHint = false;

    let lines = [];
    let currentLine = null;
    let isDrawing = false;
    let pencilPos = { x: 0, y: 0, visible: false };

    let dispenser = { x: 40, y: 120, dir: 'down', scale: 1 };
    let glass = { 
        x: 280, y: 470, w: 82, h: 98, taper: 12, filled: 0, 
        walls: [], bounceScale: 1, blinkTimer: 0 
    };
    let shapes = [];
    let allSegments = [];
    let hintCurve = null;

    let waterParticles = [];
    let splashDrops = [];
    let glassBubbles = [];
    let pencilSparks = [];
    let celebrationStars = [];
    let confettiPieces = [];

    let totalSpawned = 0;
    let spawnTick = 0;
    let dryFrames = 0;
    const MAX_WATER = 260;
    let waveTick = 0;

    // =====================================================
    // 3. 50 LEVELS GENERATOR
    // =====================================================
    function loadLevel(lvl) {
        currentLevel = lvl;
        gameState = 'drawing';
        inkPercent = 100;
        showHint = false;
        lines = [];
        currentLine = null;
        pencilPos.visible = false;
        waterParticles = [];
        splashDrops = [];
        glassBubbles = [];
        pencilSparks = [];
        celebrationStars = [];
        confettiPieces = [];
        totalSpawned = 0;
        spawnTick = 0;
        dryFrames = 0;
        shapes = [];
        allSegments = [];
        document.getElementById('win-overlay').classList.add('hidden');

        if (lvl === 1) {
            dispenser = { x: 40, y: 125, dir: 'down', scale: 1 };
            glass = { x: 280, y: 465, w: 84, h: 98, taper: 13, filled: 0, bounceScale: 1, blinkTimer: 0 };

            addRectObstacle(6, 400, 122, 12);
            addRectObstacle(140, 455, 122, 12);
            addRectObstacle(264, 563, 122, 12);

            hintCurve = { x1: 68, y1: 210, cx: 185, cy: 340, x2: 310, y2: 480 };
        } 
        else if (lvl === 2) {
            dispenser = { x: 35, y: 125, dir: 'down', scale: 1 };
            glass = { x: 298, y: 465, w: 84, h: 98, taper: 13, filled: 0, bounceScale: 1, blinkTimer: 0 };

            addPolyObstacle([
                { x: 12, y: 345 },
                { x: 106, y: 385 },
                { x: 106, y: 522 },
                { x: 12, y: 522 }
            ]);

            addPolyObstacle([
                { x: 192, y: 408 },
                { x: 286, y: 446 },
                { x: 286, y: 575 },
                { x: 192, y: 575 }
            ]);

            addRectObstacle(286, 563, 114, 12);

            hintCurve = { x1: 42, y1: 235, cx: 190, cy: 365, x2: 325, y2: 480 };
        } 
        else if (lvl === 3) {
            dispenser = { x: 0, y: 180, dir: 'right', scale: 1 };
            glass = { x: 210, y: 488, w: 84, h: 98, taper: 13, filled: 0, bounceScale: 1, blinkTimer: 0 };

            addRectObstacle(0, 246, 68, 178);
            addRectObstacle(132, 475, 70, 111);
            addRectObstacle(0, 586, 400, 34);

            hintCurve = { x1: 75, y1: 230, cx: 185, cy: 340, x2: 255, y2: 495 };
        } 
        else {
            const isSidePipe = (lvl % 4 === 0);
            if (isSidePipe) {
                dispenser = { x: 0, y: 140 + ((lvl * 19) % 80), dir: 'right', scale: 1 };
                addRectObstacle(0, dispenser.y + 66, 65, 150);
            } else {
                let dx = 35 + ((lvl * 47) % 240);
                dispenser = { x: dx, y: 120, dir: 'down', scale: 1 };
            }

            let gx = isSidePipe ? (220 + (lvl * 23) % 85) : (265 - ((lvl * 61) % 210));
            if (!isSidePipe && Math.abs(gx - dispenser.x) < 75) {
                gx = (dispenser.x + 150) % 270 + 30;
            }
            let gy = 455 + ((lvl * 13) % 45);
            glass = { x: gx, y: gy, w: 84, h: 98, taper: 13, filled: 0, bounceScale: 1, blinkTimer: 0 };

            addRectObstacle(gx - 16, gy + 98, 116, 14);

            let numBlocks = 2 + (lvl % 2);
            for (let i = 0; i < numBlocks; i++) {
                let bx = 25 + ((lvl * 53 + i * 115) % 230);
                let by = 265 + i * 95 + ((lvl * 17) % 35);
                if (Math.abs(by - gy) > 55 && Math.abs(bx - gx) > 45) {
                    if ((lvl + i) % 2 === 0) {
                        addPolyObstacle([
                            { x: bx, y: by },
                            { x: bx + 85, y: by + 32 },
                            { x: bx + 85, y: by + 110 },
                            { x: bx, y: by + 110 }
                        ]);
                    } else {
                        addRectObstacle(bx, by, 110, 14);
                    }
                }
            }

            let startX = dispenser.dir === 'right' ? 80 : dispenser.x + 28;
            let startY = dispenser.dir === 'right' ? dispenser.y + 45 : dispenser.y + 95;
            hintCurve = {
                x1: startX,
                y1: startY,
                cx: (startX + glass.x + 40) / 2,
                cy: (startY + glass.y) / 2 - 20,
                x2: glass.x + 42,
                y2: glass.y + 10
            };
        }

        const gx = glass.x, gy = glass.y, gw = glass.w, gh = glass.h, tp = glass.taper;
        glass.walls = [
            { x1: gx, y1: gy, x2: gx + tp, y2: gy + gh },
            { x1: gx + gw, y1: gy, x2: gx + gw - tp, y2: gy + gh },
            { x1: gx + tp, y1: gy + gh, x2: gx + gw - tp, y2: gy + gh }
        ];
    }

    function addRectObstacle(x, y, w, h) {
        addPolyObstacle([
            { x: x, y: y },
            { x: x + w, y: y },
            { x: x + w, y: y + h },
            { x: x, y: y + h }
        ]);
    }

    function addPolyObstacle(pts) {
        shapes.push(pts);
        for (let i = 0; i < pts.length; i++) {
            let p1 = pts[i];
            let p2 = pts[(i + 1) % pts.length];
            allSegments.push({ x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y });
        }
    }

    // =====================================================
    // 4. TOUCH / MOUSE INPUT & HUD BUTTONS (INCLUDING EXIT!)
    // =====================================================
    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        return {
            x: (e.clientX - rect.left) * (canvas.width / rect.width),
            y: (e.clientY - rect.top) * (canvas.height / rect.height)
        };
    }

    canvas.addEventListener('pointerdown', (e) => {
        initAudio();
        const pt = getPos(e);

        // Top Bar Buttons Check
        if (pt.y < 75) {
            // 1. Home Button (x: 34, y: 38)
            if (Math.hypot(pt.x - 34, pt.y - 38) <= 21) {
                playSound('click');
                openLevelMenu();
                return;
            }
            // 2. Restart Button (x: 78, y: 38)
            if (Math.hypot(pt.x - 78, pt.y - 38) <= 21) {
                playSound('click');
                loadLevel(currentLevel);
                return;
            }
            // 3. Green HINT Button (x: 256..330, y: 20..54)
            if (pt.x >= 254 && pt.x <= 332 && pt.y >= 18 && pt.y <= 56) {
                playSound('click');
                showHint = !showHint;
                return;
            }
            // 4. Red EXIT Sign Button (x: 364, y: 38)
            if (Math.hypot(pt.x - 364, pt.y - 38) <= 22) {
                playSound('click');
                openExitModal();
                return;
            }
            return;
        }

        if ((gameState !== 'drawing' && gameState !== 'pouring') || inkPercent <= 0) return;

        isDrawing = true;
        currentLine = [pt];
        pencilPos = { x: pt.x, y: pt.y, visible: true };
    });

    canvas.addEventListener('pointermove', (e) => {
        if (!isDrawing || inkPercent <= 0) return;
        const pt = getPos(e);
        if (pt.y < 78) return;

        const last = currentLine[currentLine.length - 1];
        const dist = Math.hypot(pt.x - last.x, pt.y - last.y);

        if (dist > 4) {
            currentLine.push(pt);
            pencilPos = { x: pt.x, y: pt.y, visible: true };
            inkPercent = Math.max(0, inkPercent - dist * 0.14);
            playSound('pencil');

            // Spawn animated pencil sparks while drawing!
            for (let s = 0; s < 2; s++) {
                pencilSparks.push({
                    x: pt.x,
                    y: pt.y,
                    vx: (Math.random() - 0.5) * 3.5,
                    vy: -1 - Math.random() * 2.5,
                    size: 2 + Math.random() * 2.5,
                    color: Math.random() > 0.4 ? '#facc15' : '#334155',
                    life: 16
                });
            }

            if (inkPercent <= 0) {
                finishStroke();
            }
        }
    });

    window.addEventListener('pointerup', () => {
        if (!isDrawing) return;
        finishStroke();
    });

    function finishStroke() {
        isDrawing = false;
        pencilPos.visible = false;
        if (currentLine && currentLine.length > 1) {
            lines.push(currentLine);
            if (gameState === 'drawing') {
                gameState = 'pouring';
            }
        }
        currentLine = null;
    }

    // =====================================================
    // 5. MEDIUM-SPEED FLUID STREAM & VISUAL FX UPDATES
    // =====================================================
    function slideParticleOnSegment(p, x1, y1, x2, y2, radius) {
        const dx = x2 - x1;
        const dy = y2 - y1;
        const lenSq = dx * dx + dy * dy;
        if (lenSq === 0) return;

        let t = ((p.x - x1) * dx + (p.y - y1) * dy) / lenSq;
        t = Math.max(0, Math.min(1, t));

        const cx = x1 + t * dx;
        const cy = y1 + t * dy;
        const distX = p.x - cx;
        const distY = p.y - cy;
        const dist = Math.hypot(distX, distY);

        if (dist < radius && dist > 0.0001) {
            const nx = distX / dist;
            const ny = distY / dist;

            p.x = cx + nx * radius;
            p.y = cy + ny * radius;

            const vn = p.vx * nx + p.vy * ny;
            if (vn < 0) {
                p.vx -= vn * nx;
                p.vy -= vn * ny;
                p.vx *= 0.991;
                p.vy *= 0.991;
            }
        }
    }

    function updateGame() {
        if (gameState === 'paused') return;

        waveTick += 0.125;
        glass.blinkTimer++;

        // Smoothly recover glass bounce animation
        glass.bounceScale += (1 - glass.bounceScale) * 0.18;
        dispenser.scale += (1 - dispenser.scale) * 0.2;

        // Update Pencil Sparks
        for (let i = pencilSparks.length - 1; i >= 0; i--) {
            let sp = pencilSparks[i];
            sp.x += sp.vx;
            sp.y += sp.vy;
            sp.vy += 0.18;
            sp.life--;
            if (sp.life <= 0) pencilSparks.splice(i, 1);
        }

        // Update Water Splash Droplets
        for (let i = splashDrops.length - 1; i >= 0; i--) {
            let sd = splashDrops[i];
            sd.x += sd.vx;
            sd.y += sd.vy;
            sd.vy += 0.22;
            sd.life--;
            if (sd.life <= 0) splashDrops.splice(i, 1);
        }

        // Update Rising Air Bubbles inside Glass
        for (let i = glassBubbles.length - 1; i >= 0; i--) {
            let b = glassBubbles[i];
            b.y -= b.speed;
            b.x += Math.sin(waveTick + i) * 0.3;
            b.life--;
            if (b.life <= 0) glassBubbles.splice(i, 1);
        }

        // Update Celebration Gold Stars
        for (let i = celebrationStars.length - 1; i >= 0; i--) {
            let s = celebrationStars[i];
            s.x += s.vx;
            s.y += s.vy;
            s.vy += 0.16;
            s.rot += s.vRot;
            s.life--;
            if (s.life <= 0) celebrationStars.splice(i, 1);
        }

        // Update Colorful Confetti Ribbons
        for (let i = confettiPieces.length - 1; i >= 0; i--) {
            let c = confettiPieces[i];
            c.x += c.vx;
            c.y += c.vy;
            c.vy += 0.12;
            c.rot += c.vRot;
            c.life--;
            if (c.life <= 0) confettiPieces.splice(i, 1);
        }

        if (gameState !== 'pouring') return;

        // Balanced Medium Spawn Rate
        spawnTick++;
        if (totalSpawned < MAX_WATER) {
            const countThisFrame = (spawnTick % 2 === 0) ? 2 : 1;
            dispenser.scale = 1.04; // Subtle pipe pulse animation while pouring
            for (let k = 0; k < countThisFrame; k++) {
                if (totalSpawned >= MAX_WATER) break;
                if (dispenser.dir === 'down') {
                    waterParticles.push({
                        x: dispenser.x + 28 + (Math.random() - 0.5) * 2.8,
                        y: dispenser.y + 62 + k * 2,
                        vx: (Math.random() - 0.5) * 0.10,
                        vy: 1.85,
                        active: true,
                        collected: false
                    });
                } else {
                    waterParticles.push({
                        x: dispenser.x + 62 + k * 2,
                        y: dispenser.y + 28 + (Math.random() - 0.5) * 2.8,
                        vx: 2.75,
                        vy: (Math.random() - 0.5) * 0.10,
                        active: true,
                        collected: false
                    });
                }
                totalSpawned++;
            }
            if (spawnTick % 5 === 0) playSound('water');
        }

        let activeCount = 0;
        const subSteps = 4;

        for (let step = 0; step < subSteps; step++) {
            for (let i = 0; i < waterParticles.length; i++) {
                const p = waterParticles[i];
                if (!p.active || p.collected) continue;
                if (step === 0) activeCount++;

                p.vy += 0.145 / subSteps;
                const speed = Math.hypot(p.vx, p.vy);
                if (speed > 5.8) {
                    p.vx = (p.vx / speed) * 5.8;
                    p.vy = (p.vy / speed) * 5.8;
                }

                p.x += p.vx / subSteps;
                p.y += p.vy / subSteps;

                const gx = glass.x, gy = glass.y, gw = glass.w, gh = glass.h;
                const fillTopY = (gy + gh - 8) - ((gh - 24) * (glass.filled / 100));

                // Check if water enters inside the open top of the glass
                if (
                    p.x > gx + 8 &&
                    p.x < gx + gw - 8 &&
                    p.y >= gy + 4 &&
                    p.y <= gy + gh - 6
                ) {
                    if (p.y >= fillTopY - 5) {
                        p.collected = true;
                        glass.filled = Math.min(100, glass.filled + 0.62);
                        glass.bounceScale = 1.035; // Cute squash/stretch bounce!

                        // Spawn splash droplets & rising bubbles inside glass
                        if (Math.random() < 0.45) {
                            splashDrops.push({
                                x: p.x,
                                y: fillTopY,
                                vx: (Math.random() - 0.5) * 2.8,
                                vy: -1.5 - Math.random() * 2,
                                r: 2 + Math.random() * 2,
                                life: 14
                            });
                        }
                        if (Math.random() < 0.35 && glass.filled > 15) {
                            glassBubbles.push({
                                x: gx + 18 + Math.random() * (gw - 36),
                                y: gy + gh - 14,
                                r: 1.8 + Math.random() * 2.2,
                                speed: 0.8 + Math.random() * 0.8,
                                life: Math.floor((glass.filled / 100) * 35)
                            });
                        }
                        if (Math.random() < 0.25) playSound('splash');

                        if (glass.filled >= 100 && gameState === 'pouring') {
                            triggerVictory();
                        }
                        continue;
                    }
                }

                // Slide along user-drawn black lines
                for (let line of lines) {
                    for (let j = 0; j < line.length - 1; j++) {
                        slideParticleOnSegment(p, line[j].x, line[j].y, line[j + 1].x, line[j + 1].y, 7);
                    }
                }
                if (currentLine && currentLine.length > 1) {
                    for (let j = 0; j < currentLine.length - 1; j++) {
                        slideParticleOnSegment(p, currentLine[j].x, currentLine[j].y, currentLine[j + 1].x, currentLine[j + 1].y, 7);
                    }
                }

                // Slide along glass exterior walls
                for (let w of glass.walls) {
                    slideParticleOnSegment(p, w.x1, w.y1, w.x2, w.y2, 6);
                }

                // Slide along teal obstacles
                for (let seg of allSegments) {
                    slideParticleOnSegment(p, seg.x1, seg.y1, seg.x2, seg.y2, 5.5);
                }

                if (p.y > canvas.height + 30 || p.x < -30 || p.x > canvas.width + 30) {
                    p.active = false;
                }
            }

            // Stream cohesion so droplets fuse into a thick blue liquid ribbon
            if (step === 0) {
                for (let i = 0; i < waterParticles.length; i++) {
                    const p1 = waterParticles[i];
                    if (!p1.active || p1.collected) continue;
                    for (let j = Math.max(0, i - 5); j < Math.min(waterParticles.length, i + 5); j++) {
                        if (i === j) continue;
                        const p2 = waterParticles[j];
                        if (!p2.active || p2.collected) continue;
                        const dx = p2.x - p1.x;
                        const dy = p2.y - p1.y;
                        const d = Math.hypot(dx, dy);
                        if (d > 2 && d < 24) {
                            p1.vx = p1.vx * 0.89 + p2.vx * 0.11;
                            p1.vy = p1.vy * 0.89 + p2.vy * 0.11;
                        }
                    }
                }
            }
        }

        // Check if water finished without filling
        if (totalSpawned >= MAX_WATER && activeCount === 0 && glass.filled < 100) {
            dryFrames++;
            if (dryFrames > 42) {
                triggerRetry();
            }
        }
    }

    function triggerVictory() {
        if (gameState === 'won') return;
        gameState = 'won';
        playSound('win');

        if (currentLevel === unlockedLevel && unlockedLevel < 50) {
            unlockedLevel++;
            localStorage.setItem('happyGlassExact50', unlockedLevel.toString());
        }

        // 1. Burst Gold Stars around the Glass
        for (let i = 0; i < 30; i++) {
            celebrationStars.push({
                x: glass.x + glass.w / 2 + (Math.random() - 0.5) * 40,
                y: glass.y + glass.h / 2,
                vx: (Math.random() - 0.5) * 9,
                vy: -3.5 - Math.random() * 6.5,
                size: 7 + Math.random() * 8,
                rot: Math.random() * Math.PI,
                vRot: (Math.random() - 0.5) * 0.22,
                life: 65
            });
        }

        // 2. Burst Colorful Party Confetti across the screen!
        const colors = ['#f43f5e', '#84cc16', '#38bdf8', '#facc15', '#a855f7', '#fb923c'];
        for (let i = 0; i < 45; i++) {
            confettiPieces.push({
                x: 200 + (Math.random() - 0.5) * 220,
                y: 260 + (Math.random() - 0.5) * 100,
                vx: (Math.random() - 0.5) * 7,
                vy: -4 - Math.random() * 5,
                w: 6 + Math.random() * 5,
                h: 10 + Math.random() * 6,
                color: colors[i % colors.length],
                rot: Math.random() * Math.PI,
                vRot: (Math.random() - 0.5) * 0.25,
                life: 80
            });
        }

        setTimeout(() => {
            document.getElementById('win-banner-text').innerText = `LEVEL ${currentLevel} COMPLETE! 🎉`;
            document.getElementById('win-banner-text').style.color = '#0284c7';
            document.getElementById('overlay-btn-text').innerText = 'NEXT';
            document.getElementById('win-overlay').classList.remove('hidden');
        }, 900);
    }

    function triggerRetry() {
        if (gameState === 'won' || gameState === 'lost') return;
        gameState = 'lost';
        playSound('lose');
        document.getElementById('win-banner-text').innerText = 'TRY AGAIN! 💧';
        document.getElementById('win-banner-text').style.color = '#ef4444';
        document.getElementById('overlay-btn-text').innerText = 'RETRY';
        document.getElementById('win-overlay').classList.remove('hidden');
    }

    function handleNextButton() {
        playSound('click');
        if (gameState === 'won') {
            if (currentLevel < 50) loadLevel(currentLevel + 1);
            else openLevelMenu();
        } else {
            loadLevel(currentLevel);
        }
    }

    function drawGridBackground() {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = '#f1f5f9';
        ctx.lineWidth = 1;
        const step = 22;
        for (let x = 0; x <= canvas.width; x += step) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, canvas.height);
            ctx.stroke();
        }
        for (let y = 0; y <= canvas.height; y += step) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(canvas.width, y);
            ctx.stroke();
        }
    }

    function drawMiniStar(cx, cy, r, filled) {
        ctx.save();
        ctx.beginPath();
        for (let i = 0; i < 5; i++) {
            const a1 = (i * 72 - 90) * Math.PI / 180;
            const a2 = ((i * 72 + 36) - 90) * Math.PI / 180;
            if (i === 0) ctx.moveTo(cx + Math.cos(a1) * r, cy + Math.sin(a1) * r);
            else ctx.lineTo(cx + Math.cos(a1) * r, cy + Math.sin(a1) * r);
            ctx.lineTo(cx + Math.cos(a2) * (r * 0.45), cy + Math.sin(a2) * (r * 0.45));
        }
        ctx.closePath();
        ctx.fillStyle = filled ? '#facc15' : '#ffffff';
        ctx.strokeStyle = filled ? '#b45309' : '#94a3b8';
        ctx.lineWidth = 1.3;
        ctx.fill();
        ctx.stroke();
        ctx.restore();
    }

    function drawDispenserPipe() {
        ctx.save();
        ctx.strokeStyle = '#1e293b';

        if (dispenser.dir === 'down') {

            ctx.scale(dispenser.scale, 2 - dispenser.scale);

            if (gameState === 'drawing') {
                // Animated pulsing water drop before pouring
                const pulse = Math.sin(waveTick * 1.5) * 1.5;

                ctx.arc(x + 28, y + 60, 7.5 + pulse, 0, Math.PI);

            g1.addColorStop(0.5, '#e5e7eb');

            ctx.fillRect(x + 8, y, 40, 44);

    function drawContinuousLiquidStream() {
        wCtx.clearRect(0, 0, waterLayer.width, waterLayer.height);
        wCtx.lineCap = 'round';
        wCtx.lineJoin = 'round';

        // 1. Outer bright blue outline
        for (let i = 0; i < waterParticles.length - 1; i++) {
            const p1 = waterParticles[i];
            const p2 = waterParticles[i + 1];
            if (!p1.active || p1.collected || !p2.active || p2.collected) continue;
            const d = Math.hypot(p2.x - p1.x, p2.y - p1.y);
            if (d < 38) {
                wCtx.strokeStyle = '#0099ff';
                wCtx.lineWidth = 17;
                wCtx.beginPath();
                wCtx.moveTo(p1.x, p1.y);
                wCtx.lineTo(p2.x, p2.y);
                wCtx.stroke();
            }
        }

        for (let p of waterParticles) {
            if (!p.active || p.collected) continue;
            wCtx.fillStyle = '#0099ff';
            wCtx.beginPath();
            wCtx.arc(p.x, p.y, 8.5, 0, Math.PI * 2);
            wCtx.fill();
        }

        // 2. Inner bright cyan core
        for (let i = 0; i < waterParticles.length - 1; i++) {
            const p1 = waterParticles[i];
            const p2 = waterParticles[i + 1];
            if (!p1.active || p1.collected || !p2.active || p2.collected) continue;
            const d = Math.hypot(p2.x - p1.x, p2.y - p1.y);
            if (d < 38) {
                wCtx.strokeStyle = '#18ffff';
                wCtx.lineWidth = 11;
                wCtx.beginPath();
                wCtx.moveTo(p1.x, p1.y);
                wCtx.lineTo(p2.x, p2.y);
                wCtx.stroke();

                // Glossy white water reflection line
                wCtx.strokeStyle = 'rgba(255, 255, 255, 0.65)';
                wCtx.lineWidth = 2.5;
                wCtx.beginPath();
                wCtx.moveTo(p1.x - 2, p1.y - 2);
                wCtx.lineTo(p2.x - 2, p2.y - 2);
                wCtx.stroke();
            }
        }

        for (let p of waterParticles) {
            if (!p.active || p.collected) continue;
            wCtx.fillStyle = '#18ffff';
            wCtx.beginPath();
            wCtx.arc(p.x, p.y, 5.5, 0, Math.PI * 2);
            wCtx.fill();
        }

        ctx.drawImage(waterLayer, 0, 0);
    }

    function drawExactGlass() {
        const gx = glass.x, gy = glass.y, gw = glass.w, gh = glass.h, tp = glass.taper;
        const wallThick = 9;

        ctx.save();
        // Squash & stretch bounce around the bottom center of the glass
        const pivotX = gx + gw / 2;
        const pivotY = gy + gh;
        ctx.translate(pivotX, pivotY);
        ctx.scale(glass.bounceScale, 2 - glass.bounceScale);
        ctx.translate(-pivotX, -pivotY);

        // 1. Interior background
        ctx.fillStyle = 'rgba(241, 245, 249, 0.72)';
        ctx.beginPath();
        ctx.moveTo(gx + wallThick, gy);
        ctx.lineTo(gx + tp + 6, gy + gh - 9);
        ctx.lineTo(gx + gw - tp - 6, gy + gh - 9);
        ctx.lineTo(gx + gw - wallThick, gy);
        ctx.closePath();
        ctx.fill();

        // 2. Pooled Cyan Water + Bubbles + Splashes Inside Glass
        if (glass.filled > 0) {
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(gx + wallThick - 1, gy);
            ctx.lineTo(gx + tp + 5, gy + gh - 8);
            ctx.lineTo(gx + gw - tp - 5, gy + gh - 8);
            ctx.lineTo(gx + gw - wallThick + 1, gy);
            ctx.closePath();
            ctx.clip();

            const maxH = gh - 24;
            const curH = maxH * (glass.filled / 100);
            const topY = gy + gh - 8 - curH;

            ctx.fillStyle = '#18ffff';
            ctx.strokeStyle = '#0099ff';
            ctx.lineWidth = 3;

            ctx.beginPath();
            ctx.moveTo(gx, gy + gh);
            for (let x = gx; x <= gx + gw; x += 4) {
                const wave = Math.sin(x * 0.08 + waveTick) * (glass.filled < 100 ? 4.2 : 1.5);
                ctx.lineTo(x, topY + wave);
            }
            ctx.lineTo(gx + gw, gy + gh);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Draw Rising Bubbles inside the pooled water
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
            ctx.lineWidth = 1.2;
            glassBubbles.forEach(b => {
                if (b.y > topY + 3) {
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                }
            });

            // Draw Splash Droplets above the water surface
            ctx.fillStyle = '#00d8ff';
            splashDrops.forEach(sd => {
                ctx.beginPath();
                ctx.arc(sd.x, sd.y, sd.r, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.restore();
        }

        // 3. Thick Grey U-Shaped Glass Rim & Base
        ctx.fillStyle = '#c4c9ce';
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 1.6;
        ctx.lineJoin = 'round';

        ctx.beginPath();
        ctx.moveTo(gx, gy);
        ctx.lineTo(gx + tp, gy + gh);
        ctx.lineTo(gx + gw - tp, gy + gh);
        ctx.lineTo(gx + gw, gy);
        ctx.lineTo(gx + gw - wallThick, gy);
        ctx.lineTo(gx + gw - tp - 6, gy + gh - 9);
        ctx.lineTo(gx + tp + 6, gy + gh - 9);
        ctx.lineTo(gx + wallThick, gy);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Glossy vertical shine on left glass wall
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.75)';
        ctx.lineWidth = 2.5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(gx + 5, gy + 10);
        ctx.lineTo(gx + tp + 3, gy + gh - 14);
        ctx.stroke();

        // 4. Dashed Fill Line across top of glass
        ctx.save();
        ctx.setLineDash([5, 4]);
        ctx.strokeStyle = glass.filled >= 100 ? '#16a34a' : '#334155';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.moveTo(gx + wallThick + 2, gy + 16);
        ctx.lineTo(gx + gw - wallThick - 2, gy + 16);
        ctx.stroke();
        ctx.restore();

        // 5. Animated Cartoon Face with Blinking Eyes & Rosy Cheeks!
        const fx = gx + gw / 2;
        const fy = gy + gh / 2 + 2;
        const isBlinking = (glass.blinkTimer % 170) > 162;

        // Cute pink blush cheeks when happy or filling
        if (glass.filled > 25) {
            ctx.fillStyle = 'rgba(244, 114, 182, 0.45)';
            ctx.beginPath();
            ctx.ellipse(fx - 17, fy + 3, 4.5, 2.8, 0, 0, Math.PI * 2);
            ctx.ellipse(fx + 17, fy + 3, 4.5, 2.8, 0, 0, Math.PI * 2);
            ctx.fill();
        }

        [-10, 10].forEach(offsetX => {
            if (isBlinking) {
                // Closed blinking eyelid line
                ctx.strokeStyle = '#1e293b';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(fx + offsetX - 5, fy - 5);
                ctx.lineTo(fx + offsetX + 5, fy - 5);
                ctx.stroke();
            } else {
                ctx.fillStyle = '#ffffff';
                ctx.strokeStyle = '#1e293b';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.ellipse(fx + offsetX, fy - 6, 5.5, 7.5, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#1e293b';
                ctx.beginPath();
                ctx.arc(fx + offsetX, fy - 4, 2.8, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(fx + offsetX - 1, fy - 5.2, 1.1, 0, Math.PI * 2);
                ctx.fill();
            }

            // Arched Eyebrow
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            ctx.arc(fx + offsetX, fy - 13, 5, 1.15 * Math.PI, 1.85 * Math.PI);
            ctx.stroke();
        });

        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        if (gameState === 'pouring' && glass.filled < 95) {
            ctx.fillStyle = '#ffffff';
            ctx.ellipse(fx, fy + 11, 4.2, 5.5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
        } else if (gameState === 'lost') {
            // Sad mouth on retry
            ctx.arc(fx, fy + 13, 6, 1.15 * Math.PI, 1.85 * Math.PI);
            ctx.stroke();
        } else {
            ctx.arc(fx, fy + 6, 7.5, 0.15 * Math.PI, 0.85 * Math.PI);
            ctx.stroke();
        }

        ctx.restore();
    }

    function drawYellowPencil(x, y) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(28 * Math.PI / 180);

        const w = 22;
        const h = 115;
        const tipH = 26;

        ctx.fillStyle = '#fef3c7';
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(-w / 2, -tipH);
        ctx.lineTo(w / 2, -tipH);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#1e293b';
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(-4.5, -10);
        ctx.lineTo(4.5, -10);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#facc15';
        ctx.fillRect(-w / 2, -tipH - h, w, h);
        ctx.strokeRect(-w / 2, -tipH - h, w, h);

        ctx.fillStyle = '#eab308';
        ctx.fillRect(-w / 6, -tipH - h, w / 3, h);
        ctx.strokeRect(-w / 6, -tipH - h, w / 3, h);

        // Pink eraser top cap
        ctx.fillStyle = '#f472b6';
        ctx.fillRect(-w / 2, -tipH - h - 9, w, 9);
        ctx.strokeRect(-w / 2, -tipH - h - 9, w, 9);

        ctx.restore();
    }

    function drawParticleEffects() {
        // 1. Pencil Graphite & Gold Sparks
        pencilSparks.forEach(sp => {
            ctx.fillStyle = sp.color;
            ctx.beginPath();
            ctx.arc(sp.x, sp.y, sp.size, 0, Math.PI * 2);
            ctx.fill();
        });

        // 2. Gold Celebration Stars
        celebrationStars.forEach(s => {
            ctx.save();
            ctx.translate(s.x, s.y);
            ctx.rotate(s.rot);
            drawMiniStar(0, 0, s.size, true);
            ctx.restore();
        });

        // 3. Party Confetti Pieces
        confettiPieces.forEach(c => {
            ctx.save();
            ctx.translate(c.x, c.y);
            ctx.rotate(c.rot);
            ctx.fillStyle = c.color;
            ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
            ctx.restore();
        });
    }

    function render() {
        drawGridBackground();

        if (showHint && hintCurve) {
            ctx.save();
            ctx.setLineDash([7, 6]);
            ctx.strokeStyle = 'rgba(132, 204, 22, 0.85)';
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.moveTo(hintCurve.x1, hintCurve.y1);
            ctx.quadraticCurveTo(hintCurve.cx, hintCurve.cy, hintCurve.x2, hintCurve.y2);
            ctx.stroke();
            ctx.restore();
        }

        drawContinuousLiquidStream();
        drawTealObstacles();
        drawDispenserPipe();
        drawExactGlass();

        // User Drawn Black Pencil Lines
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 6.5;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        lines.forEach(line => {
            if (line.length < 2) return;
            ctx.beginPath();
            ctx.moveTo(line[0].x, line[0].y);
            for (let i = 1; i < line.length; i++) {
                ctx.lineTo(line[i].x, line[i].y);
            }
            ctx.stroke();
        });

        if (currentLine && currentLine.length > 1) {
            ctx.beginPath();
            ctx.moveTo(currentLine[0].x, currentLine[0].y);
            for (let i = 1; i < currentLine.length; i++) {
                ctx.lineTo(currentLine[i].x, currentLine[i].y);
            }
            ctx.stroke();
        }

        drawParticleEffects();

        if (pencilPos.visible) {
            drawYellowPencil(pencilPos.x, pencilPos.y);
        }

        drawTopHUD();
    }

    // =====================================================
    // 7. 50 LEVELS MENU & EXIT MODAL FUNCTIONS
    // =====================================================
    const gridEl = document.getElementById('levels-grid');
    for (let i = 1; i <= 50; i++) {
        const item = document.createElement('div');
        item.className = 'lvl-item' + (i > unlockedLevel ? ' locked' : '');
        item.id = `menu-lvl-${i}`;
        item.innerText = i;
        item.onclick = () => {
            if (i <= unlockedLevel) {
                playSound('click');
                document.getElementById('level-menu').classList.add('hidden');
                loadLevel(i);
            }
        };
        gridEl.appendChild(item);
    }

    function openLevelMenu() {
        for (let i = 1; i <= 50; i++) {
            const el = document.getElementById(`menu-lvl-${i}`);
            if (i <= unlockedLevel) el.classList.remove('locked');
            else el.classList.add('locked');
        }
        document.getElementById('win-overlay').classList.add('hidden');
        document.getElementById('level-menu').classList.remove('hidden');
    }

    function closeLevelMenu() {
        playSound('click');
        document.getElementById('level-menu').classList.add('hidden');
    }

    let previousGameState = 'drawing';

    function openExitModal() {
        if (gameState !== 'paused') {
            previousGameState = gameState;
            gameState = 'paused';
        }
        document.getElementById('exit-modal').classList.remove('hidden');
    }

    function closeExitModal() {
        playSound('click');
        document.getElementById('exit-modal').classList.add('hidden');
        gameState = previousGameState;
    }

    function confirmExitGame() {
        playSound('click');
        document.getElementById('exit-modal').classList.add('hidden');
        document.getElementById('level-menu').classList.add('hidden');
        document.getElementById('win-overlay').classList.add('hidden');
        document.getElementById('goodbye-screen').classList.remove('hidden');
        try {
            window.close();
        } catch (e) {}
    }

    function resumeFromExit() {
        playSound('click');
        document.getElementById('goodbye-screen').classList.add('hidden');
        loadLevel(currentLevel);
    }

    function mainLoop() {
        updateGame();
        render();
        requestAnimationFrame(mainLoop);
    }

    loadLevel(1);
    mainLoop();
</script>
