<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Glass - Exact 50 Levels Game</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background: #1e293b;
            font-family: 'Arial Rounded MT Bold', 'Helvetica Rounded', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            touch-action: none;
        }

        #game-wrapper {
            width: 100%;
            max-width: 412px;
            height: 100%;
            max-height: 780px;
            background: #ffffff;
            position: relative;
            overflow: hidden;
            box-shadow: 0 15px 45px rgba(0,0,0,0.45);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        /* Level Selection Overlay */
        #level-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            background-image: 
                linear-gradient(to right, #f1f5f9 1px, transparent 1px),
                linear-gradient(to bottom, #f1f5f9 1px, transparent 1px);
            background-size: 22px 22px;
            display: flex;
            flex-direction: column;
            padding: 20px;
            z-index: 50;
        }

        .hidden {
            display: none !important;
        }

        .menu-header {
            text-align: center;
            font-size: 26px;
            font-weight: 900;
            color: #334155;
            margin: 15px 0 20px 0;
            letter-spacing: 2px;
        }

        .levels-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            overflow-y: auto;
            padding: 10px 5px 30px 5px;
            flex: 1;
            justify-items: center;
            align-content: start;
        }

        .lvl-item {
            width: 54px;
            height: 54px;
            border-radius: 14px;
            background: #84cc16;
            border: 2.5px solid #1e293b;
            color: #fff;
            font-size: 19px;
            font-weight: 900;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 0 #4d7c0f;
            transition: transform 0.1s;
        }

        .lvl-item:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #4d7c0f;
        }

        .lvl-item.locked {
            background: #e2e8f0;
            color: #94a3b8;
            border-color: #94a3b8;
            box-shadow: 0 4px 0 #cbd5e1;
            cursor: not-allowed;
        }

        /* Exact Win Screen Overlay */
        #win-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.72);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            z-index: 30;
            animation: fadeIn 0.35s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .grid-circle-btn {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid #64748b;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            animation: slideLeft 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .grid-icon {
            display: grid;
            grid-template-columns: repeat(2, 10px);
            gap: 3px;
        }

        .grid-icon span {
            width: 10px;
            height: 10px;
            background: #f59e0b;
            border: 1.5px solid #78350f;
            border-radius: 2px;
        }

        .next-pill-btn {
            height: 50px;
            padding: 0 26px;
            border-radius: 25px;
            background: #84cc16;
            border: 2.5px solid #1e293b;
            box-shadow: 0 4px 10px rgba(0,0,0,0.18), inset 0 2px 0 rgba(255,255,255,0.4);
            color: #1e293b;
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            animation: slideRight 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .next-pill-btn:active, .grid-circle-btn:active {
            transform: scale(0.93);
        }

        @keyframes slideLeft {
            from { transform: translateX(-80px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes slideRight {
            from { transform: translateX(80px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>

<div id="game-wrapper">
    <canvas id="gameCanvas" width="400" height="720"></canvas>

    <!-- Exact Video Win Overlay -->
    <div id="win-overlay" class="hidden">
        <div class="grid-circle-btn" onclick="openLevelMenu()" title="Levels">
            <div class="grid-icon">
                <span></span><span></span>
                <span></span><span></span>
            </div>
        </div>
        <button class="next-pill-btn" id="overlay-action-btn" onclick="handleNextButton()">
            <span id="overlay-btn-text">NEXT</span>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="white" stroke="#1e293b" stroke-width="2">
                <path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
    </div>

    <!-- 50 Levels Menu -->
    <div id="level-menu" class="hidden">
        <div class="menu-header">SELECT LEVEL (1 - 50)</div>
        <div class="levels-grid" id="levels-grid"></div>
    </div>
</div>

<script>
    // =====================================================
    // 1. REALISTIC SOUND EFFECTS (Web Audio API)
    // =====================================================
    let audioCtx = null;

    function initAudio() {
        try {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        } catch (e) {}
    }

    function playSound(type) {
        try {
            initAudio();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;

            if (type === 'pencil') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(220 + Math.random() * 110, now);
                gain.gain.setValueAtTime(0.025, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.028);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.028);
            } 
            else if (type === 'water') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                const f = 330 + (glass.filled * 3.7) + Math.random() * 85;
                osc.frequency.setValueAtTime(f, now);
                osc.frequency.exponentialRampToValueAtTime(f * 1.24, now + 0.06);
                gain.gain.setValueAtTime(0.02, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.06);
            } 
            else if (type === 'click') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                gain.gain.setValueAtTime(0.06, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.05);
            }
            else if (type === 'win') {
                const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.075);
                    gain.gain.setValueAtTime(0.11, now + idx * 0.075);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.075 + 0.45);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + idx * 0.075);
                    osc.stop(now + idx * 0.075 + 0.45);
                });
            }
        } catch (e) {}
    }

    // =====================================================
    // 2. CANVAS & FLUID LAYER SETUP
    // =====================================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const waterLayer = document.createElement('canvas');
    waterLayer.width = 400;
    waterLayer.height = 720;
    const wCtx = waterLayer.getContext('2d');

    let currentLevel = 1;
    let unlockedLevel = parseInt(localStorage.getItem('happyGlassExact50') || '1', 10);
    let gameState = 'drawing'; // 'drawing', 'pouring', 'won', 'lost'
    let inkPercent = 100;
    let showHint = false;

    let lines = [];
    let currentLine = null;
    let isDrawing = false;
    let pencilPos = { x: 0, y: 0, visible: false };

    let dispenser = { x: 40, y: 120, dir: 'down' };
    let glass = { x: 280, y: 470, w: 82, h: 98, taper: 12, filled: 0, walls: [] };
    let shapes = [];
    let allSegments = [];
    let hintCurve = null;

    let waterParticles = [];
    let celebrationStars = [];
    let totalSpawned = 0;
    let spawnTick = 0;
    let dryFrames = 0;
    const MAX_WATER = 260;
    let waveTick = 0;

    // =====================================================
    // 3. EXACT 50 LEVELS GENERATOR
    // =====================================================
    function loadLevel(lvl) {
        currentLevel = lvl;
        gameState = 'drawing';
        inkPercent = 100;
        showHint = false;
        lines = [];
        currentLine = null;
        pencilPos.visible = false;
        waterParticles = [];
        celebrationStars = [];
        totalSpawned = 0;
        spawnTick = 0;
        dryFrames = 0;
        shapes = [];
        allSegments = [];
        document.getElementById('win-overlay').classList.add('hidden');

        if (lvl === 1) {
            dispenser = { x: 40, y: 125, dir: 'down' };
            glass = { x: 280, y: 465, w: 84, h: 98, taper: 13, filled: 0 };

            addRectObstacle(6, 400, 122, 12);
            addRectObstacle(140, 455, 122, 12);
            addRectObstacle(264, 563, 122, 12);

            hintCurve = { x1: 68, y1: 210, cx: 185, cy: 340, x2: 310, y2: 480 };
        } 
        else if (lvl === 2) {
            dispenser = { x: 35, y: 125, dir: 'down' };
            glass = { x: 298, y: 465, w: 84, h: 98, taper: 13, filled: 0 };

            addPolyObstacle([
                { x: 12, y: 345 },
                { x: 106, y: 385 },
                { x: 106, y: 522 },
                { x: 12, y: 522 }
            ]);

            addPolyObstacle([
                { x: 192, y: 408 },
                { x: 286, y: 446 },
                { x: 286, y: 575 },
                { x: 192, y: 575 }
            ]);

            addRectObstacle(286, 563, 114, 12);

            hintCurve = { x1: 42, y1: 235, cx: 190, cy: 365, x2: 325, y2: 480 };
        } 
        else if (lvl === 3) {
            dispenser = { x: 0, y: 180, dir: 'right' };
            glass = { x: 210, y: 488, w: 84, h: 98, taper: 13, filled: 0 };

            addRectObstacle(0, 246, 68, 178);
            addRectObstacle(132, 475, 70, 111);
            addRectObstacle(0, 586, 400, 34);

            hintCurve = { x1: 75, y1: 230, cx: 185, cy: 340, x2: 255, y2: 495 };
        } 
        else {
            const isSidePipe = (lvl % 4 === 0);
            if (isSidePipe) {
                dispenser = { x: 0, y: 140 + ((lvl * 19) % 80), dir: 'right' };
                addRectObstacle(0, dispenser.y + 66, 65, 150);
            } else {
                let dx = 35 + ((lvl * 47) % 240);
                dispenser = { x: dx, y: 120, dir: 'down' };
            }

            let gx = isSidePipe ? (220 + (lvl * 23) % 85) : (265 - ((lvl * 61) % 210));
            if (!isSidePipe && Math.abs(gx - dispenser.x) < 75) {
                gx = (dispenser.x + 150) % 270 + 30;
            }
            let gy = 455 + ((lvl * 13) % 45);
            glass = { x: gx, y: gy, w: 84, h: 98, taper: 13, filled: 0 };

            addRectObstacle(gx - 16, gy + 98, 116, 14);

            let numBlocks = 2 + (lvl % 2);
            for (let i = 0; i < numBlocks; i++) {
                let bx = 25 + ((lvl * 53 + i * 115) % 230);
                let by = 265 + i * 95 + ((lvl * 17) % 35);
                if (Math.abs(by - gy) > 55 && Math.abs(bx - gx) > 45) {
                    if ((lvl + i) % 2 === 0) {
                        addPolyObstacle([
                            { x: bx, y: by },
                            { x: bx + 85, y: by + 32 },
                            { x: bx + 85, y: by + 110 },
                            { x: bx, y: by + 110 }
                        ]);
                    } else {
                        addRectObstacle(bx, by, 110, 14);
                    }
                }
            }

            let startX = dispenser.dir === 'right' ? 80 : dispenser.x + 28;
            let startY = dispenser.dir === 'right' ? dispenser.y + 45 : dispenser.y + 95;
            hintCurve = {
                x1: startX,
                y1: startY,
                cx: (startX + glass.x + 40) / 2,
                cy: (startY + glass.y) / 2 - 20,
                x2: glass.x + 42,
                y2: glass.y + 10
            };
        }

        const gx = glass.x, gy = glass.y, gw = glass.w, gh = glass.h, tp = glass.taper;
        glass.walls = [
            { x1: gx, y1: gy, x2: gx + tp, y2: gy + gh },
            { x1: gx + gw, y1: gy, x2: gx + gw - tp, y2: gy + gh },
            { x1: gx + tp, y1: gy + gh, x2: gx + gw - tp, y2: gy + gh }
        ];
    }

    function addRectObstacle(x, y, w, h) {
        addPolyObstacle([
            { x: x, y: y },
            { x: x + w, y: y },
            { x: x + w, y: y + h },
            { x: x, y: y + h }
        ]);
    }

    function addPolyObstacle(pts) {
        shapes.push(pts);
        for (let i = 0; i < pts.length; i++) {
            let p1 = pts[i];
            let p2 = pts[(i + 1) % pts.length];
            allSegments.push({ x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y });
        }
    }

    // =====================================================
    // 4. TOUCH / MOUSE INPUT & TOP BAR BUTTONS
    // =====================================================
    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        return {
            x: (e.clientX - rect.left) * (canvas.width / rect.width),
            y: (e.clientY - rect.top) * (canvas.height / rect.height)
        };
    }

    canvas.addEventListener('pointerdown', (e) => {
        initAudio();
        const pt = getPos(e);

        if (pt.y < 75) {
            if (Math.hypot(pt.x - 42, pt.y - 38) <= 22) {
                playSound('click');
                openLevelMenu();
                return;
            }
            if (Math.hypot(pt.x - 88, pt.y - 38) <= 22) {
                playSound('click');
                loadLevel(currentLevel);
                return;
            }
            if (pt.x >= 295 && pt.x <= 378 && pt.y >= 18 && pt.y <= 58) {
                playSound('click');
                showHint = !showHint;
                return;
            }
            return;
        }

        if ((gameState !== 'drawing' && gameState !== 'pouring') || inkPercent <= 0) return;

        isDrawing = true;
        currentLine = [pt];
        pencilPos = { x: pt.x, y: pt.y, visible: true };
    });

    canvas.addEventListener('pointermove', (e) => {
        if (!isDrawing || inkPercent <= 0) return;
        const pt = getPos(e);
        if (pt.y < 78) return;

        const last = currentLine[currentLine.length - 1];
        const dist = Math.hypot(pt.x - last.x, pt.y - last.y);

        if (dist > 4) {
            currentLine.push(pt);
            pencilPos = { x: pt.x, y: pt.y, visible: true };
            inkPercent = Math.max(0, inkPercent - dist * 0.14);
            playSound('pencil');

            if (inkPercent <= 0) {
                finishStroke();
            }
        }
    });

    window.addEventListener('pointerup', () => {
        if (!isDrawing) return;
        finishStroke();
    });

    function finishStroke() {
        isDrawing = false;
        pencilPos.visible = false;
        if (currentLine && currentLine.length > 1) {
            lines.push(currentLine);
            if (gameState === 'drawing') {
                gameState = 'pouring';
            }
        }
        currentLine = null;
    }

    // =====================================================
    // 5. BALANCED MEDIUM-SPEED FLUID STREAM PHYSICS
    // =====================================================
    function slideParticleOnSegment(p, x1, y1, x2, y2, radius) {
        const dx = x2 - x1;
        const dy = y2 - y1;
        const lenSq = dx * dx + dy * dy;
        if (lenSq === 0) return;

        let t = ((p.x - x1) * dx + (p.y - y1) * dy) / lenSq;
        t = Math.max(0, Math.min(1, t));

        const cx = x1 + t * dx;
        const cy = y1 + t * dy;
        const distX = p.x - cx;
        const distY = p.y - cy;
        const dist = Math.hypot(distX, distY);

        if (dist < radius && dist > 0.0001) {
            const nx = distX / dist;
            const ny = distY / dist;

            p.x = cx + nx * radius;
            p.y = cy + ny * radius;

            const vn = p.vx * nx + p.vy * ny;
            if (vn < 0) {
                p.vx -= vn * nx;
                p.vy -= vn * ny;
                // Balanced medium surface friction (not too slow, not too fast)
                p.vx *= 0.991;
                p.vy *= 0.991;
            }
        }
    }

    function updateGame() {
        waveTick += 0.125; // Medium wave motion inside glass

        for (let i = celebrationStars.length - 1; i >= 0; i--) {
            let s = celebrationStars[i];
            s.x += s.vx;
            s.y += s.vy;
            s.vy += 0.18;
            s.rot += s.vRot;
            s.life--;
            if (s.life <= 0) celebrationStars.splice(i, 1);
        }

        if (gameState !== 'pouring') return;

        // Medium spawn rate (alternates 1 and 2 particles per frame = 1.5 avg)
        spawnTick++;
        if (totalSpawned < MAX_WATER) {
            const countThisFrame = (spawnTick % 2 === 0) ? 2 : 1;
            for (let k = 0; k < countThisFrame; k++) {
                if (totalSpawned >= MAX_WATER) break;
                if (dispenser.dir === 'down') {
                    waterParticles.push({
                        x: dispenser.x + 28 + (Math.random() - 0.5) * 2.8,
                        y: dispenser.y + 62 + k * 2,
                        vx: (Math.random() - 0.5) * 0.10,
                        vy: 1.85, // Balanced medium downward pour velocity
                        active: true,
                        collected: false
                    });
                } else {
                    waterParticles.push({
                        x: dispenser.x + 62 + k * 2,
                        y: dispenser.y + 28 + (Math.random() - 0.5) * 2.8,
                        vx: 2.75, // Balanced medium side-pipe pour velocity
                        vy: (Math.random() - 0.5) * 0.10,
                        active: true,
                        collected: false
                    });
                }
                totalSpawned++;
            }
            if (spawnTick % 5 === 0) playSound('water');
        }

        let activeCount = 0;
        const subSteps = 4;

        for (let step = 0; step < subSteps; step++) {
            for (let i = 0; i < waterParticles.length; i++) {
                const p = waterParticles[i];
                if (!p.active || p.collected) continue;
                if (step === 0) activeCount++;

                // Balanced medium gravity (0.145) & medium max speed cap (5.8)
                p.vy += 0.145 / subSteps;
                const speed = Math.hypot(p.vx, p.vy);
                if (speed > 5.8) {
                    p.vx = (p.vx / speed) * 5.8;
                    p.vy = (p.vy / speed) * 5.8;
                }

                p.x += p.vx / subSteps;
                p.y += p.vy / subSteps;

                const gx = glass.x, gy = glass.y, gw = glass.w, gh = glass.h;
                const fillTopY = (gy + gh - 8) - ((gh - 24) * (glass.filled / 100));

                // Check if water enters inside the open top of the glass
                if (
                    p.x > gx + 8 &&
                    p.x < gx + gw - 8 &&
                    p.y >= gy + 4 &&
                    p.y <= gy + gh - 6
                ) {
                    if (p.y >= fillTopY - 5) {
                        p.collected = true;
                        glass.filled = Math.min(100, glass.filled + 0.62);

                        if (glass.filled >= 100 && gameState === 'pouring') {
                            triggerVictory();
                        }
                        continue;
                    }
                }

                // Slide along user-drawn black lines
                for (let line of lines) {
                    for (let j = 0; j < line.length - 1; j++) {
                        slideParticleOnSegment(p, line[j].x, line[j].y, line[j + 1].x, line[j + 1].y, 7);
                    }
                }
                if (currentLine && currentLine.length > 1) {
                    for (let j = 0; j < currentLine.length - 1; j++) {
                        slideParticleOnSegment(p, currentLine[j].x, currentLine[j].y, currentLine[j + 1].x, currentLine[j + 1].y, 7);
                    }
                }

                // Slide along glass exterior walls
                for (let w of glass.walls) {
                    slideParticleOnSegment(p, w.x1, w.y1, w.x2, w.y2, 6);
                }

                // Slide along teal obstacles
                for (let seg of allSegments) {
                    slideParticleOnSegment(p, seg.x1, seg.y1, seg.x2, seg.y2, 5.5);
                }

                if (p.y > canvas.height + 30 || p.x < -30 || p.x > canvas.width + 30) {
                    p.active = false;
                }
            }

            // Stream cohesion so droplets fuse into a thick blue liquid ribbon
            if (step === 0) {
                for (let i = 0; i < waterParticles.length; i++) {
                    const p1 = waterParticles[i];
                    if (!p1.active || p1.collected) continue;
                    for (let j = Math.max(0, i - 5); j < Math.min(waterParticles.length, i + 5); j++) {
                        if (i === j) continue;
                        const p2 = waterParticles[j];
                        if (!p2.active || p2.collected) continue;
                        const dx = p2.x - p1.x;
                        const dy = p2.y - p1.y;
                        const d = Math.hypot(dx, dy);
                        if (d > 2 && d < 24) {
                            p1.vx = p1.vx * 0.89 + p2.vx * 0.11;
                            p1.vy = p1.vy * 0.89 + p2.vy * 0.11;
                        }
                    }
                }
            }
        }

        // Check if water finished without filling
        if (totalSpawned >= MAX_WATER && activeCount === 0 && glass.filled < 100) {
            dryFrames++;
            if (dryFrames > 42) {
                triggerRetry();
            }
        }
    }

    function triggerVictory() {
        if (gameState === 'won') return;
        gameState = 'won';
        playSound('win');

        if (currentLevel === unlockedLevel && unlockedLevel < 50) {
            unlockedLevel++;
            localStorage.setItem('happyGlassExact50', unlockedLevel.toString());
        }

        for (let i = 0; i < 28; i++) {
            celebrationStars.push({
                x: glass.x + glass.w / 2 + (Math.random() - 0.5) * 40,
                y: glass.y + glass.h / 2,
                vx: (Math.random() - 0.5) * 8,
                vy: -3 - Math.random() * 6,
                size: 7 + Math.random() * 7,
                rot: Math.random() * Math.PI,
                vRot: (Math.random() - 0.5) * 0.2,
                life: 55
            });
        }

        setTimeout(() => {
            document.getElementById('overlay-btn-text').innerText = 'NEXT';
            document.getElementById('win-overlay').classList.remove('hidden');
        }, 850);
    }

    function triggerRetry() {
        if (gameState === 'won' || gameState === 'lost') return;
        gameState = 'lost';
        document.getElementById('overlay-btn-text').innerText = 'RETRY';
        document.getElementById('win-overlay').classList.remove('hidden');
    }

    function handleNextButton() {
        playSound('click');
        if (gameState === 'won') {
            if (currentLevel < 50) loadLevel(currentLevel + 1);
            else openLevelMenu();
        } else {
            loadLevel(currentLevel);
        }
    }

    // =====================================================
    // 6. EXACT VIDEO VISUAL RENDERING
    // =====================================================
    function drawGridBackground() {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = '#f1f5f9';
        ctx.lineWidth = 1;
        const step = 22;
        for (let x = 0; x <= canvas.width; x += step) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, canvas.height);
            ctx.stroke();
        }
        for (let y = 0; y <= canvas.height; y += step) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(canvas.width, y);
            ctx.stroke();
        }
    }

    function drawTopHUD() {
        // 1. Home Circle Button (x: 42, y: 38)
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#64748b';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(42, 38, 19, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(42, 38, 16, 0, Math.PI * 2);
        ctx.stroke();

        // House Icon
        ctx.fillStyle = '#fde047';
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 1.4;
        ctx.fillRect(35, 37, 14, 10);
        ctx.strokeRect(35, 37, 14, 10);
        ctx.fillStyle = '#fb923c';
        ctx.beginPath();
        ctx.moveTo(32, 38);
        ctx.lineTo(42, 29);
        ctx.lineTo(52, 38);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // 2. Restart Circle Button (x: 88, y: 38)
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#64748b';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(88, 38, 19, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(88, 38, 16, 0, Math.PI * 2);
        ctx.stroke();

        // Orange Circular Refresh Arrow
        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 3.2;
        ctx.beginPath();
        ctx.arc(88, 38, 7.5, 0.3 * Math.PI, 1.85 * Math.PI);
        ctx.stroke();
        ctx.fillStyle = '#f59e0b';
        ctx.beginPath();
        ctx.moveTo(95, 31);
        ctx.lineTo(98, 38);
        ctx.lineTo(90, 37);
        ctx.closePath();
        ctx.fill();

        // 3. Green HINT Pill Button
        ctx.fillStyle = '#a3e635';
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(298, 22, 76, 30, 15);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#fde047';
        ctx.beginPath();
        ctx.arc(313, 37, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#1e293b';
        ctx.font = 'bold 13px Arial';
        ctx.textAlign = 'left';
        ctx.fillText('HINT', 324, 42);

        // 4. Center "LEVEL X" Title
        ctx.fillStyle = '#334155';
        ctx.font = 'bold 17px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(`LEVEL ${currentLevel}`, 200, 68);

        // 5. Percentage Text + Green Ink Bar
        ctx.fillStyle = '#1e293b';
        ctx.font = 'bold 15px Arial';
        ctx.textAlign = 'right';
        ctx.fillText(`${Math.round(inkPercent)} %`, 110, 92);

        const barX = 116, barY = 77, barW = 166, barH = 18;
        ctx.fillStyle = '#78716c';
        ctx.fillRect(barX, barY, barW, barH);

        const fillW = barW * (inkPercent / 100);
        ctx.fillStyle = '#84cc16';
        ctx.fillRect(barX, barY, fillW, barH);

        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 1.8;
        ctx.strokeRect(barX, barY, barW, barH);

        ctx.strokeStyle = '#ef4444';
        ctx.lineWidth = 2;
        [barX + barW * 0.33, barX + barW * 0.66].forEach(lx => {
            ctx.beginPath();
            ctx.moveTo(lx, barY + 1);
            ctx.lineTo(lx, barY + barH - 1);
            ctx.stroke();
        });

        // 6. Three Star Icons
        const s1 = inkPercent > 10;
        const s2 = inkPercent > 33;
        const s3 = inkPercent > 66;
        drawMiniStar(296, 86, 7.5, s1);
        drawMiniStar(314, 86, 7.5, s2);
        drawMiniStar(332, 86, 7.5, s3);
    }

    function drawMiniStar(cx, cy, r, filled) {
        ctx.save();
        ctx.beginPath();
        for (let i = 0; i < 5; i++) {
            const a1 = (i * 72 - 90) * Math.PI / 180;
            const a2 = ((i * 72 + 36) - 90) * Math.PI / 180;
            if (i === 0) ctx.moveTo(cx + Math.cos(a1) * r, cy + Math.sin(a1) * r);
            else ctx.lineTo(cx + Math.cos(a1) * r, cy + Math.sin(a1) * r);
            ctx.lineTo(cx + Math.cos(a2) * (r * 0.45), cy + Math.sin(a2) * (r * 0.45));
        }
        ctx.closePath();
        ctx.fillStyle = filled ? '#facc15' : '#ffffff';
        ctx.strokeStyle = filled ? '#b45309' : '#94a3b8';
        ctx.lineWidth = 1.3;
        ctx.fill();
        ctx.stroke();
        ctx.restore();
    }

    function drawDispenserPipe() {
        ctx.save();
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 1.6;

        if (dispenser.dir === 'down') {
            const x = dispenser.x, y = dispenser.y;
            if (gameState === 'drawing') {
                ctx.fillStyle = '#00d8ff';
                ctx.beginPath();
                ctx.arc(x + 28, y + 60, 8, 0, Math.PI);
                ctx.fill();
            }

            let g1 = ctx.createLinearGradient(x + 8, y, x + 48, y);
            g1.addColorStop(0, '#9ca3af');
            g1.addColorStop(0.5, '#d1d5db');
            g1.addColorStop(1, '#6b7280');
            ctx.fillStyle = g1;
            ctx.fillRect(x + 8, y, 40, 44);
            ctx.strokeRect(x + 8, y, 40, 44);

            ctx.fillStyle = g1;
            ctx.fillRect(x, y + 44, 56, 15);
            ctx.strokeRect(x, y + 44, 56, 15);

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.moveTo(x + 24, y + 10);
            ctx.lineTo(x + 32, y + 10);
            ctx.lineTo(x + 32, y + 23);
            ctx.lineTo(x + 38, y + 23);
            ctx.lineTo(x + 28, y + 35);
            ctx.lineTo(x + 18, y + 23);
            ctx.lineTo(x + 24, y + 23);
            ctx.closePath();
            ctx.fill();
        } else {
            const x = dispenser.x, y = dispenser.y;
            let g1 = ctx.createLinearGradient(x, y + 8, x, y + 48);
            g1.addColorStop(0, '#9ca3af');
            g1.addColorStop(0.5, '#d1d5db');
            g1.addColorStop(1, '#6b7280');
            ctx.fillStyle = g1;
            ctx.fillRect(x, y + 8, 44, 40);
            ctx.strokeRect(x, y + 8, 44, 40);

            ctx.fillRect(x + 44, y, 15, 56);
            ctx.strokeRect(x + 44, y, 15, 56);

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.moveTo(x + 10, y + 24);
            ctx.lineTo(x + 23, y + 24);
            ctx.lineTo(x + 23, y + 18);
            ctx.lineTo(x + 35, y + 28);
            ctx.lineTo(x + 23, y + 38);
            ctx.lineTo(x + 23, y + 32);
            ctx.lineTo(x + 10, y + 32);
            ctx.closePath();
            ctx.fill();
        }
        ctx.restore();
    }

    function drawTealObstacles() {
        ctx.fillStyle = '#439798';
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 1.6;

        shapes.forEach(pts => {
            ctx.beginPath();
            ctx.moveTo(pts[0].x, pts[0].y);
            for (let i = 1; i < pts.length; i++) {
                ctx.lineTo(pts[i].x, pts[i].y);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        });
    }

    function drawContinuousLiquidStream() {
        wCtx.clearRect(0, 0, waterLayer.width, waterLayer.height);
        wCtx.lineCap = 'round';
        wCtx.lineJoin = 'round';

        // 1. Outer bright blue outline
        for (let i = 0; i < waterParticles.length - 1; i++) {
            const p1 = waterParticles[i];
            const p2 = waterParticles[i + 1];
            if (!p1.active || p1.collected || !p2.active || p2.collected) continue;
            const d = Math.hypot(p2.x - p1.x, p2.y - p1.y);
            if (d < 38) {
                wCtx.strokeStyle = '#0099ff';
                wCtx.lineWidth = 17;
                wCtx.beginPath();
                wCtx.moveTo(p1.x, p1.y);
                wCtx.lineTo(p2.x, p2.y);
                wCtx.stroke();
            }
        }

        for (let p of waterParticles) {
            if (!p.active || p.collected) continue;
            wCtx.fillStyle = '#0099ff';
            wCtx.beginPath();
            wCtx.arc(p.x, p.y, 8.5, 0, Math.PI * 2);
            wCtx.fill();
        }

        // 2. Inner bright cyan core
        for (let i = 0; i < waterParticles.length - 1; i++) {
            const p1 = waterParticles[i];
            const p2 = waterParticles[i + 1];
            if (!p1.active || p1.collected || !p2.active || p2.collected) continue;
            const d = Math.hypot(p2.x - p1.x, p2.y - p1.y);
            if (d < 38) {
                wCtx.strokeStyle = '#18ffff';
                wCtx.lineWidth = 11;
                wCtx.beginPath();
                wCtx.moveTo(p1.x, p1.y);
                wCtx.lineTo(p2.x, p2.y);
                wCtx.stroke();
            }
        }

        for (let p of waterParticles) {
            if (!p.active || p.collected) continue;
            wCtx.fillStyle = '#18ffff';
            wCtx.beginPath();
            wCtx.arc(p.x, p.y, 5.5, 0, Math.PI * 2);
            wCtx.fill();
        }

        ctx.drawImage(waterLayer, 0, 0);
    }

    function drawExactGlass() {
        const gx = glass.x, gy = glass.y, gw = glass.w, gh = glass.h, tp = glass.taper;
        const wallThick = 9;

        ctx.fillStyle = 'rgba(241, 245, 249, 0.7)';
        ctx.beginPath();
        ctx.moveTo(gx + wallThick, gy);
        ctx.lineTo(gx + tp + 6, gy + gh - 9);
        ctx.lineTo(gx + gw - tp - 6, gy + gh - 9);
        ctx.lineTo(gx + gw - wallThick, gy);
        ctx.closePath();
        ctx.fill();

        if (glass.filled > 0) {
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(gx + wallThick - 1, gy);
            ctx.lineTo(gx + tp + 5, gy + gh - 8);
            ctx.lineTo(gx + gw - tp - 5, gy + gh - 8);
            ctx.lineTo(gx + gw - wallThick + 1, gy);
            ctx.closePath();
            ctx.clip();

            const maxH = gh - 24;
            const curH = maxH * (glass.filled / 100);
            const topY = gy + gh - 8 - curH;

            ctx.fillStyle = '#18ffff';
            ctx.strokeStyle = '#0099ff';
            ctx.lineWidth = 3;

            ctx.beginPath();
            ctx.moveTo(gx, gy + gh);
            for (let x = gx; x <= gx + gw; x += 4) {
                const wave = Math.sin(x * 0.08 + waveTick) * (glass.filled < 100 ? 4.2 : 1.5);
                ctx.lineTo(x, topY + wave);
            }
            ctx.lineTo(gx + gw, gy + gh);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.restore();
        }

        ctx.fillStyle = '#c4c9ce';
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 1.6;
        ctx.lineJoin = 'round';

        ctx.beginPath();
        ctx.moveTo(gx, gy);
        ctx.lineTo(gx + tp, gy + gh);
        ctx.lineTo(gx + gw - tp, gy + gh);
        ctx.lineTo(gx + gw, gy);
        ctx.lineTo(gx + gw - wallThick, gy);
        ctx.lineTo(gx + gw - tp - 6, gy + gh - 9);
        ctx.lineTo(gx + tp + 6, gy + gh - 9);
        ctx.lineTo(gx + wallThick, gy);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.save();
        ctx.setLineDash([5, 4]);
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.moveTo(gx + wallThick + 2, gy + 16);
        ctx.lineTo(gx + gw - wallThick - 2, gy + 16);
        ctx.stroke();
        ctx.restore();

        const fx = gx + gw / 2;
        const fy = gy + gh / 2 + 2;

        [-10, 10].forEach(offsetX => {
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.ellipse(fx + offsetX, fy - 6, 5.5, 7.5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#1e293b';
            ctx.beginPath();
            ctx.arc(fx + offsetX, fy - 4, 2.8, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(fx + offsetX - 1, fy - 5.2, 1, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            ctx.arc(fx + offsetX, fy - 13, 5, 1.15 * Math.PI, 1.85 * Math.PI);
            ctx.stroke();
        });

        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        if (gameState === 'pouring' && glass.filled < 95) {
            ctx.fillStyle = '#ffffff';
            ctx.ellipse(fx, fy + 11, 4.2, 5.5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
        } else {
            ctx.arc(fx, fy + 6, 7, 0.15 * Math.PI, 0.85 * Math.PI);
            ctx.stroke();
        }
    }

    function drawYellowPencil(x, y) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(28 * Math.PI / 180);

        const w = 22;
        const h = 115;
        const tipH = 26;

        ctx.fillStyle = '#fef3c7';
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(-w / 2, -tipH);
        ctx.lineTo(w / 2, -tipH);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#1e293b';
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(-4.5, -10);
        ctx.lineTo(4.5, -10);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#facc15';
        ctx.fillRect(-w / 2, -tipH - h, w, h);
        ctx.strokeRect(-w / 2, -tipH - h, w, h);

        ctx.fillStyle = '#eab308';
        ctx.fillRect(-w / 6, -tipH - h, w / 3, h);
        ctx.strokeRect(-w / 6, -tipH - h, w / 3, h);

        ctx.fillStyle = '#fde047';
        ctx.fillRect(-w / 2, -tipH - h - 5, w, 5);
        ctx.strokeRect(-w / 2, -tipH - h - 5, w, 5);

        ctx.restore();
    }

    function drawCelebrationStars() {
        celebrationStars.forEach(s => {
            ctx.save();
            ctx.translate(s.x, s.y);
            ctx.rotate(s.rot);
            drawMiniStar(0, 0, s.size, true);
            ctx.restore();
        });
    }

    function render() {
        drawGridBackground();

        if (showHint && hintCurve) {
            ctx.save();
            ctx.setLineDash([7, 6]);
            ctx.strokeStyle = 'rgba(132, 204, 22, 0.85)';
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.moveTo(hintCurve.x1, hintCurve.y1);
            ctx.quadraticCurveTo(hintCurve.cx, hintCurve.cy, hintCurve.x2, hintCurve.y2);
            ctx.stroke();
            ctx.restore();
        }

        drawContinuousLiquidStream();
        drawTealObstacles();
        drawDispenserPipe();
        drawExactGlass();

        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 6.5;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        lines.forEach(line => {
            if (line.length < 2) return;
            ctx.beginPath();
            ctx.moveTo(line[0].x, line[0].y);
            for (let i = 1; i < line.length; i++) {
                ctx.lineTo(line[i].x, line[i].y);
            }
            ctx.stroke();
        });

        if (currentLine && currentLine.length > 1) {
            ctx.beginPath();
            ctx.moveTo(currentLine[0].x, currentLine[0].y);
            for (let i = 1; i < currentLine.length; i++) {
                ctx.lineTo(currentLine[i].x, currentLine[i].y);
            }
            ctx.stroke();
        }

        if (pencilPos.visible) {
            drawYellowPencil(pencilPos.x, pencilPos.y);
        }

        drawCelebrationStars();
        drawTopHUD();
    }

    // =====================================================
    // 7. 50 LEVELS MENU MANAGEMENT
    // =====================================================
    const gridEl = document.getElementById('levels-grid');
    for (let i = 1; i <= 50; i++) {
        const item = document.createElement('div');
        item.className = 'lvl-item' + (i > unlockedLevel ? ' locked' : '');
        item.id = `menu-lvl-${i}`;
        item.innerText = i;
        item.onclick = () => {
            if (i <= unlockedLevel) {
                playSound('click');
                document.getElementById('level-menu').classList.add('hidden');
                loadLevel(i);
            }
        };
        gridEl.appendChild(item);
    }

    function openLevelMenu() {
        for (let i = 1; i <= 50; i++) {
            const el = document.getElementById(`menu-lvl-${i}`);
            if (i <= unlockedLevel) el.classList.remove('locked');
            else el.classList.add('locked');
        }
        document.getElementById('win-overlay').classList.add('hidden');
        document.getElementById('level-menu').classList.remove('hidden');
    }

    function mainLoop() {
        updateGame();
        render();
        requestAnimationFrame(mainLoop);
    }

    loadLevel(1);
    mainLoop();
</script>
