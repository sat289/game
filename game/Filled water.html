<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Glass 3D - 50 Levels</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background: #e2e8f0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            touch-action: none;
            user-select: none;
        }

        #game-container {
            width: 100%;
            max-width: 420px;
            height: 100%;
            max-height: 740px;
            background: #ffffff;
            position: relative;
            box-shadow: 0 12px 40px rgba(0,0,0,0.18);
            border-radius: 18px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            z-index: 20;
        }

        .hidden {
            display: none !important;
        }

        /* Level Select Screen */
        #level-select-screen {
            padding: 18px;
            background: linear-gradient(180deg, #f0f9ff 0%, #ffffff 100%);
        }

        .header-title {
            text-align: center;
            color: #0284c7;
            font-size: 26px;
            font-weight: 900;
            margin: 10px 0 16px 0;
            letter-spacing: 1.5px;
        }

        .levels-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            overflow-y: auto;
            flex: 1;
            padding: 8px 4px 20px 4px;
            justify-items: center;
            align-content: start;
        }

        .level-btn {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: linear-gradient(145deg, #fbbf24, #f59e0b);
            border: 2px solid #ffffff;
            color: #fff;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(245, 158, 11, 0.35);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .level-btn:active {
            transform: scale(0.92);
        }

        .level-btn.locked {
            background: #e2e8f0;
            color: #94a3b8;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Gameplay Screen */
        #game-screen {
            background-color: #ffffff;
            background-image: 
                linear-gradient(to right, #f1f5f9 1px, transparent 1px),
                linear-gradient(to bottom, #f1f5f9 1px, transparent 1px);
            background-size: 20px 20px;
            z-index: 10;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            background: rgba(255,255,255,0.95);
            border-bottom: 2px solid #f1f5f9;
            height: 64px;
            flex-shrink: 0;
        }

        .icon-btn {
            background: #ffffff;
            border: 2px solid #cbd5e1;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.06);
            padding: 0;
        }

        .icon-btn:active {
            transform: scale(0.9);
        }

        .level-indicator {
            font-weight: 900;
            color: #1e293b;
            font-size: 17px;
            white-space: nowrap;
        }

        .meter-wrapper {
            position: relative;
            width: 130px;
        }

        .meter-container {
            width: 100%;
            height: 14px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #cbd5e1;
        }

        #ink-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #84cc16, #65a30d);
            transition: width 0.05s linear;
        }

        .star-markers {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: #f59e0b;
            padding: 0 12px;
            margin-top: 2px;
        }

        .canvas-wrapper {
            flex: 1;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        /* Modal Overlay */
        .modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(3px);
        }

        .modal-content {
            background: white;
            padding: 26px;
            border-radius: 22px;
            text-align: center;
            width: 270px;
            box-shadow: 0 20px 45px rgba(0,0,0,0.35);
            animation: popIn 0.28s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.6); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-content h2 {
            margin: 0 0 8px 0;
            color: #0284c7;
            font-size: 26px;
        }

        .stars {
            font-size: 34px;
            margin-bottom: 12px;
            letter-spacing: 4px;
        }

        .modal-btn {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            border: none;
            padding: 13px 20px;
            font-size: 16px;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.35);
            margin-top: 6px;
        }

        .modal-btn.retry {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.35);
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- Level Select Screen -->
    <div id="level-select-screen" class="screen hidden">
        <div class="header-title">SELECT LEVEL (1-50)</div>
        <div class="levels-grid" id="levels-grid"></div>
    </div>

    <!-- Gameplay Screen (Visible immediately on load!) -->
    <div id="game-screen" class="screen">
        <div class="top-bar">
            <button class="icon-btn" onclick="returnToLevels()" title="Levels">🏠</button>
            <div class="level-indicator" id="current-level-text">LEVEL 1</div>
            <div class="meter-wrapper">
                <div class="meter-container">
                    <div id="ink-fill"></div>
                </div>
                <div class="star-markers">
                    <span>★</span><span>★★</span><span>★★★</span>
                </div>
            </div>
            <button class="icon-btn" onclick="toggleHint()" title="Hint">💡</button>
            <button class="icon-btn" onclick="restartLevel()" title="Restart">🔄</button>
        </div>
        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="400" height="620"></canvas>
        </div>
    </div>

    <!-- Victory / Try Again Modal -->
    <div id="victory-modal" class="modal hidden">
        <div class="modal-content">
            <h2 id="modal-title">Happy Glass!</h2>
            <div class="stars" id="modal-stars">⭐⭐⭐</div>
            <p id="modal-desc" style="color:#64748b; margin: 0 0 14px 0;">Level Completed!</p>
            <button class="modal-btn" id="modal-primary-btn" onclick="nextLevel()">NEXT LEVEL ▶</button>
        </div>
    </div>
</div>

<script>
    // ==========================================
    // 1. CROSS-BROWSER ROUNDED RECT HELPER
    // ==========================================
    function drawRoundedBox(context, x, y, w, h, r) {
        r = Math.min(r, w / 2, h / 2);
        context.beginPath();
        context.moveTo(x + r, y);
        context.lineTo(x + w - r, y);
        context.quadraticCurveTo(x + w, y, x + w, y + r);
        context.lineTo(x + w, y + h - r);
        context.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        context.lineTo(x + r, y + h);
        context.quadraticCurveTo(x, y + h, x, y + h - r);
        context.lineTo(x, y + r);
        context.quadraticCurveTo(x, y, x + r, y);
        context.closePath();
    }

    // ==========================================
    // 2. WEB AUDIO SYNTHESIZER (NO EXTERNAL FILES)
    // ==========================================
    let audioCtx = null;

    function initAudio() {
        try {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        } catch (e) {}
    }

    function playSound(type) {
        try {
            initAudio();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;

            if (type === 'draw') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(190 + Math.random() * 60, now);
                gain.gain.setValueAtTime(0.02, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.03);
            } else if (type === 'pour') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                const f = 330 + (glass.filled * 3.5) + Math.random() * 70;
                osc.frequency.setValueAtTime(f, now);
                gain.gain.setValueAtTime(0.018, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.06);
            } else if (type === 'win') {
                [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + i * 0.08);
                    gain.gain.setValueAtTime(0.09, now + i * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.45);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + i * 0.08);
                    osc.stop(now + i * 0.08 + 0.45);
                });
            }
        } catch (e) {}
    }

    // ==========================================
    // 3. GAME STATE & 50-LEVEL INITIALIZATION
    // ==========================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const fluidCanvas = document.createElement('canvas');
    fluidCanvas.width = 400;
    fluidCanvas.height = 620;
    const fluidCtx = fluidCanvas.getContext('2d');

    let currentLevel = 1;
    let unlockedLevel = parseInt(localStorage.getItem('happyGlassUnlocked') || '1', 10);
    let gameState = 'drawing';
    let ink = 100;
    let showHint = false;

    let lines = [];
    let currentLine = null;
    let isDrawing = false;

    // Default valid objects so canvas NEVER renders blank
    let pipe = { x: 60, y: 70, w: 38, h: 32 };
    let glass = { x: 265, y: 440, w: 68, h: 88, taper: 9, filled: 0, walls: [] };
    let obstacles = [];
    let particles = [];
    let splashes = [];
    let totalSpawned = 0;
    let emptyFrames = 0;
    const MAX_WATER_PARTICLES = 270;
    let waveTime = 0;

    // Generate 50 Level Buttons
    const gridContainer = document.getElementById('levels-grid');
    for (let i = 1; i <= 50; i++) {
        const btn = document.createElement('button');
        btn.className = 'level-btn' + (i > unlockedLevel ? ' locked' : '');
        btn.id = `lvl-btn-${i}`;
        btn.innerText = i;
        btn.onclick = () => {
            if (i <= unlockedLevel) {
                initAudio();
                startLevel(i);
            }
        };
        gridContainer.appendChild(btn);
    }

    function updateLevelButtons() {
        for (let i = 1; i <= 50; i++) {
            const btn = document.getElementById(`lvl-btn-${i}`);
            if (i <= unlockedLevel) btn.classList.remove('locked');
            else btn.classList.add('locked');
        }
    }

    function returnToLevels() {
        gameState = 'menu';
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('level-select-screen').classList.remove('hidden');
        document.getElementById('victory-modal').classList.add('hidden');
        updateLevelButtons();
    }

    function toggleHint() {
        showHint = !showHint;
    }

    function startLevel(lvl) {
        currentLevel = lvl;
        document.getElementById('current-level-text').innerText = `LEVEL ${lvl}`;
        document.getElementById('level-select-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        document.getElementById('victory-modal').classList.add('hidden');
        setupLevelData(lvl);
        resetLevelState();
    }

    function restartLevel() {
        document.getElementById('victory-modal').classList.add('hidden');
        resetLevelState();
    }

    function resetLevelState() {
        gameState = 'drawing';
        ink = 100;
        showHint = false;
        document.getElementById('ink-fill').style.width = '100%';
        lines = [];
        particles = [];
        splashes = [];
        totalSpawned = 0;
        emptyFrames = 0;
        glass.filled = 0;
    }

    function setupLevelData(lvl) {
        obstacles = [];

        if (lvl === 1) {
            pipe = { x: 65, y: 65, w: 38, h: 32 };
            glass = { x: 265, y: 440, w: 70, h: 90, taper: 9, filled: 0 };
        } else {
            let pipeX = 45 + ((lvl * 37) % 250);
            pipe = { x: pipeX, y: 55, w: 38, h: 32 };

            let glassX = 260 - ((lvl * 53) % 190);
            if (Math.abs(glassX - pipeX) < 70) {
                glassX = (pipeX + 135) % 260 + 35;
            }
            let glassY = 445 - ((lvl * 11) % 75);
            glass = { x: glassX, y: glassY, w: 70, h: 90, taper: 9, filled: 0 };

            let count = Math.min(Math.floor(lvl / 3) + 1, 4);
            for (let i = 0; i < count; i++) {
                let ox = 45 + ((lvl * 43 + i * 85) % 235);
                let oy = 175 + ((lvl * 29 + i * 68) % 185);
                let ow = 60 + ((lvl + i * 17) % 45);
                let oh = 16;
                if (Math.abs(oy - glass.y) > 45 && Math.abs(oy - (pipe.y + pipe.h)) > 40) {
                    obstacles.push({ x: ox, y: oy, w: ow, h: oh });
                }
            }
        }

        // Solid platform stand underneath the glass
        obstacles.push({
            x: glass.x - 14,
            y: glass.y + glass.h + 2,
            w: glass.w + 28,
            h: 16,
            isStand: true
        });

        // Solid glass side walls & bottom so water NEVER leaks through the sides
        glass.walls = [
            { x1: glass.x, y1: glass.y, x2: glass.x + glass.taper, y2: glass.y + glass.h },
            { x1: glass.x + glass.w, y1: glass.y, x2: glass.x + glass.w - glass.taper, y2: glass.y + glass.h },
            { x1: glass.x + glass.taper, y1: glass.y + glass.h, x2: glass.x + glass.w - glass.taper, y2: glass.y + glass.h }
        ];
    }

    // ==========================================
    // 4. TOUCH & MOUSE DRAWING + STREAM PHYSICS
    // ==========================================
    function getCanvasCoords(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        return {
            x: (e.clientX - rect.left) * scaleX,
            y: (e.clientY - rect.top) * scaleY
        };
    }

    canvas.addEventListener('pointerdown', (e) => {
        if (gameState !== 'drawing' || ink <= 0) return;
        initAudio();
        isDrawing = true;
        currentLine = [getCanvasCoords(e)];
    });

    canvas.addEventListener('pointermove', (e) => {
        if (!isDrawing || gameState !== 'drawing' || ink <= 0) return;
        const pt = getCanvasCoords(e);
        const last = currentLine[currentLine.length - 1];
        const dist = Math.hypot(pt.x - last.x, pt.y - last.y);

        if (dist > 4) {
            currentLine.push(pt);
            ink = Math.max(0, ink - dist * 0.11);
            document.getElementById('ink-fill').style.width = ink + '%';
            playSound('draw');
            if (ink <= 0) finishDrawing();
        }
    });

    window.addEventListener('pointerup', () => {
        if (!isDrawing) return;
        finishDrawing();
    });

    function finishDrawing() {
        isDrawing = false;
        if (currentLine && currentLine.length > 1) {
            lines.push(currentLine);
        }
        currentLine = null;
        if (gameState === 'drawing' && lines.length > 0) {
            gameState = 'running';
        }
    }

    function resolveSegmentSlide(p, x1, y1, x2, y2, radius) {
        const dx = x2 - x1;
        const dy = y2 - y1;
        const lenSq = dx * dx + dy * dy;
        if (lenSq === 0) return;

        let t = ((p.x - x1) * dx + (p.y - y1) * dy) / lenSq;
        t = Math.max(0, Math.min(1, t));

        const cx = x1 + t * dx;
        const cy = y1 + t * dy;
        const distX = p.x - cx;
        const distY = p.y - cy;
        const dist = Math.hypot(distX, distY);

        if (dist < radius && dist > 0.0001) {
            const nx = distX / dist;
            const ny = distY / dist;

            p.x = cx + nx * radius;
            p.y = cy + ny * radius;

            const vn = p.vx * nx + p.vy * ny;
            if (vn < 0) {
                p.vx -= vn * nx;
                p.vy -= vn * ny;
                p.vx *= 0.994;
                p.vy *= 0.994;
            }
        }
    }

    function updateFluidPhysics() {
        waveTime += 0.15;

        // Update tiny surface splash droplets inside the glass
        for (let i = splashes.length - 1; i >= 0; i--) {
            let s = splashes[i];
            s.x += s.vx;
            s.y += s.vy;
            s.vy += 0.25;
            s.life--;
            if (s.life <= 0) splashes.splice(i, 1);
        }

        if (gameState !== 'running') return;

        if (totalSpawned < MAX_WATER_PARTICLES) {
            for (let k = 0; k < 2; k++) {
                particles.push({
                    x: pipe.x + pipe.w / 2 + (Math.random() - 0.5) * 2.5,
                    y: pipe.y + pipe.h - 2 + (k * 2.5),
                    vx: (Math.random() - 0.5) * 0.12,
                    vy: 2.3,
                    collected: false,
                    active: true
                });
                totalSpawned++;
            }
            if (totalSpawned % 6 === 0) playSound('pour');
        }

        let activeCount = 0;
        const subSteps = 4;
        for (let step = 0; step < subSteps; step++) {
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                if (!p.active || p.collected) continue;
                if (step === 0) activeCount++;

                p.vy += 0.19 / subSteps;
                p.x += p.vx / subSteps;
                p.y += p.vy / subSteps;

                const waterSurfaceY = (glass.y + glass.h - 10) - ((glass.h - 26) * (glass.filled / 100));

                // Check entry strictly through open top rim of glass
                if (
                    p.x > glass.x + 7 &&
                    p.x < glass.x + glass.w - 7 &&
                    p.y >= glass.y + 3 &&
                    p.y <= glass.y + glass.h - 6
                ) {
                    if (p.y >= waterSurfaceY - 4) {
                        p.collected = true;
                        glass.filled = Math.min(100, glass.filled + 0.58);

                        // Spawn tiny splash droplet inside glass
                        if (Math.random() < 0.35 && glass.filled < 96) {
                            splashes.push({
                                x: p.x,
                                y: waterSurfaceY,
                                vx: (Math.random() - 0.5) * 2.2,
                                vy: -1.5 - Math.random() * 1.5,
                                life: 14
                            });
                        }

                        if (glass.filled >= 100) {
                            setTimeout(triggerWin, 250);
                        }
                        continue;
                    }
                }

                // Slide smoothly along user lines
                for (let line of lines) {
                    for (let j = 0; j < line.length - 1; j++) {
                        resolveSegmentSlide(p, line[j].x, line[j].y, line[j + 1].x, line[j + 1].y, 6.5);
                    }
                }

                // Slide/deflect off solid glass exterior walls
                for (let w of glass.walls) {
                    resolveSegmentSlide(p, w.x1, w.y1, w.x2, w.y2, 5.5);
                }

                // Slide along obstacles
                for (let obs of obstacles) {
                    resolveSegmentSlide(p, obs.x, obs.y, obs.x + obs.w, obs.y, 5);
                    resolveSegmentSlide(p, obs.x, obs.y, obs.x, obs.y + obs.h, 5);
                    resolveSegmentSlide(p, obs.x + obs.w, obs.y, obs.x + obs.w, obs.y + obs.h, 5);
                }

                if (p.y > canvas.height + 30 || p.x < -30 || p.x > canvas.width + 30) {
                    p.active = false;
                }
            }

            // Stream cohesion so water stays connected like a ribbon
            if (step === 0) {
                for (let i = 0; i < particles.length; i++) {
                    const p1 = particles[i];
                    if (!p1.active || p1.collected) continue;
                    for (let j = Math.max(0, i - 4); j < Math.min(particles.length, i + 4); j++) {
                        if (i === j) continue;
                        const p2 = particles[j];
                        if (!p2.active || p2.collected) continue;
                        const dx = p2.x - p1.x;
                        const dy = p2.y - p1.y;
                        const d = Math.hypot(dx, dy);
                        if (d > 2 && d < 24) {
                            p1.vx = p1.vx * 0.9 + p2.vx * 0.1;
                            p1.vy = p1.vy * 0.9 + p2.vy * 0.1;
                        }
                    }
                }
            }
        }

        // Check if water ran out before filling the glass
        if (totalSpawned >= MAX_WATER_PARTICLES && activeCount === 0 && glass.filled < 100) {
            emptyFrames++;
            if (emptyFrames > 40) {
                triggerTryAgain();
            }
        }
    }

    function triggerWin() {
        if (gameState === 'won') return;
        gameState = 'won';
        playSound('win');

        if (currentLevel === unlockedLevel && unlockedLevel < 50) {
            unlockedLevel++;
            localStorage.setItem('happyGlassUnlocked', unlockedLevel.toString());
        }

        const starsCount = ink >= 55 ? 3 : (ink >= 25 ? 2 : 1);
        document.getElementById('modal-title').innerText = 'Happy Glass!';
        document.getElementById('modal-stars').innerText = '⭐'.repeat(starsCount);
        document.getElementById('modal-desc').innerText = `Level ${currentLevel} Completed!`;
        const btn = document.getElementById('modal-primary-btn');
        btn.innerText = 'NEXT LEVEL ▶';
        btn.className = 'modal-btn';
        btn.onclick = nextLevel;

        document.getElementById('victory-modal').classList.remove('hidden');
    }

    function triggerTryAgain() {
        if (gameState === 'won' || gameState === 'lost') return;
        gameState = 'lost';

        document.getElementById('modal-title').innerText = 'Still Thirsty!';
        document.getElementById('modal-stars').innerText = '💧';
        document.getElementById('modal-desc').innerText = 'Not enough water reached the glass.';
        const btn = document.getElementById('modal-primary-btn');
        btn.innerText = 'TRY AGAIN 🔄';
        btn.className = 'modal-btn retry';
        btn.onclick = restartLevel;

        document.getElementById('victory-modal').classList.remove('hidden');
    }

    function nextLevel() {
        if (currentLevel < 50) startLevel(currentLevel + 1);
        else returnToLevels();
    }

    // ==========================================
    // 5. CONTINUOUS FLUID & 3D CRYSTAL GLASS
    // ==========================================
    function renderMetaballWaterStream() {
        fluidCtx.clearRect(0, 0, fluidCanvas.width, fluidCanvas.height);

        fluidCtx.lineCap = 'round';
        fluidCtx.lineJoin = 'round';

        // Outer continuous water ribbon
        for (let i = 0; i < particles.length - 1; i++) {
            const p1 = particles[i];
            const p2 = particles[i + 1];
            if (!p1.active || p1.collected || !p2.active || p2.collected) continue;
            const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
            if (dist < 36) {
                fluidCtx.strokeStyle = '#0284c7';
                fluidCtx.lineWidth = 14;
                fluidCtx.beginPath();
                fluidCtx.moveTo(p1.x, p1.y);
                fluidCtx.lineTo(p2.x, p2.y);
                fluidCtx.stroke();
            }
        }

        // Overlapping metaball nodes
        for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            if (!p.active || p.collected) continue;
            fluidCtx.fillStyle = '#0ea5e9';
            fluidCtx.beginPath();
            fluidCtx.arc(p.x, p.y, 7.2, 0, Math.PI * 2);
            fluidCtx.fill();
        }

        // Inner glossy cyan stream core + white highlight
        for (let i = 0; i < particles.length - 1; i++) {
            const p1 = particles[i];
            const p2 = particles[i + 1];
            if (!p1.active || p1.collected || !p2.active || p2.collected) continue;
            const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
            if (dist < 36) {
                fluidCtx.strokeStyle = '#38bdf8';
                fluidCtx.lineWidth = 8;
                fluidCtx.beginPath();
                fluidCtx.moveTo(p1.x, p1.y);
                fluidCtx.lineTo(p2.x, p2.y);
                fluidCtx.stroke();

                fluidCtx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
                fluidCtx.lineWidth = 2.2;
                fluidCtx.beginPath();
                fluidCtx.moveTo(p1.x - 1.8, p1.y - 1.8);
                fluidCtx.lineTo(p2.x - 1.8, p2.y - 1.8);
                fluidCtx.stroke();
            }
        }

        ctx.drawImage(fluidCanvas, 0, 0);
    }

    function draw3DGlass() {
        const gx = glass.x;
        const gy = glass.y;
        const gw = glass.w;
        const gh = glass.h;
        const taper = glass.taper;

        // Back elliptical rim
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.6)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(gx + gw / 2, gy, gw / 2, 5.5, 0, Math.PI, 0, false);
        ctx.stroke();

        // Pooled water inside the glass
        if (glass.filled > 0) {
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(gx + 3, gy + 2);
            ctx.lineTo(gx + taper + 3, gy + gh - 9);
            ctx.lineTo(gx + gw - taper - 3, gy + gh - 9);
            ctx.lineTo(gx + gw - 3, gy + 2);
            ctx.closePath();
            ctx.clip();

            const maxFillHeight = gh - 25;
            const currentFillH = maxFillHeight * (glass.filled / 100);
            const surfaceY = gy + gh - 9 - currentFillH;

            const liqGrad = ctx.createLinearGradient(gx, surfaceY, gx, gy + gh);
            liqGrad.addColorStop(0, '#38bdf8');
            liqGrad.addColorStop(0.45, '#0ea5e9');
            liqGrad.addColorStop(1, '#0284c7');
            ctx.fillStyle = liqGrad;

            ctx.beginPath();
            ctx.moveTo(gx, gy + gh);
            for (let x = gx; x <= gx + gw; x += 3) {
                const wave = Math.sin(x * 0.09 + waveTime) * (glass.filled < 100 ? 2.4 : 1.0);
                ctx.lineTo(x, surfaceY + wave);
            }
            ctx.lineTo(gx + gw, gy + gh);
            ctx.closePath();
            ctx.fill();

            // Meniscus surface highlight
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.88)';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            for (let x = gx; x <= gx + gw; x += 3) {
                const wave = Math.sin(x * 0.09 + waveTime) * (glass.filled < 100 ? 2.4 : 1.0);
                if (x === gx) ctx.moveTo(x, surfaceY + wave);
                else ctx.lineTo(x, surfaceY + wave);
            }
            ctx.stroke();

            // Splash droplets inside glass
            ctx.fillStyle = '#38bdf8';
            for (let s of splashes) {
                ctx.beginPath();
                ctx.arc(s.x, s.y, 2.8, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }

        // 3D Crystal Glass Body Gradient
        const bodyGrad = ctx.createLinearGradient(gx, gy, gx + gw, gy);
        bodyGrad.addColorStop(0, 'rgba(203, 213, 225, 0.65)');
        bodyGrad.addColorStop(0.2, 'rgba(255, 255, 255, 0.38)');
        bodyGrad.addColorStop(0.5, 'rgba(241, 245, 249, 0.12)');
        bodyGrad.addColorStop(0.8, 'rgba(226, 232, 240, 0.32)');
        bodyGrad.addColorStop(1, 'rgba(148, 163, 184, 0.68)');

        ctx.fillStyle = bodyGrad;
        ctx.beginPath();
        ctx.moveTo(gx, gy);
        ctx.lineTo(gx + taper, gy + gh);
        ctx.lineTo(gx + gw - taper, gy + gh);
        ctx.lineTo(gx + gw, gy);
        ctx.closePath();
        ctx.fill();

        // Heavy Crystal Base Cushion
        const baseGrad = ctx.createLinearGradient(gx + taper, gy + gh - 10, gx + gw - taper, gy + gh);
        baseGrad.addColorStop(0, 'rgba(148, 163, 184, 0.85)');
        baseGrad.addColorStop(0.5, 'rgba(248, 250, 252, 0.95)');
        baseGrad.addColorStop(1, 'rgba(148, 163, 184, 0.85)');
        ctx.fillStyle = baseGrad;
        ctx.beginPath();
        ctx.moveTo(gx + taper - 1, gy + gh - 9);
        ctx.lineTo(gx + gw - taper + 1, gy + gh - 9);
        ctx.lineTo(gx + gw - taper, gy + gh);
        ctx.lineTo(gx + taper, gy + gh);
        ctx.closePath();
        ctx.fill();

        // Dashed Target Fill Line
        const fillLineY = gy + 18;
        ctx.save();
        ctx.setLineDash([5, 4]);
        ctx.strokeStyle = 'rgba(71, 85, 105, 0.6)';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.moveTo(gx + 4, fillLineY);
        ctx.lineTo(gx + gw - 4, fillLineY);
        ctx.stroke();
        ctx.restore();

        // Vertical 3D Specular Glass Reflections
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.92)';
        ctx.lineWidth = 3.5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(gx + 7, gy + 10);
        ctx.lineTo(gx + taper + 5, gy + gh - 15);
        ctx.stroke();

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.55)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(gx + gw - 7, gy + 12);
        ctx.lineTo(gx + gw - taper - 5, gy + gh - 16);
        ctx.stroke();

        // Crisp Outer Glass Contour
        ctx.strokeStyle = '#64748b';
        ctx.lineWidth = 3.5;
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(gx, gy);
        ctx.lineTo(gx + taper, gy + gh);
        ctx.lineTo(gx + gw - taper, gy + gh);
        ctx.lineTo(gx + gw, gy);
        ctx.stroke();

        // Front Rim Highlight
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.ellipse(gx + gw / 2, gy, gw / 2, 5.5, 0, 0, Math.PI, false);
        ctx.stroke();

        // Cute Expressive Face
        const fx = gx + gw / 2;
        const fy = gy + gh / 2 + 5;

        // Rosy Cheeks
        ctx.fillStyle = 'rgba(244, 114, 182, 0.45)';
        ctx.beginPath();
        ctx.ellipse(fx - 15, fy + 2, 4.2, 2.6, 0, 0, Math.PI * 2);
        ctx.ellipse(fx + 15, fy + 2, 4.2, 2.6, 0, 0, Math.PI * 2);
        ctx.fill();

        // Eyes
        ctx.fillStyle = '#1e293b';
        ctx.beginPath();
        ctx.arc(fx - 10, fy - 4, 3.6, 0, Math.PI * 2);
        ctx.arc(fx + 10, fy - 4, 3.6, 0, Math.PI * 2);
        ctx.fill();

        // Eye Sparkles
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(fx - 11.2, fy - 5.2, 1.3, 0, Math.PI * 2);
        ctx.arc(fx + 8.8, fy - 5.2, 1.3, 0, Math.PI * 2);
        ctx.fill();

        // Mouth Expression
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 2.2;
        ctx.lineCap = 'round';
        ctx.beginPath();
        if (glass.filled >= 95) {
            ctx.fillStyle = '#ef4444';
            ctx.arc(fx, fy + 2, 6.5, 0, Math.PI, false);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        } else if (glass.filled > 10) {
            ctx.arc(fx, fy + 1, 5.5, 0.15 * Math.PI, 0.85 * Math.PI, false);
            ctx.stroke();
        } else {
            ctx.arc(fx, fy + 8, 5, 1.15 * Math.PI, 1.85 * Math.PI, false);
            ctx.stroke();
        }
    }

    function drawScene() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Optional Hint Guide Curve
        if (showHint && gameState === 'drawing') {
            ctx.save();
            ctx.setLineDash([6, 6]);
            ctx.strokeStyle = 'rgba(14, 165, 233, 0.55)';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(pipe.x + pipe.w / 2 - 10, pipe.y + pipe.h + 15);
            ctx.quadraticCurveTo(
                (pipe.x + glass.x) / 2,
                glass.y - 20,
                glass.x + glass.w / 2,
                glass.y - 5
            );
            ctx.stroke();
            ctx.restore();
        }

        // 1. Render Continuous Liquid Stream
        renderMetaballWaterStream();

        // 2. Draw 3D Pipe Spout
        const pGrad = ctx.createLinearGradient(pipe.x, pipe.y, pipe.x + pipe.w, pipe.y);
        pGrad.addColorStop(0, '#64748b');
        pGrad.addColorStop(0.4, '#cbd5e1');
        pGrad.addColorStop(1, '#475569');
        ctx.fillStyle = pGrad;
        ctx.fillRect(pipe.x, pipe.y, pipe.w, pipe.h);

        // Pipe Flange Nozzle (Universal drawRoundedBox instead of roundRect)
        ctx.fillStyle = '#334155';
        drawRoundedBox(ctx, pipe.x - 4, pipe.y + pipe.h - 8, pipe.w + 8, 8, 3);
        ctx.fill();

        // 3. Draw Obstacles & Glass Stand
        obstacles.forEach(obs => {
            const oGrad = ctx.createLinearGradient(obs.x, obs.y, obs.x, obs.y + obs.h);
            if (obs.isStand) {
                oGrad.addColorStop(0, '#0ea5e9');
                oGrad.addColorStop(1, '#0369a1');
            } else {
                oGrad.addColorStop(0, '#475569');
                oGrad.addColorStop(1, '#1e293b');
            }
            ctx.fillStyle = oGrad;
            drawRoundedBox(ctx, obs.x, obs.y, obs.w, obs.h, 4);
            ctx.fill();
        });

        // 4. Draw 3D Crystal Glass
        draw3DGlass();

        // 5. Draw User Pencil Lines
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 6.5;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        lines.forEach(line => {
            if (line.length < 2) return;
            ctx.beginPath();
            ctx.moveTo(line[0].x, line[0].y);
            for (let i = 1; i < line.length; i++) {
                ctx.lineTo(line[i].x, line[i].y);
            }
            ctx.stroke();
        });

        if (currentLine && currentLine.length > 1) {
            ctx.beginPath();
            ctx.moveTo(currentLine[0].x, currentLine[0].y);
            for (let i = 1; i < currentLine.length; i++) {
                ctx.lineTo(currentLine[i].x, currentLine[i].y);
            }
            ctx.stroke();
        }
    }

    function loop() {
        updateFluidPhysics();
        drawScene();
        requestAnimationFrame(loop);
    }

    // Initialize Level 1 IMMEDIATELY before starting the loop so the screen is never blank!
    startLevel(1);
    loop();
</script>
