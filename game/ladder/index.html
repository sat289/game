<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ST Games - Snake and Ladder</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div id="app">
        <!-- Auth / Welcome Screen -->
        <div id="auth-screen" class="screen active">
            <div class="card">
                <div class="logo-container">
                    <img src="3438.jpg" alt="ST Games Logo" class="brand-logo[span_2](start_span)"[span_2](end_span)>
                </div>
                <h1>ST GAMES</h1>
                <p>Roll a 1 to start your climb!</p>
                
                <div id="login-status-banner" class="status-banner hidden">
                    <span>✅ User Login Success!</span>
                </div>

                <div class="input-group">
                    <label for="player-name">Your Nickname:</label>
                    <input type="text" id="player-name" placeholder="Enter your name..." maxlength="15">
                </div>

                <div class="btn-container">
                    <button id="btn-continue" class="btn primary">Continue to Game</button>
                    <button id="btn-google-login" class="btn google">Sign in with Google</button>
                </div>
            </div>
        </div>

        <!-- Animated Login Popup -->
        <div id="login-popup" class="popup-overlay hidden">
            <div class="popup-card">
                <h3>✨ Unlock More Features!</h3>
                <p>Login to save your scores, sync progress, and access exclusive online multiplayer features.</p>
                <div class="popup-btn-group">
                    <button id="btn-goto-login-page" class="btn primary">Login Now</button>
                    <button id="btn-dismiss-popup" class="btn secondary">Continue with Username</button>
                </div>
            </div>
        </div>

        <!-- Menu Screen -->
        <div id="menu-screen" class="screen">
            <div class="card">
                <div class="logo-container">
                    <img src="3438.jpg" alt="ST Games Logo" class="brand-logo small-logo[span_3](start_span)"[span_3](end_span)>
                </div>
                <h2>Welcome, <span id="user-display-name">Player</span>!</h2>
                
                <div class="input-group">
                    <label for="theme-select">🎨 Choose Game Board:</label>
                    <select id="theme-select" class="theme-dropdown">
                        <option value="board1">Board 1 (Classic White)</option>
                        <option value="board2">Board 2 (Pastel Trophy)</option>
                        <option value="board3">Board 3 (Rainbow Star)</option>
                        <option value="board4">Board 4 (Emoji Party)</option>
                        <option value="board5" selected>Board 5 (Yellow Checkered)</option>
                        <option value="board6">Board 6 (Forest Jungle)</option>
                    </select>
                </div>

                <div class="board-preview-wrap">
                    <img id="board-preview-img" src="board5.jpg" alt="Board Preview[span_4](start_span)"[span_4](end_span)>
                </div>

                <div class="menu-options">
                    <button id="btn-mode-bot" class="btn secondary">Play vs Bot</button>
                    <button id="btn-mode-pass" class="btn secondary">Pass & Play (Local Multiplayer)</button>
                    <button id="btn-mode-online" class="btn secondary">Play Online with Friends</button>
                    <button id="btn-show-leaderboard" class="btn accent">Top 10 Leaderboard</button>
                </div>
                <button id="btn-logout" class="btn danger small">Switch User / Logout</button>
            </div>
        </div>

        <!-- Online Lobby Screen -->
        <div id="lobby-screen" class="screen">
            <div class="card">
                <h2>Multiplayer Room</h2>
                <div class="room-actions">
                    <button id="btn-create-room" class="btn primary">Create Room (Generate Code)</button>
                    <div class="join-section">
                        <input type="text" id="room-code-input" placeholder="Enter 6-digit Code" maxlength="6">
                        <button id="btn-join-room" class="btn secondary">Join Room</button>
                    </div>
                </div>
                <button id="btn-back-menu" class="btn small">Back to Menu</button>
            </div>
        </div>

        <!-- Leaderboard Screen -->
        <div id="leaderboard-screen" class="screen">
            <div class="card">
                <h2>🏆 Top 10 Leaderboard</h2>
                <ul id="leaderboard-list">
                    <li>Loading scores...</li>
                </ul>
                <button id="btn-close-leaderboard" class="btn primary">Back</button>
            </div>
        </div>

        <!-- Game Board Screen -->
        <div id="game-screen" class="screen">
            <div class="game-header">
                <div class="header-brand">
                    <img src="3438.jpg" alt="Logo" class="header-logo[span_5](start_span)"[span_5](end_span)>
                    <span id="turn-indicator">Turn: Player 1</span>
                </div>
                <button id="btn-quit-game" class="btn danger small">Quit</button>
            </div>
            
            <div class="game-container">
                <div id="board" class="board-board5"></div>
                
                <div class="sidebar">
                    <div class="dice-section">
                        <div id="dice" class="dice">🎲</div>
                        <div id="dice-status" style="font-size: 0.85rem; color: var(--accent);">Roll a 1 to start!</div>
                        <button id="btn-roll" class="btn primary">Roll Dice</button>
                    </div>
                    <div class="scoreboard" id="scoreboard"></div>
                </div>
            </div>
        </div>
    </div>

    <audio id="bgm" src="https://actions.google.com/sounds/v1/ambiences/forest_birds.ogg" loop></audio>
    <audio id="sfx-tap" src="https://actions.google.com/sounds/v1/ui/button_click.ogg"></audio>
    <audio id="sfx-dice" src="https://actions.google.com/sounds/v1/toys/dice_roll.ogg"></audio>
    <audio id="sfx-ladder" src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg"></audio>
    <audio id="sfx-snake" src="https://actions.google.com/sounds/v1/creatures/snake_hiss.ogg"></audio>

    <script src="firebase.js"></script>
    <script src="game.js"></script>
</body>
</html>
