<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Lamborghini Racing - 50 Levels</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #0b0b0b;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        #hud {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #00ffcc;
            font-size: 22px;
            font-weight: bold;
            text-align: right;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        #menu, #gameover, #winscr {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 10;
        }
        h1 {
            color: #ffcc00;
            font-size: 48px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(255, 204, 0, 0.6);
        }
        p {
            font-size: 18px;
            color: #ccc;
            margin-bottom: 30px;
        }
        .btn {
            background: linear-gradient(45deg, #ff0055, #ffcc00);
            border: none;
            color: white;
            padding: 15px 40px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 30px;
            box-shadow: 0 5px 15px rgba(255, 0, 85, 0.4);
            transition: 0.2s;
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(255, 204, 0, 0.6);
        }
    </style>
    <!-- Three.js Library for 3D Graphics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-container">
        <div id="levelDisplay">LEVEL: 1 / 50</div>
        <div id="scoreDisplay">SCORE: 0</div>
    </div>
    <div id="hud">
        <div id="speedDisplay">SPEED: 280 KM/H</div>
        <div id="targetDisplay">TARGET: 1000m</div>
    </div>

    <!-- Main Menu -->
    <div id="menu">
        <h1>Lamborghini 3D Track</h1>
        <p>50 Hardcore Levels | Real 3D Physics & Traffic Racing</p>
        <button class="btn" onclick="startGame()">START ENGINE</button>
    </div>

    <!-- Game Over Screen -->
    <div id="gameover" style="display: none;">
        <h1>Crashed!</h1>
        <p id="failReason">You hit an obstacle!</p>
        <button class="btn" onclick="restartGame()">TRY AGAIN</button>
    </div>

    <!-- Game Win / Next Level Screen -->
    <div id="winscr" style="display: none;">
        <h1>Level Cleared!</h1>
        <p id="winText">Get ready for higher difficulty.</p>
        <button class="btn" onclick="nextLevel()">NEXT LEVEL</button>
    </div>

    <script>
        let scene, camera, renderer;
        let car, road, obstacles = [];
        let gameActive = false;
        
        let currentLevel = 1;
        let score = 0;
        let distanceCovered = 0;
        let targetDistance = 2000; // Level length increases
        let gameSpeed = 0.8;
        let spawnTimer = 0;

        let moveLeft = false;
        let moveRight = false;

        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050510);
            scene.fog = new THREE.FogExp2(0x050510, 0.015);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 4, -7);
            camera.lookAt(0, 1, 3);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);

            // Create Road
            const roadGeo = new THREE.PlaneGeometry(16, 2000);
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x111115, roughness: 0.4 });
            road = new THREE.Mesh(roadGeo, roadMat);
            road.rotation.x = -Math.PI / 2;
            scene.add(road);

            // Road Markings (Stripes)
            for(let i = -1000; i < 1000; i += 10) {
                const stripeGeo = new THREE.PlaneGeometry(0.3, 4);
                const stripeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
                const stripe = new THREE.Mesh(stripeGeo, stripeMat);
                stripe.rotation.x = -Math.PI / 2;
                stripe.position.set(0, 0.01, i);
                scene.add(stripe);
            }

            createLamborghini();

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('keydown', handleKeyDown);
            window.addEventListener('keyup', handleKeyUp);
        }

        // Build a sleek Lamborghini-style 3D Car using geometry components
        function createLamborghini() {
            car = new THREE.Group();

            // Body Main (Orange/Yellow signature Lambo color)
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff4500, metalness: 0.9, roughness: 0.1 });
            
            const bottomGeo = new THREE.BoxGeometry(2, 0.5, 4.2);
            const bottom = new THREE.Mesh(bottomGeo, bodyMat);
            bottom.position.y = 0.4;
            car.add(bottom);

            const topGeo = new THREE.BoxGeometry(1.4, 0.6, 2);
            const top = new THREE.Mesh(topGeo, bodyMat);
            top.position.set(0, 0.9, -0.2);
            car.add(top);

            // Windshield
            const glassMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.0, transparent: true, opacity: 0.7 });
            const glassGeo = new THREE.BoxGeometry(1.3, 0.5, 1.2);
            const glass = new THREE.Mesh(glassGeo, glassMat);
            glass.position.set(0, 0.95, 0.3);
            glass.rotation.x = 0.4;
            car.add(glass);

            // Wheels
            const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.4, 16);
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });

            const positions = [
                [-1.1, 0.4, 1.4], [1.1, 0.4, 1.4],
                [-1.1, 0.4, -1.4], [1.1, 0.4, -1.4]
            ];

            positions.forEach(pos => {
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.rotation.z = Math.PI / 2;
                wheel.position.set(...pos);
                car.add(wheel);
            });

            car.position.set(0, 0, 0);
            scene.add(car);
        }

        // Spawn Traffic Obstacles (Harder cars as levels increase)
        function spawnObstacle() {
            const obsTypes = [0x0066ff, 0x00ff00, 0xffff00, 0xff0000];
            const color = obsTypes[Math.floor(Math.random() * obsTypes.length)];
            
            const obsMat = new THREE.MeshStandardMaterial({ color: color, metalness: 0.5, roughness: 0.3 });
            const obsGeo = new THREE.BoxGeometry(2, 0.9, 4);
            const obstacle = new THREE.Mesh(obsGeo, obsMat);

            // Random lanes (-5, -2.5, 0, 2.5, 5)
            const lanes = [-5, -2.5, 0, 2.5, 5];
            const laneX = lanes[Math.floor(Math.random() * lanes.length)];

            obstacle.position.set(laneX, 0.45, car.position.z + 120);
            scene.add(obstacle);
            obstacles.push(obstacle);
        }

        function startGame() {
            document.getElementById('menu').style.display = 'none';
            currentLevel = 1;
            score = 0;
            loadLevelSettings();
            gameActive = true;
        }

        function loadLevelSettings() {
            distanceCovered = 0;
            targetDistance = 1500 + (currentLevel * 500); // Level perti daniki distance perugutundi
            gameSpeed = 0.7 + (currentLevel * 0.08); // Speed perthundi (Hard vuntundi)
            document.getElementById('levelDisplay').innerText = `LEVEL: ${currentLevel} / 50`;
        }

        function nextLevel() {
            document.getElementById('winscr').style.display = 'none';
            currentLevel++;
            if(currentLevel > 50) {
                alert("CONGRATULATIONS! You completed all 50 Levels like a Pro Driver!");
                currentLevel = 1;
            }
            loadLevelSettings();
            gameActive = true;
        }

        function restartGame() {
            document.getElementById('gameover').style.display = 'none';
            // Clear old obstacles
            obstacles.forEach(obs => scene.remove(obs));
            obstacles = [];
            car.position.x = 0;
            loadLevelSettings();
            gameActive = true;
        }

        function handleKeyDown(e) {
            if(e.key === 'ArrowLeft' || e.key === 'a') moveLeft = true;
            if(e.key === 'ArrowRight' || e.key === 'd') moveRight = true;
        }

        function handleKeyUp(e) {
            if(e.key === 'ArrowLeft' || e.key === 'a') moveLeft = false;
            if(e.key === 'ArrowRight' || e.key === 'd') moveRight = false;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Main Game Loop
        function animate() {
            requestAnimationFrame(animate);

            if (gameActive) {
                // Car Steering logic
                if (moveLeft && car.position.x > -6) car.position.x -= 0.15;
                if (moveRight && car.position.x < 6) car.position.x += 0.15;

                // Forward Movement simulation
                distanceCovered += gameSpeed;
                score += Math.floor(gameSpeed);

                document.getElementById('scoreDisplay').innerText = `SCORE: ${score}`;
                document.getElementById('speedDisplay').innerText = `SPEED: ${Math.floor(gameSpeed * 250)} KM/H`;
                document.getElementById('targetDisplay').innerText = `GOAL: ${Math.max(0, Math.floor(targetDistance - distanceCovered))}m`;

                // Level Win Check
                if (distanceCovered >= targetDistance) {
                    gameActive = false;
                    if(currentLevel >= 50) {
                        document.getElementById('winText').innerText = "Ultimate Champion! You finished all 50 levels!";
                    } else {
                        document.getElementById('winText').innerText = `Level ${currentLevel} completed! Ready for Level ${currentLevel + 1}?`;
                    }
                    document.getElementById('winscr').style.display = 'flex';
                }

                // Obstacle Spawning control based on level difficulty
                spawnTimer++;
                let spawnInterval = Math.max(20, 70 - (currentLevel * 1)); // High levels = heavy traffic
                if (spawnTimer > spawnInterval) {
                    spawnObstacle();
                    spawnTimer = 0;
                }

                // Move obstacles and check collisions
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    let obs = obstacles[i];
                    obs.position.z -= gameSpeed;

                    // Collision Detection (Bounding Box check)
                    let dx = Math.abs(car.position.x - obs.position.x);
                    let dz = Math.abs(car.position.z - obs.position.z);

                    if (dx < 1.8 && dz < 3.0) {
                        gameActive = false;
                        document.getElementById('failReason').innerText = `Crashed in Level ${currentLevel}! Watch out for traffic.`;
                        document.getElementById('gameover').style.display = 'flex';
                    }

                    // Remove passed obstacles
                    if (obs.position.z < car.position.z - 10) {
                        scene.remove(obs);
                        obstacles.splice(i, 1);
                    }
                }

                // Smooth Camera Follow
                camera.position.x = car.position.x * 0.4;
            }

            renderer.render(scene, camera);
        }

        init3D();
        animate();
    </script>
</body>
</html>
