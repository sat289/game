<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rampage Racer - Gaming Hub</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #070a13;
      font-family: 'Inter', sans-serif;
    }
    
    /* Game iframe fills the entire screen */
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 10;
    }
    
    /* Top scrolling notice bar with higher z-index so clicks register properly */
    .top-notice-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 40px;
      z-index: 40;
      background: rgba(7, 10, 19, 0.98);
      border-bottom: 1px solid rgba(56, 189, 248, 0.4);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      backdrop-filter: blur(8px);
      transition: transform 0.3s ease;
      pointer-events: auto;
    }
    
    /* Class to hide the notice when clicked */
    .top-notice-bar.hidden-notice {
      transform: translateY(-100%);
    }

    /* Hide button hanging below the bar */
    .hide-notice-btn {
      position: absolute;
      bottom: -22px;
      right: 12px;
      background: rgba(7, 10, 19, 0.95);
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-top: none;
      color: #38bdf8;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 0 0 6px 6px;
      cursor: pointer;
      z-index: 41;
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      gap: 4px;
      pointer-events: auto;
    }

    /* Scrolling ticker text container */
    .ticker-container {
      overflow: hidden;
      white-space: nowrap;
      width: 68%;
    }

    .ticker-text {
      display: inline-block;
      animation: marquee 16s linear infinite;
      font-size: 11px;
      font-weight: 700;
      color: #38bdf8;
    }

    @keyframes marquee {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }
  </style>
</head>
<body class="relative">

  <!-- Top Scrolling Notice Bar -->
  <div id="topNoticeBar" class="top-notice-bar">
    <!-- Hub Back Button -->
    <a href="../index.html" class="bg-[#002b5b] hover:bg-[#002b5b]/80 text-white border border-cyan-400/40 px-2 py-0.5 rounded-md text-[10px] font-extrabold flex items-center gap-1 shadow-md transition shrink-0">
      <i class="fa-solid fa-arrow-left text-cyan-300"></i><span>Hub</span>
    </a>

    <!-- Scrolling Marquee Notice -->
    <div class="ticker-container">
      <div class="ticker-text">
        🎮 Enjoy the game! &nbsp;•&nbsp; Follow on Instagram: <span class="text-pink-400">@_satish_official_16</span> &nbsp;•&nbsp; YouTube: <span class="text-red-400">@nanu16-h3g</span> &nbsp;•&nbsp; Have fun playing! 🚀
      </div>
    </div>

    <!-- Hide Button with Name and Symbol -->
    <button onclick="hideAndRestoreNotice()" class="hide-notice-btn">
      <i class="fa-solid fa-eye-slash" id="hideIcon"></i> <span id="hideText">Hide 🫥</span>
    </button>
  </div>

  <!-- Gamezop Game Embed Iframe -->
  <iframe seamless="seamless" allowtransparency="true" allowfullscreen="true" src="https://zv1y2i8p.play.gamezop.com/g/p7HOjYF4O"></iframe>

  <script>
    let noticeTimer = null;

    function hideAndRestoreNotice() {
      const bar = document.getElementById('topNoticeBar');
      
      // Slide up and hide the notice bar immediately
      bar.classList.add('hidden-notice');

      // Clear any existing timeout to prevent overlaps
      if (noticeTimer) clearTimeout(noticeTimer);

      // Automatically bring the notice bar back down after 5 seconds
      noticeTimer = setTimeout(() => {
        bar.classList.remove('hidden-notice');
      }, 5000);
    }
  </script>

</body>
</html>
