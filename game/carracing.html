<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Battle Royale - Fire Arena</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101820;color:white;font-family:Arial;text-align:center;overflow:hidden}
header{padding:10px;background:#202c38;font-size:20px;font-weight:bold;color:#ffb000}
#hud{display:flex;justify-content:space-around;padding:10px;background:#18232d}
canvas{display:block;width:100%;max-height:65vh;background:#385c38;touch-action:none}
.controls{display:flex;justify-content:center;gap:12px;padding:12px}
button{background:#ff8c00;color:#111;border:0;border-radius:12px;padding:15px;font-weight:bold;font-size:16px}
#msg{padding:5px;color:#ffcc55}
</style>
</head>
<body>
<header>🔥 FIRE ARENA: BATTLE ROYALE</header>
<div id="hud">
<span id="hp">❤️ 100</span>
<span id="kills">☠️ 0</span>
<span id="ammo">🔫 READY</span>
</div>
<canvas id="game" width="800" height="520"></canvas>
<div class="controls">
<button id="left">⬅️</button>
<button id="up">⬆️</button>
<button id="down">⬇️</button>
<button id="right">➡️</button>
<button id="shoot">🔥 FIRE</button>
</div>
<div id="msg">Move, aim automatically, and survive!</div>
<button onclick="restart()">RESTART</button>

<script>
const c=document.getElementById('game');
const ctx=c.getContext('2d');
let player,enemies,bullets,kills,gameOver,keys,lastShot;

function restart(){
 player={x:400,y:260,hp:100};
 enemies=[];bullets=[];kills=0;gameOver=false;
 lastShot=0;
 for(let i=0;i<7;i++) spawnEnemy();
 updateHUD();
}
function spawnEnemy(){
 let x=Math.random()*760+20,y=Math.random()*480+20;
 if(Math.hypot(x-player.x,y-player.y)<140){x=30;y=30}
 enemies.push({x,y,hp:2,speed:0.55+Math.random()*0.5});
}
keys={};
['left','right','up','down'].forEach(id=>{
 const b=document.getElementById(id);
 const k=id;
 b.onpointerdown=e=>{e.preventDefault();keys[k]=true};
 b.onpointerup=b.onpointerleave=b.onpointercancel=()=>keys[k]=false;
});
document.getElementById('shoot').onpointerdown=()=>shoot();
window.addEventListener('keydown',e=>{
 keys[{ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',
 ArrowUp:'up',w:'up',ArrowDown:'down',s:'down'}[e.key]||e.key]=true;
 if(e.code==='Space')shoot();
});
window.addEventListener('keyup',e=>{
 keys[{ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',
 ArrowUp:'up',w:'up',ArrowDown:'down',s:'down'}[e.key]||e.key]=false;
});
function shoot(){
 if(gameOver||!enemies.length)return;
 let target=enemies.reduce((a,b)=>
 Math.hypot(a.x-player.x,a.y-player.y)<
 Math.hypot(b.x-player.x,b.y-player.y)?a:b);
 let dx=target.x-player.x,dy=target.y-player.y;
 let d=Math.hypot(dx,dy)||1;
 bullets.push({x:player.x,y:player.y,vx:dx/d*7,vy:dy/d*7});
}
function updateHUD(){
 document.getElementById('hp').textContent='❤️ '+Math.max(0,player.hp);
 document.getElementById('kills').textContent='☠️ '+kills;
 document.getElementById('ammo').textContent='🔫 AUTO AIM';
}
function draw(){
 ctx.clearRect(0,0,800,520);
 ctx.fillStyle='#456b3e';ctx.fillRect(0,0,800,520);
 ctx.strokeStyle='#507747';ctx.lineWidth=1;
 for(let x=0;x<800;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,520);ctx.stroke()}
 for(let y=0;y<520;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(800,y);ctx.stroke()}
 // Obstacles
 ctx.fillStyle='#72543b';
 [[130,100,90,45],[550,120,110,55],[270,370,100,60],
 [620,360,70,90]].forEach(r=>ctx.fillRect(...r));
 // Player
 ctx.fillStyle='#24c7e8';ctx.beginPath();
 ctx.arc(player.x,player.y,15,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='white';ctx.fillRect(player.x-5,player.y-5,10,10);
 // Enemies
 enemies.forEach(e=>{
 ctx.fillStyle='#f04444';ctx.beginPath();
 ctx.arc(e.x,e.y,14,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='white';ctx.fillRect(e.x-12,e.y-23,24,4);
 ctx.fillStyle='#42e66a';ctx.fillRect(e.x-12,e.y-23,24*e.hp/2,4);
 });
 // Bullets
 ctx.fillStyle='#ffe34d';
 bullets.forEach(b=>{ctx.beginPath();ctx.arc(b.x,b.y,5,0,Math.PI*2);ctx.fill()});
 if(gameOver||enemies.length===0){
 ctx.fillStyle='rgba(0,0,0,.72)';ctx.fillRect(0,0,800,520);
 ctx.fillStyle='#ffca45';ctx.font='bold 42px Arial';
 ctx.textAlign='center';
 ctx.fillText(gameOver?'GAME OVER':'BOOYAH!',400,245);
 ctx.font='22px Arial';
 ctx.fillText('Kills: '+kills+' — Press RESTART',400,290);
 }
}
function loop(){
 if(!gameOver&&enemies.length){
 let speed=3;
 if(keys.left)player.x-=speed;
 if(keys.right)player.x+=speed;
 if(keys.up)player.y-=speed;
 if(keys.down)player.y+=speed;
 player.x=Math.max(16,Math.min(784,player.x));
 player.y=Math.max(16,Math.min(504,player.y));
 enemies.forEach(e=>{
 let dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;
 e.x+=dx/d*e.speed;e.y+=dy/d*e.speed;
 if(d<27){
 player.hp-=0.12;
 }
 });
 bullets.forEach(b=>{b.x+=b.vx;b.y+=b.vy});
 bullets=bullets.filter(b=>b.x>0&&b.x<800&&b.y>0&&b.y<520);
 for(let i=bullets.length-1;i>=0;i--){
 let b=bullets[i],hit=enemies.findIndex(e=>Math.hypot(e.x-b.x,e.y-b.y)<18);
 if(hit>=0){
 enemies[hit].hp--;
 bullets.splice(i,1);
 if(enemies[hit].hp<=0){
 enemies.splice(hit,1);kills++;
 if(enemies.length===0)break;
 }
 }
 }
 if(player.hp<=0)gameOver=true;
 updateHUD();
 }
 draw();
 requestAnimationFrame(loop);
}
restart();loop();
</script>
</body>
</html>
