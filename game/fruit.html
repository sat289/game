<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#ffd9a0">
<title>Fruit Merge Reloaded</title>

<style>
*{
 box-sizing:border-box;
 margin:0;
 padding:0;
}
html,body{
 width:100%;
 height:100%;
 overflow:hidden;
 touch-action:none;
 font-family:Arial,sans-serif;
 background:#ffc4b9;
}
#gameShell{
 position:relative;
 width:100%;
 max-width:520px;
 height:100dvh;
 margin:auto;
 overflow:hidden;
 background:#ffd3c9;
}
.pattern{
 position:absolute;
 left:0;
 width:100%;
 height:8%;
 background-color:#ffc3b9;
 background-image:
 radial-gradient(ellipse at 30% 40%,transparent 0 15px,#f59e91 16px 18px,transparent 19px),
 radial-gradient(ellipse at 70% 70%,transparent 0 15px,#f59e91 16px 18px,transparent 19px);
 background-size:130px 80px;
}
#topPattern{top:0}
#bottomPattern{bottom:0}

#gamePanel{
 position:absolute;
 top:8%;
 bottom:8%;
 left:0;
 right:0;
 overflow:hidden;
 border-top:5px solid #dfa34e;
 border-bottom:5px solid #dfa34e;
 background:repeating-linear-gradient(
  90deg,
  #ffe6a4 0%,
  #ffe6a4 25%,
  #ffedb9 25%,
  #ffedb9 50%
 );
}
#gamePanel:before{
 content:"";
 position:absolute;
 inset:0;
 pointer-events:none;
 opacity:.18;
 background-image:
 radial-gradient(circle,transparent 0 23px,#ffffff 24px 27px,transparent 28px);
 background-size:145px 170px;
}

/* LOADING */
#loadingScreen{
 position:absolute;
 inset:0;
 z-index:30;
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
 gap:28px;
 background:linear-gradient(140deg,#ffe7a8,#ffd58b);
 transition:opacity .5s;
}
#loadingScreen:before{
 content:"🍎 🍓 🍇 🍊 🍉 🍏";
 position:absolute;
 inset:-20px;
 display:flex;
 justify-content:center;
 align-items:center;
 text-align:center;
 font-size:100px;
 line-height:2;
 word-break:break-all;
 filter:blur(15px);
 opacity:.5;
 transform:scale(1.3);
}
#loadingArt{
 z-index:1;
 width:66%;
 aspect-ratio:2.05;
 border-radius:14px;
 background:linear-gradient(#fff2c6,#ffdb91);
 box-shadow:0 8px 20px #67371955;
 display:flex;
 justify-content:center;
 align-items:center;
 gap:4px;
 overflow:hidden;
}
.loadFruit{
 font-size:clamp(35px,10vw,65px);
 filter:drop-shadow(0 5px 3px #6333);
 animation:bounce 1s infinite alternate;
}
.loadFruit:nth-child(even){
 animation-delay:.3s;
}
@keyframes bounce{
 to{transform:translateY(-12px) rotate(8deg)}
}
#loadingTrack{
 z-index:1;
 width:66%;
 height:17px;
 background:#171717;
 border-radius:30px;
 overflow:hidden;
}
#loadingProgress{
 height:100%;
 width:0;
 border-radius:30px;
 background:linear-gradient(90deg,#284bff,#6685ff);
 animation:progress 2.5s ease forwards;
}
@keyframes progress{
 to{width:100%}
}
#loadingText{
 z-index:1;
 color:white;
 font-size:12px;
 font-weight:bold;
 letter-spacing:2px;
 text-shadow:0 2px 4px #444;
}
#loadingScreen.hide{
 opacity:0;
 pointer-events:none;
}

/* HEADER */
#hud{
 position:absolute;
 z-index:5;
 top:12px;
 left:12px;
 right:12px;
 height:85px;
 display:flex;
 align-items:flex-start;
 gap:8px;
}
#basket{
 width:76px;
 height:76px;
 flex-shrink:0;
 border-radius:50%;
 border:7px solid #a5682d;
 background:radial-gradient(circle,#f5d17e 45%,#c17a36 47%,#efbd68 70%);
 box-shadow:0 4px 8px #72401d55;
 display:grid;
 place-items:center;
 font-size:35px;
}
#stats{
 flex:1;
 display:grid;
 gap:8px;
 padding-top:2px;
 max-width:160px;
}
.stat{
 padding:10px;
 border-radius:12px;
 background:#613017;
 color:#fff1c8;
 font-weight:900;
 font-size:15px;
 box-shadow:0 2px 3px #63351b44;
}
.stat b{
 float:right;
 color:white;
 font-size:17px;
}
#nextBox{
 text-align:center;
 font-size:11px;
 font-weight:1000;
 letter-spacing:1px;
 color:#60321b;
}
#nextFruit{
 margin:4px auto;
 width:65px;
 height:65px;
 border-radius:50%;
 border:5px solid #61318b;
 background:radial-gradient(circle at 30% 25%,#e5aaff,#8d27c9 70%,#511276);
 box-shadow:0 4px 0 #4b2616;
 display:grid;
 place-items:center;
 font-size:36px;
}
#controls{
 position:absolute;
 z-index:8;
 right:8px;
 top:18px;
 display:flex;
 gap:8px;
}
.round{
 width:53px;
 height:53px;
 border:4px solid #168b06;
 border-radius:50%;
 background:linear-gradient(#7cff26,#14a800);
 box-shadow:0 4px 0 #8a4b1b;
 color:white;
 font-size:25px;
 font-weight:bold;
 display:grid;
 place-items:center;
}

/* PLAYFIELD */
#playfield{
 position:absolute;
 inset:105px 0 0;
 overflow:hidden;
}
#canvas{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
 z-index:3;
 touch-action:none;
}
#floor{
 position:absolute;
 z-index:1;
 left:0;
 right:0;
 bottom:0;
 height:11%;
 border-top:7px solid #975324;
 background:
 repeating-radial-gradient(ellipse at 20% 30%,transparent 0 30px,#b9793d 31px 33px,transparent 34px 80px),
 linear-gradient(#d99d59,#c58a4b);
}
#floor:after{
 content:"";
 position:absolute;
 inset:8px 0;
 background:repeating-linear-gradient(175deg,transparent 0 20px,#a96a35 21px 23px,transparent 24px 45px);
 opacity:.4;
}

/* MENU */
#menu{
 position:absolute;
 z-index:15;
 inset:0;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 text-align:center;
 padding:20px;
 background:linear-gradient(#fff0b5ee,#ffd28eee);
}
.logo{
 color:#65e82b;
 font-size:clamp(40px,11vw,60px);
 font-weight:1000;
 line-height:.95;
 letter-spacing:-2px;
 -webkit-text-stroke:2px #70228d;
 text-shadow:0 5px 0 #591477,0 9px 12px #67331d66;
}
.logo span{
 display:block;
 color:white;
 font-size:.76em;
 margin-top:10px;
 -webkit-text-stroke:1px #70228d;
}
.menuFruit{
 font-size:40px;
 margin:20px 0;
}
.bigbtn{
 border:5px solid #178d08;
 border-radius:60px;
 padding:14px 48px;
 background:linear-gradient(#7dff25,#1bad00);
 box-shadow:0 7px 0 #81431b,inset 0 3px 5px #ffffffaa;
 color:white;
 font-size:27px;
 font-weight:1000;
 text-shadow:0 2px 2px #28740e;
}
.hint{
 margin-top:25px;
 max-width:280px;
 color:#784b2c;
 font-size:13px;
 line-height:1.7;
 font-weight:bold;
}

/* GAME OVER */
#endPanel{
 position:absolute;
 z-index:20;
 inset:0;
 display:none;
 justify-content:center;
 align-items:center;
 background:#40200bbb;
 padding:20px;
}
.modal{
 width:90%;
 max-width:340px;
 padding:27px 20px;
 text-align:center;
 background:linear-gradient(#fff0b5,#ffd58b);
 border:5px solid #9a5a26;
 border-radius:25px;
 box-shadow:0 10px 30px #30160088;
}
.modal h2{
 color:#79258f;
 font-size:32px;
 margin-bottom:15px;
}
.modal p{
 font-size:18px;
 line-height:2;
 font-weight:bold;
 margin-bottom:15px;
}
#toast{
 position:absolute;
 z-index:12;
 top:115px;
 left:50%;
 transform:translateX(-50%);
 background:#603017;
 color:white;
 padding:9px 16px;
 border-radius:30px;
 font-weight:bold;
 font-size:13px;
 opacity:0;
 transition:opacity .2s;
 white-space:nowrap;
 pointer-events:none;
}
</style>
</head>

<body>

<div id="gameShell">

 <div id="topPattern" class="pattern"></div>
 <div id="bottomPattern" class="pattern"></div>

 <main id="gamePanel">

  <!-- LOADING SCREEN -->
  <div id="loadingScreen">
   <div id="loadingArt">
    <span class="loadFruit">🍏</span>
    <span class="loadFruit">🍓</span>
    <span class="loadFruit">🍎</span>
    <span class="loadFruit">🫐</span>
    <span class="loadFruit">🍊</span>
   </div>
   <div id="loadingTrack">
    <div id="loadingProgress"></div>
   </div>
   <div id="loadingText">LOADING FRUIT MERGE...</div>
  </div>

  <!-- SCORE HEADER -->
  <header id="hud">

   <div id="basket">🍉</div>

   <div id="stats">
    <div class="stat">SCORE <b id="score">0</b></div>
    <div class="stat">BEST <b id="best">0</b></div>
   </div>

   <div id="nextBox">
    NEXT FRUIT
    <div id="nextFruit">🍇</div>
   </div>

  </header>

  <!-- BUTTONS -->
  <div id="controls">
   <button class="round" id="homeBtn">⌂</button>
   <button class="round" id="soundBtn">🔊</button>
  </div>

  <!-- GAME BOARD -->
  <div id="playfield">
   <canvas id="canvas"></canvas>
   <div id="floor"></div>
  </div>

  <div id="toast"></div>

  <!-- START MENU -->
  <section id="menu">
   <div class="logo">
    Fruit
    <br>MERGE
    <span>Reloaded</span>
   </div>

   <div class="menuFruit">🍎 🍓 🍇 🍉</div>

   <button class="bigbtn" id="startBtn">▶ PLAY</button>

   <div class="hint">
    TOUCH, HOLD &amp; DRAG TO AIM
    <br>
    RELEASE TO DROP FRUIT!
    <br>
    Match identical fruits to merge them!
   </div>
  </section>

  <!-- GAME OVER -->
  <section id="endPanel">
   <div class="modal">
    <h2>GAME OVER!</h2>
    <p>
     SCORE: <span id="finalScore">0</span>
     <br>
     BEST: <span id="finalBest">0</span>
    </p>
    <button class="bigbtn" id="againBtn">↻ RETRY</button>
   </div>
  </section>

 </main>
</div>

<script>
(()=>{
"use strict";

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const field=document.getElementById("playfield");

const scoreEl=document.getElementById("score");
const bestEl=document.getElementById("best");
const nextEl=document.getElementById("nextFruit");
const toast=document.getElementById("toast");

const fruits=[
 {emoji:"🫐",name:"Blueberry",r:17,value:2,color:"#345ee7"},
 {emoji:"🍇",name:"Grape",r:21,value:4,color:"#8b27c7"},
 {emoji:"🍒",name:"Cherry",r:25,value:8,color:"#ed3346"},
 {emoji:"🍓",name:"Strawberry",r:29,value:12,color:"#ef3546"},
 {emoji:"🍊",name:"Orange",r:34,value:18,color:"#ff9c18"},
 {emoji:"🍋",name:"Lemon",r:38,value:26,color:"#f8d22c"},
 {emoji:"🍏",name:"Apple",r:43,value:38,color:"#76c82a"},
 {emoji:"🍑",name:"Peach",r:48,value:55,color:"#ff999d"},
 {emoji:"🍍",name:"Pineapple",r:54,value:80,color:"#e9b52c"},
 {emoji:"🍉",name:"Watermelon",r:61,value:120,color:"#37b94b"}
];

let W=0,H=0;
let balls=[];
let particles=[];
let score=0;
let best=Number(localStorage.getItem("fruitMergeBest")||0);
let current=0,next=1;
let gameOn=false;
let gameOver=false;
let lastTime=0;
let animation=0;
let sound=true;
let dropReady=true; 
let dropTimer=null;
let pointerX=180;
let isHolding=false;

bestEl.textContent=best;

function resize(){
 const rect=field.getBoundingClientRect();
 W=rect.width;
 H=rect.height;
 const dpr=Math.min(window.devicePixelRatio||1,2);
 canvas.width=Math.round(W*dpr);
 canvas.height=Math.round(H*dpr);
 canvas.style.width=W+"px";
 canvas.style.height=H+"px";
 ctx.setTransform(dpr,0,0,dpr,0,0);
 if(!isHolding) pointerX=W/2;
}

new ResizeObserver(resize).observe(field);
resize();

function floorY(){ return H*.89; }
function dangerY(){ return 75; }

function randomFruit(){
 const pool=[0,0,1,1,2,2,3,4];
 return pool[Math.floor(Math.random()*pool.length)];
}

function updateNext(){
 nextEl.textContent=fruits[next].emoji;
}

function resetGame(){
 balls=[];
 particles=[];
 score=0;
 current=randomFruit();
 next=randomFruit();
 gameOver=false;
 gameOn=true;
 dropReady=true;
 isHolding=false;
 if(dropTimer) clearTimeout(dropTimer);
 scoreEl.textContent=0;
 document.getElementById("menu").style.display="none";
 document.getElementById("endPanel").style.display="none";
 updateNext();
 pointerX=W/2;
 toastMsg("Hold and drag to aim!");
 lastTime=performance.now();
 cancelAnimationFrame(animation);
 animation=requestAnimationFrame(loop);
}

function toastMsg(message){
 toast.textContent=message;
 toast.style.opacity=1;
 clearTimeout(toast.timer);
 toast.timer=setTimeout(()=>{ toast.style.opacity=0; },1200);
}

function addScore(points){
 score+=points;
 scoreEl.textContent=score;
 if(score>best){
  best=score;
  bestEl.textContent=best;
  localStorage.setItem("fruitMergeBest",best);
 }
}

function releaseFruit(x){
 if(!gameOn||gameOver||!dropReady)return;

 const r=fruits[current].r;
 x=Math.max(r+5,Math.min(W-r-5,x));

 dropReady=false;

 balls.push({
  x:x,
  y:Math.max(r+12,30),
  vx:0,
  vy:20,
  level:current,
  r:r,
  age:0,
  settled:false
 });

 current=next;
 next=randomFruit();
 updateNext();

 // Automatically reload next fruit after exactly 1.5 seconds
 if(dropTimer) clearTimeout(dropTimer);
 dropTimer=setTimeout(()=>{
  if(gameOn && !gameOver) {
   dropReady=true;
  }
 }, 1500);
}

function lighter(hex){
 const n=parseInt(hex.slice(1),16);
 const r=Math.min(255,((n>>16)&255)+65);
 const g=Math.min(255,((n>>8)&255)+65);
 const b=Math.min(255,(n&255)+65);
 return "rgb("+r+","+g+","+b+")";
}

function drawFruit(b){
 const f=fruits[b.level];
 ctx.save();
 ctx.translate(b.x,b.y);
 ctx.shadowColor="#63331355";
 ctx.shadowBlur=6;
 ctx.shadowOffsetY=3;

 const gradient=ctx.createRadialGradient(-b.r*.35,-b.r*.4,2,0,0,b.r*1.2);
 gradient.addColorStop(0,"#ffffff");
 gradient.addColorStop(.18,lighter(f.color));
 gradient.addColorStop(1,f.color);

 ctx.fillStyle=gradient;
 ctx.beginPath();
 ctx.arc(0,0,b.r,0,Math.PI*2);
 ctx.fill();
 ctx.shadowColor="transparent";

 ctx.fillStyle="#42251a";
 ctx.beginPath();
 ctx.arc(-b.r*.27,-b.r*.04,Math.max(2,b.r*.075),0,Math.PI*2);
 ctx.arc(b.r*.27,-b.r*.04,Math.max(2,b.r*.075),0,Math.PI*2);
 ctx.fill();

 ctx.strokeStyle="#63321d";
 ctx.lineWidth=Math.max(1.5,b.r*.055);
 ctx.beginPath();
 ctx.arc(0,b.r*.12,b.r*.18,.15*Math.PI,.85*Math.PI);
 ctx.stroke();

 ctx.fillStyle="#ffffffaa";
 ctx.beginPath();
 ctx.ellipse(-b.r*.4,-b.r*.42,b.r*.14,b.r*.07,-.6,0,Math.PI*2);
 ctx.fill();
 ctx.restore();
}

function burst(x,y,color){
 for(let i=0;i<12;i++){
  const angle=Math.PI*2*i/12;
  const speed=65+Math.random()*100;
  particles.push({ x:x, y:y, vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed, life:.55, color:color });
 }
}

function mergeCheck(){
 let changed=true;
 let guard=0;

 while(changed&&guard++<25){
  changed=false;
  for(let i=0;i<balls.length&&!changed;i++){
   for(let j=i+1;j<balls.length;j++){
    const a=balls[i];
    const b=balls[j];

    if(!a||!b||a.level!==b.level)continue;
    if(a.level>=fruits.length-1)continue;

    const dx=b.x-a.x;
    const dy=b.y-a.y;
    const distance=Math.hypot(dx,dy);

    if(distance<a.r+b.r+2){
     const x=(a.x+b.x)/2;
     const y=(a.y+b.y)/2;
     const level=a.level+1;
     const vx=(a.vx+b.vx)*.15;
     const vy=Math.min(-80,(a.vy+b.vy)*.1);

     balls.splice(j,1);
     balls.splice(i,1);

     balls.push({
      x:x, y:y, vx:vx, vy:vy,
      level:level, r:fruits[level].r,
      age:0, settled:false
     });

     addScore(fruits[level].value);
     burst(x,y,fruits[level].color);
     toastMsg(fruits[level].name+" MERGED!");

     changed=true;
     break;
    }
   }
  }
 }
}

function physics(dt){
 const gravity=1050;
 const wall=5;
 const bottom=floorY();

 for(const b of balls){
  b.age+=dt;
  b.vy+=gravity*dt;
  b.x+=b.vx*dt;
  b.y+=b.vy*dt;
  b.vx*=Math.pow(.992,dt*60);

  if(b.x-b.r<wall){ b.x=wall+b.r; b.vx=Math.abs(b.vx)*.35; }
  if(b.x+b.r>W-wall){ b.x=W-wall-b.r; b.vx=-Math.abs(b.vx)*.35; }

  if(b.y+b.r>bottom){
   b.y=bottom-b.r;
   b.vy=-Math.abs(b.vy)*.18;
   b.vx*=.8;
   if(Math.abs(b.vy)<15){
    b.vy=0;
    b.settled=true;
   }
  }
 }

 for(let k=0;k<4;k++){
  for(let i=0;i<balls.length;i++){
   for(let j=i+1;j<balls.length;j++){
    const a=balls[i];
    const b=balls[j];
    let dx=b.x-a.x;
    let dy=b.y-a.y;
    let distance=Math.hypot(dx,dy)||.001;
    const minimum=a.r+b.r;

    if(distance<minimum){
     const nx=dx/distance;
     const ny=dy/distance;
     const overlap=minimum-distance;

     a.x-=nx*overlap*.5;
     a.y-=ny*overlap*.5;
     b.x+=nx*overlap*.5;
     b.y+=ny*overlap*.5;

     const relative=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
     if(relative<0){
      const impulse=-relative*.35;
      a.vx-=impulse*nx; a.vy-=impulse*ny;
      b.vx+=impulse*nx; b.vy+=impulse*ny;
     }
    }
   }
  }
 }

 mergeCheck();

 for(const p of particles){
  p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=250*dt; p.life-=dt;
 }
 particles=particles.filter(p=>p.life>0);

 if(balls.some(b=>b.age>2.5&&b.y-b.r<dangerY()&&Math.abs(b.vy)<15)){
  endGame();
 }
}

function draw(){
 ctx.clearRect(0,0,W,H);

 ctx.save();
 ctx.strokeStyle="#ffffff";
 ctx.lineWidth=3;
 ctx.setLineDash([12,9]);
 ctx.beginPath();
 ctx.moveTo(0,dangerY());
 ctx.lineTo(W,dangerY());
 ctx.stroke();
 ctx.setLineDash([]);
 ctx.restore();

 balls.forEach(drawFruit);

 if(gameOn&&!gameOver&&dropReady){
  const r=fruits[current].r;
  const cx=Math.max(r+5,Math.min(W-r-5,pointerX));
  const cy=Math.max(r+12,30);

  ctx.save();
  ctx.strokeStyle="rgba(255,255,255,0.6)";
  ctx.lineWidth=2;
  ctx.setLineDash([6,6]);
  ctx.beginPath();
  ctx.moveTo(cx,cy+r);
  ctx.lineTo(cx,H);
  ctx.stroke();
  ctx.restore();

  drawFruit({x:cx,y:cy,level:current,r:r});
 }

 for(const p of particles){
  ctx.globalAlpha=Math.max(0,p.life/.55);
  ctx.fillStyle=p.color;
  ctx.beginPath();
  ctx.arc(p.x,p.y,3,0,Math.PI*2);
  ctx.fill();
 }
 ctx.globalAlpha=1;
}

function loop(time){
 if(!gameOn)return;
 let dt=Math.min(.025,(time-lastTime)/1000||.016);
 lastTime=time;
 if(!gameOver){ physics(dt); }
 draw();
 animation=requestAnimationFrame(loop);
}

function endGame(){
 if(gameOver)return;
 gameOver=true;
 gameOn=false;
 if(dropTimer) clearTimeout(dropTimer);
 document.getElementById("finalScore").textContent=score;
 document.getElementById("finalBest").textContent=best;
 document.getElementById("endPanel").style.display="flex";
 cancelAnimationFrame(animation);
}

function handlePointerDown(e){
 if(!gameOn||gameOver||!dropReady)return;
 e.preventDefault();
 isHolding=true;
 const rect=canvas.getBoundingClientRect();
 pointerX=(e.clientX||e.touches[0].clientX)-rect.left;
}

function handlePointerMove(e){
 if(!gameOn||gameOver||!dropReady||!isHolding)return;
 e.preventDefault();
 const rect=canvas.getBoundingClientRect();
 pointerX=(e.clientX||e.touches[0].clientX)-rect.left;
}

function handlePointerUp(e){
 if(!gameOn||gameOver||!isHolding)return;
 e.preventDefault();
 isHolding=false;
 const rect=canvas.getBoundingClientRect();
 const x=(e.clientX||(e.changedTouches&&e.changedTouches[0].clientX))-rect.left;
 releaseFruit(isNaN(x)?pointerX:x);
}

canvas.addEventListener("pointerdown",handlePointerDown);
canvas.addEventListener("pointermove",handlePointerMove);
canvas.addEventListener("pointerup",handlePointerUp);
canvas.addEventListener("pointercancel",()=>isHolding=false);

canvas.addEventListener("touchstart",handlePointerDown,{passive:false});
canvas.addEventListener("touchmove",handlePointerMove,{passive:false});
canvas.addEventListener("touchend",handlePointerUp,{passive:false});

document.getElementById("startBtn").onclick=resetGame;
document.getElementById("againBtn").onclick=resetGame;

document.getElementById("homeBtn").onclick=()=>{
 gameOn=false;
 gameOver=false;
 if(dropTimer) clearTimeout(dropTimer);
 cancelAnimationFrame(animation);
 document.getElementById("endPanel").style.display="none";
 document.getElementById("menu").style.display="flex";
};

document.getElementById("soundBtn").onclick=()=>{
 sound=!sound;
 document.getElementById("soundBtn").textContent=sound?"🔊":"🔇";
 toastMsg(sound?"Sound enabled":"Sound muted");
};

window.addEventListener("load",()=>{
 const loader=document.getElementById("loadingScreen");
 setTimeout(()=>{
  loader.classList.add("hide");
  setTimeout(()=>{loader.remove();},550);
 },2550);
});

})();
</script>

</body>
</html>
