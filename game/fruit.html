<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Fruit Merge Reloaded - ST Games</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Fredoka', sans-serif;
      background: repeating-linear-gradient(
        0deg,
        #fef08a 0px,
        #fef08a 40px,
        #fde047 40px,
        #fde047 80px
      );
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    /* Splash Screen / Menu Overlay matching your screenshot */
    #splashScreen {
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        #fef08a 0px,
        #fef08a 40px,
        #fde047 40px,
        #fde047 80px
      );
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      transition: opacity 0.4s ease;
    }

    .wood-shelf {
      background: linear-gradient(180deg, #b45309 0%, #78350f 100%);
      border-top: 5px solid #f59e0b;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .glass-hud {
      background: rgba(180, 83, 9, 0.85);
      border: 3px solid #fde047;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    canvas {
      touch-action: none;
      -webkit-user-select: none;
    }
  </style>
</head>
<body>

  <!-- SPLASH SCREEN / MENU (Matches Screenshot 2) -->
  <div id="splashScreen">
    <div class="text-center mb-8">
      <h1 class="brand-font text-4xl sm:text-5xl font-black text-purple-700 drop-shadow-[0_4px_0_#fde047] tracking-wider uppercase">Fruit Merge</h1>
      <h2 class="text-3xl sm:text-4xl font-black text-green-600 drop-shadow-[0_3px_0_#ffffff] tracking-wider uppercase mt-1">Reloaded</h2>
    </div>

    <button onclick="startGame()" class="w-24 h-24 rounded-full bg-gradient-to-tr from-green-500 to-emerald-400 border-4 border-white shadow-[0_8px_25px_rgba(16,185,129,0.5)] flex items-center justify-center text-white text-4xl active:scale-95 transition">
      <i class="fa-solid fa-play ml-1"></i>
    </button>
  </div>

  <!-- TOP HUD BAR (Matches Screenshot 3) -->
  <header class="w-full max-w-md px-3 pt-3 z-25 flex items-center justify-between">
    <!-- Evolution Wheel Box -->
    <div class="glass-hud w-20 h-20 rounded-full relative flex items-center justify-center shadow-lg">
      <canvas id="wheelCanvas" width="70" height="70" class="w-full h-full"></canvas>
    </div>

    <!-- Score & High Score Board -->
    <div class="flex flex-col gap-1.5 flex-1 mx-3">
      <div class="glass-hud rounded-full px-4 py-1 flex items-center justify-between text-white text-xs font-black">
        <span>SCORE :</span>
        <span id="scoreVal">0</span>
      </div>
      <div class="glass-hud rounded-full px-4 py-1 flex items-center justify-between text-white text-xs font-black">
        <span>HIGH :</span>
        <span id="bestScoreVal">0</span>
      </div>
    </div>

    <!-- Next Fruit Preview & Hub Button -->
    <div class="flex items-center gap-2">
      <div class="glass-hud p-1.5 rounded-2xl flex flex-col items-center">
        <span class="text-[9px] font-black text-yellow-200 uppercase">Next</span>
        <canvas id="nextFruitCanvas" width="34" height="34" class="w-8 h-8 rounded-full bg-purple-900/40"></canvas>
      </div>
      <a href="../index.html" class="glass-hud w-10 h-10 rounded-full flex items-center justify-center text-white text-lg"><i class="fa-solid fa-house"></i></a>
    </div>
  </header>

  <!-- MAIN GAME CANVAS -->
  <main class="relative z-10 flex-1 flex items-center justify-center w-full max-w-md px-2">
    <canvas id="gameCanvas" width="360" height="460" class="rounded-2xl bg-amber-50/20 border-4 border-amber-600/60 shadow-xl"></canvas>
  </main>

  <!-- WOODEN TABLE FLOOR SHELF -->
  <footer class="wood-shelf w-full h-24 z-20 flex items-center justify-center">
    <div class="text-amber-200/80 text-xs font-bold tracking-widest uppercase">ST Games • Fruit Merge Reloaded</div>
  </footer>

  <!-- GAME OVER MODAL -->
  <div id="gameOverModal" class="fixed inset-0 z-50 hidden bg-slate-950/80 flex items-center justify-center p-4">
    <div class="bg-amber-50 border-4 border-amber-400 rounded-3xl max-w-sm w-full p-6 text-center shadow-2xl">
      <h2 class="text-2xl font-black text-amber-950 mb-2">Jar Overflowed!</h2>
      <p class="text-xs text-slate-600 mb-4">Final Score: <span id="finalScore" class="font-bold">0</span></p>
      <button onclick="restartGame()" class="w-full py-3 rounded-2xl font-bold bg-teal-600 text-white shadow">Play Again</button>
    </div>
  </div>

  <script>
    const FIREBASE_DB_URL = "https://friendsgame-872f5-default-rtdb.firebaseio.com";
    const LOCAL_KEY = "st_fruit_high_score";

    let highScore = Number(localStorage.getItem(LOCAL_KEY)) || 0;
    document.getElementById("bestScoreVal").textContent = highScore;

    async function syncScore(newScore) {
      if (newScore > highScore) {
        highScore = newScore;
        localStorage.setItem(LOCAL_KEY, highScore);
        document.getElementById("bestScoreVal").textContent = highScore;
        try {
          const name = localStorage.getItem("gh_user_name") || "Player";
          const key = name.toLowerCase().replace(/[^a-z0-9]/g, "_");
          await fetch(`${FIREBASE_DB_URL}/fruit_merge/players/${key}.json`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, highScore, updatedAt: Date.now() })
          });
        } catch (_) {}
      }
    }

    // 11 Kawaii Fruit Tiers matching your screenshots
    const FRUITS = [
      { radius: 15, score: 2,   color: "#a855f7" },
      { radius: 21, score: 4,   color: "#fb7185" },
      { radius: 28, score: 8,   color: "#60a5fa" },
      { radius: 35, score: 16,  color: "#f43f5e" },
      { radius: 43, score: 32,  color: "#a3e635" },
      { radius: 52, score: 64,  color: "#fde047" },
      { radius: 61, score: 128, color: "#fb923c" },
      { radius: 71, score: 256, color: "#ef4444" },
      { radius: 82, score: 512, color: "#facc15" },
      { radius: 94, score: 1024,color: "#bef264" },
      { radius: 108,score: 2048,color: "#22c55e" }
    ];

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const JAR = { left: 20, right: 340, top: 40, bottom: 430, dangerY: 75 };

    let balls = [], score = 0, currentTier = 0, nextTier = 1, gameStarted = false;
    let aimX = 180, canDrop = true, isPointerDown = false, isGameOver = false;

    function drawFruit(c, x, y, r, tier) {
      const f = FRUITS[tier] || FRUITS[0];
      c.save();
      c.translate(x, y);
      c.beginPath();
      c.arc(0, 0, r, 0, Math.PI * 2);
      c.fillStyle = f.color;
      c.fill();
      c.lineWidth = 2;
      c.strokeStyle = "#ffffff";
      c.stroke();

      // Kawaii face
      c.fillStyle = "#1e1b4b";
      c.beginPath();
      c.arc(-r * 0.3, 0, Math.max(2, r * 0.1), 0, Math.PI * 2);
      c.arc(r * 0.3, 0, Math.max(2, r * 0.1), 0, Math.PI * 2);
      c.fill();
      c.restore();
    }

    function renderWheel() {
      const wc = document.getElementById("wheelCanvas").getContext("2d");
      wc.clearRect(0, 0, 70, 70);
      FRUITS.forEach((f, idx) => {
        const angle = (idx / FRUITS.length) * Math.PI * 2;
        const wx = 35 + Math.cos(angle) * 22;
        const wy = 35 + Math.sin(angle) * 22;
        drawFruit(wc, wx, wy, 6, idx);
      });
    }

    function renderNext() {
      const nc = document.getElementById("nextFruitCanvas").getContext("2d");
      nc.clearRect(0, 0, 34, 34);
      drawFruit(nc, 17, 17, Math.min(14, FRUITS[nextTier].radius * 0.45), nextTier);
    }

    function clampAim(x) {
      const r = FRUITS[currentTier].radius;
      return Math.max(JAR.left + r, Math.min(JAR.right - r, x));
    }

    function handleMove(clientX) {
      if (!gameStarted || isGameOver) return;
      const rect = canvas.getBoundingClientRect();
      const x = (clientX - rect.left) * (canvas.width / rect.width);
      aimX = clampAim(x);
    }

    function handleDrop() {
      if (!gameStarted || isGameOver || !canDrop) return;
      canDrop = false;

      const f = FRUITS[currentTier];
      balls.push({ x: clampAim(aimX), y: JAR.top + 10, vx: 0, vy: 2, radius: f.radius, tier: currentTier, merged: false, age: 0 });
      currentTier = nextTier;
      nextTier = Math.floor(Math.random() * 4);
      renderNext();

      setTimeout(() => { canDrop = true; }, 350);
    }

    canvas.addEventListener("pointerdown", e => { e.preventDefault(); handleMove(e.clientX); }, { passive: false });
    canvas.addEventListener("pointermove", e => { e.preventDefault(); handleMove(e.clientX); }, { passive: false });
    canvas.addEventListener("pointerup", e => { e.preventDefault(); handleDrop(); }, { passive: false });

    canvas.addEventListener("touchstart", e => { e.preventDefault(); if(e.touches.length) handleMove(e.touches[0].clientX); }, { passive: false });
    canvas.addEventListener("touchmove", e => { e.preventDefault(); if(e.touches.length) handleMove(e.touches[0].clientX); }, { passive: false });
    canvas.addEventListener("touchend", e => { e.preventDefault(); handleDrop(); }, { passive: false });

    function updatePhysics() {
      if (!gameStarted || isGameOver) return;
      const SUBSTEPS = 5;
      const gravity = 0.4 / SUBSTEPS;

      for (let s = 0; s < SUBSTEPS; s++) {
        for (let i = 0; i < balls.length; i++) {
          const b = balls[i];
          b.vy += gravity;
          b.x += b.vx; b.y += b.vy;
          if (b.x - b.radius < JAR.left) { b.x = JAR.left + b.radius; b.vx *= -0.3; }
          if (b.x + b.radius > JAR.right) { b.x = JAR.right - b.radius; b.vx *= -0.3; }
          if (b.y + b.radius > JAR.bottom) { b.y = JAR.bottom - b.radius; b.vy *= -0.2; b.vx *= 0.8; }
        }

        for (let i = 0; i < balls.length; i++) {
          for (let j = i + 1; j < balls.length; j++) {
            const a = balls[i], b = balls[j];
            if (a.merged || b.merged) continue;
            const dx = b.x - a.x, dy = b.y - a.y, dist = Math.hypot(dx, dy);
            const minDist = a.radius + b.radius;
            if (dist < minDist && dist > 0.001) {
              if (a.tier === b.tier && a.tier < FRUITS.length - 1) {
                a.merged = true; b.merged = true;
                const nt = a.tier + 1;
                balls.push({ x: (a.x + b.x) * 0.5, y: (a.y + b.y) * 0.5, vx: 0, vy: -1.5, radius: FRUITS[nt].radius, tier: nt, merged: false, age: 5 });
                score += FRUITS[nt].score;
                document.getElementById("scoreVal").textContent = score;
                syncScore(score);
                continue;
              }
              const overlap = minDist - dist;
              const nx = dx / dist, ny = dy / dist;
              a.x -= nx * overlap * 0.5; a.y -= ny * overlap * 0.5;
              b.x += nx * overlap * 0.5; b.y += ny * overlap * 0.5;
            }
          }
        }
        balls = balls.filter(b => !b.merged);
      }

      for (let i = 0; i < balls.length; i++) {
        balls[i].age++;
        if (balls[i].age > 60 && balls[i].y - balls[i].radius < JAR.dangerY) {
          isGameOver = true;
          document.getElementById("finalScore").textContent = score;
          document.getElementById("gameOverModal").classList.remove("hidden");
        }
      }
    }

    function renderScene() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (gameStarted && canDrop && !isGameOver) {
        const cx = clampAim(aimX);
        ctx.setLineDash([4, 4]);
        ctx.strokeStyle = "rgba(0,0,0,0.3)";
        ctx.beginPath(); ctx.moveTo(cx, JAR.top); ctx.lineTo(cx, JAR.bottom); ctx.stroke();
        drawFruit(ctx, cx, JAR.top, FRUITS[currentTier].radius, currentTier);
      }

      balls.forEach(b => drawFruit(ctx, b.x, b.y, b.radius, b.tier));

      ctx.strokeStyle = "#f59e0b"; ctx.lineWidth = 4;
      ctx.strokeRect(JAR.left, JAR.top, JAR.right - JAR.left, JAR.bottom - JAR.top);
    }

    function loop() {
      updatePhysics();
      renderScene();
      requestAnimationFrame(loop);
    }

    function startGame() {
      document.getElementById("splashScreen").style.opacity = "0";
      setTimeout(() => document.getElementById("splashScreen").classList.add("hidden"), 400);
      gameStarted = true;
      renderWheel();
      renderNext();
    }

    function restartGame() {
      balls = []; score = 0; isGameOver = false;
      document.getElementById("scoreVal").textContent = "0";
      document.getElementById("gameOverModal").classList.add("hidden");
    }

    window.addEventListener("DOMContentLoaded", () => {
      requestAnimationFrame(loop);
    });
  </script>
</body>
</html>
