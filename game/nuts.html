<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ad</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: #000000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .ad-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            aspect-ratio: 9 / 16;
            max-width: calc(100vh * 9 / 16);
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div class="ad-wrapper">
        <video id="ad-vid" src="4910.mp4" autoplay playsinline></video>
    </div>

    <script>
        const vid = document.getElementById('ad-vid');

        // Start playback automatically
        vid.play().catch(() => {
            vid.muted = true;
            vid.play().catch(() => {});
        });

        // Automatically collect reward when video finishes
        vid.addEventListener('ended', () => {
            window.parent.postMessage('AD_COMPLETED', '*');
        });
    </script>
</body>
</html>
