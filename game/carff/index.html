<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>ST GAMES • 3D Highway Racer (Free Fire Style Lobby)</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
  <div id="stage16x9" class="stage-16x9">
    <!-- 16:9 FREE FIRE STYLE LOBBY WITH USER BACKGROUND -->
    <div id="menu" class="menu">
      <!-- User Custom Background -->
      <img id="lobbyBgImg" class="lobby-bg-img" src="assets/backgrounds/homepage-bg.png" alt="Lobby Background">
      <div class="lobby-vignette"></div>

      <!-- TOP-LEFT: FREE FIRE STYLE PLAYER PROFILE BANNER -->
      <div class="ff-profile-banner" id="btnAccountTop" title="Account & Cloud Sync">
        <div class="ff-avatar-frame">
          <span>ST</span>
          <em class="ff-lv-tag">LV.16</em>
        </div>
        <div class="ff-profile-info">
          <div class="ff-name-row">
            <strong id="topPlayerName">GUEST RACER</strong>
            <span class="ff-rank-badge">HEROIC</span>
          </div>
          <div class="ff-xp-bar"><span style="width:74%;"></span></div>
          <small id="topAccountMode">💾 GUEST LOCAL SAVE</small>
        </div>
      </div>

      <!-- TOP-RIGHT: FREE FIRE STYLE CURRENCY & UTILITY ICON BAR -->
      <div class="ff-topbar-right">
        <div class="ff-currency-strip">
          <div class="ff-curr-item">
            <span class="ff-curr-ico">🪙</span>
            <b id="coins">125,680</b>
          </div>
          <div class="ff-curr-item ff-gem">
            <span class="ff-curr-ico">💎</span>
            <b id="gems">2,450</b>
          </div>
          <div class="ff-curr-item">
            <span class="ff-curr-ico">⛽</span>
            <b>100%</b>
          </div>
        </div>

        <div class="ff-util-icons">
          <button type="button" class="ff-icon-btn" id="btnNotifications" title="Mail & Notifications">
            <span>🔔</span>
            <span class="ff-notif-dot" id="notifBadge">3</span>
          </button>
          <button type="button" class="ff-icon-btn" id="btnAchievements" title="Achievements">
            <span>🏆</span>
          </button>
          <button type="button" class="ff-icon-btn" id="btnDailyReward" title="Daily Reward">
            <span>🎁</span>
          </button>
          <button type="button" class="ff-icon-btn" id="btnSettings" title="Settings">
            <span>⚙️</span>
          </button>
          <button type="button" class="ff-icon-btn ff-full-btn" id="btnFullscreenTop" title="16:9 Fullscreen">
            <span>⛶</span>
          </button>
          <div id="whiteCustomBtns" style="display:flex;gap:5px;"></div>
        </div>
      </div>

      <!-- LEFT VERTICAL RAIL: FREE FIRE STYLE NAVIGATION BUTTONS -->
      <nav class="ff-left-rail" aria-label="Lobby Navigation">
        <button type="button" class="ff-nav-btn ff-nav-highlight" id="btnStore">
          <span class="ff-nav-ico">🛒</span>
          <span class="ff-nav-lbl">
            <strong>STORE</strong>
            <small>CARS • BIKES</small>
          </span>
        </button>

        <button type="button" class="ff-nav-btn" id="btnLibrary">
          <span class="ff-nav-ico">🚘</span>
          <span class="ff-nav-lbl">
            <strong>VAULT / GARAGE</strong>
            <small>OWNED FLEET</small>
          </span>
        </button>

        <button type="button" class="ff-nav-btn" id="btnSkinsStore">
          <span class="ff-nav-ico">🎨</span>
          <span class="ff-nav-lbl">
            <strong>WRAPS &amp; SKINS</strong>
            <small>CUSTOM PAINT</small>
          </span>
        </button>

        <button type="button" class="ff-nav-btn" id="btnUpgrades">
          <span class="ff-nav-ico">🔧</span>
          <span class="ff-nav-lbl">
            <strong>UPGRADES</strong>
            <small>ENGINE • NITRO</small>
          </span>
        </button>

        <label class="ff-nav-btn ff-nav-upload" title="Upload .GLB, .GLTF, or .OBJ Car Model">
          <span class="ff-nav-ico">📂</span>
          <span class="ff-nav-lbl">
            <strong>UPLOAD 3D CAR</strong>
            <small>.GLB / .OBJ FILE</small>
          </span>
          <input type="file" id="directCarUpload" accept=".glb,.gltf,.obj" style="display:none;">
        </label>

        <button type="button" class="ff-nav-btn ff-nav-account" id="btnAccount">
          <span class="ff-nav-ico">☁️</span>
          <span class="ff-nav-lbl">
            <strong id="accountBtnTitle">ACCOUNT</strong>
            <small id="accountBtnSub">CLOUD SYNC</small>
          </span>
        </button>

        <div id="orangeCustomBtns" style="display:flex;flex-direction:column;gap:5px;"></div>
      </nav>

      <!-- CENTER: TRANSPARENT 3D TURNTABLE OVER USER BACKGROUND -->
      <div id="turntableStage" class="turntable-stage">
        <div class="ff-car-hud">
          <div class="ff-car-title-row">
            <strong id="activeCarName">KOENIGSEGG AGERA RS 3D</strong>
            <span class="ff-badge-pill" id="activeCarBadge">3D HYPERCAR</span>
          </div>
          <div class="ff-car-stats">
            <span>SPD <b id="statSpd">100</b></span>
            <span>ACC <b id="statAcc">96</b></span>
            <span>HND <b id="statHnd">94</b></span>
            <span>FUEL <b id="statFuel">90</b></span>
          </div>
        </div>

        <canvas id="turntableCanvas"></canvas>

        <div class="ff-turntable-bar">
          <button type="button" class="ff-rot-btn" id="rotLeftBtn">⟲</button>
          <span>DRAG 360°</span>
          <button type="button" class="ff-rot-btn" id="rotRightBtn">⟳</button>
          <button type="button" class="ff-rot-btn" id="rotAutoBtn">AUTO: OFF</button>
        </div>
      </div>

      <!-- BOTTOM-LEFT: COMPACT FREE FIRE STYLE QUICK-SWITCH & EVENTS DOCK -->
      <div class="ff-bottom-dock">
        <div class="ff-dock-header">
          <button type="button" class="ff-event-pill" id="btnEvents">
            <span>🔥</span><span>LIVE EVENTS</span>
          </button>
          <span class="ff-dock-caption">QUICK SWITCH VEHICLE</span>
          <div id="greyCustomBtns" style="display:flex;gap:5px;"></div>
        </div>
        <div id="ownedQuickStrip" class="ff-quick-strip"></div>
      </div>

      <!-- BOTTOM-RIGHT: ICONIC FREE FIRE MODE SELECTOR + GOLDEN START BUTTON -->
      <div class="ff-start-cluster">
        <button type="button" id="mapSelectBox" class="ff-mode-card" aria-label="Select Highway Map">
          <div id="redMapGround" class="ff-mode-accent"></div>
          <div class="ff-mode-left">
            <span id="redMapIcon" class="ff-mode-icon">🌅</span>
            <div class="ff-mode-text">
              <small>4-LANE HIGHWAY • BACKSIDE CAM</small>
              <strong id="redMapName">SUNSET HIGHWAY</strong>
            </div>
          </div>
          <span class="ff-mode-change">CHANGE ▾</span>
        </button>

        <button type="button" id="play" class="ff-start-btn">
          <span class="ff-start-sheen"></span>
          <span class="ff-start-label">START</span>
        </button>
      </div>

      <div id="customFloatingLayer" class="custom-floating-layer"></div>
    </div>

    <!-- MODAL OVERLAY -->
    <div id="modal" class="modal hidden">
      <div class="box">
        <div class="box-header">
          <h2 id="title">STORE</h2>
          <button type="button" id="close" class="close">✕</button>
        </div>
        <div id="content"></div>
      </div>
    </div>

    <!-- CONTINUOUS FORWARD 3D HIGHWAY GAMEPLAY -->
    <div id="game" class="game hidden">
      <canvas id="highway3dCanvas"></canvas>
      <canvas id="canvas"></canvas>

      <!-- TOP-LEFT SCORE -->
      <div class="video-hud-topleft">
        <span class="lbl">SCORE</span>
        <span class="val" id="dist">0</span>
        <div class="video-hud-sub">
          <span>🪙 <b id="runCoins" style="color:#fde047;">0</b></span>
          <span>💎 <b id="runGems" style="color:#38bdf8;">0</b></span>
        </div>
      </div>

      <!-- TOP-RIGHT CAMERA SWITCH, PAUSE & SPEED KMH -->
      <div class="video-hud-topright">
        <div class="video-top-btns">
          <button type="button" id="camModeBtn" class="video-cam-btn">🎥 VIEW: BACKSIDE</button>
          <button type="button" id="pauseBtn" class="video-pause-btn" aria-label="Pause">||</button>
        </div>
        <div class="video-speed-box">
          <span class="lbl">SPEED</span>
          <span class="val" id="speedKmh">67</span> <span class="unit">KMH</span>
        </div>
      </div>

      <!-- LEFT HEADLIGHT BUTTON -->
      <button type="button" id="headlightBtn" class="video-headlight-btn" aria-label="Headlights">💡</button>

      <!-- BOTTOM PEDALS & STEERING -->
      <div class="video-controls-bar">
        <div class="video-left-cluster">
          <button type="button" id="brake" class="pedal-brake" aria-label="Brake">
            <span></span><span></span><span></span><span></span><span></span>
          </button>
          <button type="button" id="steerLeft" class="steer-btn" aria-label="Steer Left">◀</button>
          <button type="button" id="steerRight" class="steer-btn" aria-label="Steer Right">▶</button>
        </div>
        <div class="video-right-cluster">
          <button type="button" id="nitro" class="steer-btn" style="border-color:#a855f7;color:#e9d5ff;" aria-label="Nitro">🚀</button>
          <button type="button" id="gas" class="pedal-gas" aria-label="Gas">
            <span></span><span></span><span></span><span></span><span></span><span></span>
          </button>
        </div>
      </div>

      <!-- PAUSE OVERLAY -->
      <div id="pauseOverlay" class="video-overlay hidden">
        <div class="video-blue-squares">
          <button type="button" class="v-sq-item" id="home">
            <div class="v-sq-icon">🏠</div>
            <span class="v-sq-label">MENU</span>
          </button>
          <button type="button" class="v-sq-item" id="openOptionsBtn">
            <div class="v-sq-icon">⚙️</div>
            <span class="v-sq-label">OPTIONS</span>
          </button>
          <button type="button" class="v-sq-item" id="pauseRestartBtn">
            <div class="v-sq-icon">↻</div>
            <span class="v-sq-label">RESTART</span>
          </button>
          <button type="button" class="v-sq-item" id="pauseContinueBtn">
            <div class="v-sq-icon">▶</div>
            <span class="v-sq-label">CONTINUE</span>
          </button>
        </div>
      </div>

      <!-- OPTIONS OVERLAY -->
      <div id="optionsOverlay" class="video-overlay hidden">
        <div class="video-options-box">
          <div class="v-opt-row">
            <strong>SOUND</strong>
            <div class="v-bar-track" id="soundBarTrack"><div class="v-bar-fill" id="soundBarFill" style="width:75%;"></div></div>
          </div>
          <div class="v-opt-row">
            <strong>MUSIC</strong>
            <div class="v-bar-track" id="musicBarTrack"><div class="v-bar-fill" id="musicBarFill" style="width:65%;"></div></div>
          </div>
        </div>
        <button type="button" class="v-rect-btn" id="optionsContinueBtn">CONTINUE</button>
      </div>

      <!-- CRASH OVERLAY -->
      <div id="crashOverlay" class="video-overlay hidden">
        <div class="video-crash-card">
          <h3>YOU HAVE CRASHED !!</h3>
          <button type="button" class="v-continue-green" id="continueFreeBtn">
            🎬 CONTINUE<br><small style="font-size:10px;font-weight:700;">FREE</small>
          </button>
          <button type="button" class="v-cancel-grey" id="crashCancelBtn">CANCEL</button>
        </div>
      </div>

      <!-- FINAL SCORE OVERLAY -->
      <div id="end" class="video-overlay hidden">
        <div style="text-align:center;">
          <div style="color:#facc15;font-size:20px;font-weight:900;letter-spacing:0.06em;">SCORE</div>
          <div id="finalScoreNum" style="color:#ffffff;font-size:52px;font-weight:900;line-height:1.05;">0</div>
          <p id="summary" style="color:#f8fafc;font-size:14px;font-weight:800;margin:8px 0 20px;">YOU EARNED: 0 🪙</p>
        </div>
        <div class="video-blue-squares">
          <button type="button" class="v-sq-item" id="garage">
            <div class="v-sq-icon">🏠</div>
            <span class="v-sq-label">MENU</span>
          </button>
          <button type="button" class="v-sq-item" id="scoresBtn">
            <div class="v-sq-icon">👑</div>
            <span class="v-sq-label">SCORES</span>
          </button>
          <button type="button" class="v-sq-item" id="retry">
            <div class="v-sq-icon">↻</div>
            <span class="v-sq-label">RESTART</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="agera_3d_data.js"></script>
  <script src="vehicles.js"></script>
  <script src="maps.js"></script>
  <script src="main.js"></script>
  <script src="game.js"></script>
</body>
</html>
