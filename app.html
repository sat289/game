<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ST Games - Arcade Launcher</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Fredoka & Inter for Arcade / Casual look -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Fredoka', 'Inter', sans-serif;
            background-color: #e0f2fe;
            color: #1e293b;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        /* Custom scrollbar hiding */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Arcade Button Glow */
        .arcade-btn {
            background: linear-gradient(180deg, #4ade80 0%, #16a34a 100%);
            box-shadow: 0 6px 0 #15803d, 0 10px 15px rgba(22, 163, 74, 0.4);
            transition: all 0.1s ease;
        }
        .arcade-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #15803d, 0 5px 8px rgba(22, 163, 74, 0.4);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col pb-28">

    <!-- Offline Status Banner -->
    <div id="offline-banner" class="bg-red-500 text-white text-xs font-bold text-center py-1 px-4 hidden sticky top-0 z-50 shadow-md">
        <i class="fa-solid fa-triangle-exclamation mr-1"></i> Offline Mode: Showing Downloaded Games Only
    </div>

    <!-- App Header & Mode Switcher -->
    <header class="bg-white/80 backdrop-blur-md px-4 py-3 sticky top-0 z-40 border-b border-sky-100 shadow-sm">
        <div class="flex items-center justify-between mb-3">
            <div class="flex items-center space-x-2">
                <div class="bg-gradient-to-tr from-sky-400 to-indigo-500 text-white p-2 rounded-xl shadow-md">
                    <i class="fa-solid fa-gamepad text-lg"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-sky-900 leading-tight">ST Games</h1>
                    <p class="text-xs text-sky-600 font-semibold" id="connection-status-text">Online Cloud Hub</p>
                </div>
            </div>

            <!-- Online / Offline App Mode Buttons -->
            <div class="bg-sky-100 p-1 rounded-full flex items-center shadow-inner">
                <button id="mode-online-btn" onclick="switchAppMode('online')" class="px-3 py-1 text-xs font-bold rounded-full bg-sky-500 text-white shadow-sm transition-all">
                    Online
                </button>
                <button id="mode-offline-btn" onclick="switchAppMode('offline')" class="px-3 py-1 text-xs font-bold rounded-full text-sky-700 transition-all">
                    Offline
                </button>
            </div>
        </div>

        <!-- Category Filter Pills -->
        <div class="flex space-x-2 overflow-x-auto no-scrollbar pb-1">
            <button onclick="filterCategory('All', this)" class="cat-pill px-5 py-2 rounded-full text-sm font-bold bg-sky-500 text-white shadow-md shadow-sky-200 whitespace-nowrap transition-all">All</button>
            <button onclick="filterCategory('Casual', this)" class="cat-pill px-5 py-2 rounded-full text-sm font-bold bg-white text-sky-700 border-2 border-sky-100 whitespace-nowrap transition-all">Casual</button>
            <button onclick="filterCategory('Antistress', this)" class="cat-pill px-5 py-2 rounded-full text-sm font-bold bg-white text-sky-700 border-2 border-sky-100 whitespace-nowrap transition-all">Antistress</button>
            <button onclick="filterCategory('Challenge', this)" class="cat-pill px-5 py-2 rounded-full text-sm font-bold bg-white text-sky-700 border-2 border-sky-100 whitespace-nowrap transition-all">Challenge</button>
        </div>
    </header>

    <!-- Main Game Cards Grid Container -->
    <main class="flex-1 p-4 max-w-md mx-auto w-full">
        <div id="game-grid" class="grid grid-cols-2 gap-4">
            <!-- Dynamically populated game cards -->
        </div>
    </main>

    <!-- Sticky Bottom Navigation Bar matching screenshot design -->
    <nav class="fixed bottom-0 left-0 right-0 bg-sky-100/90 backdrop-blur-lg border-t border-sky-200 px-6 py-3 flex items-center justify-between z-40 max-w-md mx-auto shadow-2xl">
        <!-- Left Ads / Reward Button -->
        <button onclick="openAdsModal()" class="w-12 h-12 rounded-full bg-amber-400 border-2 border-white shadow-lg flex items-center justify-center text-amber-900 font-extrabold text-sm hover:scale-105 active:scale-95 transition-transform">
            ADS
        </button>

        <!-- Center Prominent Green Play Button -->
        <button onclick="launchRandomGame()" class="arcade-btn px-8 py-3 rounded-full text-white font-extrabold text-xl tracking-wider flex items-center justify-center space-x-2 border-2 border-green-300">
            <span>PLAY</span>
            <i class="fa-solid fa-play text-sm"></i>
        </button>

        <!-- Right Settings Gear Button -->
        <button onclick="openSettingsModal()" class="w-12 h-12 rounded-full bg-sky-400 border-2 border-white shadow-lg flex items-center justify-center text-white text-lg hover:rotate-90 transition-transform duration-300">
            <i class="fa-solid fa-gear"></i>
        </button>
    </nav>

    <!-- Modal Notification / Game Launch Dialog -->
    <div id="game-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl text-center border-4 border-sky-300 animate-bounce-in">
            <div id="modal-game-icon" class="w-20 h-20 mx-auto mb-3 rounded-2xl bg-sky-100 flex items-center justify-center text-3xl text-sky-500 shadow-inner">
                🎮
            </div>
            <h3 id="modal-title" class="text-xl font-bold text-sky-900 mb-1">Game Title</h3>
            <p id="modal-desc" class="text-xs text-slate-500 mb-5">Downloading game assets for offline playback...</p>
            
            <div class="flex space-x-3">
                <button onclick="closeModal()" class="flex-1 py-3 bg-slate-200 font-bold text-slate-700 rounded-2xl active:scale-95 transition-all">Cancel</button>
                <button id="modal-play-btn" onclick="executePlayGame()" class="flex-1 py-3 bg-green-500 font-bold text-white rounded-2xl shadow-lg shadow-green-200 active:scale-95 transition-all">Start Game</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Game Launcher Logic & Caching -->
    <script>
        // Game Catalog mimicking the requested screenshot layout & style
        const gamesDatabase = [
            { id: 'restroom', title: 'FIND RESTROOM', category: 'Casual', tag: 'NEW!', bg: 'bg-sky-50', border: 'border-sky-300', icon: '🏃‍♂️', url: '#' },
            { id: 'parking', title: 'MARKED PARKING', category: 'Challenge', tag: '', bg: 'bg-emerald-50', border: 'border-emerald-300', icon: '🚗', url: '#' },
            { id: 'shoot', title: 'SHOOT', category: 'Challenge', tag: '', bg: 'bg-lime-50', border: 'border-lime-300', icon: '🚀', url: '#' },
            { id: 'thief', title: 'Catch The Thief', category: 'Casual', tag: '', bg: 'bg-cyan-50', border: 'border-cyan-300', icon: '🕵️‍♂️', url: '#' },
            { id: 'fruit', title: 'FRUIT MERGE', category: 'Antistress', tag: '', bg: 'bg-amber-50', border: 'border-amber-300', icon: '🍉', url: '#' },
            { id: 'dog', title: 'CRAZY DOG', category: 'Antistress', tag: '', bg: 'bg-yellow-50', border: 'border-yellow-300', icon: '🐶', url: '#' },
            { id: 'bulb', title: 'LIGHT BULB', category: 'Challenge', tag: '', bg: 'bg-indigo-50', border: 'border-indigo-300', icon: '💡', url: '#' },
            { id: 'glass', title: 'HAPPY GLASS', category: 'Casual', tag: '', bg: 'bg-orange-50', border: 'border-orange-300', icon: '🥛', url: '#' }
        ];

        let currentCategory = 'All';
        let currentAppMode = 'online';
        let selectedGameToPlay = null;
        let cachedGameIds = JSON.parse(localStorage.getItem('st_cached_games') || '[]');

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            renderGames();
            window.addEventListener('online', updateNetworkStatus);
            window.addEventListener('offline', updateNetworkStatus);
            updateNetworkStatus();
        });

        function updateNetworkStatus() {
            const banner = document.getElementById('offline-banner');
            const statusText = document.getElementById('connection-status-text');
            if (!navigator.onLine) {
                banner.classList.remove('hidden');
                statusText.innerText = "Offline Mode Active";
                switchAppMode('offline');
            } else {
                banner.classList.add('hidden');
                statusText.innerText = "Online Cloud Hub";
            }
        }

        function switchAppMode(mode) {
            currentAppMode = mode;
            const onlineBtn = document.getElementById('mode-online-btn');
            const offlineBtn = document.getElementById('mode-offline-btn');

            if (mode === 'online') {
                onlineBtn.className = "px-3 py-1 text-xs font-bold rounded-full bg-sky-500 text-white shadow-sm transition-all";
                offlineBtn.className = "px-3 py-1 text-xs font-bold rounded-full text-sky-700 transition-all";
            } else {
                offlineBtn.className = "px-3 py-1 text-xs font-bold rounded-full bg-sky-500 text-white shadow-sm transition-all";
                onlineBtn.className = "px-3 py-1 text-xs font-bold rounded-full text-sky-700 transition-all";
            }
            renderGames();
        }

        function filterCategory(category, btnElement) {
            currentCategory = category;
            document.querySelectorAll('.cat-pill').forEach(btn => {
                btn.className = "cat-pill px-5 py-2 rounded-full text-sm font-bold bg-white text-sky-700 border-2 border-sky-100 whitespace-nowrap transition-all";
            });
            btnElement.className = "cat-pill px-5 py-2 rounded-full text-sm font-bold bg-sky-500 text-white shadow-md shadow-sky-200 whitespace-nowrap transition-all";
            renderGames();
        }

        function renderGames() {
            const grid = document.getElementById('game-grid');
            grid.innerHTML = '';

            let filtered = gamesDatabase.filter(game => {
                let matchesCat = (currentCategory === 'All' || game.category === currentCategory);
                let matchesMode = true;
                if (currentAppMode === 'offline') {
                    matchesMode = cachedGameIds.includes(game.id);
                }
                return matchesCat && matchesMode;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-2 text-center py-12">
                        <div class="text-4xl mb-2">📦</div>
                        <p class="text-sm font-bold text-sky-800">No games found here!</p>
                        <p class="text-xs text-sky-600 mt-1">Switch to Online mode or download games first.</p>
                    </div>
                `;
                return;
            }

            filtered.forEach(game => {
                let isDownloaded = cachedGameIds.includes(game.id);
                grid.innerHTML += `
                    <div onclick="promptPlayGame('${game.id}')" class="${game.bg} border-2 ${game.border} rounded-3xl p-3 shadow-md active:scale-95 transition-transform cursor-pointer relative flex flex-col justify-between h-44">
                        ${game.tag ? `<span class="absolute top-3 left-3 bg-green-500 text-white font-extrabold text-[10px] px-2 py-0.5 rounded-full shadow">${game.tag}</span>` : ''}
                        
                        <!-- Game Icon Graphic Representation -->
                        <div class="flex-1 flex items-center justify-center text-5xl my-2">
                            ${game.icon}
                        </div>

                        <!-- Game Label & Offline Badge -->
                        <div class="bg-white/80 backdrop-blur-sm rounded-2xl p-2 border border-sky-100 flex items-center justify-between">
                            <h2 class="text-xs font-bold text-sky-900 truncate">${game.title}</h2>
                            <span class="text-[10px] font-bold px-1.5 py-0.5 rounded ${isDownloaded ? 'bg-green-100 text-green-700' : 'bg-sky-100 text-sky-700'}">
                                ${isDownloaded ? '💾 Ready' : '🌐 Cloud'}
                            </span>
                        </div>
                    </div>
                `;
            });
        }

        function promptPlayGame(gameId) {
            selectedGameToPlay = gamesDatabase.find(g => g.id === gameId);
            const modal = document.getElementById('game-modal');
            const titleEl = document.getElementById('modal-title');
            const descEl = document.getElementById('modal-desc');
            const iconEl = document.getElementById('modal-game-icon');

            titleEl.innerText = selectedGameToPlay.title;
            iconEl.innerText = selectedGameToPlay.icon;

            if (!cachedGameIds.includes(gameId)) {
                descEl.innerText = "First-time launch: Downloading game assets for offline gameplay...";
            } else {
                descEl.innerText = "Game is cached locally. Launching instantly offline!";
            }

            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('game-modal').classList.add('hidden');
            selectedGameToPlay = null;
        }

        function executePlayGame() {
            if (selectedGameToPlay && !cachedGameIds.includes(selectedGameToPlay.id)) {
                cachedGameIds.push(selectedGameToPlay.id);
                localStorage.setItem('st_cached_games', JSON.stringify(cachedGameIds));
            }
            closeModal();
            renderGames();
        }

        function launchRandomGame() {
            if (gamesDatabase.length > 0) {
                const randomGame = gamesDatabase[Math.floor(Math.random() * gamesDatabase.length)];
                promptPlayGame(randomGame.id);
            }
        }

        function openAdsModal() {
            alert("Reward Ad: Watch to unlock bonus coins & premium offline levels!");
        }

        function openSettingsModal() {
            alert("ST Games Launcher v1.0.0\nBuilt for Offline-First Arcade Experience.");
        }
    </script>
</body>
</html>
