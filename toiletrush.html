<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Toilet Rush - 50 Levels</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="game-wrap">
  <!-- Top Header UI -->
  <div class="top-bar">
    <div class="home-btn" onclick="window.location.href='levels.html'" title="Select Level">🏠</div>
    <div class="more-badge" onclick="window.location.href='levels.html'">🎮<br>MORE</div>
  </div>

  <!-- Status Bar (Timer & Level) -->
  <div class="status-bar">
    <div class="timer-wrap">⏰ <span id="time-val">30s</span></div>
    <div class="level-wrap">Level: <span id="lvl-val">1</span></div>
  </div>

  <!-- Main Game Canvas -->
  <canvas id="canvas" width="390" height="780"></canvas>

  <!-- Hint Button -->
  <button class="hint-btn" onclick="toggleHint()">HINT 📺</button>

  <!-- Win / Fail Overlay Modal -->
  <div class="modal" id="modal">
    <div class="modal-home" onclick="window.location.href='levels.html'">🏠</div>
    <div class="trophy-box">
      <div class="trophy-emoji" id="m-icon">🏆</div>
      <div class="banner win" id="m-banner">YOU WIN</div>
    </div>
    <button class="green-btn" id="m-btn" onclick="handleModalBtn()">» NEXT</button>
  </div>
</div>

<script src="levels.js"></script>
<script src="script.js"></script>
</body>
</html>
