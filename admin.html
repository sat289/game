<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ST Games - Advanced Admin Studio</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --poki-cyan: #32ffdc;
      --poki-teal: #1db9aa;
      --poki-bg-dark: #07222d;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #4ef2e2 0%, #17c3b2 50%, #0d9488 100%);
      background-attachment: fixed;
      overflow-x: hidden;
      transition: background 0.5s ease, color 0.35s ease;
      position: relative;
      padding-bottom: calc(86px + env(safe-area-inset-bottom, 0px));
      color: #0f172a;
    }

    body.dark-theme {
      background: linear-gradient(135deg, #092c35 0%, #061820 50%, #040e14 100%);
      color: #f8fafc;
    }

    .brand-font { font-family: 'Fredoka', sans-serif; }
    .code-font { font-family: 'JetBrains Mono', monospace; }

    .feature-hub {
      border: 1px solid rgba(50, 255, 220, 0.3);
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 28px rgba(7, 34, 45, 0.15), 0 0 20px rgba(50, 255, 220, 0.1);
    }

    body.dark-theme .feature-hub {
      background: rgba(8, 22, 30, 0.94) !important;
      color: #eaf7ff;
      border-color: rgba(50, 255, 220, 0.3);
    }

    .neon-input {
      width: 100%;
      border: 1px solid rgba(13, 148, 136, 0.35);
      background: rgba(240, 253, 250, 0.92);
      color: #0f172a;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 12px;
      font-weight: 600;
      outline: none;
    }

    .neon-input:focus {
      border-color: #17c3b2;
      box-shadow: 0 0 0 3px rgba(50, 255, 220, 0.25);
    }

    body.dark-theme .neon-input {
      background: #061820;
      color: #f8fafc;
      border-color: rgba(50, 255, 220, 0.3);
    }

    .neon-action {
      border: 1px solid rgba(50, 255, 220, 0.5);
      border-radius: 12px; padding: 10px 16px;
      background: linear-gradient(120deg, #0d9488, #0f766e);
      color: white; font-size: 12px; font-weight: 800;
      box-shadow: 0 0 16px rgba(50, 255, 220, 0.2);
      transition: all 0.2s ease; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    .neon-action:hover:not(:disabled) { box-shadow: 0 0 24px rgba(50, 255, 220, 0.4); transform: translateY(-1px); }

    /* Bottom Navigation Bar */
    .st-bottom-nav {
      position: fixed; z-index: 9999; left: 0; right: 0; bottom: 0;
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px;
      padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px));
      background: rgba(7, 34, 45, 0.96); backdrop-filter: blur(12px); border-top: 1px solid rgba(50, 255, 220, 0.3);
      box-shadow: 0 -5px 25px rgba(0, 0, 0, 0.4);
    }
    .st-bottom-nav a {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 3px; padding: 6px 2px; border-radius: 12px; color: #94a3b8; text-decoration: none; font-size: 11px; font-weight: 700;
    }
    .st-bottom-nav .nav-icon { font-size: 20px; color: #32ffdc; }
    .st-bottom-nav a:hover, .st-bottom-nav a.active { color: #fff; background: rgba(50, 255, 220, 0.15); }
    @media (min-width: 768px) {
      .st-bottom-nav { left: 50%; transform: translateX(-50%); width: min(500px, calc(100% - 32px)); border-radius: 18px 18px 0 0; }
    }
  </style>
</head>

<body class="min-h-screen flex flex-col justify-between">

  <!-- PASSWORD GATE -->
  <div id="passwordModal" class="fixed inset-0 z-[99999] bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4">
    <div class="feature-hub max-w-sm w-full p-6 rounded-3xl text-center shadow-2xl border border-[#32ffdc]/50">
      <div class="w-14 h-14 mx-auto mb-3 rounded-2xl bg-gradient-to-tr from-teal-500 to-cyan-400 text-slate-950 flex items-center justify-center text-2xl font-black shadow-lg">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h2 class="brand-font text-lg font-bold text-[#07222d] dark:text-[#32ffdc] mb-1">Admin Studio Access</h2>
      <p class="text-[11px] text-slate-500 mb-4">Enter security passcode</p>
      
      <div class="relative flex items-center mb-4">
        <input id="passcodeInput" type="password" class="neon-input pr-12 text-center text-lg tracking-widest font-mono" placeholder="•••••••" autofocus onkeydown="if(event.key==='Enter') verifyAdminPassword()">
        <button type="button" onclick="togglePasscodeVisibility()" class="absolute right-3 text-lg" title="Toggle visibility">🙈</button>
      </div>

      <button type="button" onclick="verifyAdminPassword()" class="neon-action w-full py-2.5">
        <i class="fa-solid fa-key mr-1"></i> Unlock Admin Console
      </button>
    </div>
  </div>

  <main class="max-w-4xl w-full mx-auto px-3.5 sm:px-6 pt-4 pb-12 relative z-10">
    <header class="feature-hub rounded-2xl p-4 mb-5 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="index.html" class="w-10 h-10 rounded-xl bg-[#07222d] flex items-center justify-center text-[#32ffdc] hover:scale-105 transition shadow">
          <i class="fa-solid fa-arrow-left"></i>
        </a>
        <div>
          <h1 class="brand-font text-base sm:text-lg font-bold uppercase text-[#07222d] dark:text-white flex items-center gap-2">
            <i class="fa-solid fa-shield-halved text-[#17c3b2]"></i> Advanced Admin Studio
          </h1>
          <p class="text-[11px] text-slate-500">Global sync, notice manager &amp; game publisher</p>
        </div>
      </div>
      <button onclick="toggleTheme()" class="w-9 h-9 rounded-xl border border-[#17c3b2]/40 flex items-center justify-center text-lg">🌓</button>
    </header>

    <!-- GITHUB CONFIGURATION -->
    <section class="feature-hub rounded-2xl p-4 sm:p-5 mb-5">
      <h2 class="brand-font text-base font-bold text-[#07222d] dark:text-[#32ffdc] mb-3">1. GitHub Credentials</h2>
      <div class="grid sm:grid-cols-4 gap-3 mb-3">
        <div><label class="block text-[10px] font-extrabold uppercase text-teal-600 mb-1">Username</label><input id="ghOwner" class="neon-input" value="sat289"></div>
        <div><label class="block text-[10px] font-extrabold uppercase text-teal-600 mb-1">Repository</label><input id="ghRepo" class="neon-input" value="game"></div>
        <div><label class="block text-[10px] font-extrabold uppercase text-teal-600 mb-1">Branch</label><input id="ghBranch" class="neon-input" value="main"></div>
        <div><label class="block text-[10px] font-extrabold uppercase text-teal-600 mb-1">Personal Token</label><input id="ghToken" type="password" class="neon-input" value="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"></div>
      </div>
      <button type="button" onclick="saveGitHubCreds()" class="neon-action"><i class="fa-solid fa-floppy-disk mr-1"></i> Save Credentials</button>
    </section>

    <!-- NOTICE MANAGER -->
    <section class="feature-hub rounded-2xl p-4 sm:p-5 mb-5">
      <h2 class="brand-font text-base font-bold text-[#07222d] dark:text-[#32ffdc] mb-3">2. Announcement Notice Manager</h2>
      <textarea id="noticeInput" class="neon-input font-semibold mb-3" rows="2">📢 NOTICE: Welcome to ST GAMES — Enjoy playing and check back for new games and updates!</textarea>
      <button type="button" onclick="publishNotice()" class="neon-action !bg-gradient-to-r !from-amber-600 !to-orange-600"><i class="fa-solid fa-paper-plane mr-1"></i> Update Notice on All Phones</button>
    </section>

    <!-- ADD GAME PUBLISHER -->
    <section class="feature-hub rounded-2xl p-5 mb-5">
      <h2 class="brand-font text-base font-bold text-[#07222d] dark:text-[#32ffdc] mb-3">3. Add &amp; Publish Game to All Phones</h2>
      <form id="addGameForm" onsubmit="handleAddGame(event)" class="space-y-3">
        <div class="grid sm:grid-cols-2 gap-3">
          <div><label class="block text-[11px] font-bold text-teal-600 mb-1">Game Title *</label><input id="gameTitle" required class="neon-input" placeholder="e.g., Pixel Dunker" /></div>
          <div><label class="block text-[11px] font-bold text-teal-600 mb-1">Game URL Path *</label><input id="gamePath" required class="neon-input" placeholder="e.g., game/dunk/index.html" /></div>
        </div>
        <div class="grid sm:grid-cols-3 gap-3">
          <div><label class="block text-[11px] font-bold text-teal-600 mb-1">Upload Logo File</label><input id="logoFile" type="file" accept="image/*" onchange="handleLogoUpload(event)" class="neon-input text-[10px]"></div>
          <div><label class="block text-[11px] font-bold text-teal-600 mb-1">Category</label><select id="gameCategory" class="neon-input"><option value="popular">Popular / Hot</option><option value="1v1">1v1 Battle</option><option value="classic">Classic</option><option value="racing">Racing</option></select></div>
          <div><label class="block text-[11px] font-bold text-teal-600 mb-1">Bento Box Size</label><select id="gameSize" class="neon-input"><option value="normal">Normal Square</option><option value="large">Large Bento Box (2x2)</option></select></div>
        </div>
        <div class="flex justify-end pt-2">
          <button type="submit" class="neon-action !bg-gradient-to-r !from-emerald-600 !to-teal-600"><i class="fa-solid fa-cloud-arrow-up mr-1"></i> Publish Game to All Phones</button>
        </div>
      </form>
    </section>
  </main>

  <nav class="st-bottom-nav" aria-label="ST GAMES navigation">
    <a href="index.html"><span class="nav-icon">⌂</span><span>Home</span></a>
    <a href="login.html"><span class="nav-icon"><i class="fa-regular fa-circle-user"></i></span><span>Login</span></a>
    <a href="achievements.html"><span class="nav-icon">🏆</span><span>Achievements</span></a>
  </nav>

  <script>
    function verifyAdminPassword() {
      if (document.getElementById('passcodeInput').value.trim() === '2010143') {
        document.getElementById('passwordModal').classList.add('hidden');
        localStorage.setItem('st_admin_unlocked', 'true');
      } else {
        alert('Incorrect passcode');
        document.getElementById('passcodeInput').value = '';
      }
    }
    function togglePasscodeVisibility() {
      const i = document.getElementById('passcodeInput');
      i.type = i.type === 'password' ? 'text' : 'password';
    }

    function getCreds() {
      return {
        owner: document.getElementById('ghOwner').value.trim(),
        repo: document.getElementById('ghRepo').value.trim(),
        branch: document.getElementById('ghBranch').value.trim() || 'main',
        token: document.getElementById('ghToken').value.trim()
      };
    }
    function saveGitHubCreds() {
      localStorage.setItem('st_github_config', JSON.stringify(getCreds()));
      alert('GitHub credentials saved!');
    }

    function utf8ToBase64(str) {
      const bytes = new TextEncoder().encode(str);
      let binary = '';
      for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
      return btoa(binary);
    }

    let uploadedLogoBase64 = '';
    function handleLogoUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => { uploadedLogoBase64 = evt.target.result; };
      reader.readAsDataURL(file);
    }

    async function pushFileDirect(path, content, message) {
      const c = getCreds();
      const apiUrl = `https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/contents/${path}`;
      let sha = null;
      const checkRes = await fetch(`${apiUrl}?ref=${encodeURIComponent(c.branch)}`, {
        headers: { 'Authorization': `Bearer ${c.token}`, 'Accept': 'application/vnd.github+json' }
      });
      if (checkRes.ok) {
        const d = await checkRes.json();
        sha = d.sha;
      }
      const res = await fetch(apiUrl, {
        method: 'PUT',
        headers: { 'Authorization': `Bearer ${c.token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, content: utf8ToBase64(content), branch: c.branch, sha })
      });
      if (!res.ok) throw new Error('Failed to push to GitHub');
    }

    async function publishNotice() {
      const txt = document.getElementById('noticeInput').value.trim();
      try {
        await pushFileDirect('notice.txt', txt, 'Update website notice');
        alert('Notice updated across all phones!');
      } catch (err) {
        alert('Error updating notice: ' + err.message);
      }
    }

    async function handleAddGame(e) {
      e.preventDefault();
      const title = document.getElementById('gameTitle').value.trim();
      const url = document.getElementById('gamePath').value.trim();
      const logo = uploadedLogoBase64 || 'logo/game.jpg';
      const category = document.getElementById('gameCategory').value;
      const size = document.getElementById('gameSize').value;

      let custom = [];
      try {
        const c = getCreds();
        const res = await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/contents/games.json?ref=${c.branch}`, {
          headers: { 'Authorization': `Bearer ${c.token}` }
        });
        if (res.ok) {
          const d = await res.json();
          custom = JSON.parse(atob(d.content.replace(/\s/g, '')));
        }
      } catch(_) {}

      const newGame = {
        id: 'custom-' + Date.now().toString(36),
        title, url, logo, size,
        categories: [category, 'popular'],
        badge: '✨ NEW'
      };

      custom.push(newGame);
      document.getElementById('addGameForm').reset();
      uploadedLogoBase64 = '';

      try {
        await pushFileDirect('games.json', JSON.stringify(custom, null, 2), `Add game "${title}" globally`);
        alert('Game published to all phones successfully!');
      } catch (err) {
        alert('Sync failed: ' + err.message);
      }
    }

    function toggleTheme() {
      const isDark = !document.body.classList.contains('dark-theme');
      document.body.classList.toggle('dark-theme', isDark);
      localStorage.setItem('st_theme', isDark ? 'dark' : 'light');
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('st_theme') === 'dark') document.body.classList.add('dark-theme');
      if (localStorage.getItem('st_admin_unlocked') === 'true') {
        document.getElementById('passwordModal').classList.add('hidden');
      }
      const s = JSON.parse(localStorage.getItem('st_github_config') || '{}');
      if (s.owner) document.getElementById('ghOwner').value = s.owner;
      if (s.repo) document.getElementById('ghRepo').value = s.repo;
      if (s.branch) document.getElementById('ghBranch').value = s.branch;
      if (s.token) document.getElementById('ghToken').value = s.token;
    });
  </script>
</body>
</html>
