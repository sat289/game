
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ST Games Reward Ad</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;
  background:#000;overflow:hidden;
}
video{
  width:100%;height:100%;
  object-fit:contain;
}
#status{
  position:absolute;bottom:20px;width:100%;
  text-align:center;color:white;
  font:15px Arial;
}
</style>
</head>
<body>

<video id="adVideo" autoplay playsinline>
  <source src="ad.mp4" type="video/mp4">
</video>

<div id="status">ST GAMES • Advertisement</div>

<script>
(() => {
  const video = document.getElementById("adVideo");
  const params = new URLSearchParams(location.search);
  const returnTo = params.get("returnTo");
  let completed = false;

  video.addEventListener("ended", () => {
    if (completed) return;
    completed = true;

    if (returnTo) {
      try {
        const destination = new URL(returnTo, location.href);
        if (destination.origin === location.origin) {
          location.replace(destination.href);
          return;
        }
      } catch (error) {}
    }

    document.getElementById("status").textContent =
      "Advertisement completed";
  });

  video.play().catch(() => {
    video.muted = true;
    video.play().catch(() => {
      document.getElementById("status").textContent =
        "Tap your browser's play control to start the ad.";
    });
  });
})();
</script>

</body>
</html>
