<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer-when-downgrade" />
    <meta name="color-scheme" content="dark">
    <title>Reward Ad</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: #0d0617 !important;
            color: #ffffff;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }
        #ad-stage {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: #0d0617;
        }
        video, iframe {
            width: 100% !important;
            height: 100% !important;
            max-width: 100% !important;
            max-height: 100% !important;
            object-fit: contain;
            border: none;
            background: #0d0617;
        }
    </style>
</head>
<body>

    <div id="ad-stage">
        <!-- HilltopAds Script -->
        <script>
        (function(mkh){
        var d = document,
            s = d.createElement('script'),
            l = d.currentScript || d.scripts[d.scripts.length - 1];
        s.settings = mkh || {};
        s.src = "https://prizefamily.com/b_XxVds.d/G/lN0LYdW/cC/Le/mf9/u/ZYUzljkOPVTzcn2NM/jbcg0pMATOMUtUNRz/YBy/NDzaQFxbN/wl";
        s.async = true;
        s.referrerPolicy = 'no-referrer-when-downgrade';
        s.onerror = function() {
            window.parent.postMessage({ type: 'AD_FAILED' }, '*');
        };
        l.parentNode.insertBefore(s, l);
        })({});
        </script>
    </div>

    <script>
        let adStartedSent = false;

        function notifyAdStarted() {
            if (adStartedSent) return;
            adStartedSent = true;
            window.parent.postMessage({ type: 'AD_STARTED' }, '*');

            // Unlock reward after 5 seconds of watching
            setTimeout(() => {
                window.parent.postMessage({ type: 'AD_REWARD_READY' }, '*');
            }, 5000);
        }

        // Check every 250ms if a visible video or visible ad iframe has actually rendered
        const checkInterval = setInterval(() => {
            const video = document.querySelector('video');
            const iframe = document.querySelector('iframe');

            if (video && (video.readyState >= 2 || !video.paused || video.offsetWidth > 50)) {
                clearInterval(checkInterval);
                notifyAdStarted();
                video.onended = () => {
                    window.parent.postMessage({ type: 'AD_COMPLETED' }, '*');
                };
            } else if (iframe && iframe.offsetWidth > 50 && iframe.offsetHeight > 50) {
                clearInterval(checkInterval);
                notifyAdStarted();
            }
        }, 250);
    </script>
</body>
</html>
