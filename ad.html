<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer-when-downgrade" />
    <meta name="color-scheme" content="dark">
    <title>Reward Ad</title>
    <!-- Fluid Player for VAST Video Ads -->
    <script src="https://cdn.fluidplayer.com/v3/current/fluidplayer.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: #0d0617 !important;
            color: #ffffff;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }
        #ad-stage {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: #0d0617;
        }
        video, iframe, .fluid_video_wrapper {
            width: 100% !important;
            height: 100% !important;
            max-width: 100% !important;
            max-height: 100% !important;
            object-fit: contain;
            border: none;
            background: #0d0617 !important;
        }
    </style>
</head>
<body>

    <div id="ad-stage">
        <!-- HilltopAds Script -->
        <script>
        (function(mkh){
        var d = document,
            s = d.createElement('script'),
            l = d.currentScript || d.scripts[d.scripts.length - 1];
        s.settings = mkh || {};
        s.src = "https://prizefamily.com/b_XxVds.d/G/lN0LYdW/cC/Le/mf9/u/ZYUzljkOPVTzcn2NM/jbcg0pMATOMUtUNRz/YBy/NDzaQFxbN/wl";
        s.async = true;
        s.referrerPolicy = 'no-referrer-when-downgrade';
        s.onerror = function() {
            window.parent.postMessage({ type: 'AD_FAILED' }, '*');
        };
        l.parentNode.insertBefore(s, l);
        })({});
        </script>
    </div>

    <script>
        let adStartedSent = false;

        function notifyAdStarted() {
            if (adStartedSent) return;
            adStartedSent = true;
            window.parent.postMessage({ type: 'AD_STARTED' }, '*');

            // Unlock reward after 5 seconds of actual video playback
            setTimeout(() => {
                window.parent.postMessage({ type: 'AD_REWARD_READY' }, '*');
            }, 5000);
        }

        // STRICT CHECK: Only trigger AD_STARTED when a <video> is actually playing frames (currentTime > 0.1)
        const checkInterval = setInterval(() => {
            const videos = document.querySelectorAll('video');
            videos.forEach((video) => {
                // Ensure muted autoplay is allowed on mobile Chrome
                if (video.paused && video.readyState >= 2) {
                    video.muted = true;
                    video.play().catch(() => {});
                }

                if (!video.paused && video.currentTime > 0.1 && video.videoWidth > 0) {
                    clearInterval(checkInterval);
                    notifyAdStarted();

                    video.onended = () => {
                        window.parent.postMessage({ type: 'AD_COMPLETED' }, '*');
                    };
                }
            });
        }, 200);
    </script>
</body>
</html>
