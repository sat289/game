<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer-when-downgrade" />
    <meta name="color-scheme" content="dark">
    <title>Reward Ad</title>
    <!-- Fluid Player CSS & JS for VAST Video Ads -->
    <link rel="stylesheet" href="https://cdn.fluidplayer.com/v3/current/fluidplayer.min.css" />
    <script src="https://cdn.fluidplayer.com/v3/current/fluidplayer.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: #0d0617 !important;
            color: #ffffff;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }
        #ad-stage {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: #0d0617;
        }
        #vast-video,
        .fluid_video_wrapper {
            width: 100% !important;
            height: 100% !important;
            max-width: 100% !important;
            max-height: 100% !important;
            background: #0d0617 !important;
        }
        video {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain !important;
            background: #0d0617 !important;
        }
    </style>
</head>
<body>

    <div id="ad-stage">
        <!-- HTML5 Video Element for HilltopAds VAST (#7627405) -->
        <video id="vast-video" playsinline muted autoplay>
            <!-- Short silent dark fallback clip so FluidPlayer can trigger preRoll VAST immediately -->
            <source src="https://cdn.fluidplayer.com/videos/valerian-1080p.mkv" type="video/mp4" />
        </video>
    </div>

    <script>
        // Your exact VAST URL from HilltopAds Zone #7627405 (shown at 00:05 in your video)
        const HILLTOP_VAST_URL = "https://enchantingloss.com/d.m/F/zNd.G/N/v/Z~G5U/v/eJm3HTu9ZUbI/lkgPETHcY/2cN/j_c/01N/z/Y9xV/j/c/2mW9/1/Q5";

        let adStartedSent = false;
        let adCompletedSent = false;

        function notifyAdStarted() {
            if (adStartedSent) return;
            adStartedSent = true;
            window.parent.postMessage({ type: 'AD_STARTED' }, '*');

            // Unlock reward after 5 seconds of watching
            setTimeout(() => {
                window.parent.postMessage({ type: 'AD_REWARD_READY' }, '*');
            }, 5000);
        }

        function notifyAdCompleted() {
            if (adCompletedSent) return;
            adCompletedSent = true;
            window.parent.postMessage({ type: 'AD_COMPLETED' }, '*');
        }

        function notifyAdFailed() {
            if (!adStartedSent) {
                window.parent.postMessage({ type: 'AD_FAILED' }, '*');
            }
        }

        // Initialize FluidPlayer with your HilltopAds VAST Pre-Roll
        try {
            const player = fluidPlayer('vast-video', {
                layoutControls: {
                    fillToContainer: true,
                    autoPlay: true,
                    mute: true,
                    allowTheatre: false,
                    playButtonShowing: true,
                    controlBar: {
                        autoHide: true
                    }
                },
                vastOptions: {
                    allowVPAID: true,
                    adList: [
                        {
                            roll: 'preRoll',
                            vastTag: HILLTOP_VAST_URL
                        }
                    ],
                    vastAdvanced: {
                        vastLoadedCallback: function() {
                            notifyAdStarted();
                        },
                        noVastVideoCallback: function() {
                            // No VAST ad fill available right now
                            notifyAdFailed();
                        },
                        vastVideoSkippedCallback: function() {
                            notifyAdCompleted();
                        },
                        vastVideoEndedCallback: function() {
                            notifyAdCompleted();
                        }
                    }
                }
            });
        } catch (err) {
            console.error("VAST Player error:", err);
            notifyAdFailed();
        }
    </script>
</body>
</html>
