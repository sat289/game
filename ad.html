<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer-when-downgrade" />
    <meta name="color-scheme" content="dark">
    <title>Reward Ad</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: #0d0617 !important;
            color: #ffffff;
            overflow: hidden;
            position: relative;
        }
        #ad-stage {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #0d0617;
        }
        /* Keep all injected Monetag Vignettes, In-Page Push & iframes fitted inside the box */
        iframe, video, img, #ad-stage > div {
            max-width: 100% !important;
            max-height: 100% !important;
            object-fit: contain !important;
        }
        #ad-timer-pill {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(13, 6, 23, 0.92);
            border: 1.5px solid #ffd43b;
            color: #ffd43b;
            font-size: 0.82rem;
            font-weight: 800;
            padding: 5px 14px;
            border-radius: 999px;
            z-index: 2147483647;
            display: none;
            white-space: nowrap;
            box-shadow: 0 0 12px rgba(255, 212, 59, 0.5);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="ad-stage"></div>
    <div id="ad-timer-pill">Reward in 15s</div>

    <!-- 1. Monetag Tag (Zone 12261580) -->
    <script>(function(s){s.dataset.zone='12261580',s.src='https://nap5k.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>

    <!-- 2. Monetag Vignette Banner (Zone 12261606) -->
    <script>(function(s){s.dataset.zone='12261606',s.src='https://n6wxm.com/vignette.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>

    <!-- 3. HilltopAds Backup Video/Slider Tag -->
    <script>
    (function(mkh){
    var d = document,
        s = d.createElement('script'),
        l = d.currentScript || d.scripts[d.scripts.length - 1];
    s.settings = mkh || {};
    s.src = "https://prizefamily.com/b_XxVds.d/G/lN0LYdW/cC/Le/mf9/u/ZYUzljkOPVTzcn2NM/jbcg0pMATOMUtUNRz/YBy/NDzaQFxbN/wl";
    s.async = true;
    s.referrerPolicy = 'no-referrer-when-downgrade';
    l.parentNode.insertBefore(s, l);
    })({});
    </script>

    <script>
        const REWARD_SECONDS = 15; // 15-second reward timer once ad appears
        let adStarted = false;
        let adCompleted = false;
        let countdownTimer = null;
        let remaining = REWARD_SECONDS;

        const timerPill = document.getElementById('ad-timer-pill');

        function startRewardCountdown() {
            if (adStarted) return;
            adStarted = true;
            timerPill.style.display = 'block';
            window.parent.postMessage({ type: 'AD_STARTED' }, '*');

            countdownTimer = setInterval(() => {
                remaining--;
                if (remaining > 0) {
                    timerPill.innerText = `Reward in ${remaining}s`;
                } else {
                    clearInterval(countdownTimer);
                    finishAdReward();
                }
            }, 1000);
        }

        function finishAdReward() {
            if (adCompleted) return;
            adCompleted = true;
            timerPill.innerText = '✅ Reward Unlocked!';
            window.parent.postMessage({ type: 'AD_COMPLETED' }, '*');
        }

        // Detect when Monetag injects its Vignette / In-Page Push DOM elements
        function hasVisibleAdRendered() {
            // Check standard elements + Shadow DOM hosts injected by Monetag onto html/body
            const allElements = document.querySelectorAll('body > *:not(#ad-stage):not(#ad-timer-pill):not(script), html > *:not(head):not(body), iframe, video, img, #ad-stage > *');
            for (const el of allElements) {
                const rect = el.getBoundingClientRect();
                const style = window.getComputedStyle(el);
                if (
                    (rect.width >= 30 && rect.height >= 30 && style.display !== 'none' && style.visibility !== 'hidden') ||
                    el.shadowRoot
                ) {
                    return true;
                }
            }
            return false;
        }

        const detectInterval = setInterval(() => {
            if (hasVisibleAdRendered()) {
                clearInterval(detectInterval);
                startRewardCountdown();
            }
        }, 200);
    </script>
</body>
</html>
