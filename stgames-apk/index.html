<script>

const BASE_URL = "https://stgames.online/";
const CACHE_NAME = "stgames-apk-cache-v2";
const SONG_URL = BASE_URL + "stgames-apk/app.mp3";

/* 1. ALL YOUR 18 ORIGINAL GAMES KEPT INTACT */
const DEFAULT_GAMES_DATA = [
  {id:"game-mw3654pa",title:"Wheel master",url:"game/Wheel master/index.html",logo:"logo/game-1793861007180-5455.jpg",categories:["popular"],badge:"✨ NEW",bg:"linear-gradient(135deg,#6366f1,#4338ca)"},

  {id:"game-mvzyi81m",title:"Fight",url:"game/Fight/index.html",logo:"logo/game-1793676164188-5232.png",categories:["popular"],badge:"✨ NEW",bg:"linear-gradient(135deg,#ef4444,#b91c1c)"},
  {id:"game-mvxqcsca",title:"Catch the thief",url:"game/thief/index.html",logo:"logo/game-1793531508927-5022.png",categories:["classic","popular"],badge:"✨ NEW",bg:"linear-gradient(135deg,#38bdf8,#0284c7)"},
  {id:"game-mvwetkz4",title:"Nuts and Bolts 🔩",url:"game/nuts.html",logo:"logo/game-1793451670491-4931.jpg",categories:["classic"],badge:"✨ NEW",bg:"linear-gradient(135deg,#f59e0b,#b45309)"},
  {id:"game-mvwc6dia",title:"Toilet rush",url:"game/Toilet rush/index.html",logo:"logo/game-1793448451512-4909.jpg",categories:["classic"],badge:"✨ NEW",bg:"linear-gradient(135deg,#a855f7,#7e22ce)"},
  {id:"game-mvv6lmgs",title:"Salazar Game",url:"game/salazar.html",logo:"logo/game-1793377379865-4884.png",categories:["classic"],badge:"✨ NEW",bg:"linear-gradient(135deg,#10b981,#047857)"},
  {id:"custom-mvv0p7ge",title:"Merge Mania",url:"game/merge.html",logo:"logo/game-1793371364908-4872.png",categories:["classic"],badge:"✨ NEW",bg:"linear-gradient(135deg,#facc15,#ca8a04)"},
  {id:"subway-runner",title:"Street Subway Runner",url:"game/subway/index.html",logo:"logo/subway.jpg",categories:["single","popular"],badge:"✨ HIT",bg:"linear-gradient(135deg,#f59e0b,#b45309)"},

  {id:"fruit game",title:"Fruit Arcade Pro",url:"game/fruit.html",logo:"logo/fruit.jpg",categories:["classic","single","popular"],badge:"LIVE",bg:"linear-gradient(135deg,#ec4899,#8b5cf6)"},
  {id:"bird game",title:"Bird Action Mania",url:"game/clumsy.html",logo:"logo/bird.jpg",categories:["classic","single","popular"],badge:"NEW",bg:"linear-gradient(135deg,#f43f5e,#fb923c)"},
  {id:"game-hub-battle",title:"Ninja Shadow Duel",url:"game/fight.html",logo:"logo/fight.jpg",categories:["1v1","popular"],badge:"1v1",bg:"linear-gradient(135deg,#ef4444,#7f1d1d)"},
  {id:"snake-ladder",title:"Monster Truck Stunts",url:"game/ladder/index.html",logo:"logo/ladder.jpg",categories:["racing","single","popular"],badge:"HOT",bg:"linear-gradient(135deg,#f97316,#c2410c)"},
  {id:"typing-race",title:"Typing Race Championship",url:"game/typerace/index.html",logo:"logo/typerace.jpg",categories:["racing","single","popular"],badge:"",bg:"linear-gradient(135deg,#64748b,#334155)"}
];

let GAMES_DATA = [...DEFAULT_GAMES_DATA];
let currentMode = "online";
let currentCategory = "all";
let savedGameIds = loadSavedGames();
let swRegistration = null;
window.currentActiveGameKey = "stgames_global";

/* 2. AUTOMATIC FULLSCREEN TRIGGER (HIDES TOP BROWSER BAR) */
function enterAppFullScreen(){
  const elem = document.documentElement;
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    if (elem.requestFullscreen) {
      elem.requestFullscreen({ navigationUI: "hide" }).catch(()=>{});
    } else if (elem.webkitRequestFullscreen) {
      elem.webkitRequestFullscreen();
    }
  }
}

// Automatically enter full screen & start music on first touch/click anywhere
["click", "touchend", "pointerup"].forEach(evtName => {
  document.addEventListener(evtName, () => {
    enterAppFullScreen();
    ensureMusicPlaying();
  }, { passive: true });
});

/* 3. BACKGROUND MUSIC (app.mp3) IN LOBBY & ALL GAMES */
const bgMusic = document.getElementById("bg-music");
const musicToggle = document.getElementById("music-toggle");
const ingameMusicBtn = document.getElementById("ingame-music-btn");
let musicEnabled = localStorage.getItem("st_music_enabled") !== "false";
musicToggle.checked = musicEnabled;
bgMusic.volume = 0.28;

function updateMusicUI(){
  musicToggle.checked = musicEnabled;
  if(ingameMusicBtn){
    ingameMusicBtn.textContent = musicEnabled ? "🔊 Music" : "🔇 Muted";
  }
}
updateMusicUI();

function ensureMusicPlaying(){
  if(musicEnabled && bgMusic.paused && !document.hidden){
    bgMusic.play().catch(()=>{});
  }
}

function toggleMusic(input){
  musicEnabled = input.checked;
  localStorage.setItem("st_music_enabled", String(musicEnabled));
  updateMusicUI();
  if(musicEnabled) ensureMusicPlaying();
  else bgMusic.pause();
}

function toggleInGameMusic(){
  musicEnabled = !musicEnabled;
  localStorage.setItem("st_music_enabled", String(musicEnabled));
  updateMusicUI();
  if(musicEnabled) ensureMusicPlaying();
  else bgMusic.pause();
}

// Keep music playing even when game iframe takes focus
setInterval(() => {
  if(musicEnabled && bgMusic.paused && !document.hidden){
    bgMusic.play().catch(()=>{});
  }
}, 1500);

document.addEventListener("visibilitychange",()=>{
  if(document.hidden) bgMusic.pause();
  else ensureMusicPlaying();
});

/* 4. AUTO-SYNC WITH MAIN PAGE games.json */
function normalizeGameItem(item, index){
  const rawCats = item.categories || item.category || ["popular"];
  const categories = Array.isArray(rawCats)
    ? rawCats.map(c => String(c).toLowerCase())
    : [String(rawCats).toLowerCase()];

  return {
    id: item.id || ("game-json-" + index),
    title: item.title || item.name || "Arcade Game",
    url: item.url || item.link || item.path || "",
    logo: item.logo || item.image || item.icon || item.thumbnail || "launchericon-192x192.png",
    categories: categories,
    badge: item.badge !== undefined ? item.badge : "✨ NEW",
    bg: item.bg || "linear-gradient(135deg,#3b82f6,#1d4ed8)"
  };
}

async function syncMainPageGamesJson(){
  const urlsToTry = [
    BASE_URL + "games.json",
    "/games.json",
    "games.json"
  ];

  for (const jsonUrl of urlsToTry) {
    try {
      const res = await fetch(jsonUrl, { cache: "no-store" });
      if (!res.ok) continue;
      const data = await res.json();
      const rawList = Array.isArray(data) ? data : (Array.isArray(data.games) ? data.games : []);
      if (!rawList.length) continue;

      const normalizedFromJson = rawList.map(normalizeGameItem).filter(g => g.url);
      
      // Merge main page games.json with existing games so new games appear automatically
      const mergedMap = new Map();
      normalizedFromJson.forEach(g => mergedMap.set(g.url.toLowerCase(), g));
      DEFAULT_GAMES_DATA.forEach(g => {
        if (!mergedMap.has(g.url.toLowerCase())) {
          mergedMap.set(g.url.toLowerCase(), g);
        }
      });

      GAMES_DATA = Array.from(mergedMap.values());
      localStorage.setItem("st_cached_games_json", JSON.stringify(GAMES_DATA));
      renderGames();
      return;
    } catch (e) {
      // Try next URL
    }
  }

  // Offline fallback to last synced games.json
  try {
    const cached = JSON.parse(localStorage.getItem("st_cached_games_json") || "null");
    if (Array.isArray(cached) && cached.length) {
      GAMES_DATA = cached;
      renderGames();
    }
  } catch (err) {}
}

function loadSavedGames(){
  try{
    const value = JSON.parse(localStorage.getItem("st_saved_offline_games") || "[]");
    return Array.isArray(value) ? value : [];
  }catch(error){ return []; }
}

function fullUrl(path){
  if(/^https?:\/\//i.test(path)) return path;
  return new URL(path.split("/").map((part,i)=>i===0?part:encodeURIComponent(part)).join("/"),BASE_URL).href;
}

async function registerAppServiceWorker(){
  if(!("serviceWorker" in navigator)) return null;
  try{
    const registration = await navigator.serviceWorker.register("/sw.js",{scope:"/"});
    swRegistration = await navigator.serviceWorker.ready;
    return swRegistration || registration;
  }catch(error){
    console.error("Service worker registration failed:",error);
    return null;
  }
}
registerAppServiceWorker();

function updateSavedCounter(){
  document.getElementById("saved-count").textContent = savedGameIds.length;
}
function setAppMode(mode){
  currentMode = mode;
  document.getElementById("btn-online").classList.toggle("active",mode==="online");
  document.getElementById("btn-offline").classList.toggle("active",mode==="offline");
  renderGames();
}
function setCategory(category,button){
  currentCategory = category;
  document.querySelectorAll(".cat-pill").forEach(item=>item.classList.remove("active"));
  button.classList.add("active");
  renderGames();
}
function renderGames(){
  const container = document.getElementById("games-container");
  container.innerHTML = "";
  updateSavedCounter();

  if(currentMode==="online" && !navigator.onLine){
    container.innerHTML = `<div class="empty-box"><i class="fa-solid fa-wifi"></i><h3>No Internet Connection</h3><p>Connect to the internet to browse online games, or switch to your downloaded offline games.</p><button class="action-btn" onclick="setAppMode('offline')">PLAY OFFLINE GAMES (${savedGameIds.length})</button></div>`;
    return;
  }

  const filtered = GAMES_DATA.filter(game=>{
    const modeMatch = currentMode==="online" || savedGameIds.includes(game.id);
    const categoryMatch = currentCategory==="all" || (game.categories||[]).includes(currentCategory);
    return modeMatch && categoryMatch;
  });

  if(currentMode==="offline" && filtered.length===0){
    container.innerHTML = `<div class="empty-box"><i class="fa-solid fa-cloud-arrow-down"></i><h3>No Offline Games Yet</h3><p>Open the ONLINE tab and tap a game while connected to download its files for offline use.</p><button class="action-btn" onclick="setAppMode('online')">GO TO ONLINE TAB</button></div>`;
    return;
  }

  filtered.forEach(game=>{
    const isSaved = savedGameIds.includes(game.id);
    const badge = game.badge ? `<span class="game-badge">${game.badge.replace("✨ ","")}</span>` : "<span></span>";
    const downloadIcon = isSaved
      ? `<div class="dl-indicator saved" title="Saved offline"><i class="fa-solid fa-check"></i></div>`
      : `<div class="dl-indicator" title="Tap to open and cache"><i class="fa-solid fa-arrow-down"></i></div>`;
    const card = document.createElement("button");
    card.type = "button";
    card.className = "game-card";
    card.setAttribute("aria-label","Open "+game.title);
    card.innerHTML = `<div class="card-inner" style="background:${game.bg}"><img class="card-artwork" alt="${game.title} game artwork" loading="lazy" decoding="async"><div class="card-overlay"></div><div class="card-header"><div class="game-title"></div><div class="title-underline"></div></div><div class="card-footer">${badge}${downloadIcon}</div></div>`;
    const artwork = card.querySelector(".card-artwork");
    artwork.src = fullUrl(game.logo);
    artwork.addEventListener("error",()=>{
      card.querySelector(".card-inner").classList.add("image-missing");
      artwork.removeAttribute("src");
    },{once:true});
    card.querySelector(".game-title").textContent = game.title;
    card.addEventListener("click",()=>openAndSaveGame(game));
    container.appendChild(card);
  });
}

async function cacheGameFiles(game){
  if(!("caches" in window) || !navigator.onLine) return;
  try{
    const cache = await caches.open(CACHE_NAME);
    const urls = [fullUrl(game.url),fullUrl(game.logo),SONG_URL];
    await Promise.allSettled(urls.map(url=>cache.add(url)));
  }catch(error){
    console.warn("Some game files could not be cached:",error);
  }
}

async function openAndSaveGame(game){
  enterAppFullScreen();
  ensureMusicPlaying();

  if(!navigator.onLine && !savedGameIds.includes(game.id)){
    alert("You are offline. Connect to the internet once to open and cache "+game.title+".");
    return;
  }

  window.currentActiveGameKey = String(game.id).replace(/[^a-zA-Z0-9_-]/g, "_");

  if(navigator.onLine){
    cacheGameFiles(game);
    if(!savedGameIds.includes(game.id)){
      savedGameIds.push(game.id);
      localStorage.setItem("st_saved_offline_games",JSON.stringify(savedGameIds));
    }
  }

  const frame = document.getElementById("game-frame");
  document.getElementById("playing-title").textContent = game.title;
  document.getElementById("player-modal").classList.add("open");
  frame.src = fullUrl(game.url);
  frame.onload = () => {
    ensureMusicPlaying();
  };
  renderGames();
}

function closeGame(){
  const frame = document.getElementById("game-frame");
  frame.src = "about:blank";
  document.getElementById("player-modal").classList.remove("open");
  ensureMusicPlaying();
}

function playRandomGame(){
  enterAppFullScreen();
  ensureMusicPlaying();
  const pool = (currentMode==="offline" || !navigator.onLine)
    ? GAMES_DATA.filter(game=>savedGameIds.includes(game.id))
    : GAMES_DATA;
  if(!pool.length){
    alert("No offline games downloaded yet. Open a game from the ONLINE tab while connected.");
    return;
  }
  openAndSaveGame(pool[Math.floor(Math.random()*pool.length)]);
}

function generateReferralLink(){
  const referralUrl = BASE_URL;
  if(navigator.share){
    navigator.share({title:"ST GAMES",text:"Play online and offline arcade games on ST GAMES!",url:referralUrl}).catch(()=>{});
  }else if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(referralUrl).then(()=>alert("ST GAMES link copied!")).catch(()=>prompt("Copy ST GAMES link:",referralUrl));
  }else{
    prompt("Copy ST GAMES link:",referralUrl);
  }
}

function closeSettings(){document.getElementById("settings-modal").classList.remove("open");}

  localStorage.setItem("st_app_theme",themeClassName);
}
const savedTheme = localStorage.getItem("st_app_theme") || "";
document.getElementById("app-body").className = savedTheme;

const notificationMessages = [
  "🎮 Your games are waiting! Come back to ST GAMES.",
  "🔥 Ready for another gaming challenge?",
  "⚡ Your downloaded games are ready to play.",
  "🏆 Can you beat your previous high score?",
  "👑 The gaming champion is waiting at ST GAMES!"
];

async function enableNotifications(){
  const button = document.getElementById("notification-button");

  if(!("Notification" in window)){
    alert("This browser does not support web notifications. Install ST GAMES as a PWA using Chrome.");
    return;
  }
  if(!("serviceWorker" in navigator)){
    alert("This browser does not support service-worker notifications.");
    return;
  }

  button.disabled = true;
  button.textContent = "Please wait...";

  try{
    let permission = Notification.permission;
    if(permission === "default"){
      permission = await Notification.requestPermission();
    }
    if(permission !== "granted"){
      alert("Notifications are blocked. Allow notifications for stgames.online in Android or Chrome site settings.");
      return;
    }

    const registration = swRegistration || await navigator.serviceWorker.ready;
    if(!registration || typeof registration.showNotification !== "function"){
      throw new Error("Service worker is not ready. Check that /sw.js exists and is registered at the website root.");
    }

    const message = notificationMessages[Math.floor(Math.random()*notificationMessages.length)];
    await registration.showNotification("ST GAMES 🎮",{
      body:message,
      icon:"/launchericon-192x192.png",
      badge:"/launchericon-192x192.png",
      tag:"stgames-test",
      renotify:true,
      data:{url:"/"},
      vibrate:[200,100,200]
    });

    localStorage.setItem("st_notifications_enabled","true");
    alert("Test notification sent!");
  }catch(error){
    console.error("Notification error:",error);
    alert("Could not show notification: "+error.message);
  }finally{
    button.disabled = false;
    button.textContent = "🔔 Enable / Test Notifications";
  }
}

function updateNetworkStatus(){
  const dot = document.getElementById("net-dot");
  dot.classList.toggle("offline",!navigator.onLine);
  renderGames();
}
window.addEventListener("online", () => {
  updateNetworkStatus();
  syncMainPageGamesJson();
});
window.addEventListener("offline",updateNetworkStatus);

document.getElementById("settings-modal").addEventListener("click",event=>{
  if(event.target.id==="settings-modal") closeSettings();
});
document.addEventListener("keydown",event=>{
  if(event.key==="Escape"){
    closeSettings();
    closeGame();
  }
});

updateNetworkStatus();
syncMainPageGamesJson();
</script>

  const defaultText = document.getElementById("login-default-text");

  // Show ONLY Google Logo / Avatar (No Name Text) when Logged In
  function renderHeaderLogo(photoURL, initialLetter, isLoggedIn) {
    if (isLoggedIn) {
      authBtn.classList.add("logged-in-logo");
      defaultIcon.style.display = "none";
      defaultText.style.display = "none";

      if (photoURL) {
        logoImg.src = photoURL;
        logoImg.style.display = "block";
        letterAvatar.style.display = "none";
      } else {
        logoImg.style.display = "none";
        letterAvatar.textContent = initialLetter || "U";
        letterAvatar.style.display = "block";
      }
    } else {
      authBtn.classList.remove("logged-in-logo");
      logoImg.style.display = "none";
      letterAvatar.style.display = "none";
      defaultIcon.style.display = "inline-block";
      defaultText.style.display = "inline";
    }
  }

  // Instant check from your main login.html localStorage keys
  const cachedPhoto = localStorage.getItem("gh_user_photo");
  const cachedLetter = localStorage.getItem("gh_user_letter");
  if (cachedPhoto || cachedLetter) {
    renderHeaderLogo(cachedPhoto, cachedLetter, true);
  }

  let currentUser = null;

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      const name = user.displayName || (user.email ? user.email.split("@")[0] : "U");
      const letter = name.charAt(0).toUpperCase();
      renderHeaderLogo(user.photoURL, letter, true);

      // Sync high score with Firebase when logged in
      const gameKey = window.currentActiveGameKey || "stgames_global";
      const localHi = parseInt(localStorage.getItem(`${gameKey}_hi`) || "0", 10);
      try {
        const snapshot = await get(child(ref(db), `scores/${user.uid}/${gameKey}_high`));
        if (snapshot.exists()) {
          const cloudScore = parseInt(snapshot.val(), 10) || 0;
          if (cloudScore > localHi) {
            localStorage.setItem(`${gameKey}_hi`, cloudScore.toString());
          } else if (localHi > cloudScore) {
            set(ref(db, `scores/${user.uid}/${gameKey}_high`), localHi);
          }
        } else if (localHi > 0) {
          set(ref(db, `scores/${user.uid}/${gameKey}_high`), localHi);
        }
      } catch (err) {
        console.error("Firebase sync error:", err);
      }
    } else {
      currentUser = null;
      renderHeaderLogo("", "", false);
    }
  });

  // Global helper: Saves to Firebase if logged in, LocalStorage if guest
  window.submitScore = function(newScore) {
    const val = parseInt(newScore, 10);
    if (isNaN(val)) return;

    const gameKey = window.currentActiveGameKey || "stgames_global";
    const currentHighScore = parseInt(localStorage.getItem(`${gameKey}_hi`) || "0", 10);

    if (val > currentHighScore) {
      localStorage.setItem(`${gameKey}_hi`, val.toString());
      if (currentUser) {
        set(ref(db, `scores/${currentUser.uid}/${gameKey}_high`), val);
      }
    }
  };
</script>
