<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <title>Login - ST GAMES</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root{--bg-main:#f0f9ff;--text-main:#1e293b;--card-bg:#fff;--card-border:#e2e8f0;--brand-bar:#0f172a}
    *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Roboto,sans-serif}
    body{background:var(--bg-main);color:var(--text-main);min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px}
    .auth-card{background:var(--card-bg);border:2px solid var(--card-border);border-radius:24px;width:100%;max-width:380px;padding:30px;box-shadow:0 10px 30px #0002}
    .auth-title{font-size:24px;font-weight:900;margin-bottom:6px;text-align:center;color:#0284c7}
    .auth-subtitle{font-size:13px;opacity:.7;text-align:center;margin-bottom:24px}
    .input-group{margin-bottom:16px}
    .input-group label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}
    .input-group input{width:100%;padding:12px 16px;border-radius:12px;border:2px solid #cbd5e1;background:#f8fafc;font-size:14px;outline:none;transition:border .2s}
    .input-group input:focus{border-color:#3b82f6}
    .auth-btn{width:100%;background:#3b82f6;color:#fff;border:0;padding:14px;border-radius:14px;font-weight:900;font-size:15px;cursor:pointer;margin-top:8px;box-shadow:0 4px 12px #3b82f666}
    .auth-btn:active{transform:scale(.98)}
    .guest-btn{width:100%;background:transparent;color:#64748b;border:2px solid #cbd5e1;padding:12px;border-radius:14px;font-weight:800;font-size:14px;cursor:pointer;margin-top:12px}
    .toggle-mode{text-align:center;margin-top:20px;font-size:13px;font-weight:700}
    .toggle-mode span{color:#3b82f6;cursor:pointer}
    .back-link{position:absolute;top:20px;left:20px;background:#0f172a;color:#fff;padding:8px 16px;border-radius:20px;text-decoration:none;font-weight:800;font-size:12px}
  </style>
</head>
<body>
  <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Games</a>

  <div class="auth-card">
    <div id="form-title" class="auth-title">Welcome Back</div>
    <div id="form-subtitle" class="auth-subtitle">Sign in to sync your scores to Firebase!</div>

    <form id="auth-form" onsubmit="handleAuth(event)">
      <div class="input-group" id="name-group" style="display:none;">
        <label>Your Name</label>
        <input type="text" id="display-name" placeholder="Enter your name">
      </div>
      <div class="input-group">
        <label>Email Address</label>
        <input type="email" id="email" required placeholder="name@example.com">
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button type="submit" id="submit-btn" class="auth-btn">Sign In</button>
    </form>

    <button class="guest-btn" onclick="continueAsGuest()">Continue as Guest (Local Storage)</button>

    <div class="toggle-mode">
      <span id="toggle-text" onclick="toggleAuthMode()">Don't have an account? Sign Up</span>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBzLchy5M2fLne4c7Ghw1KNN8wVrlZdd8M",
      authDomain: "friendsgame-872f5.firebaseapp.com",
      databaseURL: "https://friendsgame-872f5-default-rtdb.firebaseio.com",
      projectId: "friendsgame-872f5",
      storageBucket: "friendsgame-872f5.firebasestorage.app",
      messagingSenderId: "522534013233",
      appId: "1:522534013233:web:f5faa6e6795023d0420810",
      measurementId: "G-PW5H3G97QR"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    let isSignUp = false;

    window.toggleAuthMode = function() {
      isSignUp = !isSignUp;
      document.getElementById("form-title").textContent = isSignUp ? "Create Account" : "Welcome Back";
      document.getElementById("form-subtitle").textContent = isSignUp ? "Sign up to save scores in the cloud!" : "Sign in to sync your scores to Firebase!";
      document.getElementById("submit-btn").textContent = isSignUp ? "Sign Up" : "Sign In";
      document.getElementById("name-group").style.display = isSignUp ? "block" : "none";
      document.getElementById("toggle-text").textContent = isSignUp ? "Already have an account? Sign In" : "Don't have an account? Sign Up";
    }

    window.handleAuth = async function(event) {
      event.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const name = document.getElementById("display-name").value;
      const btn = document.getElementById("submit-btn");

      btn.disabled = true;
      btn.textContent = "Processing...";

      try {
        if (isSignUp) {
          const userCredential = await createUserWithEmailAndPassword(auth, email, password);
          if (name) {
            await updateProfile(userCredential.user, { displayName: name });
          }
        } else {
          await signInWithEmailAndPassword(auth, email, password);
        }
        localStorage.setItem("st_auth_mode", "firebase");
        window.location.href = "index.html";
      } catch (err) {
        alert("Authentication Error: " + err.message);
        btn.disabled = false;
        btn.textContent = isSignUp ? "Sign Up" : "Sign In";
      }
    }

    window.continueAsGuest = function() {
      localStorage.setItem("st_auth_mode", "guest");
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
